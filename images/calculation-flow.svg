<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Play Points calculation flow</title>
  <desc id="desc">A three-step flow from required points through reward rate to estimated spending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#1c2635"/>
      <stop offset="1" stop-color="#202f44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="960" height="360" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#58a6ff" stroke-width="5" stroke-linecap="round">
    <path d="M300 180h64"/><path d="m350 165 16 15-16 15"/>
    <path d="M596 180h64"/><path d="m646 165 16 15-16 15"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="54" y="72" width="246" height="216" rx="24" fill="url(#card)" stroke="#30363d"/>
    <rect x="364" y="72" width="232" height="216" rx="24" fill="url(#card)" stroke="#30363d"/>
    <rect x="660" y="72" width="246" height="216" rx="24" fill="url(#card)" stroke="#3fb950"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#8b949e" font-size="22" font-weight="700">
      <text x="177" y="116">01 · POINTS</text><text x="480" y="116">02 · RATE</text><text x="783" y="116">03 · ESTIMATE</text>
    </g>
    <text x="177" y="201" fill="#f0f6fc" font-size="54" font-weight="800">1,728 pt</text>
    <text x="480" y="201" fill="#58a6ff" font-size="54" font-weight="800">× 2.0</text>
    <text x="783" y="201" fill="#3fb950" font-size="48" font-weight="800">≈ ¥86,400</text>
    <g fill="#b1bac4" font-size="18">
      <text x="177" y="246">GOAL GAP</text><text x="480" y="246">REWARD CONDITION</text><text x="783" y="246">SPENDING GUIDE</text>
    </g>
  </g>
</svg>
