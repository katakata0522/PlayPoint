<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-labelledby="title desc"><title id="title">Play Pointsを始める4つの操作</title><desc id="desc">Google Playストア、プロフィール、Play Points、無料で開始の順に進みます。</desc><rect width="480" height="540" rx="24" fill="#eaf3ff"/><g font-family="sans-serif" fill="#18334f"><text x="40" y="52" font-size="24" font-weight="700">Play Pointsを始める</text><g font-size="23"><rect x="32" y="80" width="416" height="82" rx="14" fill="white"/><text x="52" y="131">1　Google Playストアを開く</text><rect x="32" y="190" width="416" height="82" rx="14" fill="white"/><text x="52" y="241">2　右上のプロフィール</text><rect x="32" y="300" width="416" height="82" rx="14" fill="white"/><text x="52" y="351">3　Play Pointsを選ぶ</text><rect x="32" y="410" width="416" height="82" rx="14" fill="#d2e7ff"/><text x="52" y="461">4　無料で開始</text></g><g font-size="25" fill="#3473b8"><text x="230" y="184">↓</text><text x="230" y="294">↓</text><text x="230" y="404">↓</text></g><text x="40" y="521" font-size="14">出典：Google Playヘルプ（日本）</text></g></svg>
