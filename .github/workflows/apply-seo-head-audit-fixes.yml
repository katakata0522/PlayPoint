name: Apply SEO head audit fixes

on:
  push:
    branches:
      - seo/full-head-audit-20260908
    paths:
      - .github/scripts/apply-seo-head-audit-fixes.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/full-head-audit-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow SEO fixes
        run: node .github/scripts/apply-seo-head-audit-fixes.cjs
      - name: Commit patched HTML
        run: |
          if git diff --quiet -- amount/10000/index.html author/katakata.html embed.html; then
            echo "No SEO HTML changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amount/10000/index.html author/katakata.html embed.html
          git commit -m "SEO監査で検出したHead不整合を修正"
          git push origin HEAD:seo/full-head-audit-20260908
