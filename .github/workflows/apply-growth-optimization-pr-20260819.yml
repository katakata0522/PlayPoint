name: Apply Growth Optimization on Temporary PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.head_ref == 'agent/playpoint-growth-optimization-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 作業ブランチを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/playpoint-growth-optimization-20260819
          fetch-depth: 0

      - name: データに基づく最小改善を適用
        run: python3 .github/growth_patch_20260819.py

      - name: 生成物と更新日を同期
        run: node scripts/prepare-pr.cjs

      - name: 全テスト
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.cjs 2>&1 | tee /tmp/growth-tests.log

      - name: 失敗テストをPRへ記録
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## 一時Growth Optimizationテスト診断'
            echo
            echo '全テストで失敗したため、本番変更はコミットしていません。末尾ログ:'
            echo
            echo '```text'
            tail -n 220 /tmp/growth-tests.log
            echo '```'
          } > /tmp/growth-test-diagnostic.md
          gh pr comment 87 --body-file /tmp/growth-test-diagnostic.md
          exit 1

      - name: 差分検査
        run: git diff --check

      - name: 一時ファイルを除去してコミット
        shell: bash
        run: |
          rm -f .github/growth-optimization-request
          rm -f .github/growth_patch_20260819.py
          rm -f .github/workflows/apply-growth-optimization-20260819.yml
          rm -f .github/workflows/apply-growth-optimization-pr-20260819.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '変更なし' >&2
            exit 1
          fi
          git commit -m '最新情報と検索意図・回遊導線をデータに合わせて改善'
          git push origin HEAD:agent/playpoint-growth-optimization-20260819
