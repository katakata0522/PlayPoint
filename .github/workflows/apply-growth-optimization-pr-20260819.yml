name: Apply Growth Optimization on Temporary PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/playpoint-growth-optimization-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 作業ブランチを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/playpoint-growth-optimization-20260819
          fetch-depth: 0

      - name: データに基づく最小改善を適用
        run: python3 .github/growth_patch_20260819.py

      - name: 最小更新日の契約を整合
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 内部リンク1本だけを追加する比較記事は、内容の基準日を8/4のまま維持する。
          path = Path('articles/2025-12-25-diamond-worth-it.html')
          text = path.read_text(encoding='utf-8').replace('2026-08-19', '2026-08-04')
          path.write_text(text, encoding='utf-8')

          # latest は実際に8/19へ内容更新するため、サイトマップ鮮度契約も同日へ更新する。
          path = Path('tests/seo-hygiene.test.cjs')
          text = path.read_text(encoding='utf-8')
          old = '<lastmod>2026-08-11</lastmod>'
          new = '<lastmod>2026-08-19</lastmod>'
          if text.count(old) != 1:
              raise SystemExit(f'seo-hygiene latest lastmod contract: expected 1 occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 生成物と更新日を同期
        run: node scripts/prepare-pr.cjs

      - name: 全テスト
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.cjs 2>&1 | tee /tmp/growth-tests.log

      - name: 失敗ログをArtifactへ保存
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: growth-test-diagnostic-${{ github.run_id }}
          path: /tmp/growth-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: テスト失敗を確定
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: 差分検査
        run: git diff --check

      - name: 一時ファイルを除去してコミット
        shell: bash
        run: |
          rm -f .github/growth-optimization-request
          rm -f .github/growth_patch_20260819.py
          rm -f .github/workflows/apply-growth-optimization-20260819.yml
          rm -f .github/workflows/apply-growth-optimization-pr-20260819.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '変更なし' >&2
            exit 1
          fi
          git commit -m '最新情報と検索意図・回遊導線をデータに合わせて改善'
          git push origin HEAD:agent/playpoint-growth-optimization-20260819
