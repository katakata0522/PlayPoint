name: Visitor thanks diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-output:
    name: Build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node .github/scripts/verify-js-syntax.cjs
      - run: node .github/scripts/verify-build-output.cjs

  full-regression:
    name: Full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs

  minify-regression:
    name: Minify regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node .github/scripts/minify.cjs
      - run: node .github/scripts/verify-js-syntax.cjs
      - run: node --test tests/playpoint-regression.test.cjs tests/main-calculator-ui.test.cjs tests/play-points-rounding-guide.test.cjs tests/static-calculator-delivery.test.cjs tests/playpoint-product-guards.test.cjs tests/runtime-module-guards.test.cjs tests/common-pages-fact-ux.test.cjs tests/content-structure.test.cjs

  deploy-normalization:
    name: Deploy normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/article-content-navigation-normalize.cjs
      - run: node scripts/article-content-navigation-normalize.cjs --check
      - run: node scripts/article-seo-normalize.cjs
      - run: node scripts/article-seo-normalize.cjs --check
