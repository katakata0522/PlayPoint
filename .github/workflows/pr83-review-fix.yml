name: PR83 review fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818

permissions:
  contents: write

concurrency:
  group: pr83-review-fix
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply review follow-up
        run: node scripts/pr83-review-followup.cjs

      - name: Rebuild canonical outputs
        run: node scripts/build-html.js

      - name: Capture preflight diagnostics
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs --prepare-deploy > /tmp/pr83-preflight-diagnostic.txt 2>&1
          status=$?
          echo >> /tmp/pr83-preflight-diagnostic.txt
          echo "PRELIGHT_EXIT_STATUS=$status" >> /tmp/pr83-preflight-diagnostic.txt
          echo "--- failing individual tests ---" >> /tmp/pr83-preflight-diagnostic.txt
          for file in tests/*.test.cjs; do
            node --test "$file" > /tmp/pr83-one-test.txt 2>&1
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              echo "=== $file (exit $test_status) ===" >> /tmp/pr83-preflight-diagnostic.txt
              cat /tmp/pr83-one-test.txt >> /tmp/pr83-preflight-diagnostic.txt
              echo >> /tmp/pr83-preflight-diagnostic.txt
            fi
          done
          cp /tmp/pr83-preflight-diagnostic.txt /tmp/pr83-preflight-diagnostic.saved.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/pr83-preflight-diagnostic.saved.txt pr83-preflight-diagnostic.txt

      - name: Commit diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr83-preflight-diagnostic.txt
          git commit -m "[diagnostic] capture PR83 preflight failure"
          git push origin HEAD:fix/full-integrity-audit-20260818
