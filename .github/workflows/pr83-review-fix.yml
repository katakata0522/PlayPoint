name: PR83 review fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818

permissions:
  contents: write

concurrency:
  group: pr83-review-fix
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply review follow-up
        run: |
          node scripts/pr83-review-followup.cjs
          node scripts/pr83-test-contract-followup.cjs

      - name: Rebuild canonical outputs
        run: node scripts/build-html.js

      - name: Run syntax and regression tests
        shell: bash
        run: |
          set +e
          node .github/scripts/verify-js-syntax.cjs > /tmp/pr83-syntax.txt 2>&1
          syntax_status=$?
          node --test tests/*.test.cjs > /tmp/pr83-tests.txt 2>&1
          test_status=$?
          set -e
          if [ "$syntax_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            {
              echo "SYNTAX_EXIT_STATUS=$syntax_status"
              cat /tmp/pr83-syntax.txt
              echo
              echo "TEST_EXIT_STATUS=$test_status"
              grep -E -C 3 'not ok|AssertionError|ERR_ASSERTION|failureType|error:|fail [1-9]|tests? failed' /tmp/pr83-tests.txt || tail -n 250 /tmp/pr83-tests.txt
            } > /tmp/pr83-focused-diagnostic.txt
            cp /tmp/pr83-focused-diagnostic.txt /tmp/pr83-focused-diagnostic.saved.txt
            git reset --hard HEAD
            git clean -fd
            cp /tmp/pr83-focused-diagnostic.saved.txt pr83-preflight-diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pr83-preflight-diagnostic.txt
            git commit -m "[diagnostic] capture PR83 focused test failure"
            git push origin HEAD:fix/full-integrity-audit-20260818
            exit 1
          fi
          cat /tmp/pr83-tests.txt

      - name: Remove one-time helpers
        run: rm -f scripts/pr83-review-followup.cjs scripts/pr83-test-contract-followup.cjs .github/workflows/pr83-review-fix.yml pr83-review-trigger.txt pr83-preflight-diagnostic.txt

      - name: Commit repaired source and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: close PR83 review gaps"
          git push origin HEAD:fix/full-integrity-audit-20260818
