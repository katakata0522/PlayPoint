name: Intl typography patch once

on:
  push:
    branches:
      - fix/intl-readable-wrapping

permissions:
  contents: write

concurrency:
  group: intl-typography-patch-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Patch source and tests
        run: node scripts/tmp-intl-typography-patch.cjs

      - name: Generate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused regression tests
        run: node --test tests/intl-article-layout.test.cjs

      - name: Verify prepare-pr fixed point
        run: |
          git add -A
          node scripts/prepare-pr.cjs
          git diff --exit-code

      - name: Remove temporary patch files
        run: rm -f .github/workflows/intl-typography-patch-once.yml scripts/tmp-intl-typography-patch.cjs

      - name: Commit canonical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve international article line wrapping"
          git push origin HEAD:fix/intl-readable-wrapping
