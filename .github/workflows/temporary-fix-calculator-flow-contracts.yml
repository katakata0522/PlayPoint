name: Temporary fix calculator flow contracts

on:
  push:
    branches:
      - feat/calculator-flow-memory-20260916

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/calculator-flow-memory-20260916
          fetch-depth: 0

      - name: Apply canonical source fixes
        run: node scripts/temporary-fix-calculator-flow-contracts.cjs

      - name: Prepare canonical generated outputs
        run: node scripts/prepare-pr.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/temporary-fix-calculator-flow-contracts.yml scripts/temporary-fix-calculator-flow-contracts.cjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "計算導線の多言語・静的生成契約を整合"
          git push origin HEAD:feat/calculator-flow-memory-20260916
