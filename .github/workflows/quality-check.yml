name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Normalize audit helper quoting
        run: python3 scripts/fix-hk-in-audit-helper.py

      - name: Apply HK/IN post-launch audit fixes
        run: python3 scripts/apply-hk-in-postlaunch-audit-fixes.py

      - name: Synchronize generated PR artifacts
        run: node scripts/prepare-pr.cjs

      - name: Commit generated audit fixes to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
            exit 0
          fi
          git commit -m "香港・インド地域版の監査修正を適用 [audit-fix]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
