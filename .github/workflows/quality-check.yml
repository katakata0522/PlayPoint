name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

      # Temporary diagnostics for PR #142. Reset before every command because
      # prepare-deploy intentionally leaves generated/minified files in place.
      - name: Diagnose latest hub tests
        if: failure()
        run: git reset --hard HEAD && node --test tests/latest-hub-operations.test.cjs

      - name: Diagnose post-147 integrity
        if: failure()
        run: git reset --hard HEAD && node --test tests/post-147-integrity.test.cjs

      - name: Diagnose product guards
        if: failure()
        run: git reset --hard HEAD && node --test tests/playpoint-product-guards.test.cjs

      - name: Diagnose OGP deployment guards
        if: failure()
        run: git reset --hard HEAD && node --test tests/ogp-mime-deployment.test.cjs

      - name: Diagnose all regression tests
        if: failure()
        run: git reset --hard HEAD && node --test tests/*.test.cjs

      - name: Diagnose clean build reproducibility
        if: failure()
        run: git reset --hard HEAD && node .github/scripts/verify-build-output.cjs
