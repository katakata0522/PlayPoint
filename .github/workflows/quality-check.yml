name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

  discover-seo-tests:
    name: Discover failing SEO test candidates
    needs: gate
    if: ${{ always() && needs.gate.result == 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.collect.outputs.tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: collect
        name: Collect SEO tests G-L
        shell: bash
        run: |
          tests="$(node -e "const fs=require('fs');const files=fs.readdirSync('tests').filter(f=>/^seo-[g-l].*\\.test\\.cjs$/.test(f)).sort();process.stdout.write(JSON.stringify(files))")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  diagnose-seo-test:
    name: SEO test ${{ matrix.test }}
    needs: [gate, discover-seo-tests]
    if: ${{ always() && needs.gate.result == 'failure' && needs.discover-seo-tests.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover-seo-tests.outputs.tests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated test
        run: node --test "tests/${{ matrix.test }}"
