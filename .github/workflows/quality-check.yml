name: Pull request quality check

on:
  workflow_dispatch:
  push:
    branches:
      - content/rounding-guide-evolution-20260803
    paths:
      - .github/workflows/quality-check.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  apply-rounding-guide:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply content and test changes
        run: node scripts/apply-rounding-guide-evolution.cjs

      - name: Regenerate public output
        run: |
          set -euo pipefail
          ASSET_VERSION="$(node -e "const fs=require('fs');const m=fs.readFileSync('sw.js','utf8').match(/playpoint-calc-v([0-9_]+)-[a-f0-9]+/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          PLAYPOINT_MODIFIED_DATE=2026-08-03 \
          PLAYPOINT_ASSET_VERSION="$ASSET_VERSION" \
          node scripts/build-html.js

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit verified result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          {
            git diff --name-only -z
            git ls-files --others --exclude-standard -z
          } | sort -zu | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "記事の丸め計算を検証可能にする"
          git push origin HEAD

  quality:
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs
