name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply focused cleanup once
        shell: bash
        run: |
          if grep -q '今回はWeb Share APIを追加しない' tests/growth-priority.test.cjs; then
            python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-test-suite-cleanup.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          def replace_definition(start_prefix, end_prefix, replacement):
              start = next(index for index, line in enumerate(lines) if line.startswith(start_prefix))
              end = next(index for index, line in enumerate(lines[start + 1:], start + 1) if line.startswith(end_prefix))
              lines[start:end] = replacement

          replace_definition('def test_span(', 'def replace_test(', [
              'def test_span(source: str, title: str) -> tuple[int, int]:',
              '    marker = f"test(\'{title}\',"',
              '    start = source.find(marker)',
              '    if start < 0:',
              '        raise ValueError(f"test not found: {title}")',
              '    next_test = source.find(chr(10) + "test(\'", start + len(marker))',
              '    end = len(source) if next_test < 0 else next_test + 1',
              '    return start, end',
              '',
              ''
          ])

          replace_definition('def remove_function(', 'def replace_once(', [
              'def remove_function(source: str, name: str) -> str:',
              '    marker = f"function {name}("',
              '    start = source.find(marker)',
              '    if start < 0:',
              '        raise ValueError(f"function not found: {name}")',
              '    next_test = source.find(chr(10) + "test(\'", start)',
              '    if next_test < 0:',
              '        raise ValueError(f"test boundary not found after function: {name}")',
              '    return source[:start].rstrip() + chr(10) * 2 + source[next_test + 1:].lstrip(chr(10))',
              '',
              ''
          ])

          path.write_text(chr(10).join(lines) + chr(10), encoding='utf-8')
          PY
            python scripts/apply-test-suite-cleanup.py
          else
            echo 'Test cleanup is already applied.'
          fi

      - name: Restore final repository shape before validation
        shell: bash
        run: |
          rm -f scripts/apply-test-suite-cleanup.py
          rm -f .github/workflows/apply-test-suite-cleanup.yml
          rm -f .test-cleanup-trigger .test-cleanup-pr-ready .pr-placeholder .do-not-create .really-noop .stop
          git checkout origin/main -- .github/workflows/quality-check.yml

      - name: Verify focused scope
        shell: bash
        run: |
          changed="$(git diff --name-only -- tests | sort)"
          expected="$(printf '%s\n' \
            tests/all-article-quality-audit.test.cjs \
            tests/growth-migration.test.cjs \
            tests/growth-priority.test.cjs \
            tests/intl-coupon-credit.test.cjs \
            tests/intl-rank-maintenance.test.cjs \
            tests/intl-use-eligibility.test.cjs \
            tests/intl-weekly-accounts.test.cjs \
            tests/playpoint-audit-fixes.test.cjs | sort)"
          printf 'Changed test files:\n%s\n' "$changed"
          printf 'Expected test files:\n%s\n' "$expected"
          test "$changed" = "$expected"
          git diff --check

      - name: Run complete preflight on final tree
        run: node .github/scripts/preflight.cjs

      - name: Commit cleaned tests when needed
        shell: bash
        run: |
          if git diff --quiet -- tests; then
            echo 'No test cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tests/all-article-quality-audit.test.cjs \
            tests/growth-migration.test.cjs \
            tests/growth-priority.test.cjs \
            tests/intl-coupon-credit.test.cjs \
            tests/intl-rank-maintenance.test.cjs \
            tests/intl-use-eligibility.test.cjs \
            tests/intl-weekly-accounts.test.cjs \
            tests/playpoint-audit-fixes.test.cjs
          git commit -m 'test: remove obsolete and duplicate coverage'
          git push origin HEAD:refactor/test-suite-cleanup
