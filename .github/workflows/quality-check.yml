name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR merge commitの両親を取得し、基準mainの実出力と比較する。
          fetch-depth: 2

      - name: Verify build refactor output equivalence
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/build-')
        env:
          REFACTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-refactor-output.cjs --base "$REFACTOR_BASE_SHA" --evidence-dir "$RUNNER_TEMP/playpoint-refactor-evidence"

      - name: Run complete preflight
        shell: bash
        run: |
          # teeの成功で検証失敗を隠さず、ログ保存と失敗の伝播を両立する。
          set -euo pipefail
          node .github/scripts/preflight.cjs 2>&1 | tee "$RUNNER_TEMP/playpoint-preflight.log"

      - name: Install required browser driver
        run: bash .github/scripts/setup-browser-runtime.sh

      - name: Run required Chromium verification
        run: |
          set -euo pipefail
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Compare refactored runtime and appearance with the base revision
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-')
        shell: bash
        env:
          REFACTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REFACTOR_EVIDENCE_DIR: ${{ github.workspace }}/browser-smoke-artifacts/refactor
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d "$RUNNER_TEMP/playpoint-runtime-base-XXXXXX")"
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive "$REFACTOR_BASE_SHA" | tar -x -C "$baseline_dir"
          node .github/scripts/refactor-runtime-compatibility.cjs "$baseline_dir"
          node .github/scripts/refactor-visual-smoke.cjs "$baseline_dir"

      - name: Preserve runtime refactor source evidence
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-') }}
        shell: bash
        env:
          REFACTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          evidence_dir="browser-smoke-artifacts/refactor"
          mkdir -p "$evidence_dir"
          git archive --format=tar "$REFACTOR_BASE_SHA" | gzip > "$evidence_dir/base-source.tar.gz"
          git archive --format=tar HEAD | gzip > "$evidence_dir/candidate-source.tar.gz"
          printf 'base=%s\ncandidate=%s\ntree=%s\n' "$REFACTOR_BASE_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$evidence_dir/source-revisions.txt"

      - name: Preserve required gate verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playpoint-preflight.log
            ${{ runner.temp }}/playpoint-refactor-evidence/
            browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7
