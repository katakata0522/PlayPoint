name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Regenerate P1 blog sidebar branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/p1-blog-sidebar-accessibility'
        run: node .github/scripts/tmp-p1-blog-sidebar.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy
