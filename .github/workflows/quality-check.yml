name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

      - name: Capture preflight failure diagnostics
        if: failure()
        run: |
          mkdir -p preflight-diagnostics
          git status --short > preflight-diagnostics/status.txt
          git diff --binary > preflight-diagnostics/generated.diff
          cp sw.js preflight-diagnostics/sw.js

      - name: Upload preflight failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-diagnostics-${{ github.run_id }}
          path: preflight-diagnostics/
          if-no-files-found: error
          retention-days: 7
