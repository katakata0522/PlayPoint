name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reproduce committed build output
        run: node .github/scripts/verify-build-output.cjs || true

      - name: Capture generated drift
        if: always()
        run: |
          git diff --binary > generated-drift.patch
          git diff --name-only > generated-drift-files.txt

      - name: Upload generated drift
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-generated-drift
          path: |
            generated-drift.patch
            generated-drift-files.txt
          if-no-files-found: error
