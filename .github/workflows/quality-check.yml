name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture build reproducibility diagnostics
        run: |
          mkdir -p build-repro-diagnostics
          set +e
          node .github/scripts/verify-build-output.cjs > build-repro-diagnostics/output.txt 2>&1
          echo "$?" > build-repro-diagnostics/exit-code.txt
          set -e
          git status --short > build-repro-diagnostics/status.txt
          git diff --binary > build-repro-diagnostics/generated.diff
          cp sw.js build-repro-diagnostics/sw.js
          git reset --hard HEAD

      - name: Upload build reproducibility diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-repro-diagnostics-${{ github.run_id }}
          path: build-repro-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy
