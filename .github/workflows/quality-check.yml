name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply focused rounding fix
        if: github.head_ref == 'fix/rounding-assumption-clarity'
        run: python scripts/apply-rounding-assumption-fix.py

      - name: Synchronize generated assets
        if: github.head_ref == 'fix/rounding-assumption-clarity'
        run: node scripts/build-html.js

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit validated source changes
        if: github.head_ref == 'fix/rounding-assumption-clarity'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/calculator.js tests/playpoint-regression.test.cjs sw.js
          git diff --cached --check
          git commit -m 'fix: clarify purchase rounding assumptions'
          git push origin HEAD:fix/rounding-assumption-clarity
