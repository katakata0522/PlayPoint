name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

      # Temporary diagnostics for PR #142. These only run after preflight fails;
      # remove them once the failing phase is identified.
      - name: Diagnose JavaScript syntax
        if: failure()
        run: node .github/scripts/verify-js-syntax.cjs

      - name: Diagnose click depth
        if: failure()
        run: node scripts/site-click-depth.cjs

      - name: Diagnose regression tests
        if: failure()
        run: node --test tests/*.test.cjs

      - name: Diagnose ads.txt
        if: failure()
        run: node .github/scripts/check-ads-txt.cjs

      - name: Diagnose build reproducibility
        if: failure()
        run: node .github/scripts/verify-build-output.cjs
