name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}-${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && 'active' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && 'PR Gate' || 'Draft PR Gate' }}
    # Draftイベントは必須名の結果や進行中の実検証を上書きしない。
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR merge commitの両親を取得し、基準mainの実出力と比較する。
          fetch-depth: 2

      - name: Set up pinned CI Node
        id: ci_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Record CI environment
        id: record_ci_environment
        run: node .github/scripts/ci-evidence.cjs

      - name: Detect PR Gate impact
        id: pr_gate_impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || ! [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "browser_scope=full" >> "$GITHUB_OUTPUT"
            echo "apache_required=true" >> "$GITHUB_OUTPUT"
            echo "PR diff unavailable or manual run; using full verification."
            exit 0
          fi
          if ! impact_json="$(node .github/scripts/detect-pr-gate-impact.cjs --base "$BASE_SHA")"; then
            impact_json='{"preflightScope":"full","browserRequired":true,"browserScope":"full","apacheRequired":true,"pages":[]}'
          fi
          echo "preflight_scope=$(jq -r .preflightScope <<< "$impact_json")" >> "$GITHUB_OUTPUT"
          echo "pages=$(jq -c .pages <<< "$impact_json")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$impact_json" | jq .
          echo "browser_required=$(jq -r '.browserRequired' <<< "$impact_json")" >> "$GITHUB_OUTPUT"
          echo "browser_scope=$(jq -r '.browserScope' <<< "$impact_json")" >> "$GITHUB_OUTPUT"
          echo "apache_required=$(jq -r '.apacheRequired' <<< "$impact_json")" >> "$GITHUB_OUTPUT"


      - name: Verify build refactor output equivalence
        id: verify_build_refactor_output_equivalence
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/build-')
        env:
          REFACTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-refactor-output.cjs --base "$REFACTOR_BASE_SHA" --evidence-dir "$RUNNER_TEMP/playpoint-refactor-evidence"

      - name: Verify internal analytics contracts
        id: analytics_contracts
        if: steps.pr_gate_impact.outputs.preflight_scope == 'analytics'
        run: node .github/scripts/preflight.cjs --analytics

      - name: Run complete preflight
        id: run_complete_preflight
        if: steps.pr_gate_impact.outputs.preflight_scope != 'analytics'
        shell: bash
        run: |
          # teeの成功で検証失敗を隠さず、ログ保存と失敗の伝播を両立する。
          set -euo pipefail
          node .github/scripts/preflight.cjs 2>&1 | tee "$RUNNER_TEMP/playpoint-preflight.log"

      # 設定を模倣せず、候補の.htaccessを実Apache/TLSで評価する。Node単体検査はWindowsでも維持。
      - name: Verify Apache HTTP cache behavior
        id: verify_apache_http_cache
        if: steps.pr_gate_impact.outputs.apache_required == 'true'
        run: node tests/helpers/apache-cache-contract.cjs

      - name: Cache Playwright Chromium binary
        id: cache_playwright_chromium
        if: steps.pr_gate_impact.outputs.browser_required == 'true' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-'))
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playpoint-browsers
          key: playpoint-chromium-ubuntu24-${{ hashFiles('.github/ci-runtime/package-lock.json') }}

      - name: Cache npm runtime packages
        id: cache_npm_runtime
        if: steps.pr_gate_impact.outputs.browser_required == 'true' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-'))
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: playpoint-npm-runtime-ubuntu24-${{ hashFiles('.github/ci-runtime/package-lock.json') }}

      - name: Install required browser driver
        id: ci_browser
        if: steps.pr_gate_impact.outputs.browser_required == 'true' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-'))
        run: bash .github/scripts/setup-browser-runtime.sh

      - name: Run required Chromium verification
        id: run_required_chromium_verification
        if: steps.pr_gate_impact.outputs.browser_required == 'true'
        env:
          BROWSER_SCOPE: ${{ steps.pr_gate_impact.outputs.browser_scope || 'full' }}
          PLAYPOINT_CHANGED_PAGES: ${{ steps.pr_gate_impact.outputs.pages || '[]' }}
        run: node .github/scripts/run-pr-browser-checks.cjs --scope "$BROWSER_SCOPE"

      - name: Compare refactored runtime and appearance with the base revision
        id: compare_refactored_runtime_and_appearance_with_the_base_revision
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-')
        shell: bash
        env:
          REFACTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REFACTOR_EVIDENCE_DIR: ${{ github.workspace }}/browser-smoke-artifacts/refactor
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d "$RUNNER_TEMP/playpoint-runtime-base-XXXXXX")"
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive "$REFACTOR_BASE_SHA" | tar -x -C "$baseline_dir"
          node .github/scripts/refactor-runtime-compatibility.cjs "$baseline_dir"
          node .github/scripts/refactor-visual-smoke.cjs "$baseline_dir"

      - name: Preserve runtime refactor source evidence
        id: preserve_runtime_refactor_source_evidence
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/runtime-') }}
        shell: bash
        env:
          REFACTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          evidence_dir="browser-smoke-artifacts/refactor"
          mkdir -p "$evidence_dir"
          git archive --format=tar "$REFACTOR_BASE_SHA" | gzip > "$evidence_dir/base-source.tar.gz"
          git archive --format=tar HEAD | gzip > "$evidence_dir/candidate-source.tar.gz"
          printf 'base=%s\ncandidate=%s\ntree=%s\n' "$REFACTOR_BASE_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$evidence_dir/source-revisions.txt"

      - name: Preserve required gate verification evidence
        id: preserve_required_gate_verification_evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: pr-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playpoint-preflight.log
            ${{ runner.temp }}/playpoint-refactor-evidence/
            browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Record CI job outcome
        id: record_ci_job_outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: node .github/scripts/ci-evidence.cjs finalize

      - name: Preserve CI environment and phase evidence
        id: preserve_ci_environment_and_phase_evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playpoint-ci-evidence/
          if-no-files-found: warn
          retention-days: 7

