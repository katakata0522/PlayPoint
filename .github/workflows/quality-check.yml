name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  apply-rounding-guide:
    if: github.event_name == 'pull_request' && github.head_ref == 'content/rounding-guide-evolution-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply content and test changes
        run: |
          node scripts/apply-rounding-guide-evolution.cjs
          node scripts/finalize-rounding-guide-evolution.cjs

      - name: Regenerate public output
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-03'
          PLAYPOINT_ASSET_VERSION: '20260803_2217'
        run: node scripts/build-html.js

      - name: Remove one-time migration files and restore normal CI
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/quality-check.yml
          rm -f .github/workflows/apply-rounding-guide-evolution.yml
          rm -f scripts/apply-rounding-guide-evolution.cjs
          rm -f scripts/finalize-rounding-guide-evolution.cjs

      - name: Commit generated baseline locally
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          {
            git diff --name-only -z
            git ls-files --others --exclude-standard -z
          } | sort -zu | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "記事の丸め計算を検証可能にする"

      - name: Run complete preflight from clean baseline
        run: node .github/scripts/preflight.cjs

      - name: Confirm preflight left the tree clean
        run: test -z "$(git status --porcelain)"

      - name: Push verified result
        run: git push origin HEAD

  quality:
    if: github.event_name != 'pull_request' || github.head_ref != 'content/rounding-guide-evolution-20260803'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs
