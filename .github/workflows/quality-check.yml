name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture third-party integration output
        run: |
          set +e
          node --test tests/third-party-analytics-integration.test.cjs > third-party-output.txt 2>&1
          code=$?
          echo "$code" > third-party-exit-code.txt
          exit 0

      - name: Upload third-party diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-diagnostics
          path: |
            third-party-output.txt
            third-party-exit-code.txt
          if-no-files-found: error
