name: Locate feed date assertion text

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/human-first-article-evolution-20260803
          persist-credentials: false

      - name: Search exact failure fragments
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['tests', 'scripts', '.github'];
          const patterns = [/先頭日付/, /最新記事と一致/, /掲載範囲と更新日/, /strictEqual\([^\n]*latest/];
          let found = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:c?js|mjs)$/.test(entry.name)) {
                const lines = fs.readFileSync(full, 'utf8').split('\n');
                lines.forEach((line, index) => {
                  if (!patterns.some(pattern => pattern.test(line))) return;
                  found += 1;
                  const start = Math.max(0, index - 15);
                  const end = Math.min(lines.length, index + 20);
                  console.log(`--- ${full}:${index + 1} ---`);
                  console.log(lines.slice(start, end).map((value, offset) => `${start + offset + 1}: ${value}`).join('\n'));
                });
              }
            }
          }
          roots.filter(fs.existsSync).forEach(walk);
          if (!found) throw new Error('exact failure fragments were not found');
          NODE
