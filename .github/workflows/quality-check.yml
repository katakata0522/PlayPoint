name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  push:
    branches:
      - agent/ga4-landing-page-view-fix

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply GA4 initial page_view repair on the work branch
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${file}: replacement target count=${count}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceOnce(
            'js/analytics-core.js',
            "    const ALLOWED_PARAMS = Object.freeze({\n        calculation_completed:",
            "    const ALLOWED_PARAMS = Object.freeze({\n        page_view: [],\n        calculation_completed:"
          );
          replaceOnce(
            'js/analytics-core.js',
            "    const pendingEvents = [];\n    let analyticsReady = false;",
            "    const pendingEvents = [];\n    let analyticsReady = false;\n    let initialPageViewSent = false;"
          );
          replaceOnce(
            'js/analytics-core.js',
            "    function flushPending() {\n        if (!window.PlayPointConsent) return;",
            "    function sendInitialPageView() {\n        if (initialPageViewSent || !analyticsReady || !hasConsent()) return false;\n        initialPageViewSent = true;\n        send('page_view', {});\n        return true;\n    }\n\n    function flushPending() {\n        if (!window.PlayPointConsent) return;"
          );
          replaceOnce(
            'js/analytics-core.js',
            "        if (!analyticsReady) return;\n\n        while (pendingEvents.length) {",
            "        if (!analyticsReady) return;\n\n        if (window.__playpointManualPageView === true) sendInitialPageView();\n        while (pendingEvents.length) {"
          );

          replaceOnce(
            'js/third-party.js',
            "    async function loadAnalytics() {\n        if (gaLoaded) return;\n        try {",
            "    async function loadAnalytics() {\n        if (gaLoaded) return;\n        if (window.__playpointGaConfigured) {\n            gaLoaded = true;\n            return;\n        }\n        try {"
          );
          replaceOnce(
            'js/third-party.js',
            "            window.gtag('set', { app_display_mode: getDisplayMode() });\n            window.gtag('config', GA_MEASUREMENT_ID);\n            gaLoaded = true;\n            window.PlayPointAnalytics.markAnalyticsReady();",
            "            window.gtag('set', { app_display_mode: getDisplayMode() });\n            window.__playpointManualPageView = true;\n            window.gtag('config', GA_MEASUREMENT_ID, { send_page_view: false });\n            window.__playpointGaConfigured = true;\n            gaLoaded = true;\n            window.PlayPointAnalytics.markAnalyticsReady();"
          );

          const testFile = 'tests/analytics-core.test.cjs';
          let testSource = fs.readFileSync(testFile, 'utf8');
          const anchor = "test('記事・LPからの計算機流入は次の計算完了へ一度だけ引き継ぐ', () => {";
          if (!testSource.includes(anchor)) throw new Error('analytics test anchor missing');
          const newTest = `test('手動page_viewモードでは保留イベントより先に一度だけpage_viewを送る', () => {\n  const { context } = createRuntime('granted');\n  const analytics = context.PlayPointAnalytics;\n  context.__playpointManualPageView = true;\n  analytics.track('theme_change', { theme_mode: 'dark' });\n\n  analytics.markAnalyticsReady();\n\n  const sentNames = context.dataLayer\n    .filter(item => item && item[0] === 'event')\n    .map(item => item[1]);\n  assert.deepEqual(sentNames.slice(0, 2), ['page_view', 'theme_change']);\n  assert.equal(eventCalls(context, 'page_view').length, 1);\n\n  analytics.markAnalyticsReady();\n  analytics.flushPending();\n  assert.equal(eventCalls(context, 'page_view').length, 1, '初回page_viewが重複送信されています');\n});\n\n`;
          testSource = testSource.replace(anchor, newTest + anchor);
          fs.writeFileSync(testFile, testSource);
          NODE

      - name: Sync generated assets
        if: github.event_name == 'push'
        run: node scripts/prepare-pr.cjs

      - name: Run focused analytics tests
        if: github.event_name == 'push'
        run: node --test tests/analytics-core.test.cjs tests/calculator-funnel-analytics.test.cjs tests/monetization-search-quality.test.cjs tests/playpoint-product-guards.test.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Verify diff
        if: github.event_name == 'push'
        run: git diff --check

      - name: Save verified repair
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize GA4 initial page_view and single initialization'
          git push
