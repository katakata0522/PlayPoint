name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply focused rounding fix
        if: github.head_ref == 'fix/rounding-assumption-clarity'
        run: python scripts/apply-rounding-assumption-fix.py

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit validated fix and remove one-shot helpers
        if: github.head_ref == 'fix/rounding-assumption-clarity'
        shell: bash
        run: |
          rm -f scripts/apply-rounding-assumption-fix.py
          rm -f .github/workflows/apply-rounding-assumption-fix.yml
          git checkout origin/main -- .github/workflows/quality-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/calculator.js tests/playpoint-regression.test.cjs .github/workflows/quality-check.yml
          git add -u -- scripts/apply-rounding-assumption-fix.py .github/workflows/apply-rounding-assumption-fix.yml
          git diff --cached --check
          git commit -m 'fix: clarify purchase rounding assumptions'
          git push origin HEAD:fix/rounding-assumption-clarity
