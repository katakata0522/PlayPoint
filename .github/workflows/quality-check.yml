name: Apply verified PR fixes

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-pr59-verified-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'content/quality-audit-wave1-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/quality-audit-wave1-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified fixes and run complete preflight
        run: node .github/scripts/apply-pr59-verified-fixes.cjs
