name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JavaScript syntax
        continue-on-error: true
        run: node .github/scripts/verify-js-syntax.cjs

      - name: Reproducible generated output
        continue-on-error: true
        run: node .github/scripts/verify-build-output.cjs

      - name: Static public and precache assets
        continue-on-error: true
        run: node .github/scripts/check-static-preflight-assets.cjs

      - name: Article click depth
        continue-on-error: true
        run: node scripts/site-click-depth.cjs

      - name: Regression tests before minify
        continue-on-error: true
        run: node --test tests/*.test.cjs

      - name: ads.txt
        continue-on-error: true
        run: node .github/scripts/check-ads-txt.cjs

      - name: Minify public assets
        continue-on-error: true
        run: node .github/scripts/minify.cjs

      - name: JavaScript syntax after minify
        continue-on-error: true
        run: node .github/scripts/verify-js-syntax.cjs

      - name: Regression tests after minify
        continue-on-error: true
        run: node --test tests/*.test.cjs
