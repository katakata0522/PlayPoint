name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        id: preflight
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs --prepare-deploy > preflight.log 2>&1
          code=$?
          set -e
          cat preflight.log
          exit "$code"

      - name: Upload complete preflight output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-preflight-output-${{ github.run_id }}
          path: preflight.log
          if-no-files-found: error
          retention-days: 7
