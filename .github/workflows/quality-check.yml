name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

      # Temporary binary-search diagnostics for PR #142.
      - name: Diagnose tests SA-SD
        if: failure()
        shell: bash
        run: git reset --hard HEAD; shopt -s nullglob; files=(tests/s[a-d]*.test.cjs); ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Diagnose tests SEA-SEH
        if: failure()
        shell: bash
        run: git reset --hard HEAD; shopt -s nullglob; files=(tests/se[a-h]*.test.cjs); ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Diagnose tests SEI-SEP
        if: failure()
        shell: bash
        run: git reset --hard HEAD; shopt -s nullglob; files=(tests/se[i-p]*.test.cjs); ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Diagnose tests SEQ-SEZ
        if: failure()
        shell: bash
        run: git reset --hard HEAD; shopt -s nullglob; files=(tests/se[q-z]*.test.cjs); ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Diagnose tests SF
        if: failure()
        shell: bash
        run: git reset --hard HEAD; shopt -s nullglob; files=(tests/sf*.test.cjs); ((${#files[@]} == 0)) || node --test "${files[@]}"
