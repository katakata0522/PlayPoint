name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

      # Temporary binary-search diagnostics for PR #142.
      - name: Diagnose tests S
        if: failure()
        run: git reset --hard HEAD && node --test tests/s*.test.cjs

      - name: Diagnose tests T-U
        if: failure()
        run: git reset --hard HEAD && node --test tests/[t-u]*.test.cjs
