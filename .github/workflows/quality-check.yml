name: Diagnose feed date assertion source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/human-first-article-evolution-20260803
          persist-credentials: false

      - name: Search feed assertions in test sources
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.readdirSync('tests').filter(file => file.endsWith('.test.cjs')).sort();
          let found = 0;
          for (const file of files) {
            const lines = fs.readFileSync(path.join('tests', file), 'utf8').split('\n');
            const matches = lines
              .map((line, index) => ({ line, index }))
              .filter(({ line }) => /blogフィード|フィード|feed\.xml|atom\.xml/.test(line));
            if (!matches.length) continue;
            found += matches.length;
            console.log(`--- ${file} ---`);
            for (const { index } of matches) {
              const start = Math.max(0, index - 12);
              const end = Math.min(lines.length, index + 18);
              console.log(lines.slice(start, end).map((line, offset) => `${start + offset + 1}: ${line}`).join('\n'));
            }
          }
          if (!found) throw new Error('feed-related assertions were not found');
          NODE
