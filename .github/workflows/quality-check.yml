name: Diagnose article feed date assertion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/human-first-article-evolution-20260803
          persist-credentials: false

      - name: Find and print feed date assertion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const phrase = '記事一覧・フィード・サイトマップの掲載範囲と更新日を同期する';
          const files = fs.readdirSync('tests').filter(file => file.endsWith('.test.cjs')).sort();
          const target = files.find(file => fs.readFileSync(path.join('tests', file), 'utf8').includes(phrase));
          if (!target) throw new Error('target assertion was not found');
          const lines = fs.readFileSync(path.join('tests', target), 'utf8').split('\n');
          const index = lines.findIndex(line => line.includes(phrase));
          console.log('target:', target, 'line:', index + 1);
          console.log(lines.slice(Math.max(0, index - 35), index + 85)
            .map((line, offset) => `${Math.max(0, index - 35) + offset + 1}: ${line}`)
            .join('\n'));
          NODE
