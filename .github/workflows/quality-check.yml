name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Update verified stale product guard
        if: github.event.pull_request.number == 147 && github.head_ref == 'fix/high-priority-audit'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/playpoint-product-guards.test.cjs')
          text = path.read_text(encoding='utf-8')
          old = """  assert.match(html, /Japan, the United States, South Korea, and Taiwan/);\n  assert.match(html, /rates and level requirements vary by country/i);"""
          new = """  assert.match(html, /Japan, the United States, South Korea, Taiwan, Hong Kong, and India/);\n  assert.match(html, /level thresholds, base earn rates, currency units, and available top levels can differ by country/i);"""

          if text.count(old) != 1:
              raise SystemExit(f'Expected stale guard block exactly once, found {text.count(old)}')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          node --test tests/playpoint-product-guards.test.cjs tests/repository-integrity-audit.test.cjs
          git diff --check
          git add tests/playpoint-product-guards.test.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align region guard with six modes"
          git push origin "HEAD:$HEAD_BRANCH"
