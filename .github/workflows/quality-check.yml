name: Pull request quality check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/play-points-content-evolution
          fetch-depth: 0

      - name: Repair remaining content and test mismatches
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');

          function update(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${file}: expected replacement was not applied`);
            fs.writeFileSync(file, after, 'utf8');
          }

          update('tests/article-fact-regression.test.cjs', source => source
            .replace(
              'assert.match(html, /Androidから購入したGoogle One/);',
              'assert.match(html, /Androidから(?:購入したGoogle One|のGoogle One定期購入|Google Oneを定期購入)/);'
            )
            .replace(
              'assert.match(html, /Play Pointsの履歴/);',
              'assert.match(html, /Play Pointsの(?:ポイント)?履歴/);'
            ));

          update('articles/2026-07-31-super-weekly-reward.html', html => html
            .replace(
              'Google Play Pointsのスーパーウィークリーリワードについて、通常の週次特典との違い、ゴールド以上の対象条件、金曜0時の更新、賞品在庫と受け取り時の注意点をGoogle公式情報から整理します。',
              '通常のウィークリーリワードとの違い、ゴールド以上の対象条件、金曜0時の更新、賞品在庫と受け取り時の注意点をGoogle公式情報から整理します。'
            )
            .replace(
              '<p class="hero-meta">2026/07/31 公開 ・ 読了 5分</p>',
              '<p class="hero-meta">2026/07/31 更新 ・ 読了 5分</p>'
            ));

          update('articles/2026-07-31-google-play-quests.html', html => html.replace(
            '<p class="hero-meta">2026/07/31 公開 ・ 読了 7分</p>',
            '<p class="hero-meta">2026/07/31 更新 ・ 読了 7分</p>'
          ));

          update('scripts/article-editorial-structure.cjs', source => source.replace(
            /\n  'articles\/2026-07-24-earn-play-points-free\.html': \{[\s\S]*?\n  \},\n  'articles\/2026-07-25-play-credit-not-working\.html': \{/,
            "\n  'articles/2026-07-25-play-credit-not-working.html': {"
          ));

          update('blog/articles.json', source => {
            const articles = JSON.parse(source);
            const descriptions = new Map([
              ['google-play-quests', 'Google Playのクエストについて、表示場所、対象者ごとに異なる達成条件、購入として数えられる取引、Play Gamesログインやパーソナライズ設定、返金時の扱いをGoogle公式情報から解説します。'],
              ['earn-play-points-free', 'Google Play Pointsを追加購入なし、または元から予定していた行動で得られる正規ルートを整理。通常・スーパーウィークリーリワード、クエスト、アプリ体験オファー、Play Pass特典と危険な情報の見分け方を解説します。'],
              ['play-games', 'Google Play GamesとPlay Pointsの役割の違い、ゲームを遊ぶだけでは通常ポイントが付かない理由、クエストでPlay Gamesログインが必要になる場合、PC版を含む購入・獲得条件を解説します。'],
              ['movies-books', 'Google Play Pointsが電子書籍、有料アプリ、ゲーム本体などの買い切り購入で貯まる条件を解説。購入前のPlay Points参加、Google Play経由、対象国・アカウント、端末とポイント履歴の確認方法を整理します。'],
              ['subscription', 'Google Oneやアプリ・ゲーム内の定期購入でGoogle Play Pointsが貯まる条件を解説。AndroidからのGoogle One契約、Google Play経由の請求、初回ボーナス、更新時の付与、外部決済との違いを整理します。'],
              ['weekly-reward', 'Google Play Pointsの通常ウィークリーリワード、スーパーウィークリーリワード、Play Pass週次ボーナス・ブースターの違いを比較。対象者、金曜・木曜の更新、受け取り方、表示されない時の確認順を解説します。']
            ]);
            for (const [id, description] of descriptions) {
              const article = articles.find(item => item.id === id);
              if (!article) throw new Error(`required article entry was not found: ${id}`);
              article.description = description;
            }
            return `${JSON.stringify(articles, null, 2)}\n`;
          });
          NODE

      - name: Regenerate every committed build output
        run: node scripts/build-html.js

      - name: Restore permanent workflow
        run: |
          cat > .github/workflows/quality-check.yml <<'YAML'
          name: Pull request quality check

          on:
            workflow_dispatch:
            pull_request:
              branches:
                - main
              paths-ignore:
                - '**.md'
                - '.gitignore'
                - '.gitattributes'

          permissions:
            contents: read

          concurrency:
            group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
            cancel-in-progress: true

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 7
              steps:
                - name: Checkout code
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false

                - name: Run complete preflight
                  run: node .github/scripts/preflight.cjs
          YAML

      - name: Commit all synchronized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 改稿記事と生成物を完全同期"

      - name: Verify complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Push verified commit
        run: git push origin HEAD:agent/play-points-content-evolution
