name: Diagnose phase1 runtime trim

on:
  push:
    branches:
      - perf/phase1-mobile-stability-20260807
    paths:
      - .github/workflows/diagnose-phase1-runtime-trim.yml

permissions:
  contents: write

jobs:
  diagnose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/phase1-mobile-stability-20260807
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply runtime trimming and build
        run: |
          node scripts/apply-phase1-runtime-trim.cjs
          node scripts/apply-phase1-runtime-trim-fixes.cjs
          node scripts/build-html.js

      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run browser smoke and persist diagnostic log
        shell: bash
        run: |
          set +e
          node .github/scripts/browser-smoke.cjs > /tmp/browser-smoke.log 2>&1
          status=$?
          cp /tmp/browser-smoke.log runtime-trim-browser-smoke.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-trim-browser-smoke.log
          git commit -m "一時ブラウザ診断ログを保存"
          git push origin HEAD:perf/phase1-mobile-stability-20260807
          exit $status
