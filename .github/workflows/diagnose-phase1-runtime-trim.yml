name: Diagnose phase1 runtime trim

on:
  push:
    branches:
      - perf/phase1-mobile-stability-20260807
    paths:
      - .github/workflows/diagnose-phase1-runtime-trim.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/phase1-mobile-stability-20260807
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply runtime trimming and regression alignment
        run: |
          node scripts/apply-phase1-runtime-trim.cjs
          node scripts/apply-phase1-runtime-trim-fixes.cjs
          node scripts/build-html.js

      - name: Run preflight and persist diagnostic log
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/preflight.log 2>&1
          status=$?
          cp /tmp/preflight.log runtime-trim-preflight.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-trim-preflight.log
          git commit -m "一時診断ログを更新"
          git push origin HEAD:perf/phase1-mobile-stability-20260807
          exit $status
