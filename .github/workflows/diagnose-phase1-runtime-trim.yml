name: Diagnose phase1 runtime trim

on:
  push:
    branches:
      - perf/phase1-mobile-stability-20260807
    paths:
      - .github/workflows/diagnose-phase1-runtime-trim.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/phase1-mobile-stability-20260807

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply runtime trimming
        run: |
          node scripts/apply-phase1-runtime-trim.cjs
          node scripts/build-html.js

      - name: Run preflight with focused failure output
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/preflight.log 2>&1
          status=$?
          echo '===== PREFLIGHT FAILURE CONTEXT ====='
          grep -n -E 'not ok|AssertionError|ERR_ASSERTION|事前検証で失敗|fail|error|diary|日記|Service Worker' /tmp/preflight.log | tail -n 160 || true
          echo '===== PREFLIGHT TAIL ====='
          tail -n 260 /tmp/preflight.log
          exit $status
