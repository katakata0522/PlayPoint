name: Apply international article UX audit fixes v7

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/apply-intl-article-ux-audit-v7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-article-ux-audit
          fetch-depth: 0

      - name: Apply audited UX patch
        run: |
          python3 scripts/apply-intl-ux-temp.py
          python3 scripts/harden-intl-hub-sync-temp.py

      - name: Validate source syntax
        run: |
          node --check scripts/intl-article-layout.cjs
          node --check scripts/intl-seo-pages.cjs
          node --check scripts/intl-manual-content-sync.cjs
          node --check scripts/intl-content-expansion.cjs
          node --check tests/intl-article-ux-audit.test.cjs

      - name: Regenerate and run focused regressions
        run: |
          node scripts/prepare-pr.cjs
          node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs

      - name: Prove generator fixed point
        run: |
          git add -A
          test -n "$(git diff --cached --name-only)"
          node scripts/prepare-pr.cjs
          git diff --exit-code

      - name: Run project tests
        run: npm test

      - name: Commit implementation
        run: |
          rm -f .github/workflows/apply-intl-article-ux-audit.yml
          rm -f .github/workflows/apply-intl-article-ux-audit-v2.yml
          rm -f .github/workflows/apply-intl-article-ux-audit-v3.yml
          rm -f .github/workflows/apply-intl-article-ux-audit-v4.yml
          rm -f .github/workflows/apply-intl-article-ux-audit-v5.yml
          rm -f .github/workflows/apply-intl-article-ux-audit-v6.yml
          rm -f .github/workflows/apply-intl-article-ux-audit-v7.yml
          rm -f scripts/apply-intl-ux-temp.py scripts/harden-intl-hub-sync-temp.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish international article UX after visual audit"
          git push origin HEAD:fix/intl-article-ux-audit
