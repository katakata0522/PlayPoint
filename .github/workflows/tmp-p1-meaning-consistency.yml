name: Temporary P1 meaning consistency regeneration

on:
  push:
    branches:
      - fix/p1-meaning-consistency

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'chore: regenerate meaning consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-meaning-consistency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply exact meaning corrections to canonical sources
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');

          function replaceExact(path, oldText, newText, expectedCount) {
            let source = fs.readFileSync(path, 'utf8');
            const count = source.split(oldText).length - 1;
            if (count === expectedCount) {
              source = source.split(oldText).join(newText);
              fs.writeFileSync(path, source);
              console.log(`${path}: replaced ${expectedCount} occurrence(s)`);
              return;
            }
            if (count === 0 && source.includes(newText)) {
              console.log(`${path}: replacement already present`);
              return;
            }
            throw new Error(`${path}: expected ${expectedCount} occurrence(s), found ${count}: ${oldText}`);
          }

          const locale = 'scripts/locale-config.cjs';
          replaceExact(locale,
            "description: 'Google Play Points calculator. Estimate how much you need to spend to reach Silver, Gold, Platinum, or Diamond with campaign multipliers and weekly reward notes.',",
            "description: 'Google Play Points calculator. Estimate spending to reach Silver, Gold, Platinum, or Diamond using your base earn rate and any special earn rate shown in Google Play, plus weekly reward notes.',", 1);
          replaceExact(locale,
            "ogDescription: 'Estimate Google Play Points level-up spending, reverse calculations, and campaign multiplier effects.',",
            "ogDescription: 'Estimate Play Points level-up spending and reverse calculations using the higher of your base earn rate or the special earn rate shown in Google Play.',", 1);
          replaceExact(locale,
            "siteDescription: 'Calculate how much you need to spend to reach the next Google Play Points level.<br>Enter your current status, target status, and points needed to estimate spending with campaign multipliers.',",
            "siteDescription: 'Calculate how much you need to spend to reach the next Google Play Points level.<br>Enter your current status, target status, and points needed; the calculator compares your base earn rate with the special earn rate shown in Google Play and uses the higher rate.',", 1);
          replaceExact(locale,
            'By inputting your current points and target status, we calculate the required spending based on your base point rate and any active multiplier campaigns.',
            'By inputting your current points and target status, the calculator compares your base earn rate with any special earn rate shown in Google Play and uses the higher rate. It does not multiply the two rates.', 2);
          replaceExact(locale,
            'By inputting the spending amount, the tool simulates the expected points you will earn based on your current status and campaign settings.',
            'By inputting the spending amount, the tool simulates expected points using the higher of your base earn rate and any special earn rate shown in Google Play.', 2);
          replaceExact(locale,
            '<p>On this page, you can check <strong>how much you need to level up</strong>, <strong>how many points you can earn with your current spending</strong>, and <strong>how advantageous it will be during multiplier campaigns</strong>.</p>',
            '<p>On this page, you can check <strong>how much you need to level up</strong>, <strong>how many points you can earn with your current spending</strong>, and <strong>how a special earn rate shown in Google Play changes the estimate</strong>.</p>', 1);
          replaceExact(locale,
            '<li>Compare base rewards and campaign multiplier rates for reverse calculations.</li>',
            '<li>Compare base earn rates with special earn rates shown in Google Play for reverse calculations.</li>', 1);

          replaceExact(locale,
            "description: '구글 플레이 포인트 등급 달성 계산기. 실버, 골드, 플래티넘, 다이아몬드 등급까지 필요한 결제 금액을 등급별 기본 적립률과 이벤트 배율로 계산합니다.',",
            "description: '구글 플레이 포인트 등급 달성 계산기. 실버, 골드, 플래티넘, 다이아몬드 등급까지 필요한 결제 금액을 기본 적립률과 Google Play에 표시된 특별 적립률 중 높은 값을 사용해 계산합니다.',", 1);
          replaceExact(locale,
            '현재 상태와 목표 등급까지 부족한 포인트를 입력하면, 기본 적립률 및 보너스 이벤트 배율에 따라 필요한 결제 금액을 산출합니다.',
            '현재 상태와 목표 등급까지 부족한 포인트를 입력하면, 기본 적립률과 Google Play에 표시된 특별 적립률을 비교해 높은 값을 사용하여 필요한 결제 금액을 계산합니다. 두 적립률을 서로 곱하지 않습니다.', 2);
          replaceExact(locale,
            '결제할 금액을 입력하면, 현재 등급 및 보너스 이벤트 설정에 따라 획득 예상 포인트를 시뮬레이션합니다.',
            '결제할 금액을 입력하면, 현재 등급의 기본 적립률과 Google Play에 표시된 특별 적립률 중 높은 값을 사용해 획득 예상 포인트를 시뮬레이션합니다.', 2);
          replaceExact(locale,
            '<p>이 페이지에서는 구글 플레이 포인트의 <strong>등급 업까지 필요한 결제 금액</strong>, <strong>현재 결제 금액으로 획득 가능한 포인트</strong>, <strong>이벤트 시 얼마나 더 이득인지</strong>를 한눈에 확인할 수 있습니다.</p>',
            '<p>이 페이지에서는 구글 플레이 포인트의 <strong>등급 업까지 필요한 결제 금액</strong>, <strong>현재 결제 금액으로 획득 가능한 포인트</strong>, <strong>Google Play에 표시된 특별 적립률을 적용했을 때 예상치가 어떻게 달라지는지</strong>를 한눈에 확인할 수 있습니다.</p>', 1);
          replaceExact(locale,
            '<li>기본 적립률과 이벤트 배율을 비교하면서 획득 포인트 역산</li>',
            '<li>기본 적립률과 Google Play에 표시된 특별 적립률을 비교하여 획득 포인트 역산</li>', 1);

          replaceExact(locale,
            "description: 'Google Play Points 點數等級計算器。計算達到銀級、金級、白金級、鑽石級所需的消費金額，支援活動倍率、剩餘點數與每週獎勵紀錄。',",
            "description: 'Google Play Points 點數等級計算器。估算達到銀級、金級、白金級、鑽石級所需的消費金額，會比較基本獲點率與 Google Play 顯示的活動特別獲點率並採用較高者，也可記錄每週獎勵。',", 1);
          replaceExact(locale,
            "ogDescription: '免費模擬 Google Play 點數升級需求、逆算模式與加倍活動的點數試算工具。',",
            "ogDescription: '免費模擬 Google Play 點數升級需求與逆算模式，會比較基本獲點率與 Google Play 顯示的活動特別獲點率。',", 1);
          replaceExact(locale,
            '輸入目前的點數與目標等級所需的點數後，系統會根據您目前的基本回饋率及加倍活動倍率，計算出所需的消費金額。',
            '輸入目前點數與目標等級所需點數後，系統會比較基本獲點率與 Google Play 顯示的活動特別獲點率，採用較高者計算所需消費金額，不會把兩個獲點率相乘。', 2);
          replaceExact(locale,
            '輸入預計消費的金額後，系統會根據目前的等級與活動設定，估算您可獲得的預期點數。',
            '輸入預計消費金額後，系統會使用目前等級的基本獲點率與 Google Play 顯示的活動特別獲點率中較高者，估算可獲得點數。', 2);
          replaceExact(locale,
            '<p>在此頁面中，您可以確認 <strong>距離升級還差多少消費金額</strong>、<strong>以目前的消費額可以獲得多少點數</strong>，以及 <strong>在點數加倍活動期間能多獲得多少點數</strong>。</p>',
            '<p>在此頁面中，您可以確認 <strong>距離升級還差多少消費金額</strong>、<strong>以目前的消費額可以獲得多少點數</strong>，以及 <strong>Google Play 顯示活動特別獲點率時，預估點數會如何變化</strong>。</p>', 1);
          replaceExact(locale,
            '<li>比較基本回饋與活動加倍倍率，進行點數逆算。</li>',
            '<li>比較基本獲點率與 Google Play 顯示的活動特別獲點率，進行點數逆算。</li>', 1);

          const games = 'scripts/generate-game-simulators.cjs';
          replaceExact(games,
            "tableThNormal: '通常時還元 (1%)',",
            "tableThNormal: '基本獲得率（100円あたり1pt）',", 1);
          replaceExact(games,
            "tableThNormal: 'Standard (1x)',",
            "tableThNormal: 'Base earn rate (1 pt / $1)',", 1);
          NODE

      - name: Regenerate deterministic build outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused regression test
        run: node --test tests/meaning-consistency.test.cjs

      - name: Guard changed paths and commit generated output
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ ${#changed[@]} -eq 0 ]; then
            echo 'No changes to commit.'
            exit 0
          fi

          printf 'Changed files:\n'
          printf ' - %s\n' "${changed[@]}"

          for file in "${changed[@]}"; do
            case "$file" in
              scripts/locale-config.cjs|scripts/generate-game-simulators.cjs|en/index.html|ko/index.html|tw/index.html|games/*|en/games/*|ko/games/*|tw/games/*)
                ;;
              *)
                echo "Unexpected generated change: $file" >&2
                exit 1
                ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'chore: regenerate meaning consistency'
          git push origin HEAD:fix/p1-meaning-consistency
