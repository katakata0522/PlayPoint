name: One-shot international related guides

on:
  push:
    branches:
      - fix/intl-contextual-related-guides

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'chore: sync contextual international related guides' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-contextual-related-guides
          fetch-depth: 0

      - name: Patch generator and regenerate committed outputs
        run: |
          set -euo pipefail
          node scripts/one-shot-intl-related-guides-patch.cjs
          node scripts/prepare-pr.cjs

      - name: Commit generated output
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync contextual international related guides"
          git push origin HEAD:fix/intl-contextual-related-guides
