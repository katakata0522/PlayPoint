name: Temporary P0 exact preflight capture

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p0-merge-ref-diff-temp.yml'
      - 'js/analytics-core.js'
      - 'js/asset-versions.js'
      - 'scripts/**'
      - 'articles/**'
      - 'en/articles/**'
      - 'ko/articles/**'
      - 'tw/articles/**'
      - 'tests/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture exact preflight result
        run: |
          set -u
          mkdir -p p0-preflight-evidence
          git rev-parse HEAD > p0-preflight-evidence/head.txt
          git status --short > p0-preflight-evidence/status-before.txt
          set +e
          node .github/scripts/preflight.cjs > p0-preflight-evidence/preflight.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > p0-preflight-evidence/exit-code.txt
          git status --short > p0-preflight-evidence/status-after.txt
          git --no-pager diff -- js/analytics-core.js > p0-preflight-evidence/analytics-core.diff || true
          git --no-pager diff > p0-preflight-evidence/all.diff || true
          tail -n 160 p0-preflight-evidence/preflight.log
          exit 0

      - name: Upload preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-preflight-evidence-${{ github.run_id }}
          path: p0-preflight-evidence/
          retention-days: 2
