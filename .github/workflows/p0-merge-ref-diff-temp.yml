name: Temporary P0 canonical analytics fix

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - '.github/workflows/p0-merge-ref-diff-temp.yml'

permissions:
  contents: write

concurrency:
  group: temporary-p0-canonical-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/article-journey-performance-p0-20260911
          fetch-depth: 0

      - name: Restore existing Google support destination classification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/analytics-core.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = "destination_type: new Set(['calculator', 'article', 'guide_hub', 'category', 'operator_profile', 'external_profile', 'region_home', 'section', 'internal'])";
          const after = "destination_type: new Set(['calculator', 'article', 'guide_hub', 'category', 'operator_profile', 'external_profile', 'region_home', 'section', 'internal', 'official_google_support'])";
          if (source.includes(after)) {
            console.log('official_google_support is already present.');
          } else if (source.includes(before)) {
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
            console.log('Restored official_google_support as a finite destination_type.');
          } else {
            throw new Error('Expected destination_type enum contract was not found.');
          }
          NODE

      - name: Regenerate canonical public output
        run: node scripts/prepare-pr.cjs

      - name: Verify calculator analytics regression
        run: node --test tests/calculator-funnel-analytics.test.cjs

      - name: Commit canonical result
        shell: bash
        run: |
          set -euo pipefail
          printf "'use strict';\n" > js/p0-ci-trigger.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No canonical changes to commit.'; exit 1; }
          git commit -m 'fix: preserve Google support analytics destination'
          git push origin HEAD:feat/article-journey-performance-p0-20260911
