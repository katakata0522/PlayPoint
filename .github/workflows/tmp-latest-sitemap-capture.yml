name: Temporary latest sitemap capture

on:
  push:
    branches:
      - chore/latest-hub-verify-20260918

permissions:
  contents: write

concurrency:
  group: tmp-latest-sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/latest-hub-verify-20260918
          persist-credentials: true

      - name: Set up pinned CI Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Generate canonical sitemap
        run: node scripts/prepare-pr.cjs

      - name: Commit only canonical sitemap when changed
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: regenerate sitemap for latest hub verification"
          git push origin HEAD:chore/latest-hub-verify-20260918
