name: Repair game guide text extraction

on:
  push:
    branches:
      - feat/game-guides-article-hub-20260913
    paths:
      - .github/workflows/tmp-game-guide-html-filter.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Repair text extraction and add regression cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/game-guide-article-hub-sync.cjs')
          source = p.read_text()
          for tag in ['script', 'style']:
              old = f'.replace(/<{tag}\\b[^>]*>[\\s\\S]*?<\\/{tag}>/gi,'
              new = f'.replace(/<{tag}\\b[^>]*>[\\s\\S]*?<\\/{tag}[^>]*>/gi,'
              if source.count(old) != 1:
                  raise SystemExit(f'{tag}: expected exactly one extraction expression')
              source = source.replace(old, new)
          source = source.replace('module.exports = {\n', 'module.exports = {\n  stripHtml,\n', 1)
          p.write_text(source)
          test = Path('tests/game-guide-article-hub.test.cjs')
          test.write_text(test.read_text() + r'''

          test('文字抽出は空白付きscript/style終了タグを除去して前後の単語を保持する', () => {
            const { stripHtml } = require('../scripts/game-guide-article-hub-sync.cjs');
            for (const tag of ['script', 'style']) {
              for (const ending of ['>', ' >', '\n>', ' ignored="value">']) {
                const html = '先頭<' + tag + ' type="text/plain">HIDDEN_SENTINEL</' + tag.toUpperCase() + ending + '末尾';
                assert.equal(stripHtml(html), '先頭 末尾');
              }
            }
            assert.equal(stripHtml('<b>比較</b><em>判断</em>'), '比較 判断');
          });
          ''')
          PY
          node --check scripts/game-guide-article-hub-sync.cjs
          node scripts/prepare-pr.cjs 2>&1 | tee "$RUNNER_TEMP/playpoint-html-filter.log"
          git diff --binary > "$RUNNER_TEMP/first.diff"
          node scripts/prepare-pr.cjs 2>&1 | tee -a "$RUNNER_TEMP/playpoint-html-filter.log"
          git diff --binary > "$RUNNER_TEMP/second.diff"
          cmp "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"

      - name: Commit clean verification candidate
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-game-guide-html-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正: HTML文字抽出の終了タグ処理と回帰検証"
          git rev-parse HEAD | tee -a "$RUNNER_TEMP/playpoint-html-filter.log"
          node .github/scripts/preflight.cjs 2>&1 | tee -a "$RUNNER_TEMP/playpoint-html-filter.log"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/game-guides-article-hub-20260913

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-guide-html-filter-${{ github.run_id }}
          path: ${{ runner.temp }}/playpoint-html-filter.log
          if-no-files-found: warn
          retention-days: 7
