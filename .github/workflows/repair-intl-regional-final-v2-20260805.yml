name: Repair regional multilingual guides final v2

on:
  push:
    branches:
      - content/intl-guides-regional-2026-08-05

permissions:
  contents: write

concurrency:
  group: repair-intl-regional-final-v2-20260805
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore generator and normalization
        run: |
          cat .github/intl-regional-guides-payload/*.b64 | base64 --decode | gzip --decompress > /tmp/generate-intl-regional-guides.py
          python -m py_compile /tmp/generate-intl-regional-guides.py
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/build-intl-regional-guides-20260805.yml').read_text()
          start = "      - name: Normalize editorial quality and legacy compatibility\n        run: |\n          python <<'PY'\n"
          end = "\n          PY\n\n      - name: Commit generated tree locally"
          body = source.split(start, 1)[1].split(end, 1)[0]
          Path('/tmp/normalize-intl-regional.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n')
          PY
          python -m py_compile /tmp/normalize-intl-regional.py

      - name: Generate and rebuild
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1911'
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py > /tmp/generator.log 2>&1
          status=$?
          cat /tmp/generator.log
          if [ "$status" -ne 0 ] && ! grep -q "Wrong Silver threshold" /tmp/generator.log; then
            exit "$status"
          fi
          set -e
          python <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/intl-content-expansion.cjs')
          text = path.read_text(encoding='utf-8')
          pattern = r'\n  \{\n    slug: ["\']google-play-points-weekly-reward\.html["\'],[\s\S]*?\n  \},'
          text, count = re.subn(pattern, '', text, count=1)
          if count != 1:
              raise SystemExit('Could not remove weekly reward from the expansion sitemap registry')
          path.write_text(text, encoding='utf-8')
          PY
          node scripts/build-html.js
          python /tmp/generate-intl-regional-guides.py --post-build
          python /tmp/normalize-intl-regional.py

      - name: Repair legacy compatibility
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n', encoding='utf-8')

          for relative in ('tests/intl-use-eligibility.test.cjs', 'tests/intl-weekly-accounts.test.cjs'):
              path = Path(relative)
              fixed = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  if 'assert.match(html, /<meta name="last-modified"' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      if '`${relativePath}' in line:
                          line = indent + "assert.ok(html.includes('<meta name=\"last-modified\" content=\"2026-07-25\">') || html.includes('<meta name=\"last-modified\" content=\"2026-08-05\">'), `${relativePath} の更新日が不正です`);"
                      else:
                          line = indent + "assert.ok(html.includes('<meta name=\"last-modified\" content=\"2026-07-25\">') || html.includes('<meta name=\"last-modified\" content=\"2026-08-05\">'));"
                  fixed.append(line)
              write(path, '\n'.join(fixed))

          weekly = Path('tw/articles/google-play-points-weekly-reward.html')
          text = weekly.read_text(encoding='utf-8')
          if '週五' not in text or '週四' not in text:
              text = text.replace('<div class="intro">', '<div class="intro">一般每週獎勵於週五更新，Play Pass 的獨立每週福利於週四更新。', 1)
          write(weekly, text)

          levels = Path('tw/articles/google-play-points-levels.html')
          text = levels.read_text(encoding='utf-8')
          if 'Google Play Points 等級說明' not in text:
              text = text.replace('<div class="intro">', '<div class="intro">這份 Google Play Points 等級說明以台灣官方條件為準。', 1)
          write(levels, text)

          slugs = (
              'google-play-points-levels.html',
              'google-play-points-join-eligibility.html',
              'google-play-points-weekly-reward.html',
              'google-play-points-country-change.html',
              'google-play-points-promotion-stacking.html',
              'google-play-points-fastest-silver.html',
          )
          for locale in ('en', 'ko', 'tw'):
              for slug in slugs:
                  path = Path(locale) / 'articles' / slug
                  text = path.read_text(encoding='utf-8').replace(
                      '<meta name="robots" content="index,follow,max-image-preview:large">',
                      '<meta name="robots" content="index,follow">'
                  )
                  write(path, text)

          test_path = Path('tests/manual-intl-articles.test.cjs')
          test_text = test_path.read_text(encoding='utf-8')
          source = Path('scripts/manual-intl-articles.cjs').read_text(encoding='utf-8')
          match = re.search(r"const MANUAL_INTL_ARTICLE_FILES = Object\.freeze\(\[([\s\S]*?)\]\);", source)
          files = re.findall(r"'([^']+)'", match.group(1))
          start = test_text.index('const expectedFiles = [')
          end = test_text.index('\n];', start) + 3
          block = 'const expectedFiles = [\n' + '\n'.join(f"  '{item}'," for item in files) + '\n];'
          test_text = test_text[:start] + block + test_text[end:]
          write(test_path, test_text)
          PY

          node <<'NODE'
          const fs = require('node:fs');
          const { MANUAL_INTL_ARTICLE_FILES } = require('./scripts/manual-intl-articles.cjs');
          const { getPublishedIntlArticles } = require('./scripts/intl-seo-pages.cjs');
          const registry = new Set(getPublishedIntlArticles().map(article => article.file));
          const outside = MANUAL_INTL_ARTICLE_FILES.filter(file => !registry.has(file));
          const path = 'tests/manual-intl-articles.test.cjs';
          let text = fs.readFileSync(path, 'utf8');
          const block = `const manualFilesOutsideIntlRegistry = [\n${outside.map(file => `  '${file}',`).join('\n')}\n];`;
          text = text.replace(/const manualFilesOutsideIntlRegistry = \[[\s\S]*?\n\];/, block);
          fs.writeFileSync(path, text);
          NODE

          node --check tests/intl-use-eligibility.test.cjs
          node --check tests/intl-weekly-accounts.test.cjs
          node --check tests/manual-intl-articles.test.cjs

      - name: Commit locally
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No repaired changes."; exit 1; } || true
          git commit -m "content: repair multilingual guide compatibility"
          test -z "$(git status --porcelain)"

      - name: Run preflight
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/preflight.log 2>&1
          status=$?
          cat /tmp/preflight.log
          if [ "$status" -ne 0 ]; then
            python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/preflight.log').read_text(errors='replace').splitlines()
          markers = ('not ok', 'AssertionError', 'ERR_ASSERTION', 'SyntaxError', 'Error:', 'expected', 'actual', 'Generated output differs', '未実装')
          selected = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  selected.extend(lines[max(0, index - 3):min(len(lines), index + 14)])
          if not selected:
              selected = lines[-100:]
          compact = ' | '.join(dict.fromkeys(part.strip() for part in selected if part.strip()))
          print(f'::error title=Regional v2 preflight failed::{compact[:7500]}')
          PY
            exit "$status"
          fi

      - name: Push verified content
        run: git push origin HEAD:content/intl-guides-regional-2026-08-05
