name: Temporary Article Design System V2 Run

on:
  push:
    branches:
      - feat/article-design-system-v2-20260911

permissions:
  contents: write

concurrency:
  group: article-design-system-v2-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply design migration
        run: node .github/scripts/tmp-apply-article-design-v2.cjs

      - name: Remove historical assumptions and strengthen browser evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('Expected exactly one migration anchor: ' + old[:100])
              return text.replace(old, new, 1)
          p = Path('tests/article-design-system.test.cjs')
          text = p.read_text()
          text = replace_once(text, "all 161 role-classified articles stay on the shared visual contract", "all current role-classified articles stay on the shared visual contract")
          text = replace_once(text, '  assert.equal(result.articleCount, 161);', "  const { articleCorpus } = require('../scripts/article-role-next-action-audit.cjs');\n  const inventory = articleCorpus(root);\n  assert.ok(inventory.length > 0, 'article inventory must not be empty');\n  assert.equal(result.articleCount, inventory.length);\n  assert.equal(Object.values(result.roleCounts).reduce((sum, count) => sum + count, 0), inventory.length);")
          text = replace_once(text, '  assert.ok(result.components.stackedLead > 0);', '  assert.ok(result.components.stackedLead <= result.articleCount);')
          p.write_text(text)
          p = Path('articles/article-shared.css')
          text = p.read_text()
          text = replace_once(text, 'transition-duration: 0.01ms !important;', 'transition: none !important;\nanimation: none !important;\ntransform: none !important;')
          text = replace_once(text, '/* ARTICLE_DESIGN_SYSTEM_V2_END */', '''body .content > .answer-box,
          body .content > .editorial-answer,
          body .content > .summary-box,
          body .content .related-links-section > ul > li,
          body .content .contextual-guide-links > ul > li,
          body .content .article-related-guides > ul > li {
          min-width: 0;
          overflow-wrap: anywhere;
          }
          /* 関連記事の操作領域は遅延描画の仮高さにしない。本文セクションの最適化は維持する。 */
          body .content > .section.related-links-section,
          body .content > .section.contextual-guide-links,
          body .content > .section.article-related-guides,
          body .content .related-links-section,
          body .content .contextual-guide-links,
          body .content .article-related-guides {
          content-visibility: visible;
          contain-intrinsic-size: none;
          }
          @media (prefers-reduced-motion: reduce) {
          html { scroll-behavior: auto !important; }
          }
          /* ARTICLE_DESIGN_SYSTEM_V2_END */''')
          p.write_text(text)
          p = Path('.github/scripts/article-design-smoke.cjs')
          text = p.read_text()
          text = replace_once(text, "  { key: 'mobile', width: 390, height: 844 }", "  { key: 'mobile', width: 390, height: 844 },\n  { key: 'narrow', width: 320, height: 800 }")
          text = replace_once(text, 'javaScriptEnabled: false, viewport:', "javaScriptEnabled: false, reducedMotion: 'reduce', viewport:")
          text = text.replace("if (viewport.key === 'mobile')", 'if (viewport.width <= 860)')
          anchor = "    console.log('[article-design-smoke] ' + article.key + '/' + viewport.key + ': OK');"
          extra = """    const focusTarget = page.locator('.content a').first();
              await page.keyboard.press('Tab');
              await focusTarget.focus();
              const focus = await focusTarget.evaluate(element => ({ visible: element.matches(':focus-visible'), width: parseFloat(getComputedStyle(element).outlineWidth), style: getComputedStyle(element).outlineStyle }));
              assert(focus.visible && focus.width >= 2 && focus.style !== 'none', article.key + '/' + viewport.key + ': keyboard focus indicator missing');
              const relatedTarget = page.locator('.content .related-links-section > ul > li > a, .content .contextual-guide-links > ul > li > a, .content .article-related-guides > ul > li > a').first();
              if (await relatedTarget.count()) {
                const visibility = await relatedTarget.evaluate(element => getComputedStyle(element.closest('.related-links-section, .contextual-guide-links, .article-related-guides')).contentVisibility);
                assert(visibility === 'visible', article.key + '/' + viewport.key + ': related navigation must have stable rendered geometry');
                await relatedTarget.hover();
                await relatedTarget.click({ trial: true });
                const motion = await relatedTarget.evaluate(element => ({ transform: getComputedStyle(element).transform, transition: getComputedStyle(element).transitionDuration }));
                assert(motion.transform === 'none' && motion.transition.split(',').every(value => parseFloat(value) === 0), article.key + '/' + viewport.key + ': reduced motion not respected');
              }
              fs.mkdirSync(ARTIFACT_DIR, { recursive: true });
              const evidenceName = 'article-design-' + article.key + '-' + viewport.key;
              await page.screenshot({ path: path.join(ARTIFACT_DIR, evidenceName + '.png'), fullPage: true });
              fs.writeFileSync(path.join(ARTIFACT_DIR, evidenceName + '.json'), JSON.stringify({ article, viewport, result, focus }, null, 2));
          """
          text = replace_once(text, anchor, extra + anchor)
          p.write_text(text)
          p = Path('docs/ARTICLE_DESIGN_SYSTEM_V2_2026-09-11.md')
          p.write_text(p.read_text().rstrip() + '\n\n## 検証の境界\n\n記事数は現行コーパスから取得し、固定件数や旧レイアウトの存続を要求しない。代表4記事を1280・390・320pxで、JavaScript無効・動きを減らす設定・キーボードフォーカス・関連記事の操作可能性まで検証する。日本語フォントを備えた環境で成功時も画像と計測結果を保存する。\n\n本文セクションのcontent-visibility最適化は維持するが、関連記事ナビゲーションは仮高さを使わず常時描画する。狭い画面でスクロール直後のリンク位置とヒット領域がずれる問題を防ぐためであり、強制クリックで検証を通さない。\n')
          p = Path('.github/workflows/browser-smoke.yml')
          text = p.read_text()
          anchor = '          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0'
          if text.count(anchor) != 2:
              raise RuntimeError('Expected both local and production browser installation steps')
          text = text.replace(anchor, '          sudo apt-get update -qq\n          sudo apt-get install -y --no-install-recommends fonts-noto-cjk\n          fc-match sans-serif:lang=ja\n' + anchor)
          text = text.replace('      - name: Upload failure evidence\n        if: failure()', '      - name: Upload browser verification evidence\n        if: always()')
          p.write_text(text)
          PY

      - name: Synchronize canonical output
        run: node scripts/prepare-pr.cjs

      - name: Prove all HTML content is unchanged except shared CSS fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', 'HEAD']).decode().split('\0')
          checked = 0
          for name in filter(None, changed):
              if not name.endswith('.html'):
                  continue
              before = subprocess.check_output(['git', 'show', 'HEAD:' + name]).decode()
              after = Path(name).read_text()
              normalize = lambda text: re.sub(r'(article-shared\.css\?v=)[a-f0-9]+', r'\1CONTENT_HASH', text)
              if normalize(before) != normalize(after):
                  raise RuntimeError('Design-only HTML boundary violated: ' + name)
              checked += 1
          print('HTML content invariant passed for', checked, 'changed pages; only article-shared.css fingerprints differ.')
          PY

      - name: Create local candidate commit for HEAD-based reproducibility verification
        run: |
          git rm -f .github/scripts/tmp-apply-article-design-v2.cjs
          git rm -f .github/workflows/tmp-article-design-v2-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 記事Design System 2.0と現行記事監査を導入"
          git show -s --format='commit=%H%ntree=%T%nparent=%P' HEAD > "$RUNNER_TEMP/article-design-candidate.txt"
          git bundle create "$RUNNER_TEMP/article-design-candidate.bundle" HEAD

      - name: Run complete preflight
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs 2>&1 | tee "$RUNNER_TEMP/article-design-preflight.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'article-design-preflight.log').read_text(errors='replace').splitlines()
          indices = set(range(max(0, len(lines) - 25), len(lines)))
          for index, line in enumerate(lines):
              if 'not ok ' in line or 'Error:' in line or '事前検証で失敗した工程' in line:
                  indices.update(range(max(0, index - 2), min(len(lines), index + 35)))
          excerpt = '\n'.join(lines[index] for index in sorted(indices))[:48000]
          escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Article design preflight failure::' + escaped)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Article design preflight failed\n\n<pre>' + excerpt.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') + '</pre>\n')
          PY
          fi
          exit "$result"

      - name: Verify representative article design twice in Chromium with Japanese fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match sans-serif:lang=ja | tee "$RUNNER_TEMP/article-design-fonts.log"
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          CHROME_PATH="$chrome_path" node .github/scripts/article-css-smoke.cjs 2>&1 | tee "$RUNNER_TEMP/article-css-smoke.log"
          CHROME_PATH="$chrome_path" node .github/scripts/article-design-smoke.cjs 2>&1 | tee "$RUNNER_TEMP/article-design-smoke.log"
          CHROME_PATH="$chrome_path" node .github/scripts/article-design-smoke.cjs 2>&1 | tee "$RUNNER_TEMP/article-design-repeat.log"

      - name: Publish code without workflow changes or overwriting newer work
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          {
            git show -s --format='Validated candidate: %H' HEAD
            git status --short
            git diff --exit-code
            git diff --cached --exit-code
            validated_head="$(git rev-parse HEAD)"
            # workflow変更はGITHUB_TOKENの権限外。生成物のみ保存し、通常のPR編集で最終形へ統合する。
            git restore --source="$EXPECTED_HEAD" --staged --worktree -- .github/workflows/
            git commit --amend --no-edit
            git diff --exit-code "$EXPECTED_HEAD" HEAD -- .github/workflows/
            git diff --exit-code
            git diff --cached --exit-code
            actual_head="$(git ls-remote origin refs/heads/feat/article-design-system-v2-20260911 | cut -f1)"
            echo "Expected remote: $EXPECTED_HEAD"
            echo "Actual remote: $actual_head"
            test "$actual_head" = "$EXPECTED_HEAD" || { echo '::error::Branch advanced during validation; refusing to publish stale output.'; exit 1; }
            git push origin HEAD:feat/article-design-system-v2-20260911
            published_head="$(git rev-parse HEAD)"
            {
              echo '## 中間保存のみ: このHEADはマージ対象ではありません'
              echo "検証済み候補: $validated_head"
              echo "workflow変更を除いて保存した候補: $published_head"
              echo 'browser-smokeの接続と一時workflow削除を通常のPR編集で完了し、最終HEADで全ゲートを再実行してください。'
            } >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee "$RUNNER_TEMP/article-design-publish.log"

      - name: Upload candidate and verification evidence even on publication failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-design-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/article-design-preflight.log
            ${{ runner.temp }}/article-css-smoke.log
            ${{ runner.temp }}/article-design-smoke.log
            ${{ runner.temp }}/article-design-repeat.log
            ${{ runner.temp }}/article-design-fonts.log
            ${{ runner.temp }}/article-design-publish.log
            ${{ runner.temp }}/article-design-candidate.txt
            ${{ runner.temp }}/article-design-candidate.bundle
            browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7
