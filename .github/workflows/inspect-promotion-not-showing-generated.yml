name: Inspect promotion-not-showing generated outputs

on:
  push:
    branches:
      - feat/promotion-not-showing-20260919
    paths:
      - '.github/workflows/inspect-promotion-not-showing-generated.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/promotion-not-showing-20260919
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false
      - name: Run canonical PR preparation
        run: node scripts/prepare-pr.cjs
      - name: Show generated changes
        if: always()
        shell: bash
        run: |
          echo "=== git status ==="
          git status --short
          echo "=== diff stat ==="
          git diff --stat
          echo "=== changed paths ==="
          git status --porcelain=v1 | sed -E 's/^.. //' | sort -u
          echo "=== unexpected existing article diffs ==="
          git diff -- articles/2025-12-25-expiration.html articles/2025-12-25-refund.html
