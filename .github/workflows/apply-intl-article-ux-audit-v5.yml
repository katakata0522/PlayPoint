name: Apply international article UX audit fixes v5

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/apply-intl-article-ux-audit-v5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-article-ux-audit
          fetch-depth: 0

      - name: Apply audited UX patch with semantic article lists
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-intl-article-ux-audit.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate sources"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          replacements = {
              "seo = pattern.sub(new_hub + '\\nfunction ensureDir', seo, count=1)": "seo = pattern.sub(lambda _: new_hub + '\\nfunction ensureDir', seo, count=1)",
              "if (!shared) throw new Error(relativePath + ': shared article stylesheet is missing');": "if (!shared) return next;"
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'expected patch fragment not found: {old}')
              script = script.replace(old, new, 1)
          Path('/tmp/apply-intl-ux.py').write_text(script)
          PY
          python3 /tmp/apply-intl-ux.py

          python3 - <<'PY'
          from pathlib import Path

          layout_path = Path('scripts/intl-article-layout.cjs')
          layout = layout_path.read_text()
          layout = layout.replace('.intl-hub-section {', '.intl-article-hub .related-links-section {')
          layout = layout.replace('.intl-hub-section h2 {', '.intl-article-hub .related-links-section h2 {')
          layout = layout.replace('.intl-hub-grid {', '.intl-article-hub .related-links-section ul {')
          layout = layout.replace('.content .intl-hub-card {', '.intl-article-hub .related-links-section a {')
          layout = layout.replace('.content .intl-hub-card:hover {', '.intl-article-hub .related-links-section a:hover {')
          layout = layout.replace('.content .intl-hub-card {\nmin-height: 60px;', '.intl-article-hub .related-links-section a {\nmin-height: 60px;')
          # List items become grid cells without inherited list spacing/bullets.
          marker = '.intl-article-hub .related-links-section a {\ndisplay: flex;'
          extra = '.intl-article-hub .related-links-section ul {\nlist-style: none;\npadding-left: 0;\nmargin-bottom: 0;\n}\n\n.intl-article-hub .related-links-section li {\nmargin: 0;\n}\n\n'
          if marker not in layout:
              raise SystemExit('hub card CSS marker not found')
          layout = layout.replace(marker, extra + marker, 1)
          layout_path.write_text(layout)

          seo_path = Path('scripts/intl-seo-pages.cjs')
          seo = seo_path.read_text()
          start = seo.index('  const categorySections = categoryOrder')
          end = seo.index("  const canonical = `https://playpoint-sim.com/${localeKey}/articles/`;", start)
          semantic = '''  const categorySections = categoryOrder
            .filter(key => buckets[key].length)
            .map(key => `<section class="section related-links-section" aria-labelledby="intl-hub-${key}">
              <h2 id="intl-hub-${key}">${escapeHtml(categoryLabels[key])}</h2>
              <ul>
                ${buckets[key].map(([href, title]) => `<li><a href="${escapeHtml(href)}">${escapeHtml(title)}</a></li>`).join('\\n                ')}
              </ul>
            </section>`)
            .join('\\n');
'''
          seo = seo[:start] + semantic + seo[end:]
          seo_path.write_text(seo)

          test_path = Path('tests/intl-article-ux-audit.test.cjs')
          test = test_path.read_text().replace('assert.match(html, /intl-hub-grid/);', 'assert.match(html, /section related-links-section/);')
          test_path.write_text(test)
          PY

      - name: Validate patched source syntax
        run: |
          node --check scripts/intl-article-layout.cjs
          node --check scripts/intl-seo-pages.cjs
          node --check tests/intl-article-ux-audit.test.cjs

      - name: Regenerate and run focused regressions
        run: |
          node scripts/prepare-pr.cjs
          node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs

      - name: Prove generator fixed point
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Expected generated changes were not produced" >&2
            exit 1
          fi
          node scripts/prepare-pr.cjs
          git diff --exit-code

      - name: Run project tests
        run: npm test

      - name: Commit implementation and remove one-shot workflows
        run: |
          rm .github/workflows/apply-intl-article-ux-audit.yml
          rm .github/workflows/apply-intl-article-ux-audit-v2.yml
          rm .github/workflows/apply-intl-article-ux-audit-v3.yml
          rm .github/workflows/apply-intl-article-ux-audit-v4.yml
          rm .github/workflows/apply-intl-article-ux-audit-v5.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish international article UX after visual audit"
          git push origin HEAD:fix/intl-article-ux-audit
