name: Finalize PR244 article audit

on:
  push:
    branches:
      - growth/search-intent-articles-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/search-intent-articles-20260908

      - name: Apply factual and copy audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found: {path}: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match: {path}: count={text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          weekly = 'articles/2025-12-25-weekly-reward.html'
          replace_once(
              weekly,
              '<p>日本の通常ウィークリーリワードは、Google公式では<strong>シルバー以上</strong>が対象。毎週<strong>金曜日</strong>にリセットされ、Play Pointsの「特典」から受け取ります。</p>',
              '<p>日本の通常のウィークリーリワードはシルバー以上が公式対象です。毎週<strong>金曜日</strong>にリセットされ、Play Pointsの「特典」から受け取ります。</p>'
          )
          replace_once(
              weekly,
              '<p>通常のウィークリーリワードはシルバー以上が公式対象です。Play Pass加入中なら木曜日に、Play Passの週次ボーナス・ブースターを確認すると覚えておくと迷いにくくなります。</p>',
              '<p>Play Passにも別の週次特典があります。加入中なら木曜日に、Play Passの週次ボーナス・ブースターを確認すると覚えておくと迷いにくくなります。</p>'
          )

          reflection = 'articles/2026-03-10-play-points-reflection-timing.html'
          replace_once(
              reflection,
              '<meta name="description" content="課金したのにPlay Pointsが反映されない時は、注文状態、ポイント履歴、購入アカウント、参加時期を順に確認。Google公式の確認項目と、待っても付かないケースを整理します。" />',
              '<meta name="description" content="課金したのにPlay Pointsが反映されない時の確認順を解説。Google公式では反映まで7日ほどかかる場合もあると案内。注文状態、履歴、アカウント、参加時期を順に切り分けます。" />'
          )
          replace_once(
              reflection,
              '<meta property="og:description" content="「何時間待つ？」の前に、注文・履歴・アカウント・参加時期を確認。公式案内で切り分けます。" />',
              '<meta property="og:description" content="反映まで7日ほどかかる場合も。待ち時間だけで決めず、注文・履歴・アカウント・参加時期を公式案内に沿って確認します。" />'
          )
          replace_once(
              reflection,
              '"description":"Play Pointsが反映されない時に、注文状態、ポイント履歴、購入アカウント、参加時期、キャンペーン条件をGoogle公式案内に沿って切り分けます。"',
              '"description":"Play Pointsが反映されない時に、公式案内の「7日ほどかかる場合がある」という目安も踏まえ、注文状態、ポイント履歴、購入アカウント、参加時期を切り分けます。"'
          )
          replace_once(
              reflection,
              '"text": "全購入に共通する固定時間はGoogle公式で案内されていません。一部の問題では数分待つよう案内されていますが、注文・履歴・アカウント・参加時期も合わせて確認してください。"',
              '"text": "Google公式は、ポイントがアカウントに反映されるまで7日ほどかかる場合があると案内しています。ただし7日で必ず反映される保証ではありません。注文・履歴・アカウント・参加時期も合わせて確認してください。"'
          )
          replace_once(
              reflection,
              '<p>課金したのにPlay Pointsが増えていないと、まず「いつ反映されるんだろう」と気になります。ただ、Google公式はすべての購入に共通する<strong>「○時間以内に必ず反映」</strong>という時間を案内していません。</p>\n    <p>一部の問題では処理に時間がかかるとして数分待って再確認する案内がありますが、<strong>条件を満たしていない購入は待ってもポイントが付きません。</strong> まず注文状態 → ポイント履歴 → 購入アカウント → Play Pointsへ参加していた時期、の順で見るのが近道です。</p>',
              '<p>課金したのにPlay Pointsが増えていないと、まず「いつ反映されるんだろう」と気になります。Google公式には、コンテンツやデバイスによって確認に時間がかかり、<strong>ポイントがアカウントに反映されるまで7日ほどかかる場合がある</strong>と案内されています。</p>\n    <p>ただし、これは「7日待てば必ず付く」という保証ではありません。<strong>条件を満たしていない購入は待ってもポイントが付きません。</strong> 注文状態 → ポイント履歴 → 購入アカウント → Play Pointsへ参加していた時期、の順で確認しつつ、条件を満たしている場合は時間経過も見ます。</p>'
          )
          replace_once(
              reflection,
              '<p>数分置いてPlay ストアを開き直し、同じGoogleアカウントで履歴を再確認します。それでも見当たらなければ、参加時期や対象条件まで確認してからサポートへ進みます。</p>',
              '<p>まずPlay ストアを開き直し、同じGoogleアカウントで履歴を再確認します。条件を満たしているのに見当たらない場合は、公式では反映まで7日ほどかかる場合もあるため、時間を置きながら履歴を確認します。それでも反映されない、または注文状態に問題がある時はサポートへ進みます。</p>'
          )
          replace_once(
              reflection,
              '<section class="section" id="no-24h-rule">\n    <h2>「24時間待てばいい」は一律ルールではない</h2>\n    <p>以前はネット上で「最大24時間」といった目安を見かけることがありますが、2026年9月8日に確認したGoogle公式ヘルプでは、Play Pointsのすべての購入に共通する<strong>「24時間以内に必ず反映される」ルールは確認できませんでした。</strong></p>\n    <p>だからこの記事でも、根拠のない時間を断定しません。数分待って再確認する余地はありますが、長く待つ前に「そもそも獲得条件を満たしているか」を確認する方が大切です。</p>\n  </section>',
              '<section class="section" id="no-24h-rule">\n    <h2>「24時間」は一律ルールではない。公式には7日ほどかかる場合も</h2>\n    <p>ネット上では「最大24時間」といった目安を見かけることがありますが、2026年9月8日に確認したGoogle公式ヘルプでは、Play Pointsのすべての購入に共通する<strong>「24時間以内に必ず反映される」ルールは確認できませんでした。</strong></p>\n    <p>一方でGoogleは、ポイントがアカウントに反映されるまで<strong>7日ほどかかる場合がある</strong>と案内しています。7日は締め切りや保証時間ではなく、「時間がかかるケースもある」という目安です。待つだけでなく、注文状態や獲得条件も一緒に確認してください。</p>\n  </section>'
          )
          replace_once(
              reflection,
              '<div class="faq-item"><h3>Q. Play Pointsは何分・何時間で付く？</h3><p>A. 全購入に共通する固定時間はGoogle公式で案内されていません。一部の問題では数分待つよう案内されていますが、注文・履歴・アカウント・参加時期も合わせて確認してください。</p></div>',
              '<div class="faq-item"><h3>Q. Play Pointsは何分・何時間で付く？</h3><p>A. Google公式は、ポイントがアカウントに反映されるまで7日ほどかかる場合があると案内しています。ただし7日で必ず反映される保証ではないため、注文・履歴・アカウント・参加時期も合わせて確認してください。</p></div>'
          )
          replace_once(
              reflection,
              '<p>Google Play Points 計算機 運営・編集。「○時間待てば大丈夫」といった根拠の薄い目安ではなく、Google公式で確認できる条件から原因を切り分けています。<a href="../author/katakata.html" rel="author">詳しい検証方針を見る</a></p>',
              '<p>Google Play Points 計算機 運営・編集。一律の待ち時間だけに頼らず、Google公式で確認できる条件から原因を切り分けています。<a href="../author/katakata.html" rel="author">詳しい検証方針を見る</a></p>'
          )

          super_weekly = 'articles/2026-07-31-super-weekly-reward.html'
          replace_once(
              super_weekly,
              '"text": "Google公式は、Super Ticketを使うと以前の特典は適用されないと案内しています。使う前に今の特典を手放してよいか確認してください。"',
              '"text": "Googleが以前公開していたSuper Ticketの案内では、チケットを使うと以前の特典は適用されないと説明されていました。現在の付与状況や期限はGoogle Playの特典画面を確認してください。"'
          )
          old_ticket = '''  <section class="section" id="super-ticket">
    <h2>Super Ticketは「もう一回」。ただし最初の特典とは交換</h2>
    <p>Super Ticketは、スーパーウィークリーリワードでPlay Pointsの特典を受け取った後に、プレミアム特典へもう一度挑戦できる仕組みです。ここで一番大事なのは、<strong>チケットを使うと以前の特典は適用されない</strong>ことです。</p>
    <p>たとえば最初の結果が「これなら十分うれしい」と思える内容なら、無理に再挑戦する必要はありません。Super Ticketは貯めておくこともできます。複数持っている場合は、プレミアム特典を獲得するまで複数回使えるとGoogleは説明しています。</p>
    <div class="table-card">
      <table>
        <thead><tr><th>Google公式の付与対象</th><th>案内されている周期</th></tr></thead>
        <tbody>
          <tr><td>Play Pass定期購入者</td><td>30日ごとに1枚</td></tr>
          <tr><td>ダイヤモンド</td><td>30日ごとに1枚</td></tr>
          <tr><td>プラチナ</td><td>90日ごとに1枚</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">実際に自分へ付与されているか、期限がいつかはGoogle Playの表示を優先してください。</p>
  </section>'''
          new_ticket = '''  <section class="section" id="super-ticket">
    <h2>Super Ticketは「もう一回」。使うと最初の特典は残らない</h2>
    <p>Super Ticketは、スーパーウィークリーリワードの結果からプレミアム特典へもう一度挑戦するためのチケットです。Googleが以前公開していた案内では、<strong>チケットを使うと以前の特典は保持できない</strong>こと、複数枚を貯めて再挑戦に使えることが説明されていました。</p>
    <p>ここで注意したいのが付与周期です。以前の公式ページにはPlay Pass加入者とダイヤモンドは30日ごと、プラチナは90日ごとという案内がありましたが、そのページは2026年9月8日時点でNot Foundになっています。<strong>30日・90日を現在の仕様として断定するのは避けるべき</strong>です。</p>
    <div class="callout callout-info">
      <h3>今の付与日は、自分の「特典」画面を優先</h3>
      <p>国内ブログ「PCあそぶ」では2026年7月の実測として、Play Pass Super Ticketは木曜日、プラチナ・ダイヤモンド向けは火曜日に週次で受け取り表示が出た例が記録されています。これはGoogle公式の現行仕様表ではなく、あくまで国内の観測例です。自分のアカウントに表示される付与日と期限を優先してください。</p>
    </div>
  </section>'''
          replace_once(super_weekly, old_ticket, new_ticket)
          replace_once(
              super_weekly,
              '<div class="faq-item"><h3>Super Ticketで外したら元の特典に戻せる？</h3><p>Google公式は、Super Ticketを使うと以前の特典は適用されないと案内しています。使う前に今の特典を手放してよいか確認してください。</p></div>',
              '<div class="faq-item"><h3>Super Ticketで外したら元の特典に戻せる？</h3><p>Googleが以前公開していたSuper Ticketの案内では、使うと以前の特典は保持できないと説明されていました。現在の付与状況や期限はGoogle Playの「特典」画面を優先してください。</p></div>'
          )
          replace_once(
              super_weekly,
              '<li><a href="https://play.google.com/store/apps/editorial?hl=ja&amp;id=mc_games_editorialmd_product_gpp_swp_super_tickets_fcp" rel="noopener noreferrer" target="_blank">Super Ticket</a></li>',
              '<li>Googleが以前公開していたSuper Ticket案内（2026年9月8日時点では公開URLがNot Found）</li>'
          )
          replace_once(
              super_weekly,
              '<h3>日本での過去確認例</h3>\n    <ul>\n      <li><a href="https://orefolder.jp/2024/03/google-super-weekly-rewards/" rel="noopener noreferrer" target="_blank">OREFOLDER：2024年3月のスーパーウィークリーリワード確認記録</a></li>\n    </ul>',
              '<h3>日本での過去確認例・実測</h3>\n    <ul>\n      <li><a href="https://orefolder.jp/2024/03/google-super-weekly-rewards/" rel="noopener noreferrer" target="_blank">OREFOLDER：2024年3月のスーパーウィークリーリワード確認記録</a></li>\n      <li><a href="https://pc.asobu.co.jp/google-play-pass-super-ticket/" rel="noopener noreferrer" target="_blank">PCあそぶ：2026年のSuper Ticket付与日の実測記録</a></li>\n    </ul>'
          )
          PY

      - name: Synchronize canonical generated outputs
        run: node scripts/prepare-pr.cjs

      - name: Audit article text hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('articles/2025-12-25-playpoints-rank-maintenance.html'),
              Path('articles/2025-12-25-weekly-reward.html'),
              Path('articles/2026-03-10-play-points-reflection-timing.html'),
              Path('articles/2026-07-31-super-weekly-reward.html'),
          ]
          problems = []
          for p in files:
              text = p.read_text(encoding='utf-8')
              if '**' in text:
                  problems.append(f'{p}: raw Markdown ** remains')
              if '\ufffd' in text:
                  problems.append(f'{p}: replacement character remains')
              if re.search(r'(?m)^\s*#{1,6}\s+\S', text):
                  problems.append(f'{p}: raw Markdown heading remains')
              if re.search(r'(?<![\w/])\[[^\]\n]+\]\(https?://[^)\n]+\)', text):
                  problems.append(f'{p}: raw Markdown link remains')
          if problems:
              raise SystemExit('\n'.join(problems))
          print('Article text hygiene passed: no raw Markdown emphasis/headings/links or mojibake in 4 audited articles.')
          PY

      - name: Commit synchronized changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/finalize-pr244-article-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: 記事の事実関係と文章を最終監査"
            git push origin HEAD:growth/search-intent-articles-20260908
          fi

      - name: Run relevant regression tests on committed tree
        run: node --test tests/article-fact-regression.test.cjs tests/content-structure.test.cjs tests/intl-rank-maintenance.test.cjs tests/intl-rewards-quests.test.cjs tests/play-points-content-evolution.test.cjs

      - name: Run complete preflight on committed tree
        run: node .github/scripts/preflight.cjs
