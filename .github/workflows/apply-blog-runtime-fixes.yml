name: Apply blog runtime fixes

on:
  push:
    branches:
      - fix/blog-runtime-regressions

permissions:
  contents: write

concurrency:
  group: apply-blog-runtime-fixes
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/blog-runtime-regressions
          fetch-depth: 0

      - name: Apply runtime and accessibility fixes
        run: node scripts/apply-blog-runtime-fixes.cjs

      - name: Synchronize generated HTML and asset hashes
        run: node scripts/build-html.js

      - name: Validate JavaScript syntax
        run: |
          node --check blog/script.js
          node --check .github/scripts/browser-smoke.cjs

      - name: Run complete repository preflight
        run: |
          set -o pipefail
          node .github/scripts/preflight.cjs 2>&1 | tee preflight.log

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blog-repair-preflight-${{ github.run_id }}
          path: preflight.log
          if-no-files-found: error
          retention-days: 7

      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify calculator and blog in Chromium
        run: node .github/scripts/browser-smoke.cjs

      - name: Commit verified repair
        env:
          TARGET_BRANCH: fix/blog-runtime-regressions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- scripts/apply-blog-runtime-fixes.cjs .github/workflows/apply-blog-runtime-fixes.yml
          rm -f preflight.log

          mapfile -d '' changed < <(git diff HEAD --name-only -z)
          test "${#changed[@]}" -gt 0

          for file in "${changed[@]}"; do
            case "$file" in
              blog/script.js|blog/index.html|.github/scripts/browser-smoke.cjs|tests/blog-runtime-regressions.test.cjs|sw.js)
                ;;
              scripts/apply-blog-runtime-fixes.cjs|.github/workflows/apply-blog-runtime-fixes.yml)
                ;;
              *.html|*.xml|feed.json|manifest.webmanifest)
                ;;
              *)
                echo "想定外の変更ファイル: $file"
                exit 1
                ;;
            esac
          done

          for file in "${changed[@]}"; do
            git add -- "$file"
          done

          git diff --cached --check
          git commit -m "fix: repair blog runtime state and add browser coverage"
          git push origin "HEAD:${TARGET_BRANCH}"
