name: Fix weekly author copy

on:
  push:
    branches:
      - content/play-points-guides-2026-08-05

permissions:
  contents: write

concurrency:
  group: fix-weekly-author-copy-20260805
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Align author verification copy
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('articles/2025-12-25-weekly-reward.html')
          text = path.read_text().replace(
              'Google Play公式情報と実際の画面で確認すべき内容を分け、計算結果だけで不要な購入を促さない方針で掲載しています。',
              'Google Play公式情報と実際の画面で確認すべき内容を分け、対象条件や更新日の違いを誤解しにくい形で掲載しています。'
          )
          if '不要な購入を促さない' in text:
              raise SystemExit('Old purchase-suppression copy remains')
          path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n')
          PY

      - name: Commit corrected article
        run: |
          git add -- articles/2025-12-25-weekly-reward.html
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git diff --cached --check
            git commit -m "content: align weekly article verification tone"
          fi

      - name: Run complete preflight
        if: env.NO_CHANGES != 'true'
        run: node .github/scripts/preflight.cjs

      - name: Push verified correction
        if: env.NO_CHANGES != 'true'
        run: git push origin HEAD:content/play-points-guides-2026-08-05
