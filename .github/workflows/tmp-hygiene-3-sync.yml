name: Temporary Hygiene 3 Sync

on:
  push:
    branches:
      - fix/site-shell-hygiene-3-legal-nav-20260915

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/site-shell-hygiene-3-legal-nav-20260915
          fetch-depth: 0
      - name: Synchronize canonical generated files
        run: node scripts/prepare-pr.cjs
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy.html terms.html
          if git diff --cached --quiet; then
            echo "No relevant generated changes"
            exit 1
          fi
          git commit -m "chore: sync legal page navigation"
          git push
