name: Rollback verified production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: List, verify, or restore a retained verified production snapshot
        required: true
        default: list
        type: choice
        options:
          - list
          - verify
          - restore
      expected_revision:
        description: Exact retained verified SHA required for verify/restore; leave empty for list
        required: false
        type: string

permissions:
  contents: read

# Deploy・watchdog・rollback・snapshot履歴は同じ本番を所有するため、絶対に並行実行しない。
concurrency:
  group: deploy-playpoint-main

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout rollback control plane
        id: checkout_rollback_control_plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up pinned CI Node
        id: ci_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Record CI environment
        id: record_ci_environment
        run: node .github/scripts/ci-evidence.cjs

      - name: Setup SSH
        id: setup_ssh
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "SSH_PRIVATE_KEY が未設定です"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
          cat > ~/.ssh/known_hosts <<'EOF'
          [hajikkoroom.xsrv.jp]:10022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKKSe2ENjD1KRgSqCY7ji78s0zqCNCKBRNfRaxRV7sh
          EOF
          chmod 600 ~/.ssh/known_hosts
          unset SSH_PRIVATE_KEY_B64

      - name: List retained verified snapshots
        id: list_retained_verified_snapshots
        if: inputs.operation == 'list'
        run: bash .github/scripts/snapshot-history.sh --list

      - name: Verify selected history snapshot
        id: verify_selected_history_snapshot
        if: inputs.operation == 'verify' || inputs.operation == 'restore'
        id: history
        shell: bash
        env:
          SELECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          if ! [[ "$SELECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Verify/restore requires an exact lowercase 40-character retained snapshot SHA.' >&2
            exit 2
          fi
          output="$(bash .github/scripts/snapshot-history.sh --verify "$SELECTED_REVISION")"
          printf '%s\n' "$output"
          revision="$(printf '%s\n' "$output" | sed -n 's/^ROLLBACK_HISTORY_REVISION=\([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)"
          if [ "$revision" != "$SELECTED_REVISION" ]; then
            echo 'Selected history snapshot did not verify to the requested SHA.' >&2
            exit 2
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Validate explicit rollback confirmation
        id: validate_explicit_rollback_confirmation
        if: inputs.operation == 'restore'
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          SNAPSHOT_REVISION: ${{ steps.history.outputs.revision }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Restore requires the exact lowercase 40-character snapshot SHA.' >&2
            exit 2
          fi
          if [ "$EXPECTED_REVISION" != "$SNAPSHOT_REVISION" ]; then
            echo "Restore confirmation does not match the selected history snapshot: expected $SNAPSHOT_REVISION." >&2
            exit 2
          fi

      - name: Preserve current verified production in history
        id: preserve_current_verified_production_in_history
        if: inputs.operation == 'restore'
        env:
          PROTECTED_HISTORY_REVISION: ${{ inputs.expected_revision }}
        run: bash .github/scripts/snapshot-history.sh --archive-live

      - name: Activate selected history snapshot as rollback source
        id: activate_selected_history_snapshot_as_rollback_source
        if: inputs.operation == 'restore'
        run: bash .github/scripts/snapshot-history.sh --activate "${{ inputs.expected_revision }}"

      - name: Verify activated rollback snapshot
        id: verify_activated_rollback_snapshot
        if: inputs.operation == 'restore'
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash .github/scripts/deploy-rsync.sh --verify-snapshot)"
          printf '%s\n' "$output"
          revision="$(printf '%s\n' "$output" | sed -n 's/^ROLLBACK_SNAPSHOT_REVISION=\([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)"
          if [ "$revision" != "${{ inputs.expected_revision }}" ]; then
            echo 'Activated rollback source does not match the explicitly selected history SHA.' >&2
            exit 2
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Restore verified snapshot
        id: restore_verified_snapshot
        if: inputs.operation == 'restore'
        env:
          EXPECTED_ROLLBACK_REVISION: ${{ inputs.expected_revision }}
        run: bash .github/scripts/deploy-rsync.sh --restore-verified-snapshot

      - name: Checkout restored revision for matching verification logic
        id: checkout_restored_revision_for_matching_verification_logic
        if: inputs.operation == 'restore'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.snapshot.outputs.revision }}
          path: rollback-verifier
          persist-credentials: false
          fetch-depth: 2

      - name: Verify restored production HTTP, SEO, sitemap, and security
        id: verify_restored_production_http_seo_sitemap_and_security
        if: inputs.operation == 'restore'
        working-directory: rollback-verifier
        env:
          EXPECTED_DEPLOY_REVISION: ${{ steps.snapshot.outputs.revision }}
          EXPECTED_DEPLOY_STATUS: verified
        run: |
          set -euo pipefail
          node .github/scripts/smoke-test.cjs
          node .github/scripts/verify-deploy-status.cjs
          node .github/scripts/seo-health-check.cjs
          node .github/scripts/sitemap-health-check.cjs
          node .github/scripts/security-health-check.cjs

      # runtimeはtrusted current main側で一度だけ準備し、復元版には環境だけ渡す。
      # これにより古いsnapshotが新helperを持たなくても検証可能にする。
      - name: Install browser driver for restored revision
        id: ci_browser
        if: inputs.operation == 'restore'
        run: bash .github/scripts/setup-browser-runtime.sh

      - name: Verify restored production in Chromium
        id: verify_restored_production_in_chromium
        if: inputs.operation == 'restore'
        working-directory: rollback-verifier
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: |
          set -euo pipefail
          test -x "${CHROME_PATH:-}"
          node -e "require.resolve('playwright-core')"
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload rollback browser evidence
        id: upload_rollback_browser_evidence
        if: ${{ always() && inputs.operation == 'restore' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-browser-${{ github.run_id }}
          path: rollback-verifier/browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove SSH material
        id: remove_ssh_material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Record CI job outcome
        id: record_ci_job_outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: node .github/scripts/ci-evidence.cjs finalize

      - name: Preserve CI environment and phase evidence
        id: preserve_ci_environment_and_phase_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playpoint-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
