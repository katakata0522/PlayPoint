name: Fix content batch workflow YAML

on:
  push:
    branches:
      - content/play-points-guides-2026-08-05

permissions:
  contents: write

concurrency:
  group: fix-content-batch-yaml
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fix YAML and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-content-batch-20260805.yml')
          text = workflow.read_text()
          old = '      - name: Commit article batch\n        run: git commit -m "content: add rank, account, country and multiplier guides"\n'
          new = '      - name: Commit article batch\n        run: |\n          git commit -m "content: add rank, account, country and multiplier guides"\n'
          if old not in text:
              raise SystemExit('Target YAML line was not found')
          workflow.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-content-batch-yaml.yml

      - name: Commit and push correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-content-batch-20260805.yml .github/workflows/fix-content-batch-yaml.yml
          git diff --cached --check
          git commit -m "chore: fix article batch workflow yaml"
          git push origin HEAD:content/play-points-guides-2026-08-05
