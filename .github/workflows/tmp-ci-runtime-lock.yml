name: Temporary CI runtime lock
on:
  push:
    branches: [fix/ci-stability-20260916]
    paths: [.github/workflows/tmp-ci-runtime-lock.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false
      - name: Resolve exact CI dependencies and verify lock
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --prefix .github/ci-runtime --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix .github/ci-runtime --ignore-scripts --no-audit --no-fund
          npm ls --prefix .github/ci-runtime --depth=0
          node .github/ci-runtime/node_modules/playwright-core/cli.js install --dry-run chromium
          npm audit --prefix .github/ci-runtime --json > "$RUNNER_TEMP/ci-runtime-audit.json" || audit_status=$?
          printf 'npm audit exit: %s\n' "${audit_status:-0}"
          tar -czf "$RUNNER_TEMP/ci-runtime-lock.tar.gz" .github/ci-runtime/package.json .github/ci-runtime/package-lock.json .github/ci-runtime/node-version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-runtime-lock
          path: |
            ${{ runner.temp }}/ci-runtime-lock.tar.gz
            ${{ runner.temp }}/ci-runtime-audit.json
          retention-days: 1
          if-no-files-found: error
