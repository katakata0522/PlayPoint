name: Inspect international localization fix targets

on:
  push:
    branches:
      - fix/intl-copy-hreflang
    paths:
      - scripts/inspect-intl-fix-targets-temp.cjs
      - .github/workflows/inspect-intl-fix-targets-temp.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-copy-hreflang
      - name: Inspect targets
        run: node scripts/inspect-intl-fix-targets-temp.cjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/intl-fix-targets.json
          git commit -m "chore: record international fix targets" || exit 0
          git push origin HEAD:fix/intl-copy-hreflang
