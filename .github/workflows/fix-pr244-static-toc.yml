name: Fix PR244 static TOC

on:
  push:
    branches:
      - growth/search-intent-articles-20260908

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/search-intent-articles-20260908

      - name: Add static TOCs to audited articles
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re

          files = [
              'articles/2025-12-25-playpoints-rank-maintenance.html',
              'articles/2025-12-25-weekly-reward.html',
              'articles/2026-03-10-play-points-reflection-timing.html',
              'articles/2026-07-31-super-weekly-reward.html',
          ]
          section_re = re.compile(r'<section\b(?P<attrs>[^>]*)>\s*<h2\b(?P<hattrs>[^>]*)>(?P<title>[\s\S]*?)</h2>', re.I)
          id_re = re.compile(r'\bid=["\']([^"\']+)["\']', re.I)

          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if 'class="inpage-toc"' in text:
                  continue
              article_start = text.find('<article')
              header_end = text.find('</header>', article_start)
              if article_start < 0 or header_end < 0:
                  raise SystemExit(f'hero header not found: {name}')
              entries = []
              for match in section_re.finditer(text, header_end):
                  attrs = match.group('attrs')
                  hattrs = match.group('hattrs')
                  target_match = id_re.search(hattrs) or id_re.search(attrs)
                  if not target_match:
                      continue
                  target = target_match.group(1)
                  title = re.sub(r'<[^>]+>', '', match.group('title'))
                  title = html.unescape(re.sub(r'\s+', ' ', title)).strip()
                  if not title or target in {item[0] for item in entries}:
                      continue
                  entries.append((target, title))
              if len(entries) < 3:
                  raise SystemExit(f'not enough TOC entries: {name}: {entries}')
              toc = '\n\n  <nav class="inpage-toc" aria-label="この記事の目次">\n    <div class="inpage-toc-title">📋 目次</div>\n    <ol>\n' + ''.join(
                  f'      <li><a href="#{target}">{html.escape(title)}</a></li>\n'
                  for target, title in entries
              ) + '    </ol>\n  </nav>'
              insert_at = header_end + len('</header>')
              text = text[:insert_at] + toc + text[insert_at:]
              p.write_text(text, encoding='utf-8')
              print(f'{name}: static TOC entries={len(entries)}')
          PY

      - name: Synchronize canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-pr244-static-toc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 改修記事の静的目次を復元してCLSを防ぐ"
          git push origin HEAD:growth/search-intent-articles-20260908

      - name: Run focused article regression tests
        run: node --test tests/article-fact-regression.test.cjs tests/content-structure.test.cjs tests/intl-rank-maintenance.test.cjs tests/intl-rewards-quests.test.cjs tests/play-points-content-evolution.test.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs
