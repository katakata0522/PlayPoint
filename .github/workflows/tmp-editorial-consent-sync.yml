name: Temporary editorial and consent sync

on:
  push:
    branches:
      - agent/fix-editorial-consent-integrity

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-editorial-consent-integrity
          fetch-depth: 0

      - name: Rebuild canonical generated assets
        run: node scripts/build-html.js

      - name: Verify focused fixes
        run: |
          node --check js/consent.js
          node --check scripts/article-editorial-structure.cjs
          node --test tests/consent-state.test.cjs tests/editorial-summary-integrity.test.cjs

      - name: Commit synchronized generated output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/tmp-editorial-consent-sync.yml'
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "記事編集サマリー生成物を同期"
          git push origin HEAD:agent/fix-editorial-consent-integrity
