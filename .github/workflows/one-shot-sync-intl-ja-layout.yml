name: One-shot sync international Japanese layout

on:
  push:
    branches:
      - fix/intl-use-ja-article-layout
    paths:
      - .github/workflows/one-shot-sync-intl-ja-layout.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate international article layout
        run: node scripts/prepare-pr.cjs

      - name: Verify layout contract
        run: node --test tests/intl-article-layout.test.cjs

      - name: Commit generated files and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-sync-intl-ja-layout.yml
          git add -A
          git commit -m "chore: 国際版記事を日本語版レイアウトで正規生成"
          git push origin HEAD:fix/intl-use-ja-article-layout
