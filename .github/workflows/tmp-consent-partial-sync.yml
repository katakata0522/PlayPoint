name: Temporary consent partial sync

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/full-integrity-audit-20260818
          fetch-depth: 0

      - name: Synchronize generated assets
        run: node scripts/build-html.js

      - name: Verify Consent synchronization
        run: |
          node --check js/consent.js
          node --test tests/consent-state.test.cjs

      - name: Commit synchronized output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/tmp-consent-partial-sync.yml'
          if git diff --cached --quiet; then
            echo 'Generated assets are already synchronized.'
            exit 0
          fi
          git commit -m 'Sync generated assets after Consent partial UNKNOWN fix'
          git push origin HEAD:fix/full-integrity-audit-20260818

# Temporary one-shot workflow. Remove separately after synchronization succeeds.
