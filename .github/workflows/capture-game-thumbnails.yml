name: Capture game thumbnail assets

on:
  pull_request:
    paths:
      - '.github/workflows/capture-game-thumbnails.yml'
      - 'scripts/capture-game-thumbnails.cjs'
      - 'scripts/game-thumbnail-assets.cjs'

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/game-list-thumbnails-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/game-list-thumbnails-20260919
          persist-credentials: true
          fetch-depth: 2
      - name: Capture official Google Play icon assets
        run: node scripts/capture-game-thumbnails.cjs
      - name: Stage reviewed local icon files
        run: |
          set -euo pipefail
          mkdir -p images/game-icons
          cp .tmp/game-icons/*.{png,jpg,jpeg,webp} images/game-icons/ 2>/dev/null || true
          test "$(find images/game-icons -maxdepth 1 -type f | wc -l)" -eq 17
      - name: Commit icon files to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/game-icons
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "assets: add sourced Google Play game icons"
            git push origin HEAD:feat/game-list-thumbnails-20260919
          fi
      - name: Upload captured assets for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: game-thumbnail-assets
          path: .tmp/game-icons/
          if-no-files-found: error
          retention-days: 1
