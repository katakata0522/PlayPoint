name: Prepare CSS generated outputs

on:
  push:
    branches:
      - css-japanese-article-contract-20260903

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout CSS work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Synchronize canonical generated output
        run: node scripts/prepare-pr.cjs

      - name: Commit generated asset versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync CSS asset versions"
          git push origin "HEAD:${{ github.ref_name }}"
