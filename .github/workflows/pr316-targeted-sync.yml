name: PR316 Targeted Generated Sync

on:
  push:
    branches:
      - fix/localization-quality-audit-20260915

permissions:
  contents: write

concurrency:
  group: pr316-targeted-generated-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/localization-quality-audit-20260915
          fetch-depth: 1

      - name: Revert unintended escape and regenerate canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/intl-seo-pages.cjs')
          text = path.read_text(encoding='utf-8')
          old = r"return JSON.stringify(data, null, 2).replace(/</g, '\\u003c');"
          new = r"return JSON.stringify(data, null, 2).replace(/</g, '\u003c');"
          if text.count(old) != 1:
              raise SystemExit(f'unexpected jsonLd escape occurrence count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          node scripts/prepare-pr.cjs

          allowed_re='^(scripts/intl-seo-pages\.cjs|en/index\.html|hk/index\.html|in/index\.html|ko/index\.html|tw/index\.html)$'
          unexpected="$(git status --porcelain=v1 | sed -E 's/^.. //' | grep -Ev "$allowed_re" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated paths:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff --check
          git add scripts/intl-seo-pages.cjs en/index.html hk/index.html in/index.html ko/index.html tw/index.html
          git diff --cached --stat

      - name: Commit canonical generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No targeted changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: sync localized generated output'
          git push origin HEAD:fix/localization-quality-audit-20260915
