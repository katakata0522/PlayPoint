name: Retry international article navigation polish

on:
  push:
    branches:
      - fix/intl-nav-sublabels
    paths:
      - '.github/workflows/intl-nav-polish-retry.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/intl-nav-sublabels
          persist-credentials: true

      - name: Reuse staged patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/intl-nav-polish.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])
          exec(compile(script, 'intl-nav-polish-embedded.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Make sublabel assertion HTML-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/intl-article-ux-audit.test.cjs')
          text = p.read_text(encoding='utf-8')
          old = "const globalNav = html.match(/<nav class=\"global-nav intl-global-nav\"[\\s\\S]*?<\\/nav>/)?.[0] || '';\n    assert.equal((globalNav.match(/class=\"nav-sub\"/g) || []).length, 6, `${locale}: six localized nav sublabels`);\n    for (const label of expected[locale]) assert.ok(globalNav.includes(label), `${locale}: missing nav sublabel ${label}`);"
          new = "const globalNav = html.match(/<nav class=\"global-nav intl-global-nav\"[\\s\\S]*?<\\/nav>/)?.[0] || '';\n    const readableNav = globalNav.replace(/&amp;/g, '&');\n    assert.equal((globalNav.match(/class=\"nav-sub\"/g) || []).length, 6, `${locale}: six localized nav sublabels`);\n    for (const label of expected[locale]) assert.ok(readableNav.includes(label), `${locale}: missing nav sublabel ${label}`);"
          if old not in text:
              raise SystemExit('HTML-aware test replacement target not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate canonical output
        run: node scripts/prepare-pr.cjs

      - name: Run focused tests
        run: node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs

      - name: Remove temporary workflows and commit
        run: |
          set -euo pipefail
          rm .github/workflows/intl-nav-polish.yml .github/workflows/intl-nav-polish-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align international nav rhythm with Japanese articles'
          git push origin HEAD:fix/intl-nav-sublabels
