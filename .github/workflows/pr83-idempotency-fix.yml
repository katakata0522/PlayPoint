name: PR83 idempotency fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818

permissions:
  contents: write

concurrency:
  group: pr83-idempotency-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build canonical outputs once
        run: node scripts/build-html.js

      - name: Verify second build is byte-idempotent
        shell: bash
        run: |
          git diff --binary > /tmp/first-build.diff
          node scripts/build-html.js
          git diff --binary > /tmp/second-build.diff
          cmp /tmp/first-build.diff /tmp/second-build.diff

      - name: Run syntax and full regression suite
        run: |
          node .github/scripts/verify-js-syntax.cjs
          node --test tests/*.test.cjs

      - name: Remove one-time workflow files
        run: rm -f .github/workflows/pr83-idempotency-fix.yml pr83-idempotency-trigger.txt

      - name: Commit canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize LP monetization build output"
          git push origin HEAD:fix/full-integrity-audit-20260818
