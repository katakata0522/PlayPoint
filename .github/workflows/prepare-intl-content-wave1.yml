name: Prepare intl content wave 1

on:
  push:
    branches:
      - growth/intl-content-quality-wave1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/intl-content-quality-wave1

      - name: Generate canonical repository outputs
        run: node scripts/prepare-pr.cjs

      - name: Remove one-shot workflow and commit generated outputs
        shell: bash
        run: |
          git rm .github/workflows/prepare-intl-content-wave1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync generated article navigation"
          git push origin HEAD:growth/intl-content-quality-wave1
