name: Wave5 Intl Reading Flow Sync

on:
  push:
    branches:
      - growth/intl-reading-flow-wave5
    paths:
      - .github/workflows/intl-reading-flow-wave5-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: growth/intl-reading-flow-wave5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate canonical article output
        run: node scripts/prepare-pr.cjs

      - name: Verify reading flow after regeneration
        run: node --test tests/intl-article-reading-flow.test.cjs

      - name: Commit generated output
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: regenerate intl answer-first reading flow'
          git push origin HEAD:growth/intl-reading-flow-wave5
