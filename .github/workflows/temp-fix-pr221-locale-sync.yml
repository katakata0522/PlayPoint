name: Temporary PR221 locale sync

on:
  push:
    branches:
      - chatgpt/static-first-view-cls-20260903
    paths:
      - tools/temp-pr221-locale-fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/static-first-view-cls-20260903
          fetch-depth: 0

      - name: Apply locale-safe static copy fix
        run: python tools/temp-pr221-locale-fix.py

      - name: Regenerate canonical outputs
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-12'
          PLAYPOINT_ASSET_VERSION: '20260823_1957'
        run: node scripts/prepare-pr.cjs

      - name: Run focused regressions
        run: node --test tests/mobile-first-view-contract.test.cjs tests/static-calculator-delivery.test.cjs tests/en-locale-hygiene.test.cjs tests/top-page-language-integrity.test.cjs

      - name: Commit synchronized fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/static-calculator-layout.cjs scripts/language-page-builder.cjs tests/mobile-first-view-contract.test.cjs tests/static-calculator-delivery.test.cjs index.html en/index.html ko/index.html tw/index.html hk/index.html in/index.html sw.js
          git diff --cached --quiet && { echo 'No generated changes to commit.' >&2; exit 1; }
          git commit -m 'fix: localize static advanced-settings copy'
          git push origin HEAD:chatgpt/static-first-view-cls-20260903
