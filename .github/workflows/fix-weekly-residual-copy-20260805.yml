name: Fix weekly residual copy

on:
  push:
    branches:
      - content/play-points-guides-2026-08-05

permissions:
  contents: write

concurrency:
  group: fix-weekly-residual-copy-20260805
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply final visible-copy corrections
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('articles/2025-12-25-weekly-reward.html')
          text = path.read_text()
          text = text.replace(
              '<div class="faq-item"><h3>ブロンズのPlay Pass加入者も週次Play Points特典を確認できますか？</h3><p>Play Pass週次ボーナス・ブースターは通常リワードと別制度で、公式ページにシルバー以上という最低ランク条件はありません。Play Points会員かつ対象の加入者はPlay Pass画面を確認してください。</p></div>',
              '<div class="faq-item"><h3>ブロンズのPlay Pass加入者も週次Play Points特典を確認できますか？</h3><p>Play Pass週次ボーナス・ブースターは通常リワードと別制度です。Play Pointsへ登録済みの対象Play Pass加入者と対象ファミリーメンバーは、Play Pass画面を確認してください。</p></div>'
          )
          text = text.replace(
              'シルバーを最速・無駄なく目指す方法',
              'シルバーをお得・効率的に目指す方法'
          )
          if '公式ページにシルバー以上という最低ランク条件はありません' in text:
              raise SystemExit('Old Play Pass qualification wording remains')
          if 'シルバーを最速・無駄なく目指す方法' in text:
              raise SystemExit('Old silver related-link wording remains')
          path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n')
          PY

      - name: Commit corrected article
        run: |
          git add -- articles/2025-12-25-weekly-reward.html
          if git diff --cached --quiet; then
            echo "No visible-copy corrections remain."
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git diff --cached --check
            git commit -m "content: align weekly FAQ and silver link copy"
          fi

      - name: Run complete preflight
        if: env.NO_CHANGES != 'true'
        run: node .github/scripts/preflight.cjs

      - name: Push verified correction
        if: env.NO_CHANGES != 'true'
        run: git push origin HEAD:content/play-points-guides-2026-08-05
