name: PR227 Prepare Sync

on:
  push:
    branches:
      - growth/article-funnel-seo-123
    paths:
      - .github/workflows/pr227-prepare-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/article-funnel-seo-123
          fetch-depth: 0

      - name: Run canonical prepare-pr
        run: node scripts/prepare-pr.cjs

      - name: Audit generated diff
        shell: bash
        run: |
          echo '--- generated files ---'
          git status --short
          echo '--- generated diff stats ---'
          git diff --stat
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          files = [line.strip() for line in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines() if line.strip()]
          if not files:
              print('No generated changes required.')
              raise SystemExit(0)

          forbidden_prefixes = (
              '.github/', 'docs/', 'scripts/', 'tests/', 'trend-reporter/'
          )
          forbidden = [p for p in files if p.startswith(forbidden_prefixes)]
          if forbidden:
              print('prepare-pr unexpectedly changed source/test/workflow files:')
              print('\n'.join(forbidden))
              raise SystemExit(1)

          print(f'Canonical generated changes accepted: {len(files)} files')
          PY

      - name: Verify generated tree is reproducible
        run: PREPARE_PR_CHECK_ONLY=1 node .github/scripts/preflight.cjs

      - name: Commit canonical generated output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: sync canonical generated output for PR227'
          git push origin HEAD:growth/article-funnel-seo-123
