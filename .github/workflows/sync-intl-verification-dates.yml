name: Sync intl verification dates

on:
  push:
    branches:
      - growth/intl-content-quality-wave1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/intl-content-quality-wave1

      - name: Update official verification SSOT
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/article-official-verification-dates.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data['en/articles/google-play-points-use-coupons.html'] = '2026-09-03';
          data['tw/articles/google-play-points-weekly-reward.html'] = '2026-09-03';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/sync-intl-verification-dates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync intl verification dates and generated outputs"
          git push origin HEAD:growth/intl-content-quality-wave1
