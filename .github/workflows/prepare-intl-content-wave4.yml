name: Prepare intl content wave 4

on:
  push:
    branches:
      - growth/intl-content-quality-wave4

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/intl-content-quality-wave4

      - name: Put expiration answer before calculator without rewriting the guide
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function moveIntroBeforeCalculator(path, verifiedTextOld, verifiedTextNew) {
            let html = fs.readFileSync(path, 'utf8');
            const introMatch = html.match(/\n    <div class="intro">[\s\S]*?<\/div>/);
            if (!introMatch) throw new Error(`${path}: intro not found`);
            const calcIndex = html.indexOf('data-generated-intl-article-prompt="true"');
            const introIndex = html.indexOf(introMatch[0]);
            if (introIndex > calcIndex) {
              html = html.replace(introMatch[0], '');
              const articleMarker = '<article class="content">\n';
              if (!html.includes(articleMarker)) throw new Error(`${path}: article marker not found`);
              html = html.replace(articleMarker, `${articleMarker}${introMatch[0].slice(1)}\n`);
            }
            html = html.replace('<meta name="playpoint:official-verified" content="2026-07-24">', '<meta name="playpoint:official-verified" content="2026-09-03">');
            html = html.replace('<meta name="last-modified" content="2026-07-24">', '<meta name="last-modified" content="2026-09-03">');
            html = html.replace('"dateModified":"2026-07-24"', '"dateModified":"2026-09-03"');
            if (verifiedTextOld && html.includes(verifiedTextOld)) html = html.replace(verifiedTextOld, verifiedTextNew);
            fs.writeFileSync(path, html);
          }

          moveIntroBeforeCalculator(
            'ko/articles/google-play-points-expiration.html',
            '공식 정보 최종 확인: 2026년 7월 24일.',
            '공식 정보 최종 확인: 2026년 9월 3일.'
          );
          moveIntroBeforeCalculator(
            'tw/articles/google-play-points-expiration.html',
            '官方資訊最終確認：2026 年 7 月 24 日。',
            '官方資訊最終確認：2026 年 9 月 3 日。'
          );

          const datesPath = 'scripts/article-official-verification-dates.json';
          const dates = JSON.parse(fs.readFileSync(datesPath, 'utf8'));
          dates['ko/articles/google-play-points-expiration.html'] = '2026-09-03';
          dates['tw/articles/google-play-points-expiration.html'] = '2026-09-03';
          fs.writeFileSync(datesPath, JSON.stringify(dates, null, 2) + '\n');

          const demandPath = 'docs/data/intl-content-demand-2026-09-03.json';
          const demand = JSON.parse(fs.readFileSync(demandPath, 'utf8'));
          for (const [url, action] of [
            ['/ko/articles/google-play-points-expiration.html', 'observe-after-wave4-answer-first'],
            ['/tw/articles/google-play-points-expiration.html', 'observe-after-wave4-answer-first']
          ]) {
            if (!demand.pages[url]) throw new Error(`${url}: demand snapshot missing`);
            demand.pages[url].priority = 'A';
            demand.pages[url].action = action;
            demand.pages[url].gsc += ' Wave4 keeps the existing substantive guide and only moves the one-year answer before the calculator; short engagement alone is not treated as proof of poor content.';
          }
          fs.writeFileSync(demandPath, JSON.stringify(demand, null, 2) + '\n');

          fs.writeFileSync('tests/intl-demand-content-quality-wave4.test.cjs', `'use strict';\n\nconst assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst test = require('node:test');\n\nconst root = path.resolve(__dirname, '..');\nconst read = relativePath => fs.readFileSync(path.join(root, relativePath), 'utf8');\n\nfor (const [locale, file, answer] of [\n  ['KO', 'ko/articles/google-play-points-expiration.html', '마지막으로 포인트를 적립하거나 사용한 날부터 1년 후 소멸'],\n  ['TW', 'tw/articles/google-play-points-expiration.html', '마지막으로 포인트를 적립하거나 사용한 날부터 1년 후 소멸']\n]) {\n  test(\`${'${locale}'} expiration gives the direct answer before calculator without a broad rewrite\`, () => {\n    const html = read(file);\n    const intro = html.indexOf('class="intro"');\n    const calc = html.indexOf('data-generated-intl-article-prompt="true"');\n    assert.notEqual(intro, -1, \`${'${locale}'} intro\`);\n    assert.notEqual(calc, -1, \`${'${locale}'} calculator\`);\n    assert.ok(intro < calc, \`${'${locale}'} answer must precede calculator\`);\n    assert.match(html, /playpoint:official-verified" content="2026-09-03"/);\n    assert.match(html, /9077192/);\n    if (locale === 'KO') assert.match(html, /마지막으로 포인트를 적립하거나 사용한 날부터 1년 후 소멸/);\n    if (locale === 'TW') assert.match(html, /最後一次獲得或使用點數後一年到期/);\n  });\n}\n\ntest('wave4 reclassifies answer-first expiration pages to observation, not repeated rewrite', () => {\n  const report = read('docs/INTL_CONTENT_AUDIT_2026-09-03.md');\n  assert.match(report, /\\| A \\| KO \\| `\\/ko\\/articles\\/google-play-points-expiration\\.html`[\\s\\S]*observe-after-wave4-answer-first/);\n  assert.match(report, /\\| A \\| TW \\| `\\/tw\\/articles\\/google-play-points-expiration\\.html`[\\s\\S]*observe-after-wave4-answer-first/);\n});\n`);
          NODE

      - name: Generate canonical outputs and refreshed audit
        run: |
          node scripts/prepare-pr.cjs
          node scripts/audit-intl-content.cjs

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/prepare-intl-content-wave4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "growth: put expiration answers before calculator"
          git push origin HEAD:growth/intl-content-quality-wave4
