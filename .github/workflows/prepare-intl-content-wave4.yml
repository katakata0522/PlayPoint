name: Prepare intl content wave 4

on:
  push:
    branches:
      - growth/intl-content-quality-wave4

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/intl-content-quality-wave4

      - name: Put expiration answer before calculator without rewriting the guide
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function moveIntroBeforeCalculator(path) {
            let html = fs.readFileSync(path, 'utf8');
            const introMatch = html.match(/\n    <div class="intro">[\s\S]*?<\/div>/);
            if (!introMatch) throw new Error(`${path}: intro not found`);
            const calcIndex = html.indexOf('data-generated-intl-article-prompt="true"');
            const introIndex = html.indexOf(introMatch[0]);
            if (calcIndex < 0) throw new Error(`${path}: calculator prompt not found`);
            if (introIndex > calcIndex) {
              html = html.replace(introMatch[0], '');
              const articleMarker = '<article class="content">\n';
              if (!html.includes(articleMarker)) throw new Error(`${path}: article marker not found`);
              html = html.replace(articleMarker, articleMarker + introMatch[0].slice(1) + '\n');
            }
            html = html.replace('<meta name="playpoint:official-verified" content="2026-07-24">', '<meta name="playpoint:official-verified" content="2026-09-03">');
            html = html.replace('<meta name="last-modified" content="2026-07-24">', '<meta name="last-modified" content="2026-09-03">');
            html = html.replace('"dateModified":"2026-07-24"', '"dateModified":"2026-09-03"');
            fs.writeFileSync(path, html);
          }

          moveIntroBeforeCalculator('ko/articles/google-play-points-expiration.html');
          moveIntroBeforeCalculator('tw/articles/google-play-points-expiration.html');

          const datesPath = 'scripts/article-official-verification-dates.json';
          const dates = JSON.parse(fs.readFileSync(datesPath, 'utf8'));
          dates['ko/articles/google-play-points-expiration.html'] = '2026-09-03';
          dates['tw/articles/google-play-points-expiration.html'] = '2026-09-03';
          fs.writeFileSync(datesPath, JSON.stringify(dates, null, 2) + '\n');

          const demandPath = 'docs/data/intl-content-demand-2026-09-03.json';
          const demand = JSON.parse(fs.readFileSync(demandPath, 'utf8'));
          for (const [url, action] of [
            ['/ko/articles/google-play-points-expiration.html', 'observe-after-wave4-answer-first'],
            ['/tw/articles/google-play-points-expiration.html', 'observe-after-wave4-answer-first']
          ]) {
            if (!demand.pages[url]) throw new Error(`${url}: demand snapshot missing`);
            demand.pages[url].priority = 'A';
            demand.pages[url].action = action;
            demand.pages[url].gsc += ' Wave4 keeps the existing substantive guide and only moves the one-year answer before the calculator; short engagement alone is not treated as proof of poor content.';
          }
          fs.writeFileSync(demandPath, JSON.stringify(demand, null, 2) + '\n');
          NODE

      - name: Add focused wave4 regression contract
        shell: bash
        run: |
          cat > tests/intl-demand-content-quality-wave4.test.cjs <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');

          const root = path.resolve(__dirname, '..');
          const read = relativePath => fs.readFileSync(path.join(root, relativePath), 'utf8');

          for (const [locale, file] of [
            ['KO', 'ko/articles/google-play-points-expiration.html'],
            ['TW', 'tw/articles/google-play-points-expiration.html']
          ]) {
            test(`${locale} expiration gives the direct answer before calculator without a broad rewrite`, () => {
              const html = read(file);
              const intro = html.indexOf('class="intro"');
              const calc = html.indexOf('data-generated-intl-article-prompt="true"');
              assert.notEqual(intro, -1, `${locale} intro`);
              assert.notEqual(calc, -1, `${locale} calculator`);
              assert.ok(intro < calc, `${locale} answer must precede calculator`);
              assert.match(html, /playpoint:official-verified" content="2026-09-03"/);
              assert.match(html, /9077192/);
              if (locale === 'KO') assert.match(html, /마지막으로 포인트를 적립하거나 사용한 날부터 1년 후 소멸/);
              if (locale === 'TW') assert.match(html, /最後一次獲得或使用點數後一年到期/);
            });
          }

          test('wave4 reclassifies answer-first expiration pages to observation, not repeated rewrite', () => {
            const report = read('docs/INTL_CONTENT_AUDIT_2026-09-03.md');
            assert.match(report, /\| A \| KO \| `\/ko\/articles\/google-play-points-expiration\.html`[^\n]*observe-after-wave4-answer-first/);
            assert.match(report, /\| A \| TW \| `\/tw\/articles\/google-play-points-expiration\.html`[^\n]*observe-after-wave4-answer-first/);
          });
          EOF

      - name: Generate canonical outputs and refreshed audit
        run: |
          node scripts/prepare-pr.cjs
          node scripts/audit-intl-content.cjs

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/prepare-intl-content-wave4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "growth: put expiration answers before calculator"
          git push origin HEAD:growth/intl-content-quality-wave4
