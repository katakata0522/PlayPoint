name: Apply phase1 runtime trim

on:
  push:
    branches:
      - perf/phase1-mobile-stability-20260807
    paths:
      - .github/workflows/apply-phase1-runtime-trim.yml

permissions:
  contents: write

concurrency:
  group: apply-phase1-runtime-trim
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/phase1-mobile-stability-20260807
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify patch syntax
        run: node --check scripts/apply-phase1-runtime-trim.cjs

      - name: Apply runtime trimming
        run: node scripts/apply-phase1-runtime-trim.cjs

      - name: Synchronize generated output
        run: node scripts/build-html.js

      - name: Remove temporary automation
        shell: bash
        run: |
          git rm -f scripts/apply-phase1-runtime-trim.cjs .github/workflows/apply-phase1-runtime-trim.yml

      - name: Create clean local commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "未使用機能の初期読込と先取りキャッシュを削減"

      - name: Verify generator reproducibility
        run: node .github/scripts/verify-build-output.cjs

      - name: Run complete repository preflight
        run: node .github/scripts/preflight.cjs

      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify lazy diary and offline behavior in Chromium
        run: node .github/scripts/browser-smoke.cjs

      - name: Clean local artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules browser-smoke-artifacts
          test -z "$(git status --porcelain)"

      - name: Push verified result
        run: git push origin HEAD:perf/phase1-mobile-stability-20260807
