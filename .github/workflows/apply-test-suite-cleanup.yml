name: Apply test suite cleanup

on:
  push:
    branches:
      - refactor/test-suite-cleanup
    paths:
      - '.github/workflows/apply-test-suite-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/test-suite-cleanup

      - name: Apply focused cleanup
        run: python scripts/apply-test-suite-cleanup.py

      - name: Verify changed scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            tests/all-article-quality-audit.test.cjs \
            tests/growth-migration.test.cjs \
            tests/growth-priority.test.cjs \
            tests/intl-coupon-credit.test.cjs \
            tests/intl-rank-maintenance.test.cjs \
            tests/intl-use-eligibility.test.cjs \
            tests/intl-weekly-accounts.test.cjs \
            tests/playpoint-audit-fixes.test.cjs | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit cleaned tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tests/all-article-quality-audit.test.cjs \
            tests/growth-migration.test.cjs \
            tests/growth-priority.test.cjs \
            tests/intl-coupon-credit.test.cjs \
            tests/intl-rank-maintenance.test.cjs \
            tests/intl-use-eligibility.test.cjs \
            tests/intl-weekly-accounts.test.cjs \
            tests/playpoint-audit-fixes.test.cjs
          git commit -m 'test: remove obsolete and duplicate coverage'
          git push origin HEAD:refactor/test-suite-cleanup
