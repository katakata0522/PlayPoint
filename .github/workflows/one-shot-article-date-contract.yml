name: One-shot Article Date Contract

on:
  push:
    branches:
      - feat/article-date-contract
    paths:
      - .github/one-shot-article-date-contract-trigger.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed registry and integrate generator
        run: node scripts/one-shot-article-date-contract.cjs

      - name: Generate and run preparation checks
        id: prepare
        shell: bash
        run: |
          set -o pipefail
          node scripts/prepare-pr.cjs 2>&1 | tee article-date-contract-run.log

      - name: Upload preparation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-date-contract-log-${{ github.run_id }}
          path: article-date-contract-run.log
          if-no-files-found: warn
          retention-days: 2

      - name: Run focused date contract tests
        run: node --test tests/article-date-contract.test.cjs

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit generated article date contract
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 記事の更新日と公式確認日を分離"
          git push origin HEAD:feat/article-date-contract
