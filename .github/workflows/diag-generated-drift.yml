name: Diagnose generated drift

on:
  push:
    branches:
      - fix/intl-japanese-layout-polish
    paths:
      - '.github/workflows/diag-generated-drift.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/intl-japanese-layout-polish
          persist-credentials: false

      - name: Regenerate and print drift
        run: |
          set -euo pipefail
          node scripts/prepare-pr.cjs
          echo '--- STATUS ---'
          git status --short --untracked-files=no
          echo '--- NAMES ---'
          git diff --name-only
          echo '--- STAT ---'
          git diff --stat
          echo '--- DIFF ---'
          git diff -- . ':(exclude)*.min.js' | head -n 1800
