name: Repair PR 56 content sync

on:
  push:
    branches:
      - content/japanese-article-quality-audit-2026-08-04

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: content/japanese-article-quality-audit-2026-08-04
          fetch-depth: 0

      - name: Apply audited source and regression fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, value) => fs.writeFileSync(file, value, 'utf8');
          const required = (value, before, after, label) => {
            if (!value.includes(before)) throw new Error(`Replacement target not found: ${label}`);
            return value.replace(before, after);
          };
          const patch = (file, replacements) => {
            let value = read(file);
            for (const [before, after, label] of replacements) {
              value = required(value, before, after, label);
            }
            write(file, value);
          };

          {
            const file = 'scripts/article-editorial-structure.cjs';
            let value = read(file);
            for (const articlePath of [
              'articles/2026-03-10-play-points-reflection-timing.html',
              'articles/2026-07-24-play-points-cash-conversion.html',
              'articles/2026-07-25-play-points-coupon-not-applied.html',
              'articles/2025-12-25-playpoints-rank-maintenance.html',
              'articles/2025-12-25-campaign.html'
            ]) {
              const before = `  '${articlePath}': {\n`;
              const after = `${before}    manualStructure: true,\n    modifiedDate: '2026-08-04',\n`;
              if (!value.includes(after)) {
                value = required(value, before, after, `manual structure ${articlePath}`);
              }
            }
            value = required(
              value,
              "    let html = fs.readFileSync(absolutePath, 'utf8').replace(EDITORIAL_MARKER_PATTERN, '\\n');\n    const knowledge = renderKnowledgeBoundary(config);",
              "    let html = fs.readFileSync(absolutePath, 'utf8');\n\n    if (config.manualStructure) {\n      html = updateDateMetadata(html, targetModifiedDate)\n        .replace(/\\r\\n/g, '\\n')\n        .replace(/[ \\t]+$/gm, '');\n      fs.writeFileSync(absolutePath, html, 'utf8');\n      updatedCount += 1;\n      continue;\n    }\n\n    html = html.replace(EDITORIAL_MARKER_PATTERN, '\\n');\n    const knowledge = renderKnowledgeBoundary(config);",
              'manual structure handling'
            );
            write(file, value);
          }

          patch('articles/2025-12-25-getting-started.html', [
            ['<li>対象となるGoogle Oneの定期購入</li>', '<li>Androidから購入したGoogle Oneの定期購入</li>', 'Google One Android condition'],
            ['<li>シルバー以上なら、毎週金曜日に更新される通常のウィークリーリワードを確認する</li>', '<li>シルバー以上になったら<strong>通常のウィークリーリワード</strong>を毎週金曜日に確認する</li>', 'weekly reward condition']
          ]);

          patch('articles/2025-12-25-multiple-accounts.html', [
            ['通常のウィークリーリワードは、シルバー以上の対象アカウントごとにPlay Points画面へ表示されます。Play Pass加入者向けなど別の週次特典は、各アカウントの加入状況と表示条件を確認してください。', '通常のウィークリーリワードは、<strong>シルバー以上の対象アカウント</strong>ごとにPlay Points画面へ表示されます。Play Pass向けなど別の週次特典は、各アカウントの加入状況と表示条件を確認してください。', 'visible weekly reward FAQ'],
            ['通常のウィークリーリワードは、シルバー以上の対象アカウントごとにPlay Points画面へ表示されます。Play Pass加入者向けなど別の週次特典は、各アカウントの加入状況と表示条件を確認してください。', '通常のウィークリーリワードは、シルバー以上の対象アカウントごとにPlay Points画面へ表示されます。Play Pass向けなど別の週次特典は、各アカウントの加入状況と表示条件を確認してください。', 'structured weekly reward FAQ']
          ]);

          patch('articles/2025-12-25-new-year-campaign.html', [
            ['<h2>2025年末の予測期間は終了しています</h2>', '<h2>2025年末の予測期間は終了しています（過去予測の記録）</h2>', 'historical heading'],
            ['現在は対象期間が終了しているため、当時の予測を現在開催中のキャンペーン情報として利用しないでください。', '現在は予測対象期間が終了しているため、当時の予測を現在開催中のキャンペーン情報として利用しないでください。', 'historical wording']
          ]);

          {
            const file = 'articles/2026-03-10-play-points-reflection-timing.html';
            let value = read(file);
            if (!value.includes('端末側で最後に試すこと')) {
              const section = `            <section class="section">\n                <h2>端末側で最後に試すこと</h2>\n                <p>注文状態・ポイント履歴・購入アカウント・キャンペーン条件を確認した後に、Play ストアや対象アプリの再起動、端末の再起動を試します。反映確認のために<strong>もう一度購入して試さない</strong>でください。重複購入になるおそれがあります。</p>\n            </section>\n\n`;
              value = required(value, '            <div class="cta-box">', section + '            <div class="cta-box">', 'reflection safety section');
            }
            write(file, value);
          }

          {
            const file = 'articles/2025-12-25-diamond-worth-it.html';
            let value = read(file);
            const url = 'https://playpoint-sim.com/campaign/3x/';
            if (!value.includes(url)) {
              const link = `                <p class="small article-note-spacing--compact">実際に3倍キャンペーンが表示されている場合は、<a href="${url}">3倍キャンペーン時の必要額</a>でも比較できます。</p>\n`;
              value = required(value, '            <div class="article-ad-slot">', link + '            <div class="article-ad-slot">', 'diamond campaign link');
            }
            write(file, value);
          }

          {
            const file = 'articles/2026-07-25-play-points-coupon-not-applied.html';
            write(file, read(file).replaceAll('Playポイント計算機', 'Google Play Points 計算機'));
          }

          patch('tests/intl-coupon-credit.test.cjs', [
            ["ja: ['クーポン額以上', '1つだけ', '同じアカウント']", "ja: ['クーポン額以上', '1つです', 'アカウントが同じか']", 'coupon Japanese phrase contract'],
            ["      const expectedModified = locale.key === 'ja' ? '2026-07-30' : '2026-07-25';", "      const expectedModified = locale.key === 'ja'\n        ? (topic.slug === 'google-play-points-coupon-not-applied.html' ? '2026-08-04' : '2026-07-30')\n        : '2026-07-25';", 'coupon modified dates']
          ]);

          patch('tests/playpoint-regression.test.cjs', [
            ["  assert.ok(html.includes('<h2>最初に確認する3つ</h2>'));", "  assert.ok(html.includes('<h2>最初に確認する4つ</h2>'));", 'reflection first checks heading'],
            ["  assert.ok(html.includes('<h2>状況別の判断目安</h2>'));", "  assert.ok(html.includes('<h2>状況別の確認方法</h2>'));", 'reflection situation heading'],
            ["  assert.ok(promotion.includes('その特典固有の条件'), 'プロモーション固有条件の案内がありません');", "  assert.ok(promotion.includes('特典固有の条件'), 'プロモーション固有条件の案内がありません');", 'promotion condition wording']
          ]);

          patch('tests/intl-platinum-diamond.test.cjs', [
            ["phrases: ['4,000〜14,999 pt', '15,000 pt以上', '約22.9万円', '75万円']", "phrases: ['4,000〜14,999ポイント', '15,000ポイント以上', '約22万8,600円', '75万円']", 'Japanese diamond phrases'],
            ["    assert.ok(html.includes('<meta name=\"last-modified\" content=\"2026-07-25\"'), page.file);", "    const expectedModified = page.key === 'ja' ? '2026-08-04' : '2026-07-25';\n    assert.ok(html.includes(`<meta name=\"last-modified\" content=\"${expectedModified}\"`), page.file);", 'diamond modified dates'],
            ["  assert.strictEqual(article.modified, '2026-07-25');", "  assert.strictEqual(article.modified, '2026-08-04');", 'diamond registry date'],
            ["  assert.ok(atom.includes('<updated>2026-07-25T12:00:00+09:00</updated>'));", "  assert.ok(atom.includes('<updated>2026-08-04T12:00:00+09:00</updated>'));", 'diamond feed date']
          ]);

          {
            const file = 'tests/intl-rank-maintenance.test.cjs';
            let value = required(read(file), "phrases: ['翌年末まで', 'ポイント残高', '今年の獲得ポイント']", "phrases: ['翌年末まで', 'ポイント残高', '今年のレベル進捗']", 'rank terminology');
            write(file, value.replaceAll('2026-07-30', '2026-08-04'));
          }
          NODE

      - name: Regenerate tracked output
        run: |
          MODIFIED_DATE=$(node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');process.stdout.write(s.match(/last-modified\\\" content=\\\"(\\d{4}-\\d{2}-\\d{2})/)[1])")
          ASSET_VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync('sw.js','utf8');process.stdout.write(s.match(/playpoint-calc-v([0-9_]+)-[a-f0-9]+/)[1])")
          PLAYPOINT_MODIFIED_DATE="$MODIFIED_DATE" PLAYPOINT_ASSET_VERSION="$ASSET_VERSION" node scripts/build-html.js

      - name: Prepare validated repair commit
        run: |
          rm .github/workflows/fix-pr56-content-sync.yml
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { generatedFiles } = require('./scripts/build-targets.cjs');
          const names = (args) => execFileSync('git', args).toString().split('\0').filter(Boolean);
          const changed = [...new Set([
            ...names(['diff', '--name-only', '-z']),
            ...names(['ls-files', '--others', '--exclude-standard', '-z'])
          ])].sort();
          const allowed = new Set([
            ...generatedFiles,
            '.github/workflows/fix-pr56-content-sync.yml',
            'scripts/article-editorial-structure.cjs',
            'articles/2025-12-25-getting-started.html',
            'articles/2025-12-25-multiple-accounts.html',
            'articles/2025-12-25-new-year-campaign.html',
            'articles/2025-12-25-diamond-worth-it.html',
            'articles/2026-03-10-play-points-reflection-timing.html',
            'articles/2026-07-25-play-points-coupon-not-applied.html',
            'tests/intl-coupon-credit.test.cjs',
            'tests/playpoint-regression.test.cjs',
            'tests/intl-platinum-diamond.test.cjs',
            'tests/intl-rank-maintenance.test.cjs',
            'blog/sitemap.xml',
            'sitemap-intl-coupon-credit.xml',
            'sitemap-intl-platinum-diamond.xml',
            'sitemap-intl-rank-maintenance.xml'
          ]);
          const unexpected = changed.filter((file) => !allowed.has(file));
          if (unexpected.length) throw new Error(`Unexpected repair paths:\n${unexpected.join('\n')}`);
          if (!changed.length) throw new Error('Repair produced no changes.');
          console.log('Validated repair paths:\n' + changed.map((file) => `- ${file}`).join('\n'));
          fs.writeFileSync('/tmp/pr56-changed-files', `${changed.join('\0')}\0`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r -d '' path; do git add -- "$path"; done < /tmp/pr56-changed-files
          git diff --cached --check
          git commit -m "fix: synchronize audited articles with generators and tests"

      - name: Verify committed repair
        run: |
          node .github/scripts/preflight.cjs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Preflight left the committed tree dirty."
            git status --short
            exit 1
          fi

      - name: Push repaired branch
        run: git push origin HEAD:content/japanese-article-quality-audit-2026-08-04
