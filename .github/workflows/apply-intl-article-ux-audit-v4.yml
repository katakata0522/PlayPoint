name: Apply international article UX audit fixes v4

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/apply-intl-article-ux-audit-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-article-ux-audit
          fetch-depth: 0

      - name: Apply audited UX patch and hub compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-intl-article-ux-audit.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate sources"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          replacements = {
              "seo = pattern.sub(new_hub + '\\nfunction ensureDir', seo, count=1)": "seo = pattern.sub(lambda _: new_hub + '\\nfunction ensureDir', seo, count=1)",
              "if (!shared) throw new Error(relativePath + ': shared article stylesheet is missing');": "if (!shared) return next;"
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'expected patch fragment not found: {old}')
              script = script.replace(old, new, 1)
          Path('/tmp/apply-intl-ux.py').write_text(script)
          PY
          python3 /tmp/apply-intl-ux.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/intl-manual-content-sync.cjs')
          text = path.read_text()
          start = text.index('  for (const [href] of config.links) {')
          end_marker = '  fs.writeFileSync(file, html);'
          end = text.index(end_marker, start)
          replacement = '''  const missingLinks = config.links.filter(([href]) => !html.includes(`href="${href}"`));
          if (missingLinks.length) {
            const listItems = missingLinks
              .map(([href, label]) => `                <li><a href="${href}">${label}</a></li>`)
              .join('\\n');
            const listInsertionPoint = /(<section class="section related-links-section">\\s*<ul>)/;
            if (listInsertionPoint.test(html)) {
              html = html.replace(listInsertionPoint, `$1\\n${listItems}`);
            } else {
              const cardInsertionPoint = /(<div class="intl-hub-grid">)/;
              if (!cardInsertionPoint.test(html)) {
                throw new Error(`Could not locate an article collection in ${path.relative(rootDir, file)}`);
              }
              const cards = missingLinks
                .map(([href, label]) => `        <a class="intl-hub-card" href="${href}">${label}</a>`)
                .join('\\n');
              html = html.replace(cardInsertionPoint, `$1\\n${cards}`);
            }
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Validate patched source syntax
        run: |
          node --check scripts/intl-article-layout.cjs
          node --check scripts/intl-seo-pages.cjs
          node --check scripts/intl-manual-content-sync.cjs
          node --check tests/intl-article-ux-audit.test.cjs

      - name: Regenerate and run focused regressions
        run: |
          node scripts/prepare-pr.cjs
          node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs

      - name: Prove generator fixed point
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Expected generated changes were not produced" >&2
            exit 1
          fi
          node scripts/prepare-pr.cjs
          git diff --exit-code

      - name: Run project tests
        run: npm test

      - name: Commit implementation and remove one-shot workflows
        run: |
          rm .github/workflows/apply-intl-article-ux-audit.yml
          rm .github/workflows/apply-intl-article-ux-audit-v2.yml
          rm .github/workflows/apply-intl-article-ux-audit-v3.yml
          rm .github/workflows/apply-intl-article-ux-audit-v4.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish international article UX after visual audit"
          git push origin HEAD:fix/intl-article-ux-audit
