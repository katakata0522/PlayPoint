name: One-shot PR Gate Diagnostic

on:
  push:
    branches:
      - feat/article-date-contract
    paths:
      - .github/one-shot-pr-gate-diagnostic-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run preflight and capture log
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/preflight.cjs 2>&1 | tee pr-gate-diagnostic.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-gate-diagnostic-${{ github.run_id }}
          path: pr-gate-diagnostic.log
          if-no-files-found: warn
          retention-days: 2

      - name: Commit diagnostic log
        if: steps.preflight.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr-gate-diagnostic.log
          git commit -m "chore: PR Gate診断ログを一時保存"
          git push origin HEAD:feat/article-date-contract

      - name: Fail after log capture
        if: steps.preflight.outcome == 'failure'
        run: exit 1
