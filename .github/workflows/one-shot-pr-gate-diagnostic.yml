name: One-shot Article Date Contract Fix

on:
  push:
    branches:
      - feat/article-date-contract
    paths:
      - .github/one-shot-pr-gate-diagnostic-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Repair migration and regenerate
        shell: bash
        run: |
          node scripts/one-shot-article-date-contract-fix-v2.cjs
          node scripts/prepare-pr.cjs

      - name: Inspect representative migrated metadata
        shell: bash
        run: |
          grep -n 'last-modified\|hero-meta' articles/2025-12-25-diamond-worth-it.html | head -n 4
          grep -n 'playpoint:official-verified\|hero-meta\|Official sources checked' en/articles/google-play-points-platinum-diamond-cost.html | head -n 6

      - name: Run focused date and regional regression
        shell: bash
        run: node --test tests/article-date-contract.test.cjs tests/intl-platinum-diamond.test.cjs tests/intl-regional-accuracy.test.cjs

      - name: Validate diff
        shell: bash
        run: git diff --check

      - name: Commit generated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: 記事日付の意味と地域注記を保持"
          git push origin HEAD:feat/article-date-contract

      - name: Run complete preflight after persisted repair
        shell: bash
        run: node .github/scripts/preflight.cjs
