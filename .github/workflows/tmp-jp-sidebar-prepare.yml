name: Temporary prepare JP sidebar

on:
  push:
    branches:
      - feat/jp-sidebar-popular-search-v2-20260919

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/jp-sidebar-popular-search-v2-20260919
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Regenerate deterministic outputs
        run: node scripts/prepare-pr.cjs

      - name: Verify sidebar contract
        run: node --test tests/japanese-navigation-sidebar.test.cjs

      - name: Commit regenerated outputs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-jp-sidebar-prepare.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate Japanese sidebar outputs on latest main"
          git push origin HEAD:feat/jp-sidebar-popular-search-v2-20260919
