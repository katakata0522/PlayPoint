name: Temporary CI stability apply
on:
  push:
    branches: [fix/ci-stability-20260916]
    paths: [.github/workflows/tmp-ci-stability-apply.yml]
permissions:
  contents: write
  actions: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ci-stability-20260916
          fetch-depth: 8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false
      - name: Apply hash-verified tested patch and exact dependency locks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/ci-stability-20260916'
          mkdir -p "$RUNNER_TEMP/ci-lock" "$RUNNER_TEMP/ci-apply-evidence"
          gh run download 35091002003 --repo katakata0522/PlayPoint -n ci-runtime-lock -D "$RUNNER_TEMP/ci-lock"
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, tarfile
          root = pathlib.Path('.')
          data = ''.join((root / f'.github/ci-code-part-{n}.b64').read_text() for n in (1, 2))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b37f85fa997ad94e5a81d88f99c2bba7a5bd1424879728237606fb98524d3579'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-code.patch').write_bytes(patch)
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-lock/ci-runtime-lock.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '4be1bfaabea17e774bd4d0352d4409c15438e27b48d8733bb52ff8980ca740a3'
          with tarfile.open(archive) as bundle:
              assert all(m.name.startswith('.github/ci-runtime') and '..' not in pathlib.PurePosixPath(m.name).parts for m in bundle.getmembers())
              bundle.extractall(root, filter='data')
          print('Exact patch and lock archive hashes verified')
          PY
          git apply --check "$RUNNER_TEMP/ci-code.patch"
          git apply "$RUNNER_TEMP/ci-code.patch"
          git rm .github/ci-code-part-1.b64 .github/ci-code-part-2.b64 .github/workflows/tmp-ci-stability-source.yml .github/workflows/tmp-ci-runtime-lock.yml .github/workflows/tmp-ci-stability-apply.yml
      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/preflight.cjs 2>&1 | tee "$RUNNER_TEMP/ci-apply-evidence/preflight.log"
          git add .github docs tests
          git diff --quiet bb54ddea118dd60b3dbc8eafd7d332ac4be5c2a5 -- . ':(exclude).github/**' ':(exclude)docs/**' ':(exclude)tests/**'
          git diff --cached --check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'bb54ddea118dd60b3dbc8eafd7d332ac4be5c2a5'], text=True).splitlines()
          assert paths and all(p.startswith(('.github/', 'docs/', 'tests/')) for p in paths)
          assert not any('tmp-ci-' in p or 'ci-code-part-' in p for p in paths)
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths if pathlib.Path(p).is_file()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ci-apply-evidence/file-hashes.json').write_text(json.dumps(hashes, indent=2))
          print(f'{len(paths)} intended CI/docs/test files; public files unchanged')
          PY
      - name: Commit verified CI-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '第0章: CI環境固定と失敗・再試行・性能ばらつきの証跡を整備'
          git push origin HEAD:refs/heads/fix/ci-stability-20260916
          git rev-parse HEAD | tee "$RUNNER_TEMP/ci-apply-evidence/candidate-sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-stability-apply-evidence
          path: |
            ${{ runner.temp }}/ci-apply-evidence/
            ${{ runner.temp }}/playpoint-ci-evidence/
            ${{ runner.temp }}/ci-lock/*-audit.json
          retention-days: 7
          if-no-files-found: warn
