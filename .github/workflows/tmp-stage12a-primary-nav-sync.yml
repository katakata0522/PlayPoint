name: Temporary Stage 12A primary nav sync

on:
  push:
    branches:
      - refactor/runtime-site-shell-stage12a-20260914

permissions:
  contents: write

concurrency:
  group: tmp-stage12a-primary-nav-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/refactor/runtime-site-shell-stage12a-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/runtime-site-shell-stage12a-20260914
          fetch-depth: 2

      - name: Generate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Verify Stage 12A navigation contract
        run: node --test tests/japanese-primary-navigation.test.cjs

      - name: Remove temporary workflow and commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-stage12a-primary-nav-sync.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m '生成: 日本語Primary Navを正規同期'
          git push origin HEAD:refactor/runtime-site-shell-stage12a-20260914
