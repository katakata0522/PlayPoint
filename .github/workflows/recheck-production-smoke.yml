name: Recheck production smoke

on:
  push:
    branches:
      - chore/recheck-production-smoke-864fe6e

permissions:
  contents: write

concurrency:
  group: recheck-production-smoke-864fe6e
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/recheck-production-smoke-864fe6e

      - name: Confirm deployed revision is visible
        shell: bash
        run: |
          set -euo pipefail
          expected='864fe6ebe345e10c5feb5706e00b3e7c4c4c2682'
          actual=''
          for attempt in 1 2 3 4 5; do
            actual="$(curl -fsS -H 'Cache-Control: no-cache' "https://playpoint-sim.com/status/deploy-revision.txt?recheck=$(date +%s%N)" | tr -d '\r\n')" || true
            echo "attempt ${attempt}: ${actual:-no-response}"
            if [ "$actual" = "$expected" ]; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "expected: $expected"
          echo "actual: ${actual:-no-response}"
          exit 1

      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Recheck production calculator browser smoke
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
          SMOKE_EXPECT_REVISION: 864fe6ebe345e10c5feb5706e00b3e7c4c4c2682
        run: node .github/scripts/browser-smoke.cjs

      - name: Recheck production revenue smoke
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: node .github/scripts/browser-revenue-smoke.cjs

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/recheck-production-smoke.yml
          git add -A
          git commit -m "chore: remove production smoke recheck workflow"
          git push origin HEAD:chore/recheck-production-smoke-864fe6e
