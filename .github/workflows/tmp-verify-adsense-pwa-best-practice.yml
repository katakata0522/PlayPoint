name: Temporary Verify AdSense PWA Best Practice

on:
  push:
    branches:
      - fix/adsense-pwa-revenue-best-practice

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove temporary workflow from validation workspace
        run: rm -f .github/workflows/tmp-verify-adsense-pwa-best-practice.yml
      - name: Full preflight
        run: node .github/scripts/preflight.cjs
