name: Refine Japanese guide content

on:
  push:
    branches:
      - content/play-points-guides-2026-08-05

permissions:
  contents: write

concurrency:
  group: refine-jp-guide-content-20260805
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare refinement script
        run: |
          cat > /tmp/refine-guides.py <<'PY'
          from pathlib import Path
          import json

          def edit(path, replacements):
              file = Path(path)
              text = file.read_text()
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f"Expected text was not found in {path}: {old[:120]}")
              file.write_text(text)

          old_silver_title = "Google Play Pointsで最速シルバーを目指す方法｜250ポイントを無駄なく貯める"
          new_silver_title = "Google Play Pointsでシルバーをお得に目指す方法｜250ポイントの効率的な貯め方"
          old_silver_desc = "ブロンズからシルバーまでの250ポイントを、無料オファー、クエスト、Play Pass週次特典、倍率キャンペーン、予定していた購入で無駄なく貯める順番と必要額を解説します。"
          new_silver_desc = "ブロンズからシルバーまでの250ポイントを、クエスト、アプリ体験オファー、Play Pass週次特典、倍率キャンペーン、購入予定の組み合わせで効率よく貯める順番と必要額を解説します。"

          edit("articles/2026-08-05-fastest-silver.html", [
              (old_silver_title, new_silver_title),
              (old_silver_desc, new_silver_desc),
              ("<span class=\"hero-badge\">シルバー最短ルート</span>", "<span class=\"hero-badge\">シルバーお得ルート</span>"),
              ("\"name\": \"ブロンズでもウィークリーリワードを受け取れますか？\"", "\"name\": \"ブロンズで確認できる週次特典はありますか？\""),
              ("\"text\": \"通常リワードの公式基準はシルバー以上です。ただしPlay Pass週次特典は別制度で、ブロンズで通常型特典が表示された報告もあるため、特典タブを確認する価値があります。\"", "\"text\": \"通常のウィークリーリワードはシルバー以上が公式対象です。Play Pass加入者向けの週次ボーナス・ブースターは別制度なので、対象の加入者はPlay Pass画面を確認してください。\""),
              ("\"name\": \"無料だけでシルバーになれますか？\"", "\"name\": \"購入以外でもシルバーへのポイントを貯められますか？\""),
              ("\"text\": \"クエストや体験オファーなどで可能性はありますが、対象者や開催内容によるため保証できません。表示中の特典と不足ポイントを確認してください。\"", "\"text\": \"クエストやアプリ体験オファーなど、購入以外で獲得できる場合があります。対象者や開催内容はアカウントごとに異なるため、表示中の特典を確認してください。\""),
              ("\"name\": \"シルバーのために課金する価値はありますか？\"", "\"name\": \"どのタイミングで購入するとシルバーをお得に目指せますか？\""),
              ("\"text\": \"元から予定していた購入で届くなら検討しやすいですが、特典だけを理由に予定外の支出を増やすのは勧められません。\"", "\"text\": \"購入予定の対象アプリやサブスクに使える高い獲得率、クエスト、Play Pass週次特典が表示されている時期を選び、購入前に開始操作・対象・上限を確認するのが基本です。\""),
              ("<h2 id=\"quick-answer\">結論：まず無料獲得と予定購入を確認し、残りだけを高獲得率で埋める</h2>", "<h2 id=\"quick-answer\">結論：購入予定を高い獲得率の期間へ合わせ、使える特典も先に反映する</h2>"),
              ("<p>日本のシルバー条件は暦年のレベル進捗250ポイントです。ブロンズの通常獲得率だけなら、0ポイントからの単純目安は税抜の対象購入額で約25,000円ですが、クエスト、アプリ体験オファー、Play Pass週次特典、対象キャンペーンがあれば必要額を減らせます。</p>", "<p>日本のシルバー条件は暦年のレベル進捗250ポイントです。ブロンズの通常獲得率だけなら、0ポイントからの単純目安は税抜の対象購入額で約25,000円です。クエスト、アプリ体験オファー、Play Pass週次特典、対象キャンペーンを組み合わせると、同じ購入予定でもシルバーへ効率よく近づけます。</p>"),
              ("<p>最速とは、何でも買うことではありません。追加購入なしで受け取れるもの、元から予定していた購入、実際に表示された高獲得率の順に確認し、最後に残った不足ポイントだけを計算します。</p>", "<p>お得に目指す基本は、現在の不足ポイントを確認し、アカウントに表示された特典を受け取り、今後の購入予定を対象の高い獲得率へ合わせることです。最後に残る不足分だけを計算機で比較します。</p>"),
              ("<h2>最速ルートは「無料・予定済み・高倍率」の順で確認する</h2>", "<h2>お得なルートは「現在地・特典・購入予定・高獲得率・再計算」の順</h2>"),
              ("""      <ol>
        <li><strong>無料で表示されている特典を確認:</strong> クエスト、アプリ体験オファー、対象ゲームイベントなど、追加購入なしで獲得できるものを先に確認する</li>
        <li><strong>ブロンズでも特典タブを確認:</strong> 通常リワードの公式基準はシルバー以上だが、Play Pass週次特典は別制度で、ブロンズ表示の報告もある</li>
        <li><strong>元から予定していた購入をまとめる:</strong> アプリ、ゲーム内購入、書籍、Google Play経由の対象サブスクを確認する</li>
        <li><strong>対象の高獲得率を使う:</strong> 2倍・3倍などの表示だけでなく、対象アプリ、期間、開始操作、上限を確認する</li>
        <li><strong>残りポイントだけ計算:</strong> 無料獲得分と予定購入分を引いた後の不足分を逆算する</li>
      </ol>""", """      <ol>
        <li><strong>現在地を確認:</strong> 「ステータスの特典」でシルバーまでの不足ポイントと現在の通常獲得率を確認する</li>
        <li><strong>表示中の特典を確認:</strong> クエスト、アプリ体験オファー、対象ゲームイベント、Play Pass加入者向け週次特典を確認する</li>
        <li><strong>購入予定を整理:</strong> アプリ、ゲーム内購入、書籍、Google Play経由の対象サブスクなど、近いうちの対象購入をまとめる</li>
        <li><strong>高い獲得率へ合わせる:</strong> 対象アプリ、期間、開始操作、上限を確認し、購入予定を利用できる高い獲得率の期間へ合わせる</li>
        <li><strong>残りを再計算:</strong> 特典と購入予定で得られる見込みを反映し、残った不足ポイントだけを逆算する</li>
      </ol>"""),
              ("<h2>ブロンズでもウィークリー特典を一度確認する</h2>", "<h2>ブロンズは通常リワードとPlay Pass週次特典を分けて確認</h2>"),
              ("<p>また、ブロンズで通常型の週次抽選が表示されたという利用者報告もあります。Googleが日本のブロンズ常設特典として明記しているわけではないため、必ず受け取れるとは言えませんが、<strong>Play Points → 特典を確認するコストはほぼありません。</strong></p>", "<p>ブロンズは通常リワードの公式対象外です。Play Pass加入者向けの週次ボーナス・ブースターは別制度で、Play Points登録済みかつ対象の加入者であればPlay Pass画面から確認できます。実際に表示された内容、期限、対象条件を優先してください。</p>"),
              ("""      <ul>
        <li>表示されていれば、期限と条件を確認して受け取る</li>
        <li>表示されなくても、公式の通常条件では不具合と断定しない</li>
        <li>Play Pass加入者は木曜日のPlay Pass画面も確認する</li>
        <li>通常・スーパー・Play Passの3種類を混同しない</li>
      </ul>""", """      <ul>
        <li>通常のウィークリーリワードはシルバー以上で、金曜日に更新される</li>
        <li>Play Pass加入者向け週次ボーナス・ブースターは別制度で、木曜日に更新される</li>
