        <li>通常・スーパー・Play Passの3種類を混同しない</li>
      </ul>"""),
              ("ブロンズを含む週次特典の違いを見る", "通常・スーパー・Play Pass週次特典の違いを見る"),
              ("<h2>無料で獲得できる可能性があるもの</h2>", "<h2>購入と組み合わせられる特典・オファー</h2>"),
              ("<caption>追加購入前に確認する場所</caption>", "<caption>購入前に確認する特典・オファー</caption>"),
              ("<p>無料獲得だけで短期間に250ポイントへ届くとは限りません。表示されていない特典を探し続けるより、今ある不足ポイントと予定購入を基準に判断します。</p>", "<p>これらは購入予定と組み合わせられる場合があり、シルバーへの到達を早める材料になります。対象者、期間、達成条件はアカウントごとに異なるため、実際に表示されている内容を基準にしてください。</p>"),
              ("<section class=\"section\" id=\"avoid\">", "<section class=\"section\" id=\"timing\">"),
              ("<h2>無駄な課金を避ける判断ライン</h2>", "<h2>残りポイントに合わせて、よりお得な購入タイミングを選ぶ</h2>"),
              ("<p>シルバーになる主な利点は、通常獲得率が100円ごとに1.25ポイントへ上がり、通常ウィークリーリワードの公式対象になることです。しかし、特典のためだけに大きく予定外の支出をすると、回収できない可能性が高くなります。</p>", "<p>シルバーになると、通常獲得率が100円ごとに1.25ポイントへ上がり、通常ウィークリーリワードの公式対象になります。近いうちに対象購入がある場合は、アプリ別オファー、クエスト条件、2倍・3倍など実際に表示された高い獲得率へ合わせると、同じ購入額でもシルバーへ近づきやすくなります。</p>"),
              ("<caption>残りポイント別の考え方</caption>", "<caption>残りポイント別の活かし方</caption>"),
              ("<tr><td>50ポイント</td><td>約5,000円</td><td>近いうちの予定購入で届くか確認</td></tr>", "<tr><td>50ポイント</td><td>約5,000円</td><td>直近の購入予定と対象オファーを合わせる</td></tr>"),
              ("<tr><td>100ポイント</td><td>約10,000円</td><td>高倍率対象と予定購入を比較</td></tr>", "<tr><td>100ポイント</td><td>約10,000円</td><td>2倍・3倍やアプリ別レートを比較する</td></tr>"),
              ("<tr><td>200ポイント</td><td>約20,000円</td><td>シルバー特典だけを理由に急がない</td></tr>", "<tr><td>200ポイント</td><td>約20,000円</td><td>複数の購入予定を対象期間へまとめられるか確認する</td></tr>"),
              ("<tr><td>250ポイント</td><td>約25,000円</td><td>無料・予定済み・キャンペーンを先に確認</td></tr>", "<tr><td>250ポイント</td><td>約25,000円</td><td>通常時とキャンペーン時の必要額を先に比較する</td></tr>"),
              ("<p>返金前提の購入、対象外取引の繰り返し、複数アカウントへの分散は、最速ルートではありません。返金ではポイントとレベル進捗が減算される場合があります。</p>", "<p>確実にポイントを積み上げるには、対象取引をPlay Pointsへ登録した同じGoogleアカウントに集約し、購入前に対象条件を確認します。返金ではポイント残高とレベル進捗から減算される場合があります。</p>"),
              ("<div class=\"faq-item\"><h3>ブロンズでもウィークリーリワードを受け取れますか？</h3><p>通常リワードの公式基準はシルバー以上です。ただしPlay Pass週次特典は別制度で、ブロンズで通常型特典が表示された報告もあるため、特典タブを確認する価値があります。</p></div>", "<div class=\"faq-item\"><h3>ブロンズで確認できる週次特典はありますか？</h3><p>通常のウィークリーリワードはシルバー以上が公式対象です。Play Pass加入者向けの週次ボーナス・ブースターは別制度なので、対象の加入者はPlay Pass画面を確認してください。</p></div>"),
              ("<div class=\"faq-item\"><h3>無料だけでシルバーになれますか？</h3><p>クエストや体験オファーなどで可能性はありますが、対象者や開催内容によるため保証できません。表示中の特典と不足ポイントを確認してください。</p></div>", "<div class=\"faq-item\"><h3>購入以外でもシルバーへのポイントを貯められますか？</h3><p>クエストやアプリ体験オファーなど、購入以外で獲得できる場合があります。対象者や開催内容はアカウントごとに異なるため、表示中の特典を確認してください。</p></div>"),
              ("<div class=\"faq-item\"><h3>シルバーのために課金する価値はありますか？</h3><p>元から予定していた購入で届くなら検討しやすいですが、特典だけを理由に予定外の支出を増やすのは勧められません。</p></div>", "<div class=\"faq-item\"><h3>どのタイミングで購入するとシルバーをお得に目指せますか？</h3><p>購入予定の対象アプリやサブスクに使える高い獲得率、クエスト、Play Pass週次特典が表示されている時期を選び、購入前に開始操作・対象・上限を確認するのが基本です。</p></div>"),
              ("シルバーを最速・無駄なく目指す方法", "シルバーをお得・効率的に目指す方法"),
              ("<p><a href=\"/status/silver/\">シルバー到達計算ページ</a>では、現在のポイントと利用できる倍率から、シルバーまでの残り必要額を確認できます。無料で得られるポイントと、もともと予定していた購入を先に反映してから計算してください。</p>", "<p><a href=\"/status/silver/\">シルバー到達計算ページ</a>では、現在の不足ポイント、購入予定、実際に利用できる獲得率から、シルバーまでの残り必要額を比較できます。通常時とキャンペーン時を並べて、購入タイミングを検討してください。</p>"),
              ("Google Play公式情報と実際の画面で確認すべき内容を分け、計算結果だけで不要な購入を促さない方針で掲載しています。", "Google Play公式情報と実際の画面で確認すべき内容を分け、購入予定とキャンペーン条件を照らし合わせて、より高い獲得率を選びやすい形で掲載しています。"),
          ])

          weekly_old_title = "Google Play Pointsのウィークリーリワード｜ブロンズも確認・3種類の違い"
