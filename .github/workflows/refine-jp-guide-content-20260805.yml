              ("\"name\": \"ブロンズでもウィークリーリワードが表示されることはありますか？\"", "\"name\": \"ブロンズは通常のウィークリーリワード対象ですか？\""),
              ("\"text\": \"利用者による表示報告はありますが、日本の常設仕様としてGoogle公式ヘルプには記載されていません。表示されていれば条件を確認し、表示されなくても不具合と断定しないでください。\"", "\"text\": \"日本向けGoogle公式ヘルプでは、通常のウィークリーリワードはシルバー以上が対象です。ブロンズのPlay Pass加入者は、別制度の週次ボーナス・ブースターをPlay Pass画面で確認してください。\""),
              ("<h2 id=\"quick-answer\">結論：通常はシルバー以上。ただしブロンズも特典画面を一度確認する</h2>", "<h2 id=\"quick-answer\">結論：通常はシルバー以上。Play Pass週次特典は別制度</h2>"),
              ("<p>また、ブロンズで通常型の週次抽選が表示されたという利用者報告もあります。常設対象とは断言できませんが、ブロンズでも「Play Points → 特典」を一度確認し、表示されている内容を優先するのが安全です。</p>", "<p>ブロンズは通常のウィークリーリワードの公式対象ではありません。Play Pass加入者向け週次ボーナス・ブースターは別制度なので、対象の加入者はPlay Pass画面で表示内容と期限を確認してください。</p>"),
              ("<h2>ブロンズでも、まず特典タブを確認してよい</h2>", "<h2>ブロンズは通常リワードとPlay Pass週次特典を混同しない</h2>"),
              ("<p><strong>公式の常設条件はシルバー以上ですが、「ブロンズは絶対に何も表示されない」とまでは断定できません。</strong> ブロンズで通常型の週次抽選が表示されたという利用者報告が複数あり、過去には表示後に消えたという報告もあります。Googleはこれを日本のブロンズ常設特典として公式ヘルプに記載していません。</p>", "<p><strong>日本の通常ウィークリーリワードはシルバー以上が公式対象です。</strong> ブロンズでは、通常リワードを前提にするのではなく、Play Passへ加入している場合に別制度の週次特典が表示されているかを確認します。</p>"),
              ("""      <ul>
        <li>ブロンズでも「Play Points → 特典」を週1回確認する</li>
