              ("<p>この記事では、公式の標準条件と例外的な画面報告を分けて扱います。ブロンズで受け取れることを保証するものではありません。</p>", "<p>対象可否は、Google Play公式のランク条件と、ご自身のPlay Points・Play Pass画面に表示された内容を優先してください。</p>"),
