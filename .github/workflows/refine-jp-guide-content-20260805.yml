      - name: Apply editorial and factual refinements
        run: python /tmp/refine-guides.py

      - name: Regenerate public output
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1249'
        run: node scripts/build-html.js

      - name: Reapply manual article refinements
        run: python /tmp/refine-guides.py

      - name: Validate and stage actual changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const { generatedFiles } = require('./scripts/build-targets.cjs');
          const run = (args) => {
            const result = spawnSync('git', args, { encoding: 'utf8' });
            if (result.status !== 0) throw new Error(`${args.join(' ')}\n${result.stdout || ''}${result.stderr || ''}`);
            return result.stdout;
          };
          const changed = [...new Set([
            ...run(['diff', '--name-only', '--diff-filter=ACDMRTUXB']).split(/\r?\n/),
            ...run(['ls-files', '--others', '--exclude-standard']).split(/\r?\n/)
          ].filter(Boolean))];
          if (!changed.length) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'NO_CHANGES=true\n');
            console.log('No content changes remain.');
            process.exit(0);
          }
          const allowed = new Set([
            ...generatedFiles,
            'blog/index.html',
            'blog/sitemap.xml',
            'articles/2026-08-05-fastest-silver.html',
            'articles/2025-12-25-weekly-reward.html',
            'articles/2026-08-05-play-points-levels-guide.html',
            'articles/2026-08-05-play-points-cannot-join.html',
            'articles/2026-08-05-play-points-multiplier-stacking.html',
            'status/silver/index.html',
            'campaign/2x/index.html',
            'campaign/3x/index.html',
            'tests/jp-guide-batch-20260805.test.cjs',
            'tests/article-fact-regression.test.cjs'
          ]);
          const unexpected = changed.filter((file) => !allowed.has(file));
          if (unexpected.length) throw new Error(`Unexpected changed paths:\n${unexpected.join('\n')}`);
          const staged = spawnSync('git', ['add', '--', ...changed], { stdio: 'inherit' });
          process.exit(staged.status ?? 1);
          NODE
          if [ "${NO_CHANGES:-false}" != "true" ]; then
            git diff --cached --check
            git diff --cached --quiet && { echo "No staged content changes."; exit 1; } || true
          fi

      - name: Commit refined guide content
        if: env.NO_CHANGES != 'true'
        run: |
          git commit -m "content: refine guide facts, tone and silver navigation"

      - name: Verify clean committed tree
        if: env.NO_CHANGES != 'true'
        run: test -z "$(git status --porcelain)"

      - name: Run complete preflight
        if: env.NO_CHANGES != 'true'
        run: node .github/scripts/preflight.cjs

      - name: Push verified content commit
        if: env.NO_CHANGES != 'true'
        run: git push origin HEAD:content/play-points-guides-2026-08-05
