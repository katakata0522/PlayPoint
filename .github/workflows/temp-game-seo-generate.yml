name: Temporary game SEO generated-output sync

on:
  push:
    branches:
      - feat/game-seo-depth-20260913

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and verify canonical output
        run: node scripts/prepare-pr.cjs

      - name: Commit generated output and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/temp-game-seo-generate.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: sync verified game SEO output"
          git push origin HEAD:feat/game-seo-depth-20260913
