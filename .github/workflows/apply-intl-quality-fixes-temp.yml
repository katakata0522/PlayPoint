name: Apply international quality fixes

on:
  push:
    branches:
      - fix/intl-copy-hreflang
    paths:
      - scripts/apply-intl-quality-fixes-temp.cjs
      - .github/workflows/apply-intl-quality-fixes-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-copy-hreflang
      - name: Apply source patch
        run: node scripts/apply-intl-quality-fixes-temp.cjs
      - name: Generate canonical outputs
        run: node scripts/prepare-pr.cjs
      - name: Run focused localization regression
        run: node --test tests/intl-localization-quality.test.cjs tests/intl-article-layout.test.cjs
      - name: Verify fixed point
        run: |
          git add -A
          node scripts/prepare-pr.cjs
          git diff --exit-code
      - name: Remove temporary audit and patch helpers
        run: |
          rm -f scripts/inspect-intl-fix-targets-temp.cjs
          rm -f scripts/apply-intl-quality-fixes-temp.cjs
          rm -f .github/workflows/inspect-intl-fix-targets-temp.yml
          rm -f .github/workflows/apply-intl-quality-fixes-temp.yml
          rm -f audit/intl-fix-targets.json
      - name: Commit canonical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: international article wording and hreflang quality"
          git push origin HEAD:fix/intl-copy-hreflang
