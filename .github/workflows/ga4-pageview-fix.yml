name: GA4 Page View Fix Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: page_view欠損とGA4二重初期化を修復
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${file}: replacement target count=${count}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceOnce(
            'js/analytics-core.js',
            "    const ALLOWED_PARAMS = Object.freeze({\n        calculation_completed:",
            "    const ALLOWED_PARAMS = Object.freeze({\n        page_view: [],\n        calculation_completed:"
          );
          replaceOnce(
            'js/analytics-core.js',
            "    const pendingEvents = [];\n    let analyticsReady = false;",
            "    const pendingEvents = [];\n    let analyticsReady = false;\n    let initialPageViewSent = false;"
          );
          replaceOnce(
            'js/analytics-core.js',
            "    function flushPending() {\n        if (!window.PlayPointConsent) return;",
            "    function sendInitialPageView() {\n        if (initialPageViewSent || !analyticsReady || !hasConsent()) return false;\n        initialPageViewSent = true;\n        send('page_view', {});\n        return true;\n    }\n\n    function flushPending() {\n        if (!window.PlayPointConsent) return;"
          );
          replaceOnce(
            'js/analytics-core.js',
            "        if (!analyticsReady) return;\n\n        while (pendingEvents.length) {",
            "        if (!analyticsReady) return;\n\n        if (window.__playpointManualPageView === true) sendInitialPageView();\n        while (pendingEvents.length) {"
          );

          replaceOnce(
            'js/third-party.js',
            "    async function loadAnalytics() {\n        if (gaLoaded) return;\n        try {",
            "    async function loadAnalytics() {\n        if (gaLoaded) return;\n        if (window.__playpointGaConfigured) {\n            gaLoaded = true;\n            return;\n        }\n        try {"
          );
          replaceOnce(
            'js/third-party.js',
            "            window.gtag('set', { app_display_mode: getDisplayMode() });\n            window.gtag('config', GA_MEASUREMENT_ID);\n            gaLoaded = true;\n            window.PlayPointAnalytics.markAnalyticsReady();",
            "            window.gtag('set', { app_display_mode: getDisplayMode() });\n            window.__playpointManualPageView = true;\n            window.gtag('config', GA_MEASUREMENT_ID, { send_page_view: false });\n            window.__playpointGaConfigured = true;\n            gaLoaded = true;\n            window.PlayPointAnalytics.markAnalyticsReady();"
          );

          const analyticsTest = 'tests/analytics-core.test.cjs';
          let analyticsTestSource = fs.readFileSync(analyticsTest, 'utf8');
          const anchor = "test('記事・LPからの計算機流入は次の計算完了へ一度だけ引き継ぐ', () => {";
          if (!analyticsTestSource.includes(anchor)) throw new Error('analytics test anchor missing');
          const newTest = `test('手動page_viewモードでは保留イベントより先に一度だけpage_viewを送る', () => {\n  const { context } = createRuntime('granted');\n  const analytics = context.PlayPointAnalytics;\n  context.__playpointManualPageView = true;\n  analytics.track('theme_change', { theme_mode: 'dark' });\n\n  analytics.markAnalyticsReady();\n\n  const sentNames = context.dataLayer\n    .filter(item => item && item[0] === 'event')\n    .map(item => item[1]);\n  assert.equal(sentNames[0], 'page_view');\n  assert.equal(sentNames[1], 'theme_change');\n  assert.equal(eventCalls(context, 'page_view').length, 1);\n\n  analytics.markAnalyticsReady();\n  analytics.flushPending();\n  assert.equal(eventCalls(context, 'page_view').length, 1, '初回page_viewが重複送信されています');\n});\n\n`;
          analyticsTestSource = analyticsTestSource.replace(anchor, newTest + anchor);
          fs.writeFileSync(analyticsTest, analyticsTestSource);

          const guardTest = 'tests/playpoint-product-guards.test.cjs';
          replaceOnce(
            guardTest,
            "  const configIndex = thirdParty.indexOf(\"window.gtag('config', GA_MEASUREMENT_ID)\");\n  const readyIndex = thirdParty.indexOf('window.PlayPointAnalytics.markAnalyticsReady()');\n  assert.ok(configIndex >= 0, 'GA4 config呼び出しがありません');\n  assert.ok(readyIndex > configIndex, 'GA4 config完了前に保留イベントをflushし得ます');",
            "  const configIndex = thirdParty.indexOf(\"window.gtag('config', GA_MEASUREMENT_ID, { send_page_view: false })\");\n  const readyIndex = thirdParty.indexOf('window.PlayPointAnalytics.markAnalyticsReady()');\n  assert.ok(configIndex >= 0, 'GA4 configで自動page_viewを明示停止していません');\n  assert.ok(core.includes(\"page_view: []\"), '明示page_viewが共通計測の許可対象にありません');\n  assert.ok(core.includes('sendInitialPageView'), '初回page_viewの明示送信処理がありません');\n  assert.ok(thirdParty.includes('window.__playpointGaConfigured'), 'GA4の二重初期化防止ガードがありません');\n  assert.ok(readyIndex > configIndex, 'GA4 config完了前に保留イベントをflushし得ます');"
          );
          NODE

      - name: GA4変更に必要な生成物とアセット参照だけ同期
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const indexHtml = fs.readFileSync('index.html', 'utf8');
          const serviceWorker = fs.readFileSync('sw.js', 'utf8');
          const modifiedDate = indexHtml.match(/<meta name="last-modified" content="(\d{4}-\d{2}-\d{2})">/)?.[1];
          const assetVersion = serviceWorker.match(/playpoint-calc-v([0-9_]+)-[a-f0-9]+/)?.[1];
          if (!modifiedDate || !assetVersion) throw new Error('committed build pins not found');
          const result = spawnSync(process.execPath, ['scripts/build-html.js'], {
            stdio: 'inherit',
            env: {
              ...process.env,
              PLAYPOINT_MODIFIED_DATE: modifiedDate,
              PLAYPOINT_ASSET_VERSION: assetVersion
            }
          });
          if (result.status !== 0) process.exit(result.status || 1);
          NODE

      - name: Analytics重点回帰テスト
        run: node --test tests/analytics-core.test.cjs tests/calculator-funnel-analytics.test.cjs tests/monetization-search-quality.test.cjs tests/playpoint-product-guards.test.cjs

      - name: 全事前検証
        run: node .github/scripts/preflight.cjs

      - name: 差分検査
        run: git diff --check

      - name: 検証済み差分を保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize GA4 initial page_view and single initialization'
          git push