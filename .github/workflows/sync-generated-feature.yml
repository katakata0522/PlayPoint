name: Sync generated files for calculator UI

on:
  push:
    branches:
      - feat/simplify-main-calculator-inputs
    paths:
      - '.github/workflows/sync-generated-feature.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor == 'katakata0522'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/simplify-main-calculator-inputs
          fetch-depth: 0

      - name: Generate synchronized public files
        run: node scripts/build-html.js

      - name: Commit only generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html en/index.html ko/index.html tw/index.html sw.js
          if git diff --cached --quiet; then
            echo "Generated outputs are already synchronized."
            exit 0
          fi
          git commit -m "生成済みHTMLとキャッシュ版を同期"
          git push origin HEAD:feat/simplify-main-calculator-inputs
