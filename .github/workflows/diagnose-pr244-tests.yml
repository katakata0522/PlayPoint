name: Diagnose PR244 test failures

on:
  push:
    branches:
      - growth/search-intent-articles-20260908

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/search-intent-articles-20260908
          persist-credentials: true

      - name: Capture failed tests
        run: |
          set +e
          node --test tests/*.test.cjs > /tmp/pr244-tests.log 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/pr244-tests.log').read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(lines) if line.startswith('not ok ')]
          out = [f'exit_code={1 if hits else 0}', f'failed_tests={len(hits)}']
          for n, i in enumerate(hits, 1):
              out.append(f'\n=== failure {n} ===')
              out.extend(lines[max(0, i-3):min(len(lines), i+28)])
          Path('.github/pr244-test-failures.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          exit 0

      - name: Commit diagnostic and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-pr244-tests.yml
          git add .github/pr244-test-failures.txt
          git commit -m "chore: PR #244の回帰テスト失敗を記録"
          git push origin HEAD:growth/search-intent-articles-20260908
