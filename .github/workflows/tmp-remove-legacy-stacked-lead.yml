name: Temporary legacy stacked lead cleanup

on:
  push:
    branches:
      - fix/remove-legacy-stacked-lead-20260911

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/remove-legacy-stacked-lead-20260911

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize legacy article markup and harden audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          article = Path('articles/2025-12-25-best-use.html')
          text = article.read_text(encoding='utf-8')
          old = '''<section aria-labelledby="quick-answer" class="answer-box">
          <h2 id="quick-answer">結論：おすすめは「実際に使う予定がある交換先」</h2>
          <p>クーポンやゲーム内アイテムは、自分がもともと買う予定の対象なら高い実用価値になりやすい一方、使う予定がなければ表示額が大きくても得とは限りません。用途をまだ決めていない場合は、Playクレジットも含めて自分の「使う」画面の条件を比較してください。</p>
          </section>
          <div class="intro">
          <strong>一番よい交換先は、表示されている特典と実際に使う予定で変わります。</strong><br/>
                          クーポン・アイテム・Playクレジットを、見かけの額ではなく「実際に使える価値」で比べます。
                      </div>'''
          new = '''<section aria-labelledby="quick-answer" class="answer-box">
          <h2 id="quick-answer">結論：おすすめは「実際に使う予定がある交換先」</h2>
          <p>一番よい交換先は、表示されている特典と実際に使う予定で変わります。クーポンやゲーム内アイテムは、自分がもともと買う予定の対象なら高い実用価値になりやすい一方、使う予定がなければ表示額が大きくても得とは限りません。クーポン・アイテム・Playクレジットを見かけの額ではなく「実際に使える価値」で比べ、用途をまだ決めていない場合はPlayクレジットも含めて自分の「使う」画面の条件を確認してください。</p>
          </section>'''
          if old not in text:
              raise SystemExit('expected legacy answer/intro block not found')
          article.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit = Path('scripts/article-design-system-audit.cjs')
          text = audit.read_text(encoding='utf-8')
          old = "if (components.stackedLead > 0) warnings.push('legacy answer + intro + summary stacks remain in markup: ' + components.stackedLead + ' (visually compacted by Design System 2.0)');"
          new = "if (components.stackedLead > 0) failures.push('legacy answer + intro + summary stacks are not allowed: ' + components.stackedLead);"
          if old not in text:
              raise SystemExit('expected stackedLead warning rule not found')
          audit.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('tests/article-design-system.test.cjs')
          text = test_file.read_text(encoding='utf-8')
          old = '  assert.ok(result.components.stackedLead <= result.articleCount);'
          new = "  assert.equal(result.components.stackedLead, 0, 'legacy answer + intro + summary stacks must not return');"
          if old not in text:
              raise SystemExit('expected stackedLead test assertion not found')
          test_file.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and regenerate canonical files
        shell: bash
        run: |
          git rm .github/workflows/tmp-remove-legacy-stacked-lead.yml
          node scripts/prepare-pr.cjs

      - name: Commit canonical cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 旧記事の重複リード構造を解消"
          git push origin HEAD:fix/remove-legacy-stacked-lead-20260911

      - name: Run full regression suite
        run: node --test tests/*.test.cjs

      - name: Run canonical preflight
        run: node .github/scripts/preflight.cjs
