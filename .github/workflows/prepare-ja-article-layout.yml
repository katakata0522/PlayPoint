name: Prepare Japanese article layout

on:
  push:
    branches:
      - feat/ja-articles-intl-layout
    paths:
      - 'scripts/article-static-usability.cjs'
      - 'articles/ja-article-layout.css'
      - 'tests/japanese-article-layout.test.cjs'
      - '.github/workflows/prepare-ja-article-layout.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ja-articles-intl-layout
          fetch-depth: 0

      - name: Generate canonical article output
        run: node scripts/prepare-pr.cjs

      - name: Remove one-shot workflow and commit generated output
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-ja-article-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "生成差分はありません"
            exit 0
          fi
          git commit -m "chore: 日本語記事レイアウト生成物を同期"
          git push origin HEAD:feat/ja-articles-intl-layout
