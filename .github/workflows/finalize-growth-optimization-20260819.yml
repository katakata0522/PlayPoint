name: Finalize Growth Optimization 2026-08-19

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/playpoint-growth-optimization-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 作業ブランチを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/playpoint-growth-optimization-20260819
          fetch-depth: 0

      - name: ダイヤモンド比較記事の表示更新日を機械向け日付へ揃える
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('articles/2025-12-25-diamond-worth-it.html')
          text = path.read_text(encoding='utf-8')
          old = '<p class="hero-meta">📅 2026/08/19 更新 ・ ⏱ 読了 6分</p>'
          new = '<p class="hero-meta">📅 2026/08/04 更新 ・ ⏱ 読了 6分</p>'
          if text.count(old) != 1:
              raise SystemExit(f'visible date: expected 1 occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 全テスト
        run: node --test tests/*.test.cjs

      - name: 差分検査
        run: git diff --check

      - name: 一時workflowを除去してコミット
        shell: bash
        run: |
          rm -f .github/workflows/finalize-growth-optimization-20260819.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ダイヤモンド比較記事の表示更新日を整合'
          git push origin HEAD:agent/playpoint-growth-optimization-20260819
