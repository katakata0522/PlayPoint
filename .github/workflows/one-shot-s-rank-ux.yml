name: One-shot S-rank UX regeneration

on:
  push:
    branches:
      - feat/s-rank-intl-discovery-ux
    paths:
      - '.github/one-shot-s-rank-ux-trigger.txt'

permissions:
  contents: write

jobs:
  patch-and-generate:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/s-rank-intl-discovery-ux
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/one-shot-s-rank-ux-patch.cjs

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused UX tests
        run: node --test tests/intl-guide-discovery.test.cjs tests/region-selector-semantics.test.cjs tests/intl-article-layout.test.cjs

      - name: Commit generated result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: implement S-rank international discovery UX'
          git push origin HEAD:feat/s-rank-intl-discovery-ux
