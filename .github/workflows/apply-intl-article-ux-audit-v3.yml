name: Apply international article UX audit fixes v3

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/apply-intl-article-ux-audit-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-article-ux-audit
          fetch-depth: 0

      - name: Apply audited UX patch safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-intl-article-ux-audit.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate sources"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old_sub = "seo = pattern.sub(new_hub + '\\nfunction ensureDir', seo, count=1)"
          new_sub = "seo = pattern.sub(lambda _: new_hub + '\\nfunction ensureDir', seo, count=1)"
          if old_sub not in script:
              raise SystemExit('expected regex replacement line not found')
          script = script.replace(old_sub, new_sub, 1)

          old_fixture_guard = "if (!shared) throw new Error(relativePath + ': shared article stylesheet is missing');"
          new_fixture_guard = "if (!shared) return next;"
          if old_fixture_guard not in script:
              raise SystemExit('expected shared stylesheet guard not found')
          script = script.replace(old_fixture_guard, new_fixture_guard, 1)

          Path('/tmp/apply-intl-ux.py').write_text(script)
          PY
          python3 /tmp/apply-intl-ux.py

      - name: Validate patched source syntax
        run: |
          node --check scripts/intl-article-layout.cjs
          node --check scripts/intl-seo-pages.cjs
          node --check tests/intl-article-ux-audit.test.cjs

      - name: Regenerate and run focused regressions
        run: |
          node scripts/prepare-pr.cjs
          node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs

      - name: Prove generator fixed point
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Expected generated changes were not produced" >&2
            exit 1
          fi
          node scripts/prepare-pr.cjs
          git diff --exit-code

      - name: Run project tests
        run: npm test

      - name: Commit implementation and remove one-shot workflows
        run: |
          rm .github/workflows/apply-intl-article-ux-audit.yml
          rm .github/workflows/apply-intl-article-ux-audit-v2.yml
          rm .github/workflows/apply-intl-article-ux-audit-v3.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish international article UX after visual audit"
          git push origin HEAD:fix/intl-article-ux-audit
