name: Refresh game list icons

on:
  push:
    branches:
      - feat/game-list-thumbnails-20260919
    paths:
      - '.github/workflows/refresh-game-list-icons.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/game-list-thumbnails-20260919
          persist-credentials: true
          fetch-depth: 2
      - name: Capture 128px official Google Play icons
        run: node scripts/capture-game-thumbnails.cjs
      - name: Replace local list icons
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .tmp/game-icons -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 17
          mkdir -p images/game-icons
          cp .tmp/game-icons/*.png images/game-icons/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/game-icons
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Icons already current."
            exit 0
          fi
          git commit -m "assets: resize game list icons to 128px"
          git push origin HEAD:feat/game-list-thumbnails-20260919
