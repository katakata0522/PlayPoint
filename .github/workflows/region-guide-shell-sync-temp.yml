name: Temporary Region Guide Shell Sync

on:
  push:
    branches:
      - fix/site-shell-hygiene-2-region-guide-20260915

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'region-guide-shell-sync')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/site-shell-hygiene-2-region-guide-20260915
          fetch-depth: 0
      - name: Update Country Guide Site Shell source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/site-shell.cjs';
          let source = fs.readFileSync(path, 'utf8');

          const oldPolicy = `const REGION_GUIDE_POLICY_LINKS = Object.freeze([\n  Object.freeze({ href: 'privacy.html', label: 'Privacy Policy' }),\n  Object.freeze({ href: 'terms.html', label: 'Terms of Service', style: 'margin-left:1em;' })\n]);`;
          const newBrand = `const REGION_GUIDE_BRAND_LINK = Object.freeze({\n  href: './',\n  label: '← PlayPoint Calculator',\n  style: 'font-weight:800;color:var(--text-color,#1f2937);text-decoration:none;'\n});`;
          if ((source.split(oldPolicy).length - 1) !== 1) throw new Error('Expected one REGION_GUIDE_POLICY_LINKS block');
          source = source.replace(oldPolicy, newBrand);

          const oldProfile = `  'attention.html': Object.freeze({\n    topBarStyle: 'margin-bottom:20px;',\n    headerLinksStyle: 'width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;',\n    navStyle: 'font-size:.9em;display:flex;flex-wrap:wrap;gap:10px;',\n    navLinks: REGION_GUIDE_LINKS,\n    policyLinks: REGION_GUIDE_POLICY_LINKS\n  })`;
          const newProfile = `  'attention.html': Object.freeze({\n    topBarStyle: 'margin-bottom:20px;',\n    headerLinksStyle: 'width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:10px;',\n    brandLink: REGION_GUIDE_BRAND_LINK,\n    navAriaLabel: 'Calculator country or region',\n    navStyle: 'font-size:.9em;display:flex;flex-wrap:wrap;gap:8px 10px;',\n    navLinks: REGION_GUIDE_LINKS,\n    policyLinks: Object.freeze([])\n  })`;
          if ((source.split(oldProfile).length - 1) !== 1) throw new Error('Expected one attention header profile');
          source = source.replace(oldProfile, newProfile);

          const start = source.indexOf('function renderFixedPageHeader(profile, indent = \'\') {');
          const end = source.indexOf('\nfunction renderCalculatorHeaderLink', start);
          if (start < 0 || end < 0) throw new Error('Could not locate renderFixedPageHeader');
          const replacement = `function renderFixedPageHeader(profile, indent = '') {\n  if (!profile || !Array.isArray(profile.navLinks) || !Array.isArray(profile.policyLinks)) {\n    throw new TypeError('Fixed-page header profile requires navLinks and policyLinks arrays.');\n  }\n  if (profile.navLinks.length === 0 && !profile.brandLink) {\n    throw new TypeError('Fixed-page header requires navigation links or a brand link.');\n  }\n\n  const blocks = [\n    \`${'${indent}'}<div class="top-bar"${'${styleAttribute(profile.topBarStyle)}'}>\`,\n    \`${'${indent}'}  <div class="header-links"${'${styleAttribute(profile.headerLinksStyle)}'}>\`\n  ];\n\n  if (profile.brandLink) {\n    blocks.push(\n      \`${'${indent}'}    <div class="site-shell-brand">\`,\n      renderHeaderLink(profile.brandLink, \`${'${indent}'}      \`),\n      \`${'${indent}'}    </div>\`\n    );\n  }\n\n  if (profile.navLinks.length > 0) {\n    const navAria = profile.navAriaLabel\n      ? \` role="navigation" aria-label="${'${escapeHtml(profile.navAriaLabel)}'}"\`\n      : '';\n    blocks.push(\n      \`${'${indent}'}    <div class="lang-nav"${'${navAria}'}${'${styleAttribute(profile.navStyle)}'}>\`,\n      profile.navLinks.map(link => renderHeaderLink(link, \`${'${indent}'}      \`)).join('\\n'),\n      \`${'${indent}'}    </div>\`\n    );\n  }\n\n  if (profile.policyLinks.length > 0) {\n    blocks.push(\n      \`${'${indent}'}    <div>\`,\n      profile.policyLinks.map(link => renderHeaderLink(link, \`${'${indent}'}      \`)).join('\\n'),\n      \`${'${indent}'}    </div>\`\n    );\n  }\n\n  blocks.push(\`${'${indent}'}  </div>\`, \`${'${indent}'}</div>\`);\n  return blocks.join('\\n');\n}\n`;
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(path, source, 'utf8');
          NODE
      - name: Synchronize committed Country Guide header
        run: node scripts/fixed-page-header-sync.cjs
      - name: Move legal links to Country Guide footer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'attention.html';
          let html = fs.readFileSync(path, 'utf8');
          const oldNav = '<p><a href="./">Calculator</a> · <a href="sitemap.html">Sitemap</a> · <a href="author/katakata.html" rel="author">Operator & verification policy</a></p>';
          const newNav = '<p><a href="./">Calculator</a> · <a href="sitemap.html">Sitemap</a> · <a href="author/katakata.html" rel="author">Operator & verification policy</a> · <a href="privacy.html">Privacy Policy (Japanese)</a> · <a href="terms.html">Terms of Service (Japanese)</a></p>';
          if ((html.split(oldNav).length - 1) !== 1) throw new Error('Expected one Country Guide footer nav');
          html = html.replace(oldNav, newNav);
          fs.writeFileSync(path, html, 'utf8');
          NODE
      - name: Run focused Site Shell tests
        run: node --test tests/site-shell-header.test.cjs
      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq 2 ]] || { echo "Expected exactly 2 generated/source changes, got ${#changed[@]}"; exit 1; }
          [[ "${changed[0]}" == "attention.html" || "${changed[1]}" == "attention.html" ]] || exit 1
          [[ "${changed[0]}" == "scripts/site-shell.cjs" || "${changed[1]}" == "scripts/site-shell.cjs" ]] || exit 1
      - name: Commit synchronized Site Shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/site-shell.cjs attention.html
          git commit -m 'region-guide-shell-sync'
          git push origin HEAD:fix/site-shell-hygiene-2-region-guide-20260915
