name: Apply Home Calculator-First

on:
  push:
    branches:
      - feat/home-calculator-first-20260915

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/home-calculator-first-20260915
          fetch-depth: 2
          persist-credentials: true

      - name: Apply source transform
        run: node .github/scripts/apply-home-calculator-first.cjs

      - name: Canonical regeneration
        run: node scripts/prepare-pr.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Verify final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'home-calculator-first' index.html
          grep -q 'ウィークリーリワード記録' index.html
          grep -q '詳細な条件を設定する' index.html
          git status --short

      - name: Commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/home-calculator-first-apply.yml
          rm .github/scripts/apply-home-calculator-first.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'トップをCalculator-FirstのモバイルUIへ再設計'
          git push origin HEAD:feat/home-calculator-first-20260915
