name: Temporary apply calculator flow

on:
  push:
    branches:
      - feat/calculator-flow-memory-20260916

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/calculator-flow-memory-20260916
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/temporary-apply-calculator-flow.cjs

      - name: Syntax check first-view runtime
        run: node --check js/first-view.js

      - name: Prepare canonical generated outputs
        run: node scripts/prepare-pr.cjs

      - name: Re-run focused contracts
        run: node --test tests/mobile-first-view-contract.test.cjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/temporary-apply-calculator-flow.yml scripts/temporary-apply-calculator-flow.cjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "計算導線と前回必要ポイント表示を改善"
          git push origin HEAD:feat/calculator-flow-memory-20260916
