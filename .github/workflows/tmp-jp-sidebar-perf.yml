name: Temporary optimize JP sidebar CSS

on:
  push:
    branches:
      - gen/jp-sidebar-perf-20260919

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout generation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gen/jp-sidebar-perf-20260919
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned CI Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Regenerate deterministic outputs
        run: node scripts/prepare-pr.cjs

      - name: Verify sidebar contract
        run: node --test tests/japanese-navigation-sidebar.test.cjs

      - name: Commit optimized generated outputs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-jp-sidebar-perf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: consolidate Japanese sidebar CSS into shared shell"
          git push origin HEAD:feat/jp-sidebar-popular-search-v2-20260919
