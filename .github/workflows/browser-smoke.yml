name: Browser calculator smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verification target
        required: true
        default: local
        type: choice
        options:
          - local
          - production
  pull_request:
    branches:
      - main
    # PR Gate remains the always-on repository gate. Real Chromium is reserved
    # for changes that can affect public/runtime behavior.
    paths:
      - 'index.html'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'js/**'
      - 'blog/**'
      - 'articles/**'
      - 'games/**'
      - 'embed.html'
      - 'embed/**'
      - 'en/**'
      - 'ko/**'
      - 'tw/**'
      - 'hk/**'
      - 'in/**'
      - 'status/**'
      - 'campaign/**'
      - 'amount/**'
      - 'compare/**'
      - 'latest/**'
      - 'points-cost/**'
      - 'attention.html'
      - 'about-playpoints.html'
      - 'info.html'
      - 'privacy.html'
      - 'terms.html'
      - 'changelog.html'
      - '.github/scripts/browser-smoke.cjs'
      - '.github/scripts/article-css-smoke.cjs'
      - '.github/scripts/article-design-smoke.cjs'
      - '.github/scripts/mobile-region-layout-smoke.cjs'
      - '.github/scripts/browser-revenue-smoke.cjs'
      - '.github/scripts/embed-widget-smoke.cjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_run:
    workflows:
      - Deploy to Xserver
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  local:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'local')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install browser driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match sans-serif:lang=ja
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify local calculator, article CSS, mobile region layout, revenue, and embed widget paths in Chromium
        run: |
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-local-${{ github.run_id }}
          path: browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

  production:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Detect whether production browser smoke is needed
        id: production-impact
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          if [ "$UPSTREAM_EVENT" = 'workflow_dispatch' ]; then
            echo 'Upstream deployment was manually requested; production browser smoke is required.'
            echo 'smoke_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="$(git rev-parse HEAD)"
          if ! parent_sha="$(git rev-parse HEAD^ 2>/dev/null)"; then
            echo 'Unable to resolve deployed revision parent; running production browser smoke as a fail-safe.'
            echo 'smoke_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # renameは旧pathの削除も判定対象にする。Deploy側と同じ差分契約を使う。
          changed_files="$(git diff --name-only --no-renames "$parent_sha" "$head_sha")"
          if [ -z "$changed_files" ]; then
            echo 'No changed files were detected; running production browser smoke as a fail-safe.'
            echo 'smoke_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          impact_json="$(printf '%s\n' "$changed_files" | node .github/scripts/detect-deploy-impact.cjs)"
          printf '%s\n' "$impact_json" | jq .
          smoke_needed="$(jq -r '.deployNeeded' <<< "$impact_json")"
          if [ "$smoke_needed" != 'true' ] && [ "$smoke_needed" != 'false' ]; then
            echo 'Deploy impact classifier returned an invalid result; running smoke as a fail-safe.' >&2
            smoke_needed=true
          fi
          echo "smoke_needed=$smoke_needed" >> "$GITHUB_OUTPUT"

      - name: Skip production browser smoke for non-public changes
        if: github.event_name == 'workflow_run' && steps.production-impact.outputs.smoke_needed == 'false'
        run: echo 'Upstream Deploy workflow was a no-op for production; Chromium production verification is unnecessary.'

      - name: Install browser driver
        if: github.event_name != 'workflow_run' || steps.production-impact.outputs.smoke_needed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match sans-serif:lang=ja
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify production calculator, article CSS, mobile region layout, revenue, and embed widget paths in Chromium
        if: github.event_name != 'workflow_run' || steps.production-impact.outputs.smoke_needed == 'true'
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: |
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload browser verification evidence
        if: ${{ always() && (github.event_name != 'workflow_run' || steps.production-impact.outputs.smoke_needed == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-production-${{ github.run_id }}
          path: browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7
