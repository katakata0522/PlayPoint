name: Browser calculator smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verification target
        required: true
        default: local
        type: choice
        options:
          - local
          - production

permissions:
  contents: read

# 通常Deployはdeploy.yml自身がproduction Chromiumをverified前に検証する。
# このworkflowは調査・再確認用の手動レーンだけを担う。
concurrency:
  group: browser-smoke-manual-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  local:
    if: inputs.target == 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up pinned CI Node
        id: ci_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Record CI environment
        id: record_ci_environment
        run: node .github/scripts/ci-evidence.cjs

      - name: Install browser driver
        id: ci_browser
        run: bash .github/scripts/setup-browser-runtime.sh

      - name: Verify local calculator, article CSS, mobile region layout, revenue, and embed widget paths in Chromium
        id: verify_local_calculator_article_css_mobile_region_layout_revenue_and_embed_widget_paths_in_chromium
        run: |
          set -euo pipefail
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload browser verification evidence
        id: upload_browser_verification_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-local-${{ github.run_id }}
          path: browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Record CI job outcome
        id: record_ci_job_outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: node .github/scripts/ci-evidence.cjs finalize

      - name: Preserve CI environment and phase evidence
        id: preserve_ci_environment_and_phase_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playpoint-ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  production:
    if: inputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up pinned CI Node
        id: ci_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Record CI environment
        id: record_ci_environment
        run: node .github/scripts/ci-evidence.cjs

      - name: Install browser driver
        id: ci_browser
        run: bash .github/scripts/setup-browser-runtime.sh

      - name: Verify production calculator, article CSS, mobile region layout, revenue, and embed widget paths in Chromium
        id: verify_production_calculator_article_css_mobile_region_layout_revenue_and_embed_widget_paths_in_chromium
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: |
          set -euo pipefail
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload browser verification evidence
        id: upload_browser_verification_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-production-${{ github.run_id }}
          path: browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Record CI job outcome
        id: record_ci_job_outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: node .github/scripts/ci-evidence.cjs finalize

      - name: Preserve CI environment and phase evidence
        id: preserve_ci_environment_and_phase_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playpoint-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
