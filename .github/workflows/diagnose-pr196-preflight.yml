name: Diagnose PR196 Preflight

on:
  push:
    branches:
      - feat/s-rank-intl-discovery-ux

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node .github/scripts/verify-js-syntax.cjs

  build-output:
    name: Generated output reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node .github/scripts/verify-build-output.cjs

  latest-hub:
    name: Latest hub freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/latest-hub-audit.cjs --fresh

  article-navigation:
    name: Article navigation normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/article-content-navigation-normalize.cjs --check

  article-seo:
    name: Article SEO normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/article-seo-normalize.cjs --check

  click-depth:
    name: Three-click depth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/site-click-depth.cjs

  tests:
    name: Full regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs

  ads:
    name: ads.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node .github/scripts/check-ads-txt.cjs

  minify:
    name: Public asset minify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node .github/scripts/minify.cjs
      - run: node .github/scripts/verify-js-syntax.cjs
      - run: node --test tests/static-calculator-delivery.test.cjs tests/runtime-module-guards.test.cjs
