name: Align multilingual purchase planning tone

on:
  push:
    branches:
      - content/intl-guides-regional-2026-08-05

permissions:
  contents: write

concurrency:
  group: align-intl-purchase-planning-tone-20260805
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Align purchase-planning copy at the source
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/intl-seo-pages.cjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "estimateBody: 'Use the result as a decision helper, not as a reason to spend more immediately. If the number is close to your normal plan, compare the official Google Play conditions and the campaign period. If it is far above your usual spending, waiting or staying at the current level may be the better choice.'":
              "estimateBody: 'Use the result to match planned purchases with the confirmed earning rate available to your account. Check eligible items and the offer period in Google Play, then recalculate the remaining progress after points are credited.'",
              "estimateBody: '계산 결과는 바로 결제를 늘리기 위한 숫자가 아니라 판단을 돕는 기준입니다. 평소 예정된 결제와 가깝다면 Google Play 앱의 공식 조건과 캠페인 기간을 확인하세요. 평소 소비보다 크다면 기다리거나 현재 등급을 유지하는 선택이 더 나을 수 있습니다.'":
              "estimateBody: '계산 결과는 예정된 결제를 계정에 확인된 적립률과 맞추는 기준입니다. Google Play 앱에서 대상 상품과 오퍼 기간을 확인하고, 포인트 반영 후 남은 진행도를 다시 계산하세요.'",
              "estimateBody: '計算結果是用來協助判斷，而不是讓你立刻增加消費。如果金額接近原本計畫的購買，可以再確認 Google Play App 內的官方條件與活動期間；如果遠高於平常消費，等待活動或維持目前等級可能更適合。'":
              "estimateBody: '計算結果可用來把原本規劃的購買與帳號確認適用的累積率相配合。請在 Google Play App 確認適用商品與活動期間，點數入帳後再計算剩餘進度。'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source copy was not found: {old[:100]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild generated pages
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_2012'
        run: node scripts/build-html.js

      - name: Verify the new tone and remove this workflow
        run: |
          python <<'PY'
          from pathlib import Path

          checks = {
              'en/status/silver/index.html': ('match planned purchases', ('reason to spend more', 'waiting or staying')),
              'ko/status/silver/index.html': ('예정된 결제를 계정에 확인된 적립률과 맞추는', ('결제를 늘리기', '현재 등급을 유지')),
              'tw/status/silver/index.html': ('原本規劃的購買與帳號確認適用的累積率相配合', ('立刻增加消費', '維持目前等級')),
          }
          for relative, (required, forbidden) in checks.items():
              text = Path(relative).read_text(encoding='utf-8')
              if required not in text:
                  raise SystemExit(f'Required planning copy is missing: {relative}')
              for phrase in forbidden:
                  if phrase in text:
                      raise SystemExit(f'Old suppressive copy remains in {relative}: {phrase}')
          PY
          rm -f .github/workflows/align-intl-purchase-planning-tone-20260805.yml

      - name: Commit clean generated changes
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No tone changes."; exit 1; } || true
          git commit -m "content: align multilingual purchase-planning tone"
          test -z "$(git status --porcelain)"

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Push verified clean content
        run: git push origin HEAD:content/intl-guides-regional-2026-08-05
