name: Isolated navigation source evidence
on:
  push:
    branches: [fix/remaining-locale-navigation-20260917]
    paths: [.github/workflows/navigation-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'katakata0522/PlayPoint' && github.ref == 'refs/heads/fix/remaining-locale-navigation-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export committed source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/navigation-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/navigation-source/source.tar.gz"
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/navigation-source/revision.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: navigation-source-${{ github.run_id }}
          path: ${{ runner.temp }}/navigation-source/
          retention-days: 1
          if-no-files-found: error
