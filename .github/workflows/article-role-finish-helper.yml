name: Article Role Finish Helper

on:
  push:
    branches:
      - fix/article-role-next-action-20260910
    paths:
      - '.github/workflows/article-role-finish-helper.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/article-role-next-action-20260910
          fetch-depth: 0

      - name: Align legacy tests with Article Role contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'tests/intl-article-layout.test.cjs',
              "  assert.equal((first.match(/data-generated-intl-article-prompt=\\\"true\\\"/g) || []).length, 1, 'localized reading prompt must be generated exactly once');",
              "  assert.equal((first.match(/data-generated-intl-article-prompt=\\\"true\\\"/g) || []).length, 0, 'layout-only fixture must not gain a calculator prompt without a classified calculator_bridge role');"
          )

          replace_exact(
              'tests/intl-coupon-credit.test.cjs',
              '''      assert.ok(\n        html.includes('class="cta-btn"') || html.includes('article-calculator-prompt__button'),\n        `${relativePath}: at least one calculator CTA is required`\n      );\n''',
              ''
          )

          replace_exact(
              'tests/intl-demand-content-quality.test.cjs',
              '''function answerBeforeCalculator(html, marker, label) {\n  const answerIndex = html.indexOf(marker);\n  const calculatorIndex = html.indexOf('data-generated-intl-article-prompt="true"');\n  assert.notEqual(answerIndex, -1, `${label}: answer marker is missing`);\n  assert.notEqual(calculatorIndex, -1, `${label}: calculator prompt is missing`);\n  assert.ok(answerIndex < calculatorIndex, `${label}: search answer must precede calculator CTA`);\n}\n''',
              '''function answerWithoutGenericCalculator(html, marker, label) {\n  const answerIndex = html.indexOf(marker);\n  const calculatorIndex = html.indexOf('data-generated-intl-article-prompt="true"');\n  assert.notEqual(answerIndex, -1, `${label}: answer marker is missing`);\n  assert.equal(calculatorIndex, -1, `${label}: non-calculator Role must not receive a generated calculator prompt`);\n}\n'''
          )
          p = Path('tests/intl-demand-content-quality.test.cjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('answerBeforeCalculator(html, contract.marker, contract.file);', 'answerWithoutGenericCalculator(html, contract.marker, contract.file);')
          name_updates = {
              'English redemption guide answers the decision question before the calculator CTA': 'English redemption guide answers the decision question without a generic calculator CTA',
              'Taiwan weekly reward guide directly covers the missing-reward search intent': 'Taiwan weekly reward guide covers missing-reward intent without a generic calculator CTA',
              'Taiwan use-coupons guide gives a reward decision framework before calculator': 'Taiwan use-coupons guide gives a reward decision framework without a generic calculator CTA',
              'English quests guide diagnoses missing and stuck states before calculator': 'English quests guide diagnoses missing and stuck states without a generic calculator CTA',
              'Korean quests owns generic and troubleshooting intent before the calculator': 'Korean quests owns generic and troubleshooting intent without a generic calculator CTA',
              'Korean Super Ticket guide answers acquisition and use intent first': 'Korean Super Ticket guide answers acquisition and use intent without a generic calculator CTA',
              'English gift-card guide owns both conversion and earning questions': 'English gift-card guide owns conversion and earning questions without a generic calculator CTA',
              'Korean expiration guide gives the direct answer before calculator': 'Korean expiration guide gives the direct answer without a generic calculator CTA',
              'Taiwan expiration guide gives the direct answer before calculator': 'Taiwan expiration guide gives the direct answer without a generic calculator CTA',
          }
          for old, new in name_updates.items():
              if old not in text:
                  raise SystemExit(f'expected test name not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          replace_exact(
              'tests/top-article-calculator-funnel.test.cjs',
              '''test('日本語クエスト記事は回答と条件境界の後に文脈化した計算機CTAを置く', () => {\n  const html = read('articles/2026-07-31-google-play-quests.html');\n  const answerIndex = html.indexOf('id="quick-answer"');\n  const boundaryIndex = html.indexOf('class="knowledge-boundary"');\n  const boundaryEnd = html.indexOf('</section>', boundaryIndex) + '</section>'.length;\n  const promptIndex = html.indexOf('data-generated-article-prompt="true"');\n\n  assert.ok(answerIndex >= 0, 'quick answer is missing');\n  assert.ok(boundaryIndex >= 0, 'knowledge boundary is missing');\n  assert.ok(promptIndex > boundaryEnd, 'calculator CTA must follow the answer and knowledge boundary');\n  assert.ok(html.includes('クエスト条件を確認できたら'));\n  assert.ok(html.includes('次のランクまで、あといくら必要？'));\n  assert.ok(html.includes('次のランクまでの必要額を計算'));\n  assert.equal((html.match(/data-generated-article-prompt="true"/g) || []).length, 1);\n});\n''',
              '''test('日本語クエスト記事はRetention回答と条件境界の後に文脈CTAだけを置く', () => {\n  const html = read('articles/2026-07-31-google-play-quests.html');\n  const answerIndex = html.indexOf('id="quick-answer"');\n  const boundaryIndex = html.indexOf('class="knowledge-boundary"');\n  const boundaryEnd = html.indexOf('</section>', boundaryIndex) + '</section>'.length;\n  const contextualCtaIndex = html.indexOf('aria-labelledby="next-action" class="cta-box"');\n\n  assert.ok(answerIndex >= 0, 'quick answer is missing');\n  assert.ok(boundaryIndex >= 0, 'knowledge boundary is missing');\n  assert.ok(contextualCtaIndex > boundaryEnd, 'contextual CTA must follow the answer and knowledge boundary');\n  assert.ok(html.includes('購入条件がある場合は必要額を確認'));\n  assert.ok(html.includes('元から予定している購入がクエスト条件に該当する場合だけ'));\n  assert.ok(html.includes('Playポイント計算機を開く'));\n  assert.equal((html.match(/data-generated-article-prompt="true"/g) || []).length, 0, 'retention article must not regain the generic calculator prompt');\n});\n'''
          )
          PY

      - name: Synchronize canonical generated output
        run: node scripts/prepare-pr.cjs

      - name: Run full preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests articles en ko tw scripts docs sitemap.xml blog/sitemap.xml blog/index.html blog/feed.xml blog/atom.xml sitemap.html sw.js index.html latest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "test: align legacy CTA guards with Article Role"
          git push origin HEAD:fix/article-role-next-action-20260910
