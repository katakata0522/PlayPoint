name: Temporary HK-IN audit fixer

on:
  push:
    branches:
      - fix/hk-in-postlaunch-audit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hk-in-postlaunch-audit
          fetch-depth: 0

      - name: Apply post-launch audit fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) 共有URL: 台湾・香港の等級名も正規化する。
          replace_once(
              'js/share.js',
              """    normalizeTarget(value) {\n        const label = String(value || '').toLowerCase();\n        if (/diamond|ダイヤ|다이아|鑽石/i.test(label)) return 'diamond';\n        if (/platinum|プラチナ|플래티넘|白金/i.test(label)) return 'platinum';\n        if (/gold|ゴールド|골드|黃金/i.test(label)) return 'gold';\n        if (/silver|シルバー|실버|白銀/i.test(label)) return 'silver';\n        return '';\n    },\n""",
              """    normalizeTarget(value) {\n        const label = String(value || '').toLowerCase();\n        if (/diamond|ダイヤ|다이아|鑽石/i.test(label)) return 'diamond';\n        if (/platinum|プラチナ|플래티넘|白金|鉑金/i.test(label)) return 'platinum';\n        if (/gold|ゴールド|골드|黃金|金級/i.test(label)) return 'gold';\n        if (/silver|シルバー|실버|白銀|銀級/i.test(label)) return 'silver';\n        return '';\n    },\n"""
          )

          # 2) 地域設定: 通貨前置、逆算ヘルプ、カレンダー、共有文、地域別ゲーム導線。
          replace_once('js/region-expansion-config.js', "        currencySymbol: 'HK$',\n        rateUnit: 'HK$7',", "        currencySymbol: 'HK$',\n        currencyPosition: 'prefix',\n        rateUnit: 'HK$7',")
          replace_once('js/region-expansion-config.js', "        currencySymbol: '₹',\n        rateUnit: '₹5',", "        currencySymbol: '₹',\n        currencyPosition: 'prefix',\n        rateUnit: '₹5',")
          replace_once(
              'js/region-expansion-config.js',
              "            'tooltip-reverse-multiplier': '<strong>【活動特別獲點率】</strong><p>請輸入 Google Play 活動詳情顯示的最終獲點率，例如「每 HK$7 3 點」。</p>'\n        },",
              "            'tooltip-reverse-multiplier': '<strong>【活動特別獲點率】</strong><p>請輸入 Google Play 活動詳情顯示的最終獲點率，例如「每 HK$7 3 點」。</p>',\n            'tooltip-reverse-status': '<strong>【香港各等級基本獲點率】</strong><ul><li><strong>銅級:</strong> 1.0 pt / HK$7</li><li><strong>銀級:</strong> 1.25 pt / HK$7</li><li><strong>金級:</strong> 1.5 pt / HK$7</li><li><strong>鉑金級:</strong> 1.75 pt / HK$7</li><li><strong>鑽石級:</strong> 2.0 pt / HK$7</li></ul>'\n        },"
          )
          replace_once(
              'js/region-expansion-config.js',
              "            'tooltip-reverse-multiplier': '<strong>Promotion special earn rate:</strong><p>Enter the final rate shown in Google Play, such as “3 points per ₹5.”</p>'\n        },",
              "            'tooltip-reverse-multiplier': '<strong>Promotion special earn rate:</strong><p>Enter the final rate shown in Google Play, such as “3 points per ₹5.”</p>',\n            'tooltip-reverse-status': '<strong>India base earn rate by level:</strong><ul><li><strong>Bronze:</strong> 1.0 pt / ₹5</li><li><strong>Silver:</strong> 1.1 pts / ₹5</li><li><strong>Gold:</strong> 1.2 pts / ₹5</li><li><strong>Platinum:</strong> 1.4 pts / ₹5</li></ul>'\n        },"
          )
          replace_once(
              'js/region-expansion-config.js',
              "            linkArticles: { text: '📝 繁體中文指南', href: '../tw/articles/' },",
              "            linkArticles: { text: '📝 繁體中文指南', href: '../tw/articles/' },\n            linkGames: { text: '🎮 繁體中文遊戲計算', href: '../tw/games/' },"
          )
          replace_once(
              'js/region-expansion-config.js',
              "            linkArticles: { text: '📝 English guides', href: '../en/articles/' },",
              "            linkArticles: { text: '📝 English guides', href: '../en/articles/' },\n            linkGames: { text: '🎮 English game calculators', href: '../en/games/' },"
          )
          replace_once(
              'js/region-expansion-config.js',
              "            linkAttention: { text: '⚠️ 國家別差異', href: '../attention.html' }\n        }",
              "            linkAttention: { text: '⚠️ 國家別差異', href: '../attention.html' },\n            calDetails: '領取您的 Google Play Points 每週獎勵並記錄在日記中！\\nhttps://playpoint-sim.com/hk/',\n            icsFilename: 'play-point-reward-reminder-hk.ics',\n            copyResultTemplate: '▼Play Points 計算結果▼\\n目標等級： {status}\\n預估消費金額： 約{symbol}{yen}\\n\\n計算來源：Play Points 計算器 ( {url} )',\n            tweetTextMain: '【Google Play 點數計算器】\\n距離我的目標「{status}」還需要【{symbol}{yen}】！💰',\n            tweetTextReverse: '【Google Play 點數計算器】\\n消費 {symbol}{yen} 大約可以獲得 {points} 點！✨'\n        }"
          )
          replace_once(
              'js/region-expansion-config.js',
              "            linkAttention: { text: '⚠️ Country Diff', href: '../attention.html' }\n        }",
              "            linkAttention: { text: '⚠️ Country Diff', href: '../attention.html' },\n            calDetails: 'Claim your Google Play Points Weekly Reward and log it!\\nhttps://playpoint-sim.com/in/',\n            icsFilename: 'google-play-reward-reminder-in.ics',\n            copyResultTemplate: '▼Google Play Points Calculator Result▼\\nTarget Status: {status}\\nEstimated Spending: Approx. {symbol}{yen}\\n\\nSource: Google Play Points Calculator ( {url} )',\n            tweetTextMain: '[Google Play Points Calculator]\\nI need approx. {symbol}{yen} to reach my goal \\"{status}\\"! 💰',\n            tweetTextReverse: '[Google Play Points Calculator]\\nIf I spend {symbol}{yen}, I can earn approx. {points} points! ✨'\n        }"
          )

          # 3) 金額表示: 通貨の前置/後置を地域設定で切り替える。
          replace_once(
              'js/calculator.js',
              "export const CALC = {\n    relatedArticleGroups:",
              """export const CALC = {\n    renderCurrencyAmount(value, config) {\n        const amountMarkup = `<span class=\"count-target\" data-value=\"${value}\">0</span>`;\n        return config.currencyPosition === 'prefix'\n            ? `${config.currencySymbol}${amountMarkup}`\n            : `${amountMarkup} ${config.currencySymbol}`;\n    },\n\n    relatedArticleGroups:"""
          )
          replacements = [
              ("<dd><b>${texts.approxLabel} <span class=\"count-target\" data-value=\"${Math.ceil(totalAmountNeeded / remainingMonths)}\">0</span> ${config.currencySymbol}${texts.perMonth}</b></dd>", "<dd><b>${texts.approxLabel} ${this.renderCurrencyAmount(Math.ceil(totalAmountNeeded / remainingMonths), config)}${texts.perMonth}</b></dd>"),
              ("<dd><b>${texts.approxLabel} <span class=\"count-target\" data-value=\"${Math.ceil(totalAmountNeeded / remainingDays)}\">0</span> ${config.currencySymbol}${texts.perDay || '/日'}</b></dd>", "<dd><b>${texts.approxLabel} ${this.renderCurrencyAmount(Math.ceil(totalAmountNeeded / remainingDays), config)}${texts.perDay || '/日'}</b></dd>"),
              ("<dd>${texts.approxLabel} <span class=\"count-target\" data-value=\"${comparison.baseAmount}\">0</span> ${config.currencySymbol}</dd>", "<dd>${texts.approxLabel} ${this.renderCurrencyAmount(comparison.baseAmount, config)}</dd>"),
              ("<dd>${texts.approxLabel} <span class=\"count-target\" data-value=\"${comparison.selectedAmount}\">0</span> ${config.currencySymbol}</dd>", "<dd>${texts.approxLabel} ${this.renderCurrencyAmount(comparison.selectedAmount, config)}</dd>"),
              ("<dd><b><span class=\"count-target\" data-value=\"${comparison.savedAmount}\">0</span> ${config.currencySymbol}</b></dd>", "<dd><b>${this.renderCurrencyAmount(comparison.savedAmount, config)}</b></dd>"),
              ("<dd><b>${texts.approxLabel} <span class=\"count-target\" data-value=\"${totalAmountNeeded}\">0</span> ${config.currencySymbol}</b></dd>", "<dd><b>${texts.approxLabel} ${this.renderCurrencyAmount(totalAmountNeeded, config)}</b></dd>")
          ]
          for old, new in replacements:
              replace_once('js/calculator.js', old, new)

          # 4) 言語一致と地域一致を分離する。明示的な en-US / zh-TW は正しい地域版を案内する。
          replace_once(
              'js/region-navigation.js',
              "export const isIndiaPath = () => /\\/in(\\/|$)/.test(window.location.pathname);\nexport const isEnglishPath = () => /\\/(?:en|in)(\\/|$)/.test(window.location.pathname);\nexport const isKoreanPath = () => /\\/ko(\\/|$)/.test(window.location.pathname);\nexport const isTaiwanPath = () => /\\/(?:tw|hk)(\\/|$)/.test(window.location.pathname);",
              "export const isIndiaPath = () => /\\/in(\\/|$)/.test(window.location.pathname);\nexport const isUnitedStatesPath = () => /\\/en(\\/|$)/.test(window.location.pathname);\nexport const isTaiwanRegionPath = () => /\\/tw(\\/|$)/.test(window.location.pathname);\nexport const isEnglishPath = () => /\\/(?:en|in)(\\/|$)/.test(window.location.pathname);\nexport const isKoreanPath = () => /\\/ko(\\/|$)/.test(window.location.pathname);\nexport const isTaiwanPath = () => /\\/(?:tw|hk)(\\/|$)/.test(window.location.pathname);"
          )
          replace_once(
              'js/region-navigation.js',
              "        isIndiaPath,\n        isKoreanPath,\n        isTaiwanPath,",
              "        isIndiaPath,\n        isUnitedStatesPath,\n        isTaiwanRegionPath,\n        isKoreanPath,\n        isTaiwanPath,"
          )
          replace_once(
              'js/language-suggestion.js',
              "    isIndiaPath,\n    isKoreanPath,\n    isTaiwanPath,",
              "    isIndiaPath,\n    isUnitedStatesPath,\n    isTaiwanRegionPath,\n    isKoreanPath,\n    isTaiwanPath,"
          )
          replace_once(
              'js/language-suggestion.js',
              """    } else if (browserLang.startsWith('zh-tw') || browserLang.startsWith('zh')) {\n        targetRegion = 'TW';\n        messageText = '提供繁體中文版本！';\n        buttonText = '切換至繁體中文';\n        isCurrentMatch = isTaiwanPath();\n    } else if (browserLang.startsWith('en')) {\n        targetRegion = 'US';\n        messageText = 'English version is available!';\n        buttonText = 'Switch to English';\n        isCurrentMatch = isEnglishPath();\n    }\n""",
              """    } else if (browserLang.startsWith('zh-tw')) {\n        targetRegion = 'TW';\n        messageText = '提供台灣地區版本！';\n        buttonText = '切換至台灣版';\n        isCurrentMatch = isTaiwanRegionPath();\n    } else if (browserLang.startsWith('zh')) {\n        targetRegion = 'TW';\n        messageText = '提供繁體中文版本！';\n        buttonText = '切換至繁體中文';\n        isCurrentMatch = isTaiwanPath();\n    } else if (browserLang.startsWith('en-us')) {\n        targetRegion = 'US';\n        messageText = 'U.S. Play Points calculator is available!';\n        buttonText = 'Switch to U.S. edition';\n        isCurrentMatch = isUnitedStatesPath();\n    } else if (browserLang.startsWith('en')) {\n        targetRegion = 'US';\n        messageText = 'English version is available!';\n        buttonText = 'Switch to English';\n        isCurrentMatch = isEnglishPath();\n    }\n"""
          )

          # 5) 生成HTML: 親地域の単位/リンク/placeholderを残さない。
          replace_once(
              'scripts/region-page-sync.cjs',
              "  html = html.replace('每 NT$30 獲得點數（自動帶入，可修改）', '每 HK$7 獲得點數（自動帶入，可修改）');",
              "  html = html.replace('每 NT$30 獲得點數（自動帶入，可修改）', '每 HK$7 獲得點數（自動帶入，可修改）');\n  html = html.replace('每 NT$30 回饋率（直接輸入）', '每 HK$7 獲得點數（自動帶入，可修改）');\n  html = html.replace('placeholder=\"例如：1500\" inputmode=\"decimal\" data-lang-placeholder=\"amountYenPlaceholder\"', 'placeholder=\"例如：350\" inputmode=\"decimal\" data-lang-placeholder=\"amountYenPlaceholder\"');\n  html = html.replace('href=\"../games/\" data-lang-key=\"linkGames\"', 'href=\"../tw/games/\" data-lang-key=\"linkGames\"');"
          )
          replace_once(
              'scripts/region-page-sync.cjs',
              "  html = html.replace('Points per $1 (auto-filled, editable)', 'Points per ₹5 (auto-filled, editable)');",
              "  html = html.replace('Points per $1 (auto-filled, editable)', 'Points per ₹5 (auto-filled, editable)');\n  html = html.replace('Earn rate per $1 (direct entry)', 'Points per ₹5 (auto-filled, editable)');\n  html = html.replace('placeholder=\"e.g., 50\" inputmode=\"decimal\" data-lang-placeholder=\"amountYenPlaceholder\"', 'placeholder=\"e.g. 500\" inputmode=\"decimal\" data-lang-placeholder=\"amountYenPlaceholder\"');\n  html = html.replace('href=\"../games/\" data-lang-key=\"linkGames\"', 'href=\"../en/games/\" data-lang-key=\"linkGames\"');"
          )

          # 6) Chromium smokeへHK/INを正式追加し、地域固有の誤表示も検査する。
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """  { key: 'KR', path: 'ko/', locale: 'ko-KR', title: 'Google Play Points 계산기', button: '결제 금액 계산' },\n  { key: 'TW', path: 'tw/', locale: 'zh-TW', title: 'Google Play Points 計算器', button: '計算消費金額' }\n];""",
              """  { key: 'KR', path: 'ko/', locale: 'ko-KR', title: 'Google Play Points 계산기', button: '결제 금액 계산' },\n  { key: 'TW', path: 'tw/', locale: 'zh-TW', title: 'Google Play Points 計算器', button: '計算消費金額', shareRestore: { status: '1.25', target: 'gold', expected: '金級' } },\n  { key: 'HK', path: 'hk/', locale: 'zh-HK', title: 'Google Play Points 計算器（香港）', button: '計算消費金額', statusCount: 5, staticReverseLabel: '每 HK$7 獲得點數（自動帶入，可修改）', gamePath: '/tw/games/', tooltipContains: 'HK$7', tooltipExcludes: 'NT$30', currencyPrefix: 'HK$', calendarPath: '/hk/', shareRestore: { status: '1.25', target: 'gold', expected: '金級' } },\n  { key: 'IN', path: 'in/', locale: 'en-IN', title: 'Google Play Points Calculator — India', button: 'Calculate Amount', statusCount: 4, staticReverseLabel: 'Points per ₹5 (auto-filled, editable)', gamePath: '/en/games/', tooltipContains: '₹5', tooltipExcludes: '$1', currencyPrefix: '₹', calendarPath: '/in/', shareRestore: { status: '1.1', target: 'gold', expected: 'Gold' } }\n];"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """      baseRate: document.querySelector('#baseRate')?.value || '',\n      multiplier: document.querySelector('#multiplier')?.value || ''\n    }), MAIN_CONTROLS);""",
              """      baseRate: document.querySelector('#baseRate')?.value || '',\n      multiplier: document.querySelector('#multiplier')?.value || '',\n      reverseBaseLabel: document.querySelector('label[for=\"reverseBaseRate\"] [data-lang-key=\"labelBaseRate\"]')?.textContent || '',\n      gamePath: document.querySelector('[data-lang-key=\"linkGames\"]')?.pathname || ''\n    }), MAIN_CONTROLS);"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """    assert(sameNumber(values.baseRate, 1) && sameNumber(values.multiplier, 1), `${locale.key} static default values changed`);\n    browserState.verify(`${locale.key} static browser errors`);""",
              """    assert(sameNumber(values.baseRate, 1) && sameNumber(values.multiplier, 1), `${locale.key} static default values changed`);\n    if (locale.staticReverseLabel) assert(sameCopy(values.reverseBaseLabel, locale.staticReverseLabel), `${locale.key} static reverse-rate label: ${values.reverseBaseLabel}`);\n    if (locale.gamePath) assert(values.gamePath === locale.gamePath, `${locale.key} static game path: ${values.gamePath}`);\n    browserState.verify(`${locale.key} static browser errors`);"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """      visibleControls: [...document.querySelectorAll(selector)].filter(element => {\n        const style = getComputedStyle(element);\n        return style.display !== 'none' && style.visibility !== 'hidden' && element.getClientRects().length > 0;\n      }).length,\n      packFields: document.querySelectorAll('#pack-amount').length\n    }), MAIN_CONTROLS);""",
              """      visibleControls: [...document.querySelectorAll(selector)].filter(element => {\n        const style = getComputedStyle(element);\n        return style.display !== 'none' && style.visibility !== 'hidden' && element.getClientRects().length > 0;\n      }).length,\n      packFields: document.querySelectorAll('#pack-amount').length,\n      statusCount: document.querySelector('#currentStatus')?.options.length || 0,\n      reverseTooltip: document.querySelector('#tooltip-reverse-status')?.textContent || '',\n      gamePath: document.querySelector('[data-lang-key=\"linkGames\"]')?.pathname || '',\n      calendarHref: document.querySelector('#register-google-cal-btn')?.href || ''\n    }), MAIN_CONTROLS);"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """    assert(header.visibleControls === 5, `${locale.key} hydrated controls: ${header.visibleControls}`);\n    assert(header.packFields === 0, `${locale.key} hydrated average-pack field returned`);""",
              """    assert(header.visibleControls === 5, `${locale.key} hydrated controls: ${header.visibleControls}`);\n    assert(header.packFields === 0, `${locale.key} hydrated average-pack field returned`);\n    if (locale.statusCount) assert(header.statusCount === locale.statusCount, `${locale.key} status count: ${header.statusCount}`);\n    if (locale.tooltipContains) assert(header.reverseTooltip.includes(locale.tooltipContains), `${locale.key} reverse tooltip missing ${locale.tooltipContains}`);\n    if (locale.tooltipExcludes) assert(!header.reverseTooltip.includes(locale.tooltipExcludes), `${locale.key} reverse tooltip contains stale ${locale.tooltipExcludes}`);\n    if (locale.gamePath) assert(header.gamePath === locale.gamePath, `${locale.key} hydrated game path: ${header.gamePath}`);\n    if (locale.calendarPath) assert(decodeURIComponent(header.calendarHref).includes(locale.calendarPath), `${locale.key} calendar link does not point back to ${locale.calendarPath}`);"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """        relatedLinks: result?.querySelectorAll('[data-result-related-link]').length || 0\n      };""",
              """        relatedLinks: result?.querySelectorAll('[data-result-related-link]').length || 0,\n        html: result?.innerHTML || ''\n      };"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """    assert(mainResult.relatedLinks <= 4, `${locale.key} too many related links: ${mainResult.relatedLinks}`);\n\n    await page.locator('#tab-reverse').click();""",
              """    assert(mainResult.relatedLinks <= 4, `${locale.key} too many related links: ${mainResult.relatedLinks}`);\n    if (locale.currencyPrefix) assert(mainResult.html.includes(`${locale.currencyPrefix}<span class=\"count-target\"`), `${locale.key} currency is not prefix-formatted`);\n\n    await page.locator('#tab-reverse').click();"""
          )
          replace_once(
              '.github/scripts/browser-smoke.cjs',
              """    assert(reverseResult.amount === 1000, `${locale.key} reverse amount changed`);\n\n    let serviceWorker = { checked: false };""",
              """    assert(reverseResult.amount === 1000, `${locale.key} reverse amount changed`);\n\n    if (locale.shareRestore) {\n      const shared = new URL(locale.path, baseUrl);\n      shared.searchParams.set('mode', 'main');\n      shared.searchParams.set('status', locale.shareRestore.status);\n      shared.searchParams.set('target', locale.shareRestore.target);\n      shared.searchParams.set('points', '125');\n      shared.searchParams.set('multiplier', '1');\n      await openPage(page, shared.href);\n      await waitForStage(page, `${locale.key} share URL restore`, expected => (\n        document.querySelector('#targetStatus option:checked')?.dataset.statusLabel === expected\n      ), locale.shareRestore.expected);\n    }\n\n    let serviceWorker = { checked: false };"""
          )

          # 7) 生成テストに静的な取り残しを追加。
          replace_once(
              'tests/region-expansion.test.cjs',
              """assert.match(hk, /每 HK\\$7/);\nassert.match(hk, /香港版/);""",
              """assert.match(hk, /每 HK\\$7/);\nassert.doesNotMatch(hk, /每 NT\\$30/);\nassert.match(hk, /href=\"..\\/tw\\/games\\/\" data-lang-key=\"linkGames\"/);\nassert.match(hk, /placeholder=\"例如：350\"/);\nassert.match(hk, /香港版/);"""
          )
          replace_once(
              'tests/region-expansion.test.cjs',
              """assert.match(india, /Points per ₹5/);\nassert.match(india, /India edition/);""",
              """assert.match(india, /Points per ₹5/);\nassert.doesNotMatch(india, /Earn rate per \\$1 \\(direct entry\\)/);\nassert.match(india, /href=\"..\\/en\\/games\\/\" data-lang-key=\"linkGames\"/);\nassert.match(india, /placeholder=\"e\\.g\\. 500\"/);\nassert.match(india, /India edition/);"""
          )
          replace_once(
              'tests/region-expansion.test.cjs',
              """assert.match(configSource, /rateUnit: 'HK\\$7'/);\nassert.match(configSource, /thresholds: \\{ '銀級': 250, '金級': 1000, '鉑金級': 4000, '鑽石級': 15000 \\}/);""",
              """assert.match(configSource, /rateUnit: 'HK\\$7'/);\nassert.match(configSource, /currencyPosition: 'prefix'/);\nassert.match(configSource, /tooltip-reverse-status/);\nassert.match(configSource, /playpoint-sim\\.com\\/hk\\//);\nassert.match(configSource, /playpoint-sim\\.com\\/in\\//);\nassert.match(configSource, /thresholds: \\{ '銀級': 250, '金級': 1000, '鉑金級': 4000, '鑽石級': 15000 \\}/);"""
          )

          print('post-launch audit patches applied')
          PY

      - name: Run full preflight and regenerate deploy artifacts
        run: node .github/scripts/preflight.cjs --prepare-deploy

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "香港・インド地域版の公開後監査修正 [audit-fix]"
          git push origin HEAD:fix/hk-in-postlaunch-audit
