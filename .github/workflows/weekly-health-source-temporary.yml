name: Temporary health source snapshot
on:
  push:
    branches: [fix/weekly-health-20260928]
    paths: [.github/workflows/weekly-health-source-temporary.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 3c8897425db9ca808dc134ffcad8c8303b9bf707
      - name: Archive the verified public baseline only
        run: git archive --format=zip --output="$RUNNER_TEMP/health-baseline.zip" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: health-baseline-3c889742
          path: ${{ runner.temp }}/health-baseline.zip
          retention-days: 1
