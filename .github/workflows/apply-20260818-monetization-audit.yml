name: Apply monetization audit once

on:
  push:
    branches:
      - fix/adsense-ga4-policy-audit-20260818

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize one-time migration target
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/insert-lp-monetization.cjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            /^\s*data-ad-client="ca-pub-3845885843809455"\r?\n\s*data-ad-format="auto"/m,
            '                     data-ad-client="ca-pub-3845885843809455"\n                     data-ad-format="auto"'
          );
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Apply source fixes
        run: node scripts/apply-20260818-monetization-audit.cjs
      - name: Connect game portal analytics
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/generate-game-simulators.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const before = '  <script src="${assetsRelative}js/analytics-core.js"></script>\n</body>';
          const after = '  <script src="${assetsRelative}js/analytics-core.js"></script>\n  <script src="${assetsRelative}js/third-party.js"></script>\n</body>';
          if (!source.includes(after)) {
            if (!source.includes(before)) throw new Error('game portal analytics target not found');
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Regenerate monetization outputs
        run: |
          node scripts/insert-article-ads.cjs
          node scripts/insert-lp-monetization.cjs
          node scripts/generate-game-simulators.cjs
          node scripts/build-html.js
      - name: Strengthen focused regression test
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/monetization-search-quality.test.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const firstStart = source.indexOf("test('記事・LP・ゲームの管理広告は有効な広告ユニットIDを持つ'");
          const nextStart = source.indexOf("test('記事・LP・ゲームの広告初期化経路が共通ローダーと同意管理に接続される'", firstStart);
          if (firstStart < 0 || nextStart < 0) throw new Error('managed ad regression test block not found');
          const replacement = [
            "test('記事・LP・ゲームの管理広告は有効な広告ユニットIDを持つ', () => {",
            "  const targets = [",
            "    ['articles/2025-12-25-campaign.html', 'article-ad-container'],",
            "    ['status/gold/index.html', 'lp-ad-container'],",
            "    ['games/fgo/index.html', 'game-ad-container'],",
            "    ['en/games/fgo/index.html', 'game-ad-container']",
            "  ];",
            "  for (const [targetFile, klass] of targets) {",
            "    const html = read(targetFile);",
            "    const marker = 'class=\"' + klass + '\"';",
            "    const index = html.indexOf(marker);",
            "    assert.ok(index >= 0, targetFile + ': 管理広告枠がありません');",
            "    const block = html.slice(index, index + 900);",
            "    assert.ok(block.includes('data-ad-slot=\"' + SLOT + '\"'), targetFile + ': data-ad-slot がありません');",
            "  }",
            "});",
            "",
            ""
          ].join('\n');
          source = source.slice(0, firstStart) + replacement + source.slice(nextStart);
          const before = "  assert.ok(game.includes('js/third-party.js'));";
          const after = "  assert.ok(game.includes('js/third-party.js'));\n  assert.ok(read('games/index.html').includes('js/third-party.js'));";
          if (source.includes(before) && !source.includes("read('games/index.html').includes('js/third-party.js')")) {
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Run focused regression tests
        run: |
          node --check js/third-party.js
          node --check blog/article.js
          node --check blog/components.js
          node --test tests/analytics-core.test.cjs tests/playpoint-product-guards.test.cjs tests/monetization-search-quality.test.cjs
      - name: Commit canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 収益計測と検索品質の監査修正を反映"
          git push

# このワークフローは監査修正の一度きり適用後に削除する。
