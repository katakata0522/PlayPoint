name: Game SEO Wave 2 Prepare

on:
  push:
    branches:
      - feat/game-seo-wave2-20260913

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Generate canonical output and run focused regression
        run: |
          node scripts/prepare-pr.cjs
          node --test tests/game-seo-expanded.test.cjs

      - name: Commit canonical output and remove temporary workflow
        run: |
          rm .github/workflows/game-seo-wave2-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: finalize game SEO wave 2 output"
          git push origin HEAD:feat/game-seo-wave2-20260913
