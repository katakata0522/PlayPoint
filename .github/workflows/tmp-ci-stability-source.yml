name: Temporary CI stability source
on:
  push:
    branches: [fix/ci-stability-20260916]
    paths: [.github/workflows/tmp-ci-stability-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bb54ddea118dd60b3dbc8eafd7d332ac4be5c2a5
          persist-credentials: false
          fetch-depth: 2
      - name: Archive exact source for isolated verification
        run: |
          git rev-parse HEAD
          tar --exclude=.git/hooks -czf "$RUNNER_TEMP/playpoint-source.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-stability-source
          path: ${{ runner.temp }}/playpoint-source.tar.gz
          retention-days: 1
          if-no-files-found: error
