name: Temporary AdSense Best Practice Sync

on:
  push:
    branches:
      - fix/adsense-pwa-revenue-best-practice

permissions:
  contents: write

concurrency:
  group: tmp-adsense-best-practice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize temporary version matcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-apply-adsense-best-practice.cjs')
          source = path.read_text(encoding='utf-8')
          source = source.replace(r'(\\d{4}-\\d{2}-\\d{2})', '([0-9]{4}-[0-9]{2}-[0-9]{2})')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply focused changes and sync generated output
        run: node scripts/tmp-apply-adsense-best-practice.cjs

      - name: Align remaining AdSense and consent regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          regression_path = Path('tests/playpoint-regression.test.cjs')
          source = regression_path.read_text(encoding='utf-8')
          replacements = [
              (
                  dedent("""\
                  test('第三者スクリプトは初回操作待ちではなく初期描画後に読み込む', () => {
                    const script = fs.readFileSync(path.join(root, 'js', 'third-party.js'), 'utf8');

                    assert.ok(script.includes('DOMContentLoaded'));
                    assert.ok(!script.includes("window.addEventListener('pointerdown'"));
                    assert.ok(!script.includes("window.addEventListener('keydown'"));
                    assert.ok(!script.includes("window.addEventListener('touchstart'"));
                  });
                  """),
                  dedent("""\
                  test('第三者スクリプトは広告を早期準備し計測だけを初期表示後に遅延する', () => {
                    const script = fs.readFileSync(path.join(root, 'js', 'third-party.js'), 'utf8');

                    assert.ok(script.includes('void loadAdsense();'));
                    assert.ok(script.includes("window.addEventListener('load', scheduleAfterLoad, { once: true })"));
                    assert.ok(script.includes('scheduleAnalyticsLoad();'));
                    assert.ok(!script.includes('ADSENSE_DELAY_MS'));
                    assert.ok(!script.includes("window.addEventListener('pointerdown'"));
                    assert.ok(!script.includes("window.addEventListener('keydown'"));
                    assert.ok(!script.includes("window.addEventListener('touchstart'"));
                  });
                  """)
              ),
              (
                  dedent("""\
                  test('AdSenseタグはConsent Mode設定後に読み込みGoogle認定CMPを起動する', () => {
                    const script = fs.readFileSync(path.join(root, 'js', 'third-party.js'), 'utf8');

                    assert.ok(script.includes('ensureConsentManager()'));
                    assert.ok(script.includes('void loadAdsense()'));
                    assert.ok(script.includes('scheduleThirdPartyLoad'));
                    assert.ok(script.indexOf('void ensureConsentManager();') < script.indexOf('scheduleThirdPartyLoad();'));
                    assert.ok(script.indexOf('ADSENSE_DELAY_MS') < script.indexOf('void loadAdsense()'));
                  });
                  """),
                  dedent("""\
                  test('AdSenseタグはConsent Mode初期化と並行して非同期で早期準備する', () => {
                    const script = fs.readFileSync(path.join(root, 'js', 'third-party.js'), 'utf8');

                    assert.ok(script.includes('ensureConsentManager()'));
                    assert.ok(script.includes('void ensureConsentManager();'));
                    assert.ok(script.includes('void loadAdsense();'));
                    assert.ok(script.includes("{ crossorigin: 'anonymous' }"));
                    assert.ok(!script.includes('ADSENSE_DELAY_MS'));
                    assert.ok(script.indexOf('void ensureConsentManager();') < script.indexOf('void loadAdsense();'));
                  });
                  """)
              )
          ]
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit('AdSense regression test target not found')
          regression_path.write_text(source, encoding='utf-8')

          nine_path = Path('tests/playpoint-nine-fixes.test.cjs')
          nine = nine_path.read_text(encoding='utf-8')
          old = dedent("""\
            assert.ok(main.includes('ensureConsentManager'));
            assert.ok(main.includes('scheduleThirdPartyLoad'));
            assert.ok(main.includes('void loadAdsense()'));
            assert.ok(main.indexOf('void ensureConsentManager();') < main.indexOf('scheduleThirdPartyLoad();'));
          """)
          new = dedent("""\
            assert.ok(main.includes('ensureConsentManager'));
            assert.ok(main.includes('void ensureConsentManager();'));
            assert.ok(main.includes('void loadAdsense();'));
            assert.ok(main.includes('scheduleAnalyticsLoad();'));
            assert.ok(!main.includes('ADSENSE_DELAY_MS'));
            assert.ok(main.indexOf('void ensureConsentManager();') < main.indexOf('void loadAdsense();'));
          """)
          if old in nine:
              nine = nine.replace(old, new)
          elif new not in nine:
              raise SystemExit('playpoint-nine-fixes consent regression target not found')
          nine_path.write_text(nine, encoding='utf-8')
          PY

      - name: Remove temporary sync machinery
        run: rm -f .github/workflows/tmp-sync-adsense-best-practice.yml scripts/tmp-apply-adsense-best-practice.cjs

      - name: Verify JavaScript syntax
        run: node .github/scripts/verify-js-syntax.cjs

      - name: Run focused regression tests
        run: |
          node --test tests/playpoint-audit-fixes.test.cjs tests/playpoint-regression.test.cjs
          node tests/playpoint-nine-fixes.test.cjs

      - name: Commit synchronized changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronized changes to commit."
          else
            git commit -m "広告読み込み改修の回帰テストと生成物を確定"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run full preflight
        run: node .github/scripts/preflight.cjs
