name: One-time content synchronization

on:
  push:
    branches:
      - content/global-quests-rewards-audit-20260801

permissions:
  contents: write

concurrency:
  group: one-time-content-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/global-quests-rewards-audit-20260801

      - name: Synchronize article registry metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'blog/articles.json';
          const articles = JSON.parse(fs.readFileSync(file, 'utf8'));
          const updates = {
            'super-weekly-reward': {
              title: 'Google Play Pointsのスーパーウィークリーリワードとは？Super Ticketの注意点',
              modified: '2026-08-01',
              description: '通常のウィークリーリワードとの違い、ゴールド以上の対象条件、金曜0時の更新、賞品在庫、Super Ticketを使うと元の特典を保持できない注意点までGoogle公式情報から整理します。'
            },
            'google-play-quests': {
              modified: '2026-08-01'
            }
          };
          for (const article of articles) Object.assign(article, updates[article.id] || {});
          fs.writeFileSync(file, `${JSON.stringify(articles, null, 2)}\n`);
          NODE

      - name: Regenerate deterministic public files
        run: node scripts/build-html.js

      - name: Commit synchronized output and remove this workflow
        run: |
          rm .github/workflows/one-time-content-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronized changes were needed."
            exit 0
          fi
          git commit -m "Synchronize article metadata and generated output"
          git push origin HEAD:content/global-quests-rewards-audit-20260801
