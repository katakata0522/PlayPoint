name: Temporary static first-view codegen

on:
  push:
    branches:
      - chatgpt/static-first-view-cls-20260903
    paths:
      - '.github/workflows/tmp-static-first-view-codegen.yml'
      - 'scripts/static-calculator-layout.cjs'
      - 'js/first-view.js'
      - 'tests/mobile-first-view-contract.test.cjs'
      - 'tests/static-calculator-delivery.test.cjs'

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip codegen]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/static-first-view-cls-20260903
          fetch-depth: 0

      - name: Generate canonical outputs with committed build pins
        run: node scripts/prepare-pr.cjs

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: sync static first-view outputs [skip codegen]'
          git push origin HEAD:chatgpt/static-first-view-cls-20260903
