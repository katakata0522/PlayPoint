name: Diagnose international UX preflight regression v9

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/diagnose-intl-preflight-v9.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-article-ux-audit
          persist-credentials: false
      - name: Apply patch and generate
        run: |
          python3 scripts/apply-intl-ux-temp.py
          python3 scripts/harden-intl-hub-sync-temp.py
          node scripts/prepare-pr.cjs
      - name: Check monetization regression first
        run: node --test tests/monetization-search-quality.test.cjs
      - name: Run test files one by one
        run: |
          for f in tests/*.test.cjs; do
            echo "=== TEST_FILE: $f ==="
            node --test "$f"
          done
