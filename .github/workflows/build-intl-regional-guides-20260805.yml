name: Build regional multilingual guides

on:
  push:
    branches:
      - content/intl-guides-regional-2026-08-05

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore generator
        run: |
          cat .github/intl-regional-guides-payload/*.b64 | base64 --decode | gzip --decompress > /tmp/generate-intl-regional-guides.py
          python -m py_compile /tmp/generate-intl-regional-guides.py

      - name: Generate articles and source configuration
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py > /tmp/generator.log 2>&1
          status=$?
          cat /tmp/generator.log
          if [ "$status" -ne 0 ] && grep -q "Wrong Silver threshold" /tmp/generator.log; then
            echo "Expected pre-build Silver-page mismatch; source files were generated and the next step rebuilds them."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/generator.log | tr '\n' ' ')"
            echo "::error title=Regional guide generator failed::$message"
            exit "$status"
          fi

      - name: Build site
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1911'
        run: node scripts/build-html.js

      - name: Finalize and validate regional output
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py --post-build > /tmp/post-build.log 2>&1
          status=$?
          cat /tmp/post-build.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/post-build.log | tr '\n' ' ')"
            echo "::error title=Regional guide post-build validation failed::$message"
            exit "$status"
          fi

      - name: Commit generated tree locally
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No regional guide changes remain."
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m "content: add region-checked multilingual Play Points guides"
          test -z "$(git status --porcelain)"

      - name: Run complete preflight
        if: env.NO_CHANGES != 'true'
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/preflight.log 2>&1
          status=$?
          cat /tmp/preflight.log
          if [ "$status" -ne 0 ]; then
            python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/preflight.log').read_text(errors='replace').splitlines()
          markers = ('not ok', 'AssertionError', 'ERR_ASSERTION', 'Error:', 'expected', 'actual', 'Generated output differs')
          selected = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  selected.extend(lines[max(0, index - 3):min(len(lines), index + 10)])
          if not selected:
              selected = lines[-60:]
          compact = ' | '.join(dict.fromkeys(part.strip() for part in selected if part.strip()))
          print(f'::error title=Regional guide preflight failed::{compact[:7500]}')
          PY
            exit "$status"
          fi

      - name: Push verified content
        if: env.NO_CHANGES != 'true'
        run: git push origin HEAD:content/intl-guides-regional-2026-08-05
