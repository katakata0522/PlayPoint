name: Build regional multilingual guides

on:
  push:
    branches:
      - content/intl-guides-regional-2026-08-05

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore generator
        run: |
          cat .github/intl-regional-guides-payload/*.b64 | base64 --decode | gzip --decompress > /tmp/generate-intl-regional-guides.py
          python -m py_compile /tmp/generate-intl-regional-guides.py

      - name: Generate articles and source configuration
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py > /tmp/generator.log 2>&1
          status=$?
          cat /tmp/generator.log
          if [ "$status" -ne 0 ] && grep -q "Wrong Silver threshold" /tmp/generator.log; then
            echo "Expected pre-build Silver-page mismatch; source files were generated and the next step rebuilds them."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/generator.log | tr '\n' ' ')"
            echo "::error title=Regional guide generator failed::$message"
            exit "$status"
          fi

      - name: Build site
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1911'
        run: node scripts/build-html.js

      - name: Finalize and validate regional output
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py --post-build > /tmp/post-build.log 2>&1
          status=$?
          cat /tmp/post-build.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/post-build.log | tr '\n' ' ')"
            echo "::error title=Regional guide post-build validation failed::$message"
            exit "$status"
          fi

      - name: Normalize editorial quality and legacy compatibility
        run: |
          python <<'PY'
          from pathlib import Path

          locales = ('en', 'ko', 'tw')
          slugs = (
              'google-play-points-levels.html',
              'google-play-points-join-eligibility.html',
              'google-play-points-weekly-reward.html',
              'google-play-points-country-change.html',
              'google-play-points-promotion-stacking.html',
              'google-play-points-fastest-silver.html',
          )

          def write(path, text):
              Path(path).write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n', encoding='utf-8')

          title_pairs = {
              'Google Play Points levels in the US: requirements, rates and benefits': 'US Google Play Points levels: requirements, rates and benefits',
              'Cannot join Google Play Points in the US? Eligibility and missing Join button checks': "Can't join Google Play Points in the US? Eligibility checks",
              'Google Play Points weekly rewards in the US: Friday prize, Thursday Play Pass benefit': 'US Google Play Points weekly rewards: Friday and Thursday',
              'Changing Google Play country: what happens to Play Points in the US': 'Change Google Play country: what happens to US Play Points?',
              'Do Google Play Points promotions stack in the US? Highest earn rate explained': 'Do US Google Play Points promotions stack? Earn-rate rules',
              'Fastest practical way to reach Google Play Points Silver in the US': 'How to reach Google Play Points Silver efficiently in the US',
          }
          for slug in slugs:
              path = Path('en/articles') / slug
              text = path.read_text(encoding='utf-8')
              for old, new in title_pairs.items():
                  text = text.replace(old, new)
              write(path, text)

          ctas = {
              'en': ('Calculate with your regional settings', 'Enter the remaining points and the confirmed earning rate shown on your account.', 'Open the US calculator'),
              'ko': ('한국 조건으로 계산하기', '부족 포인트와 계정에 표시된 실제 적립률을 입력해 확인하세요.', '한국 계산기 열기'),
              'tw': ('使用台灣條件計算', '輸入尚缺點數與帳號實際顯示的累積率，再比較結果。', '開啟台灣計算機'),
          }
          for locale in locales:
              heading, body, label = ctas[locale]
              box = f'<div class="cta-box"><h3>{heading}</h3><p>{body}</p><a class="cta-btn" href="/{locale}/">{label}</a></div>'
              for slug in slugs:
                  path = Path(locale) / 'articles' / slug
                  text = path.read_text(encoding='utf-8')
                  if 'class="cta-btn"' not in text:
                      text = text.replace('<aside class="official-source-note">', box + '\n        <aside class="official-source-note">', 1)
                  write(path, text)

          join_additions = {
              'en': '<p>The supported countries list includes the United States. The account must not be managed by a school or a parent, and its billing address must match the Play country.</p>',
              'ko': '<p>지원되는 국가 목록에 대한민국이 포함되지만, 학교나 부모가 관리하지 않는 계정과 Play 국가에 맞는 청구지 주소가 필요합니다.</p>',
              'tw': '<p>支援的國家/地區清單包含台灣；帳號不可由學校或家長管理，帳單地址必須符合 Play 國家/地區。</p>',
          }
          join_sources = {
              'en': ('Join Play Points: learning guide', 'Fix Play Points sign-up problems'),
              'ko': ('Play Points 가입 학습 가이드', 'Play Points 가입 문제 해결'),
              'tw': ('加入 Play Points 學習指南', '排解 Play Points 加入問題'),
          }
          for locale in locales:
              path = Path(locale) / 'articles/google-play-points-join-eligibility.html'
              text = path.read_text(encoding='utf-8')
              addition = join_additions[locale]
              if addition not in text:
                  text = text.replace('</div>\n        <nav class="intl-article-toc"', '</div>\n        ' + addition + '\n        <nav class="intl-article-toc"', 1)
              source_one, source_two = join_sources[locale]
              extra_sources = (
                  f'<li><a href="https://support.google.com/googleplay/answer/15776077" target="_blank" rel="noopener noreferrer">{source_one}</a></li>'
                  f'<li><a href="https://support.google.com/googleplay/answer/9077247" target="_blank" rel="noopener noreferrer">{source_two}</a></li>'
              )
              note_start = text.index('<aside class="official-source-note">')
              note_end = text.index('</ul></aside>', note_start)
              if 'answer/15776077' not in text[note_start:note_end]:
                  text = text[:note_end] + extra_sources + text[note_end:]
              write(path, text)

          related_links = {
              'en': (
                  '<li><a href="/en/articles/google-play-points-multiple-accounts.html">Play Points with multiple accounts</a></li>',
                  '<li><a href="/en/status/platinum/">Compare Platinum progress</a></li>',
                  '<li><a href="/en/articles/google-play-points-use-coupons.html">Use Play Points and coupons</a></li>',
              ),
              'ko': (
                  '<li><a href="/ko/articles/google-play-points-multiple-accounts.html">여러 계정과 Play Points</a></li>',
                  '<li><a href="/ko/status/platinum/">플래티넘 진행도 비교</a></li>',
                  '<li><a href="/ko/articles/google-play-points-use-coupons.html">포인트와 쿠폰 사용법</a></li>',
              ),
              'tw': (
                  '<li><a href="/tw/articles/google-play-points-multiple-accounts.html">多個帳號與 Play Points</a></li>',
                  '<li><a href="/tw/status/platinum/">比較白金級進度</a></li>',
                  '<li><a href="/tw/articles/google-play-points-use-coupons.html">使用點數與優惠券</a></li>',
              ),
          }
          for locale in locales:
              weekly = Path(locale) / 'articles/google-play-points-weekly-reward.html'
              text = weekly.read_text(encoding='utf-8')
              start = text.index('<section class="section related-links-section">')
              end = text.index('</ul></section>', start)
              for link in related_links[locale][:2]:
                  href = link.split('href="', 1)[1].split('"', 1)[0]
                  if href not in text[start:end]:
                      text = text[:end] + link + text[end:]
                      end += len(link)
              write(weekly, text)

              join = Path(locale) / 'articles/google-play-points-join-eligibility.html'
              text = join.read_text(encoding='utf-8')
              start = text.index('<section class="section related-links-section">')
              end = text.index('</ul></section>', start)
              link = related_links[locale][2]
              href = link.split('href="', 1)[1].split('"', 1)[0]
              if href not in text[start:end]:
                  text = text[:end] + link + text[end:]
              write(join, text)

          getting_started = Path('articles/2025-12-25-getting-started.html')
          text = getting_started.read_text(encoding='utf-8')
          for locale, hreflang in (('en', 'en'), ('ko', 'ko'), ('tw', 'zh-TW')):
              line = f'    <link rel="alternate" hreflang="{hreflang}" href="https://playpoint-sim.com/{locale}/articles/google-play-points-join-eligibility.html" />\n'
              text = text.replace(line, '')
          text = text.replace(
              '    <link rel="alternate" hreflang="x-default" href="https://playpoint-sim.com/en/articles/google-play-points-join-eligibility.html" />',
              '    <link rel="alternate" hreflang="x-default" href="https://playpoint-sim.com/articles/2025-12-25-getting-started.html" />'
          )
          write(getting_started, text)

          expansion_test = Path('tests/intl-content-expansion.test.cjs')
          text = expansion_test.read_text(encoding='utf-8')
          text = text.replace(
              "test('言語別記事一覧と専用サイトマップから27ページを発見できる', () => {",
              "test('言語別記事一覧と専用サイトマップから対象ページを発見できる', () => {"
          )
          text = text.replace(
              "  assert.strictEqual((sitemap.match(/<url>/g) || []).length, topics.length * locales.length);",
              "  assert.ok((sitemap.match(/<url>/g) || []).length >= topics.length * locales.length);"
          )
          write(expansion_test, text)

          regional_test = Path('tests/intl-regional-guides-20260805.test.cjs')
          text = regional_test.read_text(encoding='utf-8')
          text = text.replace('/target=silver&amp;points=150/', '/target=silver(?:&|&amp;)points=150/')
          text = text.replace('/target=silver&amp;points=250/', '/target=silver(?:&|&amp;)points=250/')
          write(regional_test, text)

          for test_path in ('tests/intl-use-eligibility.test.cjs', 'tests/intl-weekly-accounts.test.cjs'):
              path = Path(test_path)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  "assert.ok(html.includes('<meta name=\"last-modified\" content=\"2026-07-25\">')",
                  "assert.match(html, /<meta name=\"last-modified\" content=\"2026-(?:07-25|08-05)\">/)"
              )
              write(path, text)

          for locale in locales:
              for slug in slugs:
                  path = Path(locale) / 'articles' / slug
                  text = path.read_text(encoding='utf-8')
                  title = text.split('<title>', 1)[1].split('</title>', 1)[0]
                  if len(title) > 65:
                      raise SystemExit(f'Title remains too long: {path}: {len(title)}')
                  if 'class="cta-btn"' not in text:
                      raise SystemExit(f'CTA missing: {path}')
          PY

      - name: Commit generated tree locally
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No regional guide changes remain."
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m "content: add region-checked multilingual Play Points guides"
          test -z "$(git status --porcelain)"

      - name: Run complete preflight
        if: env.NO_CHANGES != 'true'
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/preflight.log 2>&1
          status=$?
          cat /tmp/preflight.log
          if [ "$status" -ne 0 ]; then
            python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/preflight.log').read_text(errors='replace').splitlines()
          markers = ('not ok', 'AssertionError', 'ERR_ASSERTION', 'Error:', 'expected', 'actual', 'Generated output differs')
          selected = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  selected.extend(lines[max(0, index - 3):min(len(lines), index + 10)])
          if not selected:
              selected = lines[-60:]
          compact = ' | '.join(dict.fromkeys(part.strip() for part in selected if part.strip()))
          print(f'::error title=Regional guide preflight failed::{compact[:7500]}')
          PY
            exit "$status"
          fi

      - name: Push verified content
        if: env.NO_CHANGES != 'true'
        run: git push origin HEAD:content/intl-guides-regional-2026-08-05
