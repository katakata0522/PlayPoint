name: Build regional multilingual guides

on:
  push:
    branches:
      - content/intl-guides-regional-2026-08-05

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore generator
        run: |
          cat .github/intl-regional-guides-payload/*.b64 | base64 --decode | gzip --decompress > /tmp/generate-intl-regional-guides.py
          python -m py_compile /tmp/generate-intl-regional-guides.py

      - name: Generate articles and source configuration
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py > /tmp/generator.log 2>&1
          status=$?
          cat /tmp/generator.log
          if [ "$status" -ne 0 ] && grep -q "Wrong Silver threshold" /tmp/generator.log; then
            echo "Expected pre-build Silver-page mismatch; source files were generated and the next step rebuilds them."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/generator.log | tr '\n' ' ')"
            echo "::error title=Regional guide generator failed::$message"
            exit "$status"
          fi

      - name: Build site
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1911'
        run: node scripts/build-html.js

      - name: Finalize and validate regional output
        run: |
          set +e
          python /tmp/generate-intl-regional-guides.py --post-build > /tmp/post-build.log 2>&1
          status=$?
          cat /tmp/post-build.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/post-build.log | tr '\n' ' ')"
            echo "::error title=Regional guide post-build validation failed::$message"
            exit "$status"
          fi

      - name: Commit verified changes
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No regional guide changes remain."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m "content: add region-checked multilingual Play Points guides"
          test -z "$(git status --porcelain)"
          node .github/scripts/preflight.cjs
          git push origin HEAD:content/intl-guides-regional-2026-08-05
