name: Temporary game FAQ semantics sync

on:
  push:
    branches:
      - fix/game-faq-earn-rate-semantics
    paths:
      - '.github/workflows/temp-game-faq-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/game-faq-earn-rate-semantics

      - name: Fix canonical FAQ data and regenerate game pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-game-simulators.cjs')
          source = path.read_text(encoding='utf-8')

          old_campaign = '5倍CP時'
          old_base = '通常時（1%）'
          if source.count(old_campaign) != 5:
              raise SystemExit(f'expected 5 old campaign FAQ phrases, got {source.count(old_campaign)}')
          if source.count(old_base) != 5:
              raise SystemExit(f'expected 5 old base-rate FAQ phrases, got {source.count(old_base)}')

          source = source.replace(old_campaign, '特別獲得率5pt/100円時')
          source = source.replace(old_base, '通常時（1pt/100円）')
          path.write_text(source, encoding='utf-8')
          PY

          node scripts/generate-game-simulators.cjs

      - name: Verify narrowly scoped generated diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              'scripts/generate-game-simulators.cjs',
              'games/arknights/index.html',
              'games/honkai3rd/index.html',
              'games/nikke/index.html',
              'games/phantomparade/index.html',
              'games/wutheringwaves/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected generated diff: {sorted(changed)}')

          for file in expected:
              text = open(file, encoding='utf-8').read()
              if '5倍CP時' in text or '通常時（1%）' in text:
                  raise SystemExit(f'old game earn-rate wording remains: {file}')
          PY
          git diff --check

      - name: Commit synchronized source and outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-game-simulators.cjs games/arknights/index.html games/honkai3rd/index.html games/nikke/index.html games/phantomparade/index.html games/wutheringwaves/index.html
          git commit -m 'fix: ゲームFAQの特別獲得率表現を統一'
          git push origin HEAD:fix/game-faq-earn-rate-semantics
