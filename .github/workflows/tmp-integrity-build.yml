name: Temporary integrity build

on:
  push:
    branches:
      - fix/site-integrity-audit-20260911

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Apply final audit contract adjustments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_fragment(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected fragment not found: {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1))

          replace_fragment(
              'js/calculator.js',
              "        }).slice(0, 3);\n    },\n\n    renderResultGuidance",
              "        }).slice(0, 2);\n    },\n\n    renderResultGuidance"
          )

          replace_fragment(
              'tests/playpoint-calculation-contracts.test.cjs',
              "renderedResultDetails[0].includes('does not apply purchase-by-purchase point rounding')",
              "content.includes('does not apply purchase-by-purchase point rounding')"
          )
          replace_fragment(
              'tests/playpoint-calculation-contracts.test.cjs',
              "!renderedResultDetails[0].includes('Enter an average amount per purchase')",
              "!content.includes('Enter an average amount per purchase')"
          )

          replace_fragment(
              'tests/playpoint-result-contracts.test.cjs',
              "const { PP_STATE, populateStatusSelects, updateBaseRateAndTarget, calculate, reverseCalculate, renderedResults } = loadCalculatorContext();",
              "const { PP_STATE, populateStatusSelects, updateBaseRateAndTarget, calculate, reverseCalculate, renderedResults, renderedResultDetails } = loadCalculatorContext();"
          )
          replace_fragment(
              'tests/playpoint-result-contracts.test.cjs',
              "renderedResults[0].content.includes('result-purchase-check')",
              "renderedResultDetails[0].includes('result-purchase-check')"
          )
          replace_fragment(
              'tests/playpoint-result-contracts.test.cjs',
              "renderedResults[0].content.includes('articles/2026-06-20-discount-gift-cards.html')",
              "renderedResultDetails[0].includes('articles/2026-06-20-discount-gift-cards.html')"
          )
          replace_fragment(
              'tests/playpoint-result-contracts.test.cjs',
              "renderedResults[0].content.includes('買う前にギフトコードの還元条件を見る')",
              "renderedResultDetails[0].includes('買う前にギフトコードの還元条件を見る')"
          )

          replace_fragment(
              'maintenance/platinum/index.html',
              '全員に共通する「3万円を超えたら降格が得」のような損益分岐点は置かず',
              '万人共通の固定額による損益分岐点は置かず'
          )
          replace_fragment(
              'tests/site-integrity-audit-regressions.test.cjs',
              'assert.match(maintenance, /全員に共通する「3万円を超えたら降格が得」/);',
              'assert.match(maintenance, /万人共通の固定額による損益分岐点/);'
          )

          game_path = Path('games/game-sim.js')
          game_text = game_path.read_text()
          if "id = 'pack-table-calculation-note'" not in game_text:
              anchor = "        let basisEl = document.getElementById('game-calculation-basis');"
              if anchor not in game_text:
                  raise SystemExit('game table-note anchor not found')
              insert = """        const packTable = document.querySelector('.pack-table');
        if (packTable && !document.getElementById('pack-table-calculation-note')) {
            const tableNote = document.createElement('p');
            tableNote.id = 'pack-table-calculation-note';
            tableNote.className = 'game-calculation-note';
            tableNote.textContent = `${cfg.basisEstimated} ${cfg.officialRuleText}`;
            const tableWrap = packTable.closest ? packTable.closest('.pack-table-wrap') : null;
            if (tableWrap) tableWrap.insertAdjacentElement('beforebegin', tableNote);
        }

"""
              game_path.write_text(game_text.replace(anchor, insert + anchor, 1))
          PY

      - name: Generate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run full regression suite
        run: node --test tests/*.test.cjs

      - name: Commit source, tests, and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- js/calculator.js games/game-sim.js maintenance/platinum/index.html tests/playpoint-calculation-contracts.test.cjs tests/playpoint-result-contracts.test.cjs tests/site-integrity-audit-regressions.test.cjs sw.js games/*/index.html en/games/*/index.html ko/games/*/index.html tw/games/*/index.html
          if git diff --cached --quiet; then
            echo "No final audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: 監査修正の表示契約と生成物を整合"
          git push origin "HEAD:${GITHUB_REF_NAME}"
