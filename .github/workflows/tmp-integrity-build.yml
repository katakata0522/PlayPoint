name: Temporary integrity build

on:
  push:
    branches:
      - fix/site-integrity-audit-20260911

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Generate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Commit generated outputs only
        shell: bash
        run: |
          set -euo pipefail
          git add -- sw.js games/*/index.html en/games/*/index.html ko/games/*/index.html tw/games/*/index.html
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 生成物の内容ハッシュを同期"
          git push origin "HEAD:${GITHUB_REF_NAME}"
