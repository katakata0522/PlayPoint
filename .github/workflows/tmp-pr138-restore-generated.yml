name: Temporary PR138 cleanup

on:
  push:
    branches:
      - fix/intl-amount-earn-rate-copy

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-amount-earn-rate-copy
          fetch-depth: 0

      - name: Remove captured diagnostic log
        run: |
          set -euo pipefail
          if [ ! -f .github/tmp-pr138-preflight-error.txt ]; then
            echo "Diagnostic log already removed."
            exit 0
          fi
          git rm .github/tmp-pr138-preflight-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove PR138 diagnostic log"
          git push origin HEAD:fix/intl-amount-earn-rate-copy
