name: Temporary PR138 generated-output restore

on:
  push:
    branches:
      - fix/intl-amount-earn-rate-copy

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-amount-earn-rate-copy
          fetch-depth: 0

      - name: Restore generated Amount outputs from current main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            en/amount/10000/index.html \
            ko/amount/10000/index.html \
            tw/amount/10000/index.html \
            sitemap.xml

          changed="$(git diff --name-only --cached)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "Generated outputs already match main."
            exit 0
          fi

          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(en|ko|tw)/amount/10000/index\.html$|^sitemap\.xml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected restore target:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: keep published Amount output unchanged"
          git push origin HEAD:fix/intl-amount-earn-rate-copy
