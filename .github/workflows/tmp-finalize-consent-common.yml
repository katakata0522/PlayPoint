name: Temporary Finalize Consent Common

on:
  push:
    branches:
      - fix/adsense-pwa-revenue-best-practice

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Centralize Japanese article AdSense after consent defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_block(source, start_marker, end_marker, replacement, label):
              start = source.find(start_marker)
              if start == -1:
                  if replacement.strip() in source:
                      return source
                  raise SystemExit(f'{label}: start marker not found')
              end = source.find(end_marker, start)
              if end == -1:
                  raise SystemExit(f'{label}: end marker not found')
              return source[:start] + replacement + source[end:]

          def replace_test_prefix(source, prefix, replacement):
              start = source.find(f"test('{prefix}")
              if start == -1:
                  if replacement.strip() in source:
                      return source
                  raise SystemExit(f'test prefix not found: {prefix}')
              end = source.find("\ntest('", start + 1)
              if end == -1:
                  raise SystemExit(f'next test not found after: {prefix}')
              return source[:start] + replacement + '\n' + source[end + 1:]

          components_path = Path('blog/components.js')
          components = components_path.read_text(encoding='utf-8')
          components_replacement = dedent("""\
              function setupBlogAdsense() {
                  if (!isBlogPage && !isArticlePageTop) return;
                  void ensureConsentManager()
                      .catch((error) => console.error('Consent manager load failed:', error))
                      .finally(() => {
                          loadBlogAdsense();
                      });
              }

          """)
          components = replace_block(
              components,
              '    function setupBlogAdsense() {',
              '    // ===========================================\n    // Common Styles Injection',
              components_replacement,
              'components AdSense loader'
          )
          components_path.write_text(components, encoding='utf-8')

          article_path = Path('blog/article.js')
          article = article_path.read_text(encoding='utf-8')
          article = article.replace(
              '    let scrollListenerAdded = false;\n    let articleAdsenseLoaded = false;\n    let articleAdsenseScheduled = false;\n',
              '    let scrollListenerAdded = false;\n',
              1
          )
          ad_start = article.find('    // AdSense本体はページ描画を止めないasyncで早期に準備し、短時間閲覧の広告機会を失わない。')
          if ad_start != -1:
              ad_end = article.find('    function sanitizeArticleFile', ad_start)
              if ad_end == -1:
                  raise SystemExit('article AdSense block end not found')
              article = article[:ad_start] + article[ad_end:]
          article = article.replace('        setupArticleAdsense();\n', '', 1)
          if 'function loadArticleAdsense' in article or 'function setupArticleAdsense' in article:
              raise SystemExit('duplicate article AdSense function remains')
          article_path.write_text(article, encoding='utf-8')

          audit_path = Path('tests/playpoint-audit-fixes.test.cjs')
          audit = audit_path.read_text(encoding='utf-8')
          old = "  assert.match(source, /void loadAdsense\\(\\);\\s*scheduleAnalyticsLoad\\(\\);/s);"
          new = "  assert.match(source, /void ensureConsentManager\\(\\)/);\n  assert.match(source, /\\.finally\\(\\(\\) => \\{\\s*void loadAdsense\\(\\);\\s*\\}\\)/s);\n  assert.ok(source.indexOf('void ensureConsentManager()') < source.indexOf('void loadAdsense();'));"
          if old in audit:
              audit = audit.replace(old, new, 1)
          elif new not in audit:
              raise SystemExit('audit consent-order assertion not found')
          audit_path.write_text(audit, encoding='utf-8')

          regression_path = Path('tests/playpoint-regression.test.cjs')
          regression = regression_path.read_text(encoding='utf-8')

          article_test = dedent("""\
          test('記事とブログのAdSenseはConsent Mode初期化後に共通コンポーネントから非同期で準備する', () => {
            const articleScript = fs.readFileSync(path.join(root, 'blog', 'article.js'), 'utf8');
            const components = fs.readFileSync(path.join(root, 'blog', 'components.js'), 'utf8');
            const articleFiles = fs.readdirSync(path.join(root, 'articles')).filter(file => file.endsWith('.html'));

            assert.ok(!articleScript.includes('loadArticleAdsense'));
            assert.ok(!articleScript.includes('setupArticleAdsense'));
            assert.ok(!articleScript.includes('window.scrollY < 600'));
            assert.ok(components.includes('function loadBlogAdsense()'));
            assert.ok(components.includes('if (!isBlogPage && !isArticlePageTop) return;'));
            assert.ok(components.includes('void ensureConsentManager()'));
            assert.ok(components.includes('.finally(() => {'));
            assert.ok(components.includes('loadBlogAdsense();'));
            for (const file of articleFiles) {
              const html = fs.readFileSync(path.join(root, 'articles', file), 'utf8');
              assert.ok(html.includes('../blog/components.js'), `${file} does not use the shared components loader`);
              assert.ok(!html.includes('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js'), `${file} embeds AdSense directly`);
            }
          });
          """).rstrip()
          regression = replace_test_prefix(regression, '記事のAdSenseは', article_test)

          third_party_test = dedent("""\
          test('第三者スクリプトはConsent Mode初期化後に広告を早期準備し計測だけを遅延する', () => {
            const script = fs.readFileSync(path.join(root, 'js', 'third-party.js'), 'utf8');

            assert.ok(script.includes('void ensureConsentManager()'));
            assert.ok(script.includes('.finally(() => {'));
            assert.ok(script.includes('void loadAdsense();'));
            assert.ok(script.includes("window.addEventListener('load', scheduleAfterLoad, { once: true })"));
            assert.ok(script.includes('scheduleAnalyticsLoad();'));
            assert.ok(!script.includes('ADSENSE_DELAY_MS'));
            assert.ok(script.indexOf('void ensureConsentManager()') < script.indexOf('void loadAdsense();'));
            assert.ok(!script.includes("window.addEventListener('pointerdown'"));
            assert.ok(!script.includes("window.addEventListener('keydown'"));
            assert.ok(!script.includes("window.addEventListener('touchstart'"));
          });
          """).rstrip()
          regression = replace_test_prefix(regression, '第三者スクリプトは広告を早期準備', third_party_test)

          consent_test = dedent("""\
          test('AdSenseタグはConsent Mode初期化後に非同期で早期準備する', () => {
            const script = fs.readFileSync(path.join(root, 'js', 'third-party.js'), 'utf8');

            assert.ok(script.includes('ensureConsentManager()'));
            assert.ok(script.includes('void ensureConsentManager()'));
            assert.ok(script.includes('.finally(() => {'));
            assert.ok(script.includes('void loadAdsense();'));
            assert.ok(script.includes("{ crossorigin: 'anonymous' }"));
            assert.ok(!script.includes('ADSENSE_DELAY_MS'));
            assert.ok(script.indexOf('void ensureConsentManager()') < script.indexOf('void loadAdsense();'));
          });
          """).rstrip()
          regression = replace_test_prefix(regression, 'AdSenseタグはConsent Mode初期化と並行', consent_test)

          old_common_assert = '  assert.ok(components.includes("function setupBlogAdsense() {\\n        if (!isBlogPage) return;\\n        loadBlogAdsense();"));'
          new_common_assert = "  assert.ok(components.includes('if (!isBlogPage && !isArticlePageTop) return;'));\n  assert.ok(components.includes('void ensureConsentManager()'));\n  assert.ok(components.includes('.finally(() => {'));"
          if old_common_assert in regression:
              regression = regression.replace(old_common_assert, new_common_assert, 1)
          elif new_common_assert not in regression:
              raise SystemExit('common GA/AdSense assertion not found')
          regression_path.write_text(regression, encoding='utf-8')

          nine_path = Path('tests/playpoint-nine-fixes.test.cjs')
          nine = nine_path.read_text(encoding='utf-8')
          nine = nine.replace("assert.ok(main.includes('void ensureConsentManager();'));", "assert.ok(main.includes('void ensureConsentManager()'));", 1)
          nine = nine.replace("assert.ok(main.indexOf('void ensureConsentManager();') < main.indexOf('void loadAdsense();'));", "assert.ok(main.includes('.finally(() => {'));\n  assert.ok(main.indexOf('void ensureConsentManager()') < main.indexOf('void loadAdsense();'));", 1)
          nine = nine.replace("assert.ok(article.includes('PlayPointConsent.whenGranted'));", "assert.ok(article.includes(\"window.PlayPointConsent.getStatus() === 'granted'\"));\n  assert.ok(blog.includes('if (!isBlogPage && !isArticlePageTop) return;'));", 1)
          nine_path.write_text(nine, encoding='utf-8')
          PY

      - name: Sync generated assets
        shell: bash
        run: |
          MODIFIED_DATE="$(node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<meta name=\"last-modified\" content=\"(\d{4}-\d{2}-\d{2})\">/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          ASSET_VERSION="$(node -e "const fs=require('fs');const s=fs.readFileSync('sw.js','utf8');const m=s.match(/playpoint-calc-v([0-9_]+)-[a-f0-9]+/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          PLAYPOINT_MODIFIED_DATE="$MODIFIED_DATE" PLAYPOINT_ASSET_VERSION="$ASSET_VERSION" node scripts/build-html.js

      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-finalize-consent-common.yml

      - name: Run focused checks
        run: |
          node .github/scripts/verify-js-syntax.cjs
          node --test tests/playpoint-audit-fixes.test.cjs tests/playpoint-regression.test.cjs
          node tests/playpoint-nine-fixes.test.cjs

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "記事広告もConsent Mode初期化後に共通読み込み"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run full preflight
        run: node .github/scripts/preflight.cjs
