name: Deploy to Xserver

on:
  # Explicit fallback when a squash commit message suppresses push-triggered CI.
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'tests/**'
      - 'docs/**'
      - 'tools/**'
      - 'scripts/ai-sync-preflight.cjs'
      - '.github/workflows/browser-smoke.yml'
      - '.github/workflows/mobile-performance.yml'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/seo-healthcheck.yml'
      - '.github/workflows/rollback.yml'

permissions:
  contents: read

# 実行中の本番反映は中断せず、待機中は最新の1件だけを残す
concurrency:
  group: deploy-playpoint-main

jobs:
  deploy:
    # 本番反映はmainの内容だけを対象にする
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Xserverの通信フェーズは接続待ちに加えて、接続後の停止も上限付きで検知して再試行する。
    # 本体ミラー7回・snapshot/rollback等5回に加え、本番Chromiumと失敗時の復元検証まで50分以内に収める。
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pushのbefore..HEADを判定できれば十分。複数commit pushなどで親を取得できない場合は安全側でDeployする。
          fetch-depth: 2

      - name: Detect production deploy impact
        id: deploy-impact
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'Manual deployment requested; production deploy is required.'
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ ! "$before_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$before_sha" = "$zero_sha" ]; then
            echo 'Push base SHA is unavailable; deploying as a fail-safe.'
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$before_sha^{commit}" 2>/dev/null; then
            echo 'Push base commit is outside the shallow checkout; deploying as a fail-safe.'
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # renameは旧pathの削除も本番へ反映する必要があるため、rename検出を無効化して旧/新を両方判定する。
          changed_files="$(git diff --name-only --no-renames "$before_sha" "$GITHUB_SHA")"
          echo 'Changed files:'
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files"
          else
            echo '(none detected)'
            echo 'No changed files were detected; deploying as a fail-safe.'
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          impact_json="$(printf '%s\n' "$changed_files" | node .github/scripts/detect-deploy-impact.cjs)"
          printf '%s\n' "$impact_json" | jq .
          deploy_needed="$(jq -r '.deployNeeded' <<< "$impact_json")"
          if [ "$deploy_needed" != 'true' ] && [ "$deploy_needed" != 'false' ]; then
            echo 'Deploy impact classifier returned an invalid result; failing safe.' >&2
            deploy_needed=true
          fi
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"

      - name: Skip production deployment for non-public changes
        if: steps.deploy-impact.outputs.deploy_needed == 'false'
        run: echo 'No public/deployment input changed. Skipping preflight preparation, browser setup, SSH, rsync, and production verification.'

      - name: Run complete preflight and prepare deploy assets
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: node .github/scripts/preflight.cjs --prepare-deploy

      - name: Create deploying status marker
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: |
          DEPLOY_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "DEPLOY_STARTED_AT=$DEPLOY_STARTED_AT" >> "$GITHUB_ENV"
          DEPLOY_PUBLIC_STATUS=deploying \
          DEPLOY_STARTED_AT="$DEPLOY_STARTED_AT" \
          node .github/scripts/deploy-status.cjs

      - name: Prepare explicit public deployment tree
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          public_root="$RUNNER_TEMP/playpoint-public"
          node .github/scripts/prepare-public-tree.cjs "$public_root"
          echo "DEPLOY_SOURCE_ROOT=$public_root" >> "$GITHUB_ENV"

      # ブラウザ実行環境の準備失敗はproduction mutationではないため、snapshot/rsyncより前に失敗させる。
      - name: Install production browser verifier
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match sans-serif:lang=ja
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Setup SSH
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "SSH_PRIVATE_KEY が未設定です"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
          cat > ~/.ssh/known_hosts <<'EOF'
          [hajikkoroom.xsrv.jp]:10022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKKSe2ENjD1KRgSqCY7ji78s0zqCNCKBRNfRaxRV7sh
          EOF
          chmod 600 ~/.ssh/known_hosts
          unset SSH_PRIVATE_KEY_B64

      - name: Snapshot current verified production
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: bash .github/scripts/deploy-rsync.sh --snapshot-verified

      - name: Verify rollback snapshot before production mutation
        id: rollback-snapshot
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash .github/scripts/deploy-rsync.sh --verify-snapshot)"
          printf '%s\n' "$output"
          revision="$(printf '%s\n' "$output" | sed -n 's/^ROLLBACK_SNAPSHOT_REVISION=\([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Rollback snapshot did not return one valid revision.' >&2
            exit 2
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Deploy strict public mirror via rsync
        id: production-mirror
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: bash .github/scripts/deploy-rsync.sh

      - name: Verify production deployment
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        env:
          EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
          EXPECTED_DEPLOY_STATUS: deploying
        run: |
          node .github/scripts/smoke-test.cjs
          node .github/scripts/verify-deploy-status.cjs

      - name: Verify production SEO health
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: node .github/scripts/seo-health-check.cjs

      - name: Verify production sitemap registry
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: node .github/scripts/sitemap-health-check.cjs

      - name: Verify production security headers
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        run: node .github/scripts/security-health-check.cjs

      # HTTP/SEOだけでは検出できない表示・操作・収益経路の破損もverified前に止める。
      - name: Verify production in Chromium before verified status
        id: production-browser
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: |
          set -euo pipefail
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload production browser evidence
        if: ${{ always() && steps.deploy-impact.outputs.deploy_needed == 'true' && (steps.production-browser.outcome == 'success' || steps.production-browser.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-production-browser-${{ github.run_id }}
          path: browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish verified deployment status
        if: steps.deploy-impact.outputs.deploy_needed == 'true'
        env:
          EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
          EXPECTED_DEPLOY_STATUS: verified
        run: |
          set -euo pipefail
          DEPLOY_VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DEPLOY_PUBLIC_STATUS=verified \
          DEPLOY_STARTED_AT="$DEPLOY_STARTED_AT" \
          DEPLOY_VERIFIED_AT="$DEPLOY_VERIFIED_AT" \
          node .github/scripts/deploy-status.cjs

          bash .github/scripts/deploy-rsync.sh --publish-status
          node .github/scripts/verify-deploy-status.cjs

      # ここからは失敗したreleaseを成功扱いにしない復旧レーン。
      # production-mirrorが実際に試行された場合だけprevious verifiedへ戻す。
      - name: Auto-rollback failed production mutation
        id: auto-rollback
        if: ${{ failure() && steps.rollback-snapshot.outputs.revision != '' && (steps.production-mirror.outcome == 'success' || steps.production-mirror.outcome == 'failure') }}
        env:
          EXPECTED_ROLLBACK_REVISION: ${{ steps.rollback-snapshot.outputs.revision }}
        run: bash .github/scripts/deploy-rsync.sh --restore-verified-snapshot

      - name: Checkout auto-rollback revision for matching verification logic
        if: ${{ failure() && steps.auto-rollback.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rollback-snapshot.outputs.revision }}
          path: auto-rollback-verifier
          persist-credentials: false
          fetch-depth: 2

      - name: Verify auto-rollback HTTP, SEO, sitemap, and security
        id: auto-rollback-http
        if: ${{ failure() && steps.auto-rollback.outcome == 'success' }}
        working-directory: auto-rollback-verifier
        env:
          EXPECTED_DEPLOY_REVISION: ${{ steps.rollback-snapshot.outputs.revision }}
          EXPECTED_DEPLOY_STATUS: verified
        run: |
          set -euo pipefail
          node .github/scripts/smoke-test.cjs
          node .github/scripts/verify-deploy-status.cjs
          node .github/scripts/seo-health-check.cjs
          node .github/scripts/sitemap-health-check.cjs
          node .github/scripts/security-health-check.cjs

      - name: Install browser driver for auto-rollback verification
        if: ${{ failure() && steps.auto-rollback.outcome == 'success' && steps.auto-rollback-http.outcome == 'success' }}
        working-directory: auto-rollback-verifier
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match sans-serif:lang=ja
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify auto-rollback production in Chromium
        if: ${{ failure() && steps.auto-rollback.outcome == 'success' && steps.auto-rollback-http.outcome == 'success' }}
        working-directory: auto-rollback-verifier
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: |
          set -euo pipefail
          node .github/scripts/browser-smoke.cjs
          node .github/scripts/article-css-smoke.cjs
          node .github/scripts/article-design-smoke.cjs
          node .github/scripts/mobile-region-layout-smoke.cjs
          node .github/scripts/browser-revenue-smoke.cjs
          node .github/scripts/embed-widget-smoke.cjs

      - name: Upload auto-rollback browser evidence
        if: ${{ failure() && steps.auto-rollback.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-rollback-browser-${{ github.run_id }}
          path: auto-rollback-verifier/browser-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
