name: Deploy to Xserver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read
  statuses: write

# 実行中の本番反映は中断せず、待機中は最新の1件だけを残す
concurrency:
  group: deploy-playpoint-main

jobs:
  deploy:
    # 本番反映はmainの内容だけを対象にする
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark Xserver deployment as pending
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_COMMIT_STATE: pending
          DEPLOY_COMMIT_DESCRIPTION: Xserver deployment is running
        run: |
          node <<'NODE'
          const state = process.env.DEPLOY_COMMIT_STATE;
          const payload = {
            state,
            context: 'xserver/deploy',
            description: process.env.DEPLOY_COMMIT_DESCRIPTION,
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          };
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;

          async function postStatus() {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: `Bearer ${process.env.GH_TOKEN}`,
                    'content-type': 'application/json',
                    'x-github-api-version': '2022-11-28'
                  },
                  body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`GitHub status API: HTTP ${response.status} ${await response.text()}`);
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
              }
            }
            throw lastError;
          }

          postStatus().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete preflight and prepare deploy assets
        run: node .github/scripts/preflight.cjs --prepare-deploy

      - name: Create deploying status marker
        run: |
          DEPLOY_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "DEPLOY_STARTED_AT=$DEPLOY_STARTED_AT" >> "$GITHUB_ENV"
          DEPLOY_PUBLIC_STATUS=deploying \
          DEPLOY_STARTED_AT="$DEPLOY_STARTED_AT" \
          node .github/scripts/deploy-status.cjs

      - name: Setup SSH
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY が未設定です"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/known_hosts <<'EOF'
          [hajikkoroom.xsrv.jp]:10022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKKSe2ENjD1KRgSqCY7ji78s0zqCNCKBRNfRaxRV7sh
          EOF

      - name: Deploy strict public mirror via rsync
        run: bash .github/scripts/deploy-rsync.sh

      - name: Verify production deployment
        env:
          EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
          EXPECTED_DEPLOY_STATUS: deploying
        run: |
          node .github/scripts/smoke-test.cjs
          node .github/scripts/verify-deploy-status.cjs

      - name: Verify production SEO health
        run: node .github/scripts/seo-health-check.cjs

      - name: Publish verified deployment status
        env:
          EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
          EXPECTED_DEPLOY_STATUS: verified
        run: |
          set -euo pipefail
          DEPLOY_VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DEPLOY_PUBLIC_STATUS=verified \
          DEPLOY_STARTED_AT="$DEPLOY_STARTED_AT" \
          DEPLOY_VERIFIED_AT="$DEPLOY_VERIFIED_AT" \
          node .github/scripts/deploy-status.cjs

          bash .github/scripts/deploy-rsync.sh --publish-status
          node .github/scripts/verify-deploy-status.cjs

      - name: Report Xserver deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const jobStatus = process.env.DEPLOY_JOB_STATUS;
          const state = jobStatus === 'success' ? 'success' : jobStatus === 'cancelled' ? 'error' : 'failure';
          const description = state === 'success'
            ? 'Xserver deployment and production checks passed'
            : state === 'error'
              ? 'Xserver deployment was cancelled'
              : 'Xserver deployment or production checks failed';
          const payload = {
            state,
            context: 'xserver/deploy',
            description,
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          };
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;

          async function postStatus() {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: `Bearer ${process.env.GH_TOKEN}`,
                    'content-type': 'application/json',
                    'x-github-api-version': '2022-11-28'
                  },
                  body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`GitHub status API: HTTP ${response.status} ${await response.text()}`);
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
              }
            }
            throw lastError;
          }

          postStatus().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
