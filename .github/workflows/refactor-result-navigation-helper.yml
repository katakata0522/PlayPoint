name: Refactor result navigation helper

on:
  push:
    branches:
      - refactor/region-result-navigation-boundaries

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/region-result-navigation-boundaries
          fetch-depth: 0

      - name: Apply explicit result navigation boundaries
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`${path}: pattern not found`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          const calculatorPath = 'js/calculator.js';
          let calculator = fs.readFileSync(calculatorPath, 'utf8');
          const importAnchor = "import { SHARE } from './share.js';\n";
          if (!calculator.includes("./result-navigation-config.js")) {
            if (!calculator.includes(importAnchor)) throw new Error('calculator import anchor not found');
            calculator = calculator.replace(importAnchor, `${importAnchor}import { getResultNavigationConfig } from './result-navigation-config.js';\n`);
          }
          const blockStart = calculator.indexOf('    relatedArticleGroups: {');
          const blockEnd = calculator.indexOf('\n\n    getRelatedArticles(', blockStart);
          if (blockStart < 0 || blockEnd < 0) throw new Error('calculator result navigation block not found');
          calculator = calculator.slice(0, blockStart)
            + "    getResultNavigation() {\n        return getResultNavigationConfig(STATE.currentRegion);\n    },"
            + calculator.slice(blockEnd);
          fs.writeFileSync(calculatorPath, calculator);

          replaceOnce(
            'js/main.js',
            "import { installExpandedRegionResultNavigation } from './region-result-navigation.js';\n",
            ''
          );
          replaceOnce('js/main.js', '\ninstallExpandedRegionResultNavigation(CALC, STATE);\n', '\n');
          replaceOnce('scripts/asset-sync.cjs', "  'js/region-result-navigation.js',", "  'js/result-navigation-config.js',");
          replaceOnce('sw.js', "  './js/region-result-navigation.js',", "  './js/result-navigation-config.js',");
          NODE

          git rm js/region-result-navigation.js

          cat > tests/region-runtime-wiring.test.cjs <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const rootDir = path.resolve(__dirname, '..');
          const read = (relativePath) => fs.readFileSync(path.join(rootDir, relativePath), 'utf8');

          const main = read('js/main.js');
          const calculator = read('js/calculator.js');
          const regionNavigation = read('js/region-navigation.js');
          const resultNavigation = read('js/result-navigation-config.js');
          const assetSync = read('scripts/asset-sync.cjs');
          const serviceWorker = read('sw.js');

          assert.doesNotMatch(main, /installExpandedRegionResultNavigation/);
          assert.match(calculator, /import \{ getResultNavigationConfig \} from '\.\/result-navigation-config\.js';/);
          assert.match(calculator, /return getResultNavigationConfig\(STATE\.currentRegion\);/);
          assert.doesNotMatch(calculator, /const localized = \{/);
          assert.doesNotMatch(regionNavigation, /installExpandedRegionResultNavigation/);
          assert.doesNotMatch(regionNavigation, /import \{ CALC \} from '\.\/calculator\.js';/);
          assert.match(resultNavigation, /const RESULT_NAVIGATION_CONFIGS = Object\.freeze\(\{ JP, US, KR, TW, HK, IN \}\);/);
          assert.equal(fs.existsSync(path.join(rootDir, 'js/region-result-navigation.js')), false);
          assert.match(assetSync, /'js\/result-navigation-config\.js'/);
          assert.doesNotMatch(assetSync, /region-result-navigation\.js/);
          assert.match(serviceWorker, /'\.\/js\/result-navigation-config\.js'/);
          assert.doesNotMatch(serviceWorker, /region-result-navigation\.js/);
          assert.match(serviceWorker, /'\.\/hk\/'/);
          assert.match(serviceWorker, /'\.\/in\/'/);

          console.log('Region runtime wiring guards passed.');
          EOF

          cat > tests/result-navigation-config.test.cjs <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const vm = require('node:vm');

          const root = path.resolve(__dirname, '..');
          const source = fs.readFileSync(path.join(root, 'js/result-navigation-config.js'), 'utf8')
            .replace('export function getResultNavigationConfig', 'function getResultNavigationConfig')
            + '\nglobalThis.__getResultNavigationConfig = getResultNavigationConfig;\n';
          const context = {};
          vm.createContext(context);
          vm.runInContext(source, context, { filename: 'result-navigation-config.js' });
          const getConfig = context.__getResultNavigationConfig;

          test('結果ナビ設定は公開6地域を明示的に解決し未知地域はJPへ戻す', () => {
            for (const region of ['JP', 'US', 'KR', 'TW', 'HK', 'IN']) {
              const config = getConfig(region);
              assert.ok(config.decisionTitle, `${region}: decisionTitle`);
              assert.ok(config.relatedArticleGroups.default.length > 0, `${region}: default links`);
              assert.ok(config.giftCards.href, `${region}: giftCards`);
            }
            assert.strictEqual(getConfig('UNKNOWN'), getConfig('JP'));
          });

          test('結果ナビ設定は呼び出しごとに再生成しない', () => {
            assert.strictEqual(getConfig('HK'), getConfig('HK'));
            assert.strictEqual(getConfig('IN'), getConfig('IN'));
            assert.strictEqual(getConfig('US'), getConfig('US'));
          });
          EOF

      - name: Run focused tests
        run: |
          node --test tests/result-navigation-config.test.cjs
          node tests/region-runtime-wiring.test.cjs

      - name: Synchronize generated assets
        run: node scripts/prepare-pr.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Verify diff
        run: |
          git diff --check
          git status --short

      - name: Commit refactor
        run: |
          rm .github/workflows/refactor-result-navigation-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make result navigation configuration explicit'
          git push origin HEAD:refactor/region-result-navigation-boundaries
