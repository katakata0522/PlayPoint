name: Temporary PR138 preflight diagnostic

on:
  push:
    branches:
      - fix/intl-amount-earn-rate-copy

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-amount-earn-rate-copy
          fetch-depth: 0

      - name: Run exact PR Gate command and capture failure
        run: |
          set +e
          node .github/scripts/preflight.cjs --prepare-deploy > /tmp/pr138-preflight.log 2>&1
          status=$?
          set -e
          cat /tmp/pr138-preflight.log
          if [ "$status" -eq 0 ]; then
            echo "Preflight succeeded; no diagnostic commit required."
            exit 0
          fi
          cp /tmp/pr138-preflight.log .github/tmp-pr138-preflight-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/tmp-pr138-preflight-error.txt
          git commit -m "chore: capture PR138 preflight failure"
          git push origin HEAD:fix/intl-amount-earn-rate-copy
          exit "$status"
