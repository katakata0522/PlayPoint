name: Temporary Latest Hub Verification 2026-09-11

on:
  push:
    branches:
      - chore/latest-hub-verify-20260911
    paths:
      - .github/workflows/tmp-latest-hub-verify-20260911.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/latest-hub-verify-20260911
          fetch-depth: 0

      - name: Apply verified latest-hub update
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'latest/index.html';
          let html = fs.readFileSync(path, 'utf8');

          function replaceOnce(before, after, label) {
            const count = html.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: expected 1 match, found ${count}`);
            }
            html = html.replace(before, after);
          }

          replaceOnce(
            '  <meta name="description" content="2026年9月10日時点のGoogle Play Points最新情報。次回の一般向けポイント増量キャンペーン予定、通常・スーパー・Play Pass週次特典、クエストを公開公式情報とアカウント別情報に分けて整理します。">',
            '  <meta name="description" content="2026年9月11日時点のGoogle Play Points最新情報。期限到来の通常・スーパー週次特典を公式再確認し、他項目は前回検証日を維持。公開公式情報とアカウント別情報を分けて整理します。">',
            'meta description'
          );
          replaceOnce(
            '  <meta name="last-modified" content="2026-09-10">',
            '  <meta name="last-modified" content="2026-09-11">',
            'last-modified'
          );
          replaceOnce(
            '  <meta property="article:modified_time" content="2026-09-10T00:00:00+09:00">',
            '  <meta property="article:modified_time" content="2026-09-11T00:00:00+09:00">',
            'article modified time'
          );
          replaceOnce(
            '  <meta property="og:description" content="2026年9月10日時点。次回の全員共通ポイント増量キャンペーンは公開公式情報では確認できません。週次特典とアカウント別キャンペーンの確認方法も整理します。">',
            '  <meta property="og:description" content="2026年9月11日時点。通常・スーパー週次特典を再確認し主要仕様に変更なし。その他の項目は各カードの検証日を維持しています。">',
            'og description'
          );
          replaceOnce(
            '    "dateModified":"2026-09-10",',
            '    "dateModified":"2026-09-11",',
            'json-ld modified date'
          );
          replaceOnce(
            '      <span>最終更新: <time datetime="2026-09-10">2026-09-10</time></span>\n      <span>公式情報の最終確認: <time data-latest-verified datetime="2026-09-10">2026-09-10</time></span>',
            '      <span>最終更新: <time datetime="2026-09-11">2026-09-11</time></span>\n      <span>直近の公式確認: <time data-latest-verified datetime="2026-09-11">2026-09-11</time></span>',
            'hero verification dates'
          );
          replaceOnce(
            '        <p class="meta-line">検証日: <time datetime="2026-09-10">2026-09-10</time> / 次回確認目安: 2026-09-11頃</p>\n      </article>\n      <article data-source-scope="public">\n        <span class="latest-status-label">スーパー週次｜公開公式情報で確認</span>',
            '        <p class="meta-line">検証日: <time datetime="2026-09-11">2026-09-11</time> / 次回確認目安: 2026-09-18頃</p>\n      </article>\n      <article data-source-scope="public">\n        <span class="latest-status-label">スーパー週次｜公開公式情報で確認</span>',
            'normal weekly verification date'
          );
          replaceOnce(
            '        <p>スーパーウィークリーリワードはゴールド以上が主な対象です。賞品数には限りがあり、ステータスや追加資格によって内容が異なる場合があります。過去の高額賞品例は今週の当選を保証しません。</p>',
            '        <p>スーパーウィークリーリワードはゴールド以上が対象として公開案内されています。Google公式の公開ページでは、賞品数に限りがあり、ステータスや追加資格によって内容が異なる場合があることまで確認できます。今週の賞品・残数・利用可否は、自分のPlay Points「特典」画面を最終判断にしてください。</p>',
            'super weekly scope copy'
          );
          replaceOnce(
            '        <p class="meta-line">検証日: <time datetime="2026-09-10">2026-09-10</time> / 次回確認目安: 2026-09-11頃</p>\n      </article>\n      <article data-source-scope="public">\n        <span class="latest-status-label">Play Pass週次｜公開公式情報で確認</span>',
            '        <p class="meta-line">検証日: <time datetime="2026-09-11">2026-09-11</time> / 次回確認目安: 2026-09-18頃</p>\n      </article>\n      <article data-source-scope="public">\n        <span class="latest-status-label">Play Pass週次｜公開公式情報で確認</span>',
            'super weekly verification date'
          );
          replaceOnce(
            '  <section class="section" aria-labelledby="result-title">\n    <h2 id="result-title">2026年9月10日の確認結果</h2>\n    <p>日本向けの通常ウィークリーリワード、スーパーウィークリーリワード、Play Pass加入者向け週次Play Points特典、クエスト、ポイント獲得プロモーション、ランク条件、問題解決手順をGoogle公式情報で再確認しました。</p>\n    <p>通常週次は金曜日、スーパー週次は金曜日午前0時以降、Play Pass加入者向け週次特典は木曜日に更新される主要仕様に変更はありませんでした。ポイント獲得プロモーションは1回の購入で複数を組み合わせず、利用できる中で最も高い獲得率が適用されることも再確認しました。一方、2026年9月10日に確認した公開公式情報では、次回の全員共通のポイント増量キャンペーン開始日は確認できませんでした。現在利用できる獲得率・対象・期限は、自分のPlay Points「貯める」画面を確認してください。</p>\n  </section>',
            '  <section class="section" aria-labelledby="result-title">\n    <h2 id="result-title">2026年9月11日の確認結果</h2>\n    <p>今回の再検証対象は、ページ内の次回確認目安が2026-09-11に到来した通常ウィークリーリワードとスーパーウィークリーリワードの2項目です。Play Pass週次、クエスト、ポイント獲得プロモーション、ランク条件、問題解決手順は確認期限前のため再検証せず、各カードの前回検証日を維持しています。</p>\n    <p>通常週次は日本向けGoogle公式ヘルプで、シルバー以上・金曜日リセット・「特典」からの受け取り・ポイント履歴での確認に変更がないことを再確認しました。スーパー週次はGoogle公式ページで、ゴールド以上・金曜日午前0時以降・在庫制・追加資格要件が適用される場合があるという主要ルールに変更がありません。Google Play公式のQ3 2024案内でも、日本がSuper Weekly Prizesの対象国に含まれることを再確認しました。今週の具体的な賞品・残数・個別の表示可否は公開公式情報だけでは確定できないため、アカウント内の「特典」画面を最終判断にします。</p>\n  </section>',
            'verification result section'
          );
          replaceOnce(
            '    <h2 id="official-sources-title">今回確認した公式参照先</h2>\n    <ul class="latest-source-list">',
            '    <h2 id="official-sources-title">公式参照先と今回の確認範囲</h2>\n    <p class="lp-note">2026-09-11に実際に再確認したのは通常週次とスーパー週次の参照先です。その他の参照先は各項目の前回検証日を維持しています。</p>\n    <ul class="latest-source-list">',
            'official sources heading'
          );
          replaceOnce(
            '      <li><a href="https://play.google.com/store/apps/editorial?hl=ja&amp;id=mc_editorialmd_loyalty_swp_cujs_unenrolled_fcp" target="_blank" rel="noopener noreferrer">スーパー ウィークリー リワード</a> — 対象ランク、更新、賞品在庫</li>',
            '      <li><a href="https://play.google.com/store/apps/editorial?hl=ja&amp;id=mc_editorialmd_loyalty_swp_cujs_unenrolled_fcp" target="_blank" rel="noopener noreferrer">スーパー ウィークリー リワード</a> — 対象ランク、更新、賞品在庫</li>\n      <li><a href="https://google.play/the-latest/2024-q3/" target="_blank" rel="noopener noreferrer">The Latest from Google Play: Q3 2024</a> — 日本を含む対象国とGold+向けSuper Weekly Prizes</li>',
            'super weekly Japan source'
          );
          replaceOnce(
            '    <div class="latest-log-list">\n      <article>\n        <time datetime="2026-09-10">2026-09-10</time>',
            '    <div class="latest-log-list">\n      <article>\n        <time datetime="2026-09-11">2026-09-11</time>\n        <h3>期限到来の通常・スーパー週次だけを再確認</h3>\n        <p>通常ウィークリーは日本向けGoogle公式ヘルプでシルバー以上・金曜リセット・受け取り手順に変更なし、スーパーウィークリーはGoogle公式ページでゴールド以上・金曜午前0時以降・在庫制・追加資格要件の可能性に変更なしと確認しました。Super Weekly Prizesが日本向けに案内されている根拠もGoogle Play公式の公開記事で再確認しています。今週の賞品・残数・個別表示はアカウント依存のため公開情報として一般化していません。期限前のPlay Pass週次、クエスト、プロモーション、ランク条件、問題解決は前回検証日を維持しました。</p>\n      </article>\n      <article>\n        <time datetime="2026-09-10">2026-09-10</time>',
            'verification log entry'
          );

          fs.writeFileSync(path, html);
          NODE

      - name: Validate latest hub
        shell: bash
        run: |
          set -euo pipefail
          node scripts/latest-hub-audit.cjs
          node scripts/latest-hub-audit.cjs --fresh --next-check
          node --test tests/latest-hub-operations.test.cjs

      - name: Commit verified update and remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest/index.html
          git rm .github/workflows/tmp-latest-hub-verify-20260911.yml
          git commit -m "最新情報ハブの週次特典を再確認"
          git push origin chore/latest-hub-verify-20260911

      - name: Clean temporary workflow after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-latest-hub-verify-20260911.yml
          git commit -m "一時検証workflowを削除"
          git push origin chore/latest-hub-verify-20260911
