name: Temporary sync ads and PWA analytics

on:
  push:
    branches:
      - optimize/adsense-pwa-revenue-20260807

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update regression expectations and analytics docs
        run: node .github/scripts/temp-sync-ads-pwa.cjs

      - name: Synchronize generated files
        run: node scripts/build-html.js

      - name: Create local synchronized commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "同期対象の差分はありません。"
          else
            git commit -m "広告読込改善の生成物と回帰テストを同期"
          fi

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Push synchronized commit
        run: git push origin HEAD:optimize/adsense-pwa-revenue-20260807
