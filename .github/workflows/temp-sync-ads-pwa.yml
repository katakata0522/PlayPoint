name: Temporary diagnose ads and PWA analytics

on:
  push:
    branches:
      - optimize/adsense-pwa-revenue-20260807

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update regression expectations and analytics docs
        run: node .github/scripts/temp-sync-ads-pwa.cjs

      - name: Synchronize generated files
        run: node scripts/build-html.js

      - name: Locate stale third-party expectation
        run: |
          grep -R -n -C 8 -E "第三者スクリプトは同意管理を先に初期化してから遅延読込する|third-party.js still loads before DOMContentLoaded" tests || true

      - name: Verify source syntax before minify
        run: node .github/scripts/verify-js-syntax.cjs

      - name: Minify public assets
        run: node .github/scripts/minify.cjs

      - name: Diagnose article syntax after minify
        run: |
          if node .github/scripts/verify-js-syntax.cjs; then
            echo "圧縮後のJavaScript構文は正常です。"
          else
            echo "--- blog/article.js lines 45-90 ---"
            nl -ba blog/article.js | sed -n '45,90p'
            echo "--- blog/article.js lines 1-120 ---"
            nl -ba blog/article.js | sed -n '1,120p'
            exit 1
          fi
