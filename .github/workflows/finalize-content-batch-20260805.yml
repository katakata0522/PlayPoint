name: Finalize Japanese guide article batch

on:
  push:
    branches:
      - content/play-points-guides-2026-08-05

permissions:
  contents: write

concurrency:
  group: finalize-article-batch-20260805
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect already finalized branch
        run: |
          if grep -q '2026-08-05-play-points-levels-guide.html' blog/articles.json \
            && grep -q 'href="../latest/"' blog/index.html \
            && grep -q '通常リワードは金曜日' articles/2025-12-25-weekly-reward.html; then
            echo "ARTICLE_BATCH_DONE=true" >> "$GITHUB_ENV"
            echo "Article batch is already finalized."
          else
            echo "ARTICLE_BATCH_DONE=false" >> "$GITHUB_ENV"
          fi

      - name: Configure Git
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore audited article batch
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          cat .github/article-batch-payload/*.b64 | base64 --decode | gzip --decompress > /tmp/apply-content-batch-20260805.cjs
          sed -i "s|const root = path.resolve(__dirname, '..');|const root = process.cwd();|" /tmp/apply-content-batch-20260805.cjs
          node /tmp/apply-content-batch-20260805.cjs

      - name: Extract and run audited quality corrections
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-content-batch-20260805.yml').read_text()
          start_marker = "          cat > /tmp/fix-guide-quality.cjs <<'NODE'\n"
          end_marker = "\n          NODE\n"
          if start_marker not in source:
              raise SystemExit('Quality correction start marker was not found')
          body = source.split(start_marker, 1)[1]
          if end_marker not in body:
              raise SystemExit('Quality correction end marker was not found')
          body = body.split(end_marker, 1)[0]
          lines = [
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          ]
          Path('/tmp/fix-guide-quality.cjs').write_text('\n'.join(lines) + '\n')
          PY
          test -s /tmp/fix-guide-quality.cjs
          node /tmp/fix-guide-quality.cjs

      - name: Restore latest-information fallback link
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'blog/index.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.includes('href="../latest/"')) {
            const heading = '                <h2>カテゴリー別記事一覧</h2>';
            if (!html.includes(heading)) throw new Error('Static article list heading was not found');
            html = html.replace(
              heading,
              `${heading}\n                <p class="static-latest-link"><a href="../latest/">最新情報・公式更新を見る</a></p>`
            );
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Regenerate public output
        if: env.ARTICLE_BATCH_DONE != 'true'
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1249'
        run: node scripts/build-html.js

      - name: Reapply idempotent corrections and latest link
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          node /tmp/fix-guide-quality.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'blog/index.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.includes('href="../latest/"')) {
            const heading = '                <h2>カテゴリー別記事一覧</h2>';
            if (!html.includes(heading)) throw new Error('Static article list heading was not found');
            html = html.replace(
              heading,
              `${heading}\n                <p class="static-latest-link"><a href="../latest/">最新情報・公式更新を見る</a></p>`
            );
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Restore weekly update schedule distinction
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'articles/2025-12-25-weekly-reward.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.includes('通常リワードは金曜日') || !html.includes('Play Passのボーナス・ブースターは木曜日')) {
            const note = `\n    <section class="section" id="weekly-update-schedule">\n      <h2>更新曜日を混同しない</h2>\n      <p><strong>通常リワードは金曜日</strong>にリセットされます。一方、<strong>Play Passのボーナス・ブースターは木曜日</strong>に更新される別制度です。表示場所と対象条件も異なるため、同じ週次特典として扱わずに確認してください。</p>\n    </section>\n`;
            const closing = html.lastIndexOf('</article>');
            if (closing < 0) throw new Error('Weekly reward article closing tag was not found');
            html = `${html.slice(0, closing)}${note}${html.slice(closing)}`;
            fs.writeFileSync(file, html.replace(/[ \t]+$/gm, ''));
          }
          NODE

      - name: Validate and stage actual content changes
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const { generatedFiles } = require('./scripts/build-targets.cjs');
          const run = (args) => {
            const result = spawnSync('git', args, { encoding: 'utf8' });
            if (result.status !== 0) throw new Error(`${args.join(' ')}\n${result.stdout || ''}${result.stderr || ''}`);
            return result.stdout;
          };
          const changed = [...new Set([
            ...run(['diff', '--name-only', '--diff-filter=ACDMRTUXB']).split(/\r?\n/),
            ...run(['ls-files', '--others', '--exclude-standard']).split(/\r?\n/)
          ].filter(Boolean))];
          const newArticles = fs.readdirSync('articles')
            .filter((name) => /^2026-08-05-.*\.html$/.test(name))
            .map((name) => `articles/${name}`);
          const allowed = new Set([
            ...generatedFiles,
            'blog/index.html',
            'blog/sitemap.xml',
            'articles/2025-12-25-weekly-reward.html',
            'articles/2025-12-25-getting-started.html',
            'tests/article-fact-regression.test.cjs',
            'tests/jp-guide-batch-20260805.test.cjs',
            ...newArticles
          ]);
          const unexpected = changed.filter((file) => !allowed.has(file));
          if (unexpected.length) throw new Error(`Unexpected changed paths:\n${unexpected.join('\n')}`);
          if (!changed.length) throw new Error('No content changes were produced');
          const staged = spawnSync('git', ['add', '--', ...changed], { stdio: 'inherit' });
          process.exit(staged.status ?? 1);
          NODE
          git diff --cached --check
          git diff --cached --quiet && { echo "No staged content changes."; exit 1; } || true

      - name: Commit verified article batch
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: |
          git commit -m "content: add rank, account, country and multiplier guides"

      - name: Verify clean committed tree
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: test -z "$(git status --porcelain)"

      - name: Run complete preflight
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: node .github/scripts/preflight.cjs

      - name: Push verified content commit
        if: env.ARTICLE_BATCH_DONE != 'true'
        run: git push origin HEAD:content/play-points-guides-2026-08-05
