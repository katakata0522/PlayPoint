name: Apply growth flow foundation

on:
  push:
    branches:
      - refactor/growth-flow-foundation
    paths:
      - scripts/apply-growth-flow-foundation.cjs
      - scripts/correct-growth-flow-foundation.cjs
      - scripts/correct-growth-flow-foundation-2.cjs
      - scripts/correct-growth-flow-foundation-3.cjs
      - scripts/correct-growth-flow-foundation-4.cjs
      - .github/workflows/apply-growth-flow-foundation.yml

permissions:
  contents: write

concurrency:
  group: apply-growth-flow-foundation
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/growth-flow-foundation
          fetch-depth: 0

      - name: Apply focused migration
        run: |
          node scripts/apply-growth-flow-foundation.cjs
          node scripts/correct-growth-flow-foundation.cjs
          node scripts/correct-growth-flow-foundation-2.cjs
          node scripts/correct-growth-flow-foundation-3.cjs
          node scripts/correct-growth-flow-foundation-4.cjs
          git add -A

      - name: Run complete preflight
        id: preflight
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs --prepare-deploy 2>&1 | tee preflight-failure.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve failed preflight summary
        if: steps.preflight.outputs.status != '0'
        shell: bash
        run: |
          tail -n 400 preflight-failure.log > preflight-summary.log
          git reset --mixed HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preflight-summary.log
          git commit -m "一時診断: 事前検証の末尾ログ"
          git push origin HEAD:refactor/growth-flow-foundation
          exit 1

      - name: Commit verified changes
        if: steps.preflight.outputs.status == '0'
        run: |
          rm -f preflight-failure.log preflight-summary.log
          rm -f scripts/apply-growth-flow-foundation.cjs
          rm -f scripts/correct-growth-flow-foundation.cjs
          rm -f scripts/correct-growth-flow-foundation-2.cjs
          rm -f scripts/correct-growth-flow-foundation-3.cjs
          rm -f scripts/correct-growth-flow-foundation-4.cjs
          rm -f .github/workflows/apply-growth-flow-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "成長導線と分析基盤を整理"
          git push origin HEAD:refactor/growth-flow-foundation
