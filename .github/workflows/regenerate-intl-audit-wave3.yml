name: Regenerate intl audit wave 3

on:
  push:
    branches:
      - growth/intl-content-quality-wave3

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/intl-content-quality-wave3

      - name: Regenerate audit report
        run: node scripts/audit-intl-content.cjs

      - name: Remove one-shot workflow and commit report
        shell: bash
        run: |
          git rm .github/workflows/regenerate-intl-audit-wave3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INTL_CONTENT_AUDIT_2026-09-03.md scripts/audit-intl-content.cjs tests/intl-demand-content-quality-wave3.test.cjs
          git commit -m "fix: make intl audit inventory contract stable"
          git push origin HEAD:growth/intl-content-quality-wave3
