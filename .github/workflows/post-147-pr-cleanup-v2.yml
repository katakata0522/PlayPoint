name: Post 147 PR cleanup v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/post-147-audit-cleanup

      - name: Apply targeted cleanup
        run: node .github/scripts/post-147-apply-cleanup.cjs

      - name: Regenerate deterministic outputs
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-12'
          PLAYPOINT_ASSET_VERSION: '20260823_1957'
        run: node scripts/build-html.js

      - name: Run all regression tests
        run: node --test tests/*.test.cjs

      - name: Check diff quality
        run: git diff --check

      - name: Commit generated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete post-147 regional integrity cleanup'
          git push origin HEAD:fix/post-147-audit-cleanup

      - name: Verify committed branch with full preflight
        run: node .github/scripts/preflight.cjs
