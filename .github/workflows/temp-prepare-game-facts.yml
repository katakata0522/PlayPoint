name: Temporary prepare game facts

on:
  push:
    branches:
      - fix/game-facts-clean-current-main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove unrelated localized copy edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/generate-game-simulators.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["Calculate Play Points earned on Jewels, Daily Pack, 200-pull Sparking, and MLB Support Cards in Umamusume!", "Calculate Google Play Points earned on Jewels, Daily Packs, 200-pull spark pity, and MLB Support Cards in Umamusume!"],
            ["쥬얼 구매, 데일리 쥬얼팩, 200연차 천장, 서포트 카드 풀돌 과금 시 적립되는 Play Points를 계산하세요!", "쥬얼, 먼슬리 우마(데일리 쥬얼), 200연차 교환 Pt 천장, 서포트 4돌(풀돌) 결제 시 적립되는 Play Points를 계산하세요!"],
            ["計算賽馬娘寶石、每日寶石包、200抽保底、支援卡滿突課金可獲得的 Play Points！", "計算賽馬娘寶石、每日寶石包、200抽兌換Pt保底、支援卡4凸(滿凸)課金可獲得的 Play Points！"]
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`Expected copy not found: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Regenerate deterministic outputs
        run: node scripts/prepare-pr.cjs

      - name: Commit regenerated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix: regenerate game fact outputs from SSOT"
          git push origin HEAD:fix/game-facts-clean-current-main
