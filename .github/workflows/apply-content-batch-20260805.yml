name: Apply Japanese guide article batch

on:
  push:
    branches:
      - content/play-points-guides-2026-08-05

permissions:
  contents: write

concurrency:
  group: article-batch-20260805
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore audited article batch
        run: |
          cat .github/article-batch-payload/*.b64 | base64 --decode | gzip --decompress > /tmp/apply-content-batch-20260805.cjs
          sed -i "s|const root = path.resolve(__dirname, '..');|const root = process.cwd();|" /tmp/apply-content-batch-20260805.cjs
          node /tmp/apply-content-batch-20260805.cjs

      - name: Prepare robust quality corrections
        run: |
          cat > /tmp/fix-guide-quality.cjs <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');

          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, html) => fs.writeFileSync(file, html.replace(/[ \t]+$/gm, ''));
          function insertBeforeClosing(html, snippet) {
            for (const closing of ['</article>', '</main>', '</body>']) {
              const index = html.lastIndexOf(closing);
              if (index >= 0) return `${html.slice(0, index)}${snippet}${html.slice(index)}`;
            }
            return `${html}${snippet}`;
          }

          const weeklyFile = 'articles/2025-12-25-weekly-reward.html';
          let weekly = read(weeklyFile);
          const englishWeeklyUrl = 'https://playpoint-sim.com/en/articles/google-play-points-weekly-reward.html';
          if (!weekly.includes(`hreflang="en" href="${englishWeeklyUrl}"`)) {
            const alternate = `  <link rel="alternate" hreflang="en" href="${englishWeeklyUrl}" />\n`;
            weekly = /<\/head>/i.test(weekly) ? weekly.replace(/<\/head>/i, `${alternate}</head>`) : `${alternate}${weekly}`;
          }
          const bronzeGuidance = '<p><strong>通常の公式条件はシルバー以上です。</strong> ただし、ブロンズでも特典タブに週次形式の表示が出る場合があるため、ランクだけで対象外と決めつけず、まず「Play Points → 特典」を確認してください。表示されたものがPlay Pass系など別制度の週次特典ではないかも合わせて確認しましょう。</p>';
          if (/ブロンズは通常リワードの対象外/.test(weekly)) {
            weekly = weekly.replace(/<p>[^<]*<strong>ブロンズは通常リワードの対象外です。<\/strong>[\s\S]*?<\/p>/, bronzeGuidance);
          } else if (!weekly.includes('ブロンズでも特典タブ')) {
            const heading = /(<h2[^>]*>通常のウィークリーリワード<\/h2>)/;
            weekly = heading.test(weekly)
              ? weekly.replace(heading, `$1\n      ${bronzeGuidance}`)
              : insertBeforeClosing(weekly, `\n    <section class="section" id="bronze-weekly-check"><h2>ブロンズでもまず特典タブを確認</h2>${bronzeGuidance}</section>\n`);
          }
          write(weeklyFile, weekly);

          const gettingStartedFile = 'articles/2025-12-25-getting-started.html';
          let gettingStarted = read(gettingStartedFile);
          if (!gettingStarted.includes('id="account-country-troubleshooting"')) {
            const section = `\n    <section class="section" id="account-country-troubleshooting">\n      <h2>登録・国設定で困ったとき</h2>\n      <p>Play Pointsが表示されない、参加できない場合は、まずアカウント条件とPlayの国設定を切り分けると解決しやすくなります。</p>\n      <ul>\n        <li><a href="/articles/2026-08-05-play-points-cannot-join.html">Play Pointsに登録できない・表示されない原因を確認する</a></li>\n        <li><a href="/articles/2026-08-05-play-country-change-points.html">Google Playの国変更でポイントやランクがどうなるか確認する</a></li>\n      </ul>\n    </section>\n`;
            gettingStarted = insertBeforeClosing(gettingStarted, section);
            write(gettingStartedFile, gettingStarted);
          }

          const candidateFiles = fs.readdirSync('articles')
            .filter((name) => /^2026-08-05-.*\.html$/.test(name))
            .map((name) => path.join('articles', name));
          const multiplierFile = candidateFiles.find((file) => /multiplier|rate-overlap|campaign-rate/i.test(path.basename(file)))
            || candidateFiles.find((file) => /倍率/.test(read(file)));
          if (multiplierFile) {
            let multiplier = read(multiplierFile);
            if (!multiplier.includes('足し算しない')) {
              const note = `\n    <section class="section" id="multiplier-calculation-note">\n      <h2>倍率計算で最も多い間違い</h2>\n      <p><strong>通常レートとキャンペーン倍率は足し算しない</strong>でください。画面に表示された最終倍率を基準に計算し、複数の特典が同時に見えても、適用条件と対象商品を個別に確認します。</p>\n    </section>\n`;
              write(multiplierFile, insertBeforeClosing(multiplier, note));
            } else {
              write(multiplierFile, multiplier);
            }
            console.log(`Adjusted multiplier guide: ${multiplierFile}`);
          } else {
            console.warn(`Multiplier guide was not found. Candidates: ${candidateFiles.join(', ')}`);
          }
          NODE
          node /tmp/fix-guide-quality.cjs

      - name: Regenerate public output
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-05'
          PLAYPOINT_ASSET_VERSION: '20260805_1249'
        run: node scripts/build-html.js

      - name: Reapply idempotent manual corrections
        run: node /tmp/fix-guide-quality.cjs

      - name: Validate and stage only actual changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const { generatedFiles } = require('./scripts/build-targets.cjs');
          function git(args) {
            const result = spawnSync('git', args, { encoding: 'utf8' });
            if (result.status !== 0) {
              const detail = `${result.stdout || ''}${result.stderr || ''}`.trim();
              console.log(`::error file=.github/staging-debug,line=1,title=Git command failed::${detail || args.join(' ')}`);
              process.exit(result.status ?? 1);
            }
            return result.stdout;
          }
          const tracked = git(['diff', '--name-only', '--diff-filter=ACDMRTUXB']).split(/\r?\n/).filter(Boolean);
          const untracked = git(['ls-files', '--others', '--exclude-standard']).split(/\r?\n/).filter(Boolean);
          const changed = [...new Set([...tracked, ...untracked])];
          const newArticles = fs.readdirSync('articles').filter((name) => /^2026-08-05-.*\.html$/.test(name)).map((name) => `articles/${name}`);
          const allowed = new Set([
            ...generatedFiles,
            'blog/sitemap.xml',
            'articles/2025-12-25-weekly-reward.html',
            'articles/2025-12-25-getting-started.html',
            'tests/article-fact-regression.test.cjs',
            'tests/jp-guide-batch-20260805.test.cjs',
            ...newArticles
          ]);
          const unexpected = changed.filter((file) => !allowed.has(file));
          if (unexpected.length) {
            console.log(`::error file=.github/staging-debug,line=1,title=Unexpected paths::${unexpected.join(', ')}`);
            process.exit(1);
          }
          if (!changed.length) {
            console.log('::error file=.github/staging-debug,line=1,title=No changes::No content changes were produced.');
            process.exit(1);
          }
          console.log(`Staging ${changed.length} validated paths.`);
          const result = spawnSync('git', ['add', '--', ...changed], { encoding: 'utf8' });
          if (result.status !== 0) {
            const detail = `${result.stdout || ''}${result.stderr || ''}`.trim();
            console.log(`::error file=.github/staging-debug,line=1,title=git add failed::${detail}`);
            process.exit(result.status ?? 1);
          }
          NODE

      - name: Check staged diff formatting
        run: |
          set +e
          output="$(git diff --cached --check 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error file=.github/diff-check,line=1,title=Staged diff formatting error::$escaped"
            exit "$status"
          fi
          git diff --cached --quiet && { echo "No staged content changes were produced."; exit 1; } || true

      - name: Commit article batch
        run: |
          git commit -m "content: add rank, account, country and multiplier guides"

      - name: Remove temporary automation
        run: |
          git rm -r -- .github/article-batch-payload .github/workflows/apply-content-batch-20260805.yml
          git commit -m "chore: remove temporary article batch automation"

      - name: Verify clean tree before preflight
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: Run full clean-tree preflight
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/preflight.log 2>&1
          status=$?
          set -e
          cat /tmp/preflight.log
          if [ "$status" -ne 0 ]; then
            summary="$(grep -E -B 4 -A 6 'not ok|AssertionError|ERR_ASSERTION|actual:|expected:|operator:|testCodeFailure|# fail [1-9]|Error:|失敗|不一致|未登録|見つかりません' /tmp/preflight.log | head -n 120 || true)"
            if [ -z "$summary" ]; then summary="$(tail -n 50 /tmp/preflight.log)"; fi
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error file=.github/preflight-debug,line=1,title=Preflight failure::$summary"
            exit "$status"
          fi
          test -z "$(git status --porcelain)"

      - name: Push verified branch
        run: git push origin HEAD:content/play-points-guides-2026-08-05
