name: Fix PR244 final phrase

on:
  push:
    branches:
      - growth/search-intent-articles-20260908

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/search-intent-articles-20260908

      - name: Restore complete natural phrase
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/2025-12-25-weekly-reward.html')
          text = p.read_text(encoding='utf-8')
          old = '<p>Play Passにも別の週次特典があります。Play Pass加入中なら木曜日に、週次ボーナス・ブースターを確認すると覚えておくと迷いにくくなります。</p>'
          new = '<p>Play Passにも別の週次特典があります。Play Pass加入中なら木曜日に、Play Passの週次ボーナス・ブースターを確認すると覚えておくと迷いにくくなります。</p>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one weekly phrase, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-pr244-final-phrase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 週次記事の最終文言を整合"
          git push origin HEAD:growth/search-intent-articles-20260908

      - name: Run focused regression tests
        run: node --test tests/article-fact-regression.test.cjs tests/content-structure.test.cjs tests/intl-rank-maintenance.test.cjs tests/intl-rewards-quests.test.cjs tests/play-points-content-evolution.test.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs
