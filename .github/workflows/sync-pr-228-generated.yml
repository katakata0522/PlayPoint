name: Sync PR 228 generated assets

on:
  push:
    branches:
      - fix/analytics-entry-attribution-runtime

permissions:
  contents: write

jobs:
  sync-generated-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run canonical PR preparation
        run: node scripts/prepare-pr.cjs

      - name: Verify source and regression test were not rewritten
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- js/analytics-core.js tests/analytics-runtime-attribution.test.cjs
          if [ -z "$(git status --porcelain)" ]; then
            echo "prepare-pr produced no generated changes; refusing helper-only commit."
            exit 1
          fi
          echo "Generated changes from prepare-pr:"
          git status --short

      - name: Commit generated outputs and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-pr-228-generated.yml
          git add -A
          git commit -m "chore: sync generated assets for analytics runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
