name: Diagnose generated output stability

on:
  push:
    branches:
      - fix/intl-use-ja-article-layout

permissions:
  contents: write

concurrency:
  group: diagnose-generated-output
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-use-ja-article-layout

      - name: Re-run canonical generation until stable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for pass in 1 2 3; do
            echo "=== canonical generation pass ${pass} ==="
            node scripts/prepare-pr.cjs
            if git diff --quiet; then
              echo "pass ${pass}: clean"
              break
            fi
            echo "pass ${pass}: changed files"
            git --no-pager diff --name-only
            git add -A
            git commit -m "chore: stabilize generated outputs pass ${pass}"
          done

          node scripts/prepare-pr.cjs
          if ! git diff --quiet; then
            echo "generation is still not idempotent after three passes"
            git --no-pager diff --name-only
            exit 1
          fi

          rm .github/workflows/diagnose-generated-output.yml
          git add -A
          git commit -m "chore: remove generation diagnostic workflow"
          git push origin HEAD:fix/intl-use-ja-article-layout
