name: One-shot international article reading flow

on:
  push:
    branches:
      - feat/intl-article-reading-flow
    paths:
      - '.github/one-shot-intl-reading-flow-trigger.txt'

permissions:
  contents: write

jobs:
  patch-generate-and-test:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/intl-article-reading-flow
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/one-shot-intl-reading-flow-patch.cjs

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused reading-flow tests
        run: node --test tests/intl-article-layout.test.cjs tests/intl-article-reading-flow.test.cjs

      - name: Commit generated result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: align international article reading flow with Japanese guides'
          git push origin HEAD:feat/intl-article-reading-flow
