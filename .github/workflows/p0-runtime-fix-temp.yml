name: Temporary P0 runtime fix

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - '.github/workflows/p0-runtime-fix-temp.yml'

permissions:
  contents: write

concurrency:
  group: temporary-p0-runtime-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      TARGET_BRANCH: feat/article-journey-performance-p0-20260911
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Repair lazy runtime and preserve six-region coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/region-navigation.js';
          const source = fs.readFileSync(file, 'utf8');
          const stale = '\nObject.assign(CONFIGS, createExpansionConfigs(CONFIGS));\nassertResultNavigationCoverage(Object.keys(CONFIGS));\n';
          if (source.split(stale).length !== 2) throw new Error('expected exactly one stale eager initialization');
          fs.writeFileSync(file, source.replace(stale, '\n'));
          const testFile = 'tests/result-navigation-config.test.cjs';
          const testSource = fs.readFileSync(testFile, 'utf8');
          const oldGuard = String.raw`assertResultNavigationCoverage\(Object\.keys\(CONFIGS\)\)`;
          const newGuard = String.raw`assertResultNavigationCoverage\(Object\.keys\(REGION_PATHS\)\)`;
          if (testSource.split(oldGuard).length !== 2) throw new Error('expected exactly one old coverage wiring guard');
          fs.writeFileSync(testFile, testSource.replace(oldGuard, newGuard));
          NODE
          git rm .github/workflows/p0-runtime-fix-temp.yml

      - name: Run focused static and real ESM regressions
        run: node --test tests/region-runtime-wiring.test.cjs tests/result-navigation-config.test.cjs

      - name: Regenerate canonical output before creating fixed HEAD
        run: node scripts/prepare-pr.cjs

      - name: Commit repaired runtime and canonical output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: restore lazy region startup and canonical delivery with ESM regressions'

      - name: Run complete preflight without weakening gates
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/preflight.cjs | tee "$RUNNER_TEMP/pp261-preflight.log"
          test -z "$(git status --porcelain)"

      - name: Push only if reviewed source is still the branch tip
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_SOURCE_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Package exact tracked revision for independent review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pp261-review"
          git rev-parse HEAD > "$RUNNER_TEMP/pp261-review/head-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/pp261-review/tree-sha.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/pp261-review/source.tar"
          git diff --binary > "$RUNNER_TEMP/pp261-review/uncommitted.patch"
          if [ -f "$RUNNER_TEMP/pp261-preflight.log" ]; then
            cp "$RUNNER_TEMP/pp261-preflight.log" "$RUNNER_TEMP/pp261-review/preflight.log"
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pp261-runtime-review-${{ github.run_id }}
          path: ${{ runner.temp }}/pp261-review/
          if-no-files-found: error
          retention-days: 3
