name: Temporary P0 runtime fix

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - '.github/workflows/p0-runtime-fix-temp.yml'

permissions:
  contents: write

concurrency:
  group: temporary-p0-runtime-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      EXPECTED_PARENT_SHA: a34e1064b280be0479aff0a21d1b1e5ebc5cb070
      EXPECTED_FIXED_TREE: 12fcea1f2021197657661c0f759f273603b2f8f1
      TARGET_BRANCH: feat/article-journey-performance-p0-20260911
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore the locally validated patch with exact SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test -z "$(git status --porcelain)"
          git show "$EXPECTED_PARENT_SHA:.github/workflows/p0-runtime-fix-temp.yml" > "$RUNNER_TEMP/pp261-previous.yml"
          python3 <<'PY'
          import hashlib
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          text = (temp / 'pp261-previous.yml').read_text()
          marker = "<<'PATCH'\n"
          start = text.index(marker) + len(marker)
          end = text.index('\n          PATCH', start)
          lines = text[start:end].splitlines()
          assert all(line.startswith('          ') for line in lines), 'unexpected patch indentation'
          patch = '\n'.join(line[10:] for line in lines) + '\n'
          needle = '@@ -119,7 +128,8 @@\n         const allowed = ALLOWED_PARAMS[eventName];'
          corrected = '@@ -119,7 +128,8 @@\n     function sanitizeParams(eventName, params = {}) {\n         const allowed = ALLOWED_PARAMS[eventName];'
          assert patch.count(needle) == 1, 'expected exactly one missing context line'
          patch = patch.replace(needle, corrected)
          assert hashlib.sha256(patch.encode()).hexdigest() == 'b32444fe1c16b4b3f5eb71607201f2df0c4f02077fd62705b63b8025fa212076', 'patch differs from independently tested source'
          (temp / 'pp261-observability.patch').write_text(patch)
          PY
          git apply --check "$RUNNER_TEMP/pp261-observability.patch"
          git apply "$RUNNER_TEMP/pp261-observability.patch"
          git rm .github/workflows/p0-runtime-fix-temp.yml

      - name: Regenerate and require the independently tested exact tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-pr.cjs
          git diff --check
          git add -u
          test "$(git write-tree)" = "$EXPECTED_FIXED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 計測イベントの分類境界と不正入力を修正・正規生成'

      - name: Run full preflight on the canonical commit
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/preflight.cjs
          test -z "$(git status --porcelain)"

      - name: Push only to the unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SOURCE_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "VERIFIED_HEAD=$(git rev-parse HEAD)"
          echo "VERIFIED_TREE=$(git rev-parse HEAD^{tree})"
