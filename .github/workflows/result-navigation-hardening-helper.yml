name: Result navigation hardening helper

on:
  push:
    branches:
      - fix/result-navigation-hardening

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/result-navigation-hardening
          fetch-depth: 0

      - name: Apply hardening changes
        run: |
          python3 scripts/result-navigation-hardening-helper.py
          python3 scripts/result-navigation-hardening-test-fixes.py

      - name: Run focused regression tests
        run: |
          node --test \
            tests/result-navigation-config.test.cjs \
            tests/calculator-funnel-analytics.test.cjs \
            tests/analytics-core.test.cjs \
            tests/region-navigation-behavior.test.cjs

      - name: Synchronize generated assets
        run: node scripts/prepare-pr.cjs

      - name: Commit implementation before full preflight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/result-navigation-hardening-helper.yml
          git rm scripts/result-navigation-hardening-helper.py
          git rm scripts/result-navigation-hardening-test-fixes.py
          git add -A
          git commit -m "fix: harden result navigation contracts"

      - name: Run complete preflight against committed HEAD
        run: |
          set +e
          node .github/scripts/preflight.cjs 2>&1 | tee preflight.log
          preflight_status=${PIPESTATUS[0]}
          printf '\n--- git status after preflight ---\n' | tee -a preflight.log
          git status --porcelain | tee -a preflight.log
          if [ "$preflight_status" -eq 0 ] && [ -n "$(git status --porcelain)" ]; then
            echo "Preflight left the worktree dirty" | tee -a preflight.log
            preflight_status=1
          fi
          exit "$preflight_status"

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-navigation-preflight-${{ github.run_id }}
          path: preflight.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Push completed branch
        run: git push origin HEAD:fix/result-navigation-hardening
