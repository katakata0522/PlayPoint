name: Site Shell vNext Canary Apply

on:
  push:
    branches:
      - feat/site-shell-vnext-canary-20260915

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply Canary stylesheet links
        run: node tools/apply-site-shell-vnext-canary.cjs

      - name: Validate diff
        run: |
          git diff --check
          git diff --exit-code -- site-shell-vnext.css tools/apply-site-shell-vnext-canary.cjs .github/workflows/site-shell-vnext-canary-apply.yml || true

      - name: Commit generated HTML only
        shell: bash
        run: |
          if git diff --quiet -- author/katakata.html privacy.html terms.html sitemap.html info.html blog/index.html; then
            echo "No generated HTML changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add author/katakata.html privacy.html terms.html sitemap.html info.html blog/index.html
          git commit -m "Site Shell vNextをCanary対象へ適用"
          git push origin HEAD:feat/site-shell-vnext-canary-20260915
