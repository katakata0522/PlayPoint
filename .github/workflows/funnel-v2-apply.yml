name: Apply calculator funnel v2

on:
  push:
    branches:
      - agent/calculator-funnel-v2
    paths:
      - '.github/workflows/funnel-v2-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/calculator-funnel-v2
          fetch-depth: 0

      - name: Apply funnel instrumentation
        run: node scripts/apply-calculator-funnel-v2.cjs

      - name: Verify focused tests
        run: |
          node --check js/analytics-core.js
          node --check js/main.js
          node --test tests/analytics-core.test.cjs tests/calculator-funnel-analytics.test.cjs

      - name: Synchronize canonical generated output
        shell: bash
        run: |
          set -euo pipefail
          modified_date="$(node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<meta name=\"last-modified\" content=\"(\\d{4}-\\d{2}-\\d{2})\">/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          asset_version="$(node -e "const fs=require('fs');const s=fs.readFileSync('sw.js','utf8');const m=s.match(/playpoint-calc-v([0-9_]+)-[a-f0-9]+/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          PLAYPOINT_MODIFIED_DATE="$modified_date" PLAYPOINT_ASSET_VERSION="$asset_version" node scripts/build-html.js
          node .github/scripts/verify-build-output.cjs

      - name: Run full unminified regression suite
        run: node --test tests/*.test.cjs

      - name: Commit synchronized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '計算ファネルv2を実装'
          git push origin HEAD:agent/calculator-funnel-v2
