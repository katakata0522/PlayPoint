name: Temp game guide article hub retry 2

on:
  push:
    branches:
      - feat/game-guides-article-hub-20260913
    paths:
      - .github/workflows/tmp-game-guide-article-hub-retry2.yml

permissions:
  contents: write

concurrency:
  group: game-guide-article-hub-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fix staged helper syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/tmp-game-guide-article-source-patch.cjs')
          lines = p.read_text().splitlines()
          fixed = []
          for line in lines:
              if 'for (const article of GAME_GUIDE_ARTICLES) registry[' in line:
                  fixed.append("  for (const article of GAME_GUIDE_ARTICLES) registry[article.file.slice(3)] = '2026-09-13';")
              else:
                  fixed.append(line)
          p.write_text('\n'.join(fixed) + '\n')
          c = Path('scripts/game-guide-article-catalog.cjs')
          text = c.read_text()
          needle = "}));\n\nconst GAME_GUIDE_FILE_SET"
          if needle not in text:
              raise SystemExit('catalog closing marker not found')
          c.write_text(text.replace(needle, "})));\n\nconst GAME_GUIDE_FILE_SET", 1))
          PY
          node --check .github/scripts/tmp-game-guide-article-source-patch.cjs
          node --check scripts/game-guide-article-catalog.cjs

      - name: Apply article-site integration and regression fixes
        run: |
          node .github/scripts/tmp-game-guide-article-source-patch.cjs 2>&1 | tee /tmp/article-hub-preflight.log
          node .github/scripts/tmp-game-guide-preflight-fix.cjs 2>&1 | tee -a /tmp/article-hub-preflight.log

      - name: Generate canonical outputs twice and verify reproducibility
        run: |
          node scripts/prepare-pr.cjs 2>&1 | tee -a /tmp/article-hub-preflight.log
          git diff --binary > /tmp/article-hub-first.diff
          node scripts/prepare-pr.cjs 2>&1 | tee -a /tmp/article-hub-preflight.log
          git diff --binary > /tmp/article-hub-second.diff
          cmp /tmp/article-hub-first.diff /tmp/article-hub-second.diff

      - name: Run focused article-hub regression
        run: |
          node --test tests/game-guide-article-hub.test.cjs tests/blog-listing-ux.test.cjs tests/article-discovery-retention.test.cjs tests/article-content-navigation-normalize.test.cjs tests/article-seo-normalize.test.cjs tests/article-role-next-action-audit.test.cjs tests/all-article-quality-audit.test.cjs tests/game-seo-wave5.test.cjs 2>&1 | tee -a /tmp/article-hub-preflight.log

      - name: Remove temporary files and commit candidate before verification
        run: |
          rm -f .github/workflows/tmp-game-guide-article-hub.yml
          rm -f .github/workflows/tmp-game-guide-article-hub-retry.yml
          rm -f .github/workflows/tmp-game-guide-article-hub-retry2.yml
          rm -f .github/scripts/tmp-game-guide-article-source-patch.cjs
          rm -f .github/scripts/tmp-game-guide-preflight-fix.cjs
          rm -f .github/diagnostics/game-guide-preflight.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "機能: ゲーム別ガイドを記事ハブへ統合し保存とURL契約を修正"

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs 2>&1 | tee -a /tmp/article-hub-preflight.log

      - name: Preserve failed verification diagnostics
        if: failure()
        env:
          REQUESTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          log = Path('/tmp/article-hub-preflight.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else ['Integration failed before log capture']
          selected = set(range(max(0, len(lines) - 90), len(lines)))
          for i, line in enumerate(lines):
              if 'not ok ' in line or 'error:' in line or 'Error:' in line or '事前検証で失敗' in line or line.startswith('=== '):
                  selected.update(range(max(0, i - 1), min(len(lines), i + 35)))
          report = ['requested_sha=' + os.environ['REQUESTED_SHA'], 'tested_sha=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()]
          report.extend(str(i + 1) + ': ' + lines[i] for i in sorted(selected))
          output = Path('.github/diagnostics/game-guide-preflight.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(report) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/game-guide-preflight.txt
          git commit -m "診断: 記事ハブ修正後の実測検証結果を記録"

      - name: Publish candidate or diagnostics to integration branch
        if: always()
        run: git push origin HEAD:feat/game-guides-article-hub-20260913
