name: Temp game guide article hub retry 2

on:
  push:
    branches:
      - feat/game-guides-article-hub-20260913
    paths:
      - .github/workflows/tmp-game-guide-article-hub-retry2.yml

permissions:
  contents: write

concurrency:
  group: game-guide-article-hub-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fix staged helper syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/tmp-game-guide-article-source-patch.cjs')
          lines = p.read_text().splitlines()
          fixed = []
          for line in lines:
              if 'for (const article of GAME_GUIDE_ARTICLES) registry[' in line:
                  fixed.append("  for (const article of GAME_GUIDE_ARTICLES) registry[article.file.slice(3)] = '2026-09-13';")
              else:
                  fixed.append(line)
          p.write_text('\n'.join(fixed) + '\n')
          c = Path('scripts/game-guide-article-catalog.cjs')
          text = c.read_text()
          needle = "}));\n\nconst GAME_GUIDE_FILE_SET"
          if needle not in text:
              raise SystemExit('catalog closing marker not found')
          c.write_text(text.replace(needle, "})));\n\nconst GAME_GUIDE_FILE_SET", 1))
          PY
          node --check .github/scripts/tmp-game-guide-article-source-patch.cjs
          node --check scripts/game-guide-article-catalog.cjs

      - name: Apply article-site source integration
        run: node .github/scripts/tmp-game-guide-article-source-patch.cjs

      - name: Generate canonical outputs twice and verify reproducibility
        run: |
          node scripts/prepare-pr.cjs
          git diff --binary > /tmp/article-hub-first.diff
          node scripts/prepare-pr.cjs
          git diff --binary > /tmp/article-hub-second.diff
          cmp /tmp/article-hub-first.diff /tmp/article-hub-second.diff

      - name: Run focused article-hub regression
        run: |
          node --test tests/game-guide-article-hub.test.cjs
          node --test tests/blog-listing-ux.test.cjs
          node scripts/article-design-system-audit.cjs
          node scripts/article-role-next-action-audit.cjs

      - name: Run complete preflight
        id: preflight
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/article-hub-preflight.log 2>&1
          status=$?
          cat /tmp/article-hub-preflight.log
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Preserve failed verification diagnostics
        if: failure() && steps.preflight.outputs.exit_code != ''
        env:
          TESTED_SHA: ${{ github.sha }}
          PREFLIGHT_EXIT: ${{ steps.preflight.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path('/tmp/article-hub-preflight.log').read_text(errors='replace').splitlines()
          selected = set(range(max(0, len(lines) - 100), len(lines)))
          for i, line in enumerate(lines):
              if line.startswith('=== ') or 'not ok ' in line or 'error:' in line or 'Error:' in line or '事前検証で失敗' in line:
                  selected.update(range(max(0, i - 2), min(len(lines), i + 65)))
          report = ['tested_sha=' + os.environ['TESTED_SHA'], 'preflight_exit=' + os.environ['PREFLIGHT_EXIT']]
          report.extend(str(i + 1) + ': ' + lines[i] for i in sorted(selected))
          output = Path('.github/diagnostics/game-guide-preflight.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(report) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/game-guide-preflight.txt
          git commit -m "診断: 記事ハブ全体検証の実測失敗結果を記録"
          git push origin HEAD:feat/game-guides-article-hub-20260913

      - name: Remove one-shot integration helpers and commit
        run: |
          rm -f .github/workflows/tmp-game-guide-article-hub.yml
          rm -f .github/workflows/tmp-game-guide-article-hub-retry.yml
          rm -f .github/workflows/tmp-game-guide-article-hub-retry2.yml
          rm -f .github/scripts/tmp-game-guide-article-source-patch.cjs
          rm -f .github/diagnostics/game-guide-preflight.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "機能: ゲーム別ガイドを記事ハブへ統合"
          git push origin HEAD:feat/game-guides-article-hub-20260913
