name: One-shot Task Hub Contract Sync v2

on:
  push:
    branches: [fix/site-shell-hygiene-4-human-sitemap-20260915]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/site-shell-hygiene-4-human-sitemap-20260915
          fetch-depth: 0

      - name: Align human-sitemap discovery contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{path}: replacement target not found: {old[:80]}')
              p.write_text(s.replace(old, new, 1))

          replace('sitemap.html',
            '          <li><a href="points-cost/"><strong>欲しいポイント数 → 必要額</strong></a> — 100 / 500 / 1,000ptなど</li>\n',
            '          <li><a href="points-cost/"><strong>欲しいポイント数 → 必要額</strong></a> — 100 / 500 / 1,000ptなど</li>\n          <li><a href="compare/earning-rates/">獲得率・通常／2pt／3ptの比較表</a></li>\n')

          replace('tests/info-return-navigation.test.cjs',
            "for (const relativePath of ['info.html', 'about-playpoints.html', 'sitemap.html']) {",
            "for (const relativePath of ['info.html', 'about-playpoints.html']) {")

          replace('tests/common-pages-fact-ux.test.cjs',
            "test('海外の既存ギフトカード割引記事を記事ハブと人向けサイトマップから発見できる', () => {",
            "test('海外の既存ギフトカード割引記事を各言語の記事ハブから発見でき、人向けサイト案内は言語ハブへ導く', () => {")
          replace('tests/common-pages-fact-ux.test.cjs',
            "    const relativeUrl = url.replace(/^\\//, '');\n    assert.ok(humanSitemap.includes('href=\"' + relativeUrl + '\"'), 'sitemap.html に ' + relativeUrl + ' がありません');",
            "    const locale = hub.split('/')[0];\n    assert.ok(humanSitemap.includes('href=\"' + locale + '/articles/\"'), 'sitemap.html に ' + locale + ' 記事ハブがありません');")

          replace('tests/intl-coupon-credit.test.cjs',
            "test('言語別一覧・人向けサイトマップ・日本語ブログから記事を発見できる', () => {",
            "test('言語別一覧・人向け言語ハブ・日本語ブログから記事を発見できる', () => {")
          replace('tests/intl-coupon-credit.test.cjs',
            "      assert.ok(humanSitemap.includes(`href=\"${fileFor(topic, locale)}\"`), `human sitemap: ${topic.slug}`);",
            "      assert.ok(humanSitemap.includes(`href=\"${locale.key}/articles/\"`), `human sitemap locale hub: ${locale.key}`);")
          replace('tests/intl-coupon-credit.test.cjs',
            "    assert.ok(humanSitemap.includes(`href=\"${topic.jaFile}\"`), topic.jaFile);",
            "    assert.ok(humanSitemap.includes('href=\"blog/\"'), 'human sitemap must expose the Japanese guide hub');")

          replace('tests/intl-maintenance-calculators.test.cjs',
            "        assert.ok(humanSitemap.includes(url.replace('https://playpoint-sim.com/', '')));",
            "        const locale = url.match(/playpoint-sim\\.com\\/(en|ko|tw)\\//)?.[1];\n        assert.ok(locale);\n        assert.ok(humanSitemap.includes(`href=\"${locale}/\"`), `human sitemap locale hub: ${locale}`);")

          replace('tests/intl-platinum-diamond.test.cjs',
            "    if (lang !== 'ja') assert.ok(human.includes(url.replace('https://playpoint-sim.com/', '')));",
            "    if (lang !== 'ja') {\n      const localePath = lang === 'zh-TW' ? 'tw/' : `${lang}/`;\n      assert.ok(human.includes(`href=\"${localePath}\"`), `human sitemap locale hub: ${localePath}`);\n    }")

          replace('tests/intl-rank-maintenance.test.cjs',
            "test('言語別一覧と人向けサイトマップから新しい記事へ移動できる', () => {",
            "test('言語別一覧から新しい記事へ移動でき、人向けサイト案内は各言語ハブへ導く', () => {")
          replace('tests/intl-rank-maintenance.test.cjs',
            "    assert.ok(human.includes(`href=\"${page.file}\"`), `human sitemap: ${page.file}`);",
            "    assert.ok(human.includes(`href=\"${page.key}/articles/\"`), `human sitemap locale hub: ${page.key}`);")

          replace('tests/sitemap-information-hierarchy.test.cjs',
            "  const mainStart = sitemap.indexOf('<main class=\"container\">');\n  const h1Index = sitemap.indexOf('<h1>サイトマップ</h1>', mainStart);\n  const firstH2Index = sitemap.indexOf('<h2>', mainStart);\n  const leadIndex = sitemap.indexOf('<p class=\"lead\">', mainStart);",
            "  const mainStart = sitemap.indexOf('<main class=\"container\" data-human-sitemap-mode=\"task-hub\">');\n  const h1Index = sitemap.indexOf('<h1>Playポイント計算機 サイト案内</h1>', mainStart);\n  const firstH2Index = sitemap.indexOf('<h2>', mainStart);\n  const leadIndex = sitemap.indexOf('<p>URLを全部並べる一覧ではなく', mainStart);")
          replace('tests/sitemap-information-hierarchy.test.cjs',
            "  assert.match(sitemap, /<h2>比較資料<\\/h2>/);",
            "  assert.match(sitemap, />獲得率・通常／2pt／3ptの比較表<\\/a>/);")

          replace('tests/trust-pages-consistency.test.cjs',
            "test('human sitemap amount shortcuts use the same local-currency labels as generated regional pages', () => {",
            "test('human sitemap exposes regional calculator hubs instead of duplicating every amount shortcut', () => {")
          replace('tests/trust-pages-consistency.test.cjs',
            "      html.includes(`<a href=\"${locale}/amount/10000/\">${label}</a>`),\n      `${locale} amount shortcut must use ${label}`",
            "      html.includes(`<a href=\"${locale}/\">`),\n      `${locale} calculator hub must remain discoverable; generated amount label remains ${label}`")
          PY

      - name: Run focused regression tests
        run: node --test tests/common-pages-fact-ux.test.cjs tests/info-return-navigation.test.cjs tests/intl-coupon-credit.test.cjs tests/intl-maintenance-calculators.test.cjs tests/intl-platinum-diamond.test.cjs tests/intl-rank-maintenance.test.cjs tests/sitemap-information-hierarchy.test.cjs tests/trust-pages-consistency.test.cjs tests/human-sitemap-task-hub.test.cjs

      - name: Synchronize canonical output and run full preflight
        shell: bash
        run: |
          node scripts/prepare-pr.cjs
          node .github/scripts/preflight.cjs

      - name: Commit synchronized result
        shell: bash
        run: |
          rm .github/workflows/task-hub-contract-sync-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align sitemap discovery contracts with task hub"
          git push origin HEAD:fix/site-shell-hygiene-4-human-sitemap-20260915
