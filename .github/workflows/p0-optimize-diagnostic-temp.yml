name: Temporary P0 optimization diagnostic

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - '.github/workflows/p0-optimize-diagnostic-temp.yml'

permissions:
  contents: write

concurrency:
  group: temporary-p0-optimization-diagnostic
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/article-journey-performance-p0-20260911
          fetch-depth: 0

      - name: Apply measured optimizations
        run: node .github/scripts/p0-apply-optimizations-temp.cjs

      - name: Regenerate canonical public output twice
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-pr.cjs
          node scripts/prepare-pr.cjs

      - name: Run focused regression checks
        shell: bash
        run: |
          set -euo pipefail
          node tests/region-runtime-wiring.test.cjs
          node tests/region-expansion.test.cjs
          node --test tests/calculator-funnel-analytics.test.cjs

      - name: Create local optimized HEAD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No optimization changes to commit.'; exit 1; }
          git commit -m 'perf: optimize P0 first paint and regional loading'

      - name: Run complete preflight with evidence
        id: preflight
        shell: bash
        run: |
          set +e
          mkdir -p p0-opt-evidence
          node .github/scripts/preflight.cjs > p0-opt-evidence/preflight.log 2>&1
          code=$?
          printf '%s\n' "$code" > p0-opt-evidence/exit-code.txt
          git status --short > p0-opt-evidence/status-after.txt
          git rev-parse HEAD > p0-opt-evidence/local-head.txt
          tail -n 220 p0-opt-evidence/preflight.log
          exit "$code"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-optimization-preflight-${{ github.run_id }}
          path: p0-opt-evidence/
          retention-days: 2

      - name: Push optimized canonical result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/article-journey-performance-p0-20260911
