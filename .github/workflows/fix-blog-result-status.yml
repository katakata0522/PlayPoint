name: Fix blog result status

on:
  push:
    branches:
      - fix/article-site-usability

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/article-site-usability
          fetch-depth: 0

      - name: Fix article result count
        run: node scripts/fix-blog-result-status.cjs

      - name: Validate JavaScript syntax
        run: node --check blog/script.js

      - name: Synchronize assets and run preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy

      - name: Commit verified fix
        env:
          TARGET_BRANCH: fix/article-site-usability
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- scripts/fix-blog-result-status.cjs .github/workflows/fix-blog-result-status.yml

          mapfile -d '' changed < <(git diff HEAD --name-only -z)
          for file in "${changed[@]}"; do
            case "$file" in
              blog/script.js|sw.js|*.html|*/*.html|*/*/*.html|scripts/fix-blog-result-status.cjs|.github/workflows/fix-blog-result-status.yml)
                ;;
              *)
                echo "想定外の変更ファイル: $file"
                exit 1
                ;;
            esac
          done

          git add -A
          git diff --cached --check
          git commit -m "fix: correct article result count initialization"
          git push origin "HEAD:${TARGET_BRANCH}"
