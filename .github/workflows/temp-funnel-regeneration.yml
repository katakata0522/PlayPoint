name: Temporary funnel regeneration

on:
  pull_request:
    branches:
      - chatgpt/funnel-regen-base-20260903
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Regenerate committed outputs
        run: node scripts/prepare-pr.cjs

      - name: Commit regenerated outputs
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: regenerate top article funnel outputs"
          git push origin "HEAD:${HEAD_BRANCH}"
