name: Temporary article title contract preparation

on:
  push:
    branches: [fix/article-title-color-contract-20260903]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tmp-fix-article-title-contract.py
      - name: Synchronize generated output
        run: node scripts/prepare-pr.cjs
      - name: Focused tests
        run: node --test tests/japanese-article-css-contract.test.cjs
      - name: Commit prepared fix
        run: |
          rm .github/workflows/tmp-fix-article-title-contract.yml
          rm .github/scripts/tmp-fix-article-title-contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: lock Japanese article title color contract"
          git push origin HEAD:fix/article-title-color-contract-20260903
