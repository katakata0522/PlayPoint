name: Apply international article UX audit fixes

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/apply-intl-article-ux-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-article-ux-audit
          fetch-depth: 0

      - name: Patch audited UX issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          layout_path = Path('scripts/intl-article-layout.cjs')
          layout = layout_path.read_text()

          old_font = '''body {
          font-family: "Noto Sans", "Noto Sans KR", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
          }
          '''
          new_font = '''body {
          font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
          }

          html:lang(ko) body {
          font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
          }

          html:lang(zh-TW) body {
          font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
          }
          '''
          if old_font not in layout:
              raise SystemExit('intl font block not found')
          layout = layout.replace(old_font, new_font, 1)

          hub_css = '''
          .intl-article-hub .intl-hub-intro {
          margin: 0 0 28px;
          padding: 18px 20px;
          border: 1px solid #dbe2ea;
          border-left: 4px solid var(--cocoon-nav-bg);
          border-radius: 8px;
          background: #f8fafc;
          font-size: 15px;
          }

          .intl-hub-section {
          margin: 34px 0 0;
          }

          .intl-hub-section h2 {
          margin-top: 0;
          }

          .intl-hub-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
          }

          .content .intl-hub-card {
          display: flex;
          align-items: center;
          min-height: 68px;
          padding: 14px 16px;
          border: 1px solid #dbe2ea;
          border-radius: 8px;
          background: #ffffff;
          color: #0f4c81;
          font-weight: 700;
          line-height: 1.55;
          text-decoration: none !important;
          box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
          transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
          text-wrap: pretty;
          }

          .content .intl-hub-card:hover {
          border-color: #94a3b8;
          box-shadow: 0 5px 14px rgba(15, 23, 42, 0.08);
          transform: translateY(-1px);
          }

          @media (max-width: 680px) {
          .intl-hub-grid {
          grid-template-columns: 1fr;
          }

          .content .intl-hub-card {
          min-height: 60px;
          }
          }

          '''
          media_anchor = '@media (max-width: 860px) {'
          if hub_css.strip() not in layout:
              if media_anchor not in layout:
                  raise SystemExit('intl layout media anchor not found')
              layout = layout.replace(media_anchor, hub_css + media_anchor, 1)

          old_sig = 'function renderArticleChrome(localeKey, title, newline) {\n  const locale = LOCALES[localeKey];\n  const labels = LOCALE_LAYOUT[localeKey];'
          new_sig = 'function renderArticleChrome(localeKey, title, newline, options = {}) {\n  const locale = LOCALES[localeKey];\n  const labels = LOCALE_LAYOUT[localeKey];\n  const isHub = options.isHub === true;'
          if old_sig not in layout:
              raise SystemExit('renderArticleChrome signature not found')
          layout = layout.replace(old_sig, new_sig, 1)

          old_crumb = '''    '    <a href="' + guidesHref + '">' + escapeHtml(locale.blog) + '</a><span aria-hidden="true">&gt;</span>',
              '    <span class="intl-breadcrumb-current">' + escapeHtml(title) + '</span>',
          '''
          new_crumb = '''    '    <a href="' + guidesHref + '">' + escapeHtml(locale.blog) + '</a>' + (isHub ? '' : '<span aria-hidden="true">&gt;</span>'),
              ...(isHub ? [] : ['    <span class="intl-breadcrumb-current">' + escapeHtml(title) + '</span>']),
          '''
          if old_crumb not in layout:
              raise SystemExit('breadcrumb render block not found')
          layout = layout.replace(old_crumb, new_crumb, 1)

          insert_anchor = '''function synchronizeArticle(html, localeKey, relativePath) {
            const newline = html.includes('\\r\\n') ? '\\r\\n' : '\\n';
            const withoutChrome = html.replace(markerPattern(CHROME_START, CHROME_END), newline);
          '''
          replacement = '''function normalizeIntlArticleStylesheets(html, newline, relativePath) {
            let next = html.replace(/\\s*<link\\b[^>]*href=["'][^"']*article-gift-card\\.css(?:\\?[^"']*)?["'][^>]*\\/?>\\s*/gi, newline);
            if (/href=["'][^"']*\\/en\\/articles\\/intl-article\\.css(?:\\?[^"']*)?["']/i.test(next)) return next;
            const shared = next.match(/<link\\b[^>]*href=["'][^"']*\\/articles\\/article-shared\\.css(?:\\?[^"']*)?["'][^>]*\\/?>/i);
            if (!shared) throw new Error(relativePath + ': shared article stylesheet is missing');
            return next.replace(shared[0], shared[0] + newline + '  <link rel="stylesheet" href="/en/articles/intl-article.css">');
          }

          function synchronizeArticle(html, localeKey, relativePath) {
            const newline = html.includes('\\r\\n') ? '\\r\\n' : '\\n';
            const styledHtml = normalizeIntlArticleStylesheets(html, newline, relativePath);
            const withoutChrome = styledHtml.replace(markerPattern(CHROME_START, CHROME_END), newline);
          '''
          if insert_anchor not in layout:
              raise SystemExit('synchronizeArticle anchor not found')
          layout = layout.replace(insert_anchor, replacement, 1)

          export_anchor = '''  LAYOUT_START,
            synchronizeIntlArticleLayouts
          };'''
          export_replacement = '''  LAYOUT_START,
            renderArticleChrome,
            renderSidebar,
            synchronizeIntlArticleLayouts
          };'''
          if export_anchor not in layout:
              raise SystemExit('layout export block not found')
          layout = layout.replace(export_anchor, export_replacement, 1)
          layout_path.write_text(layout)

          seo_path = Path('scripts/intl-seo-pages.cjs')
          seo = seo_path.read_text()
          old_import = "const { INTL_LAYOUT_CSS } = require('./intl-article-layout.cjs');"
          new_import = "const { INTL_LAYOUT_CSS, renderArticleChrome, renderSidebar } = require('./intl-article-layout.cjs');"
          if old_import not in seo:
              raise SystemExit('intl layout import not found')
          seo = seo.replace(old_import, new_import, 1)

          new_hub = r'''function renderArticleHub(localeKey, assetVersions) {
            const locale = LOCALES[localeKey];
            const content = ARTICLE_HUB_CONTENT[localeKey];
            const articles = getPublishedIntlArticles().filter(article => localeKeyForArticle(article) === localeKey);
            const rawLinks = [
              ...(content.priorityArticles || []),
              ...articles.map(article => [`/${article.file}`, article.title]),
              ...(content.extraArticles || [])
            ];
            const seen = new Set();
            const hubLinks = rawLinks.filter(([href]) => {
              if (seen.has(href)) return false;
              seen.add(href);
              return true;
            });
            const priorityHrefs = new Set((content.priorityArticles || []).map(([href]) => href));
            const categoryLabels = {
              en: {
                start: 'Start here',
                account: 'Account & basics',
                earn: 'Earning & spending',
                levels: 'Levels & rewards',
                trouble: 'Troubleshooting',
                more: 'More guides'
              },
              ko: {
                start: '먼저 볼 가이드',
                account: '계정 · 기본 규칙',
                earn: '적립 · 결제',
                levels: '등급 · 리워드',
                trouble: '문제 해결',
                more: '더 많은 가이드'
              },
              tw: {
                start: '先從這裡開始',
                account: '帳號 · 基本規則',
                earn: '累積 · 消費',
                levels: '等級 · 獎勵',
                trouble: '問題排查',
                more: '更多指南'
              }
            }[localeKey];
            const buckets = { start: [], account: [], earn: [], levels: [], trouble: [], more: [] };
            for (const link of hubLinks) {
              const href = link[0];
              let bucket = 'more';
              if (priorityHrefs.has(href)) bucket = 'start';
              else if (/not-showing|not-applied|quests|refund|coupon|play-credit|device-change/.test(href)) bucket = 'trouble';
              else if (/level|silver|platinum|diamond|weekly|reward/.test(href)) bucket = 'levels';
              else if (/earn|500-1000|apps-books|subscription|gift-card|discount|promo|promotion|rounding|cash-conversion|use-coupons/.test(href)) bucket = 'earn';
              else if (/join|balance|history|account|family|country/.test(href)) bucket = 'account';
              buckets[bucket].push(link);
            }
            const categoryOrder = ['start', 'account', 'earn', 'levels', 'trouble', 'more'];
            const categorySections = categoryOrder
              .filter(key => buckets[key].length)
              .map(key => `<section class="intl-hub-section" aria-labelledby="intl-hub-${key}">
                <h2 id="intl-hub-${key}">${escapeHtml(categoryLabels[key])}</h2>
                <div class="intl-hub-grid">
                  ${buckets[key].map(([href, title]) => `<a class="intl-hub-card" href="${escapeHtml(href)}">${escapeHtml(title)}</a>`).join('\n                  ')}
                </div>
              </section>`)
              .join('\n');
            const canonical = `https://playpoint-sim.com/${localeKey}/articles/`;
            const generatedModifiedAt = articles.reduce((latest, article) => latest > article.modifiedAt ? latest : article.modifiedAt, '');
            const modifiedAt = content.extraModifiedAt > generatedModifiedAt ? content.extraModifiedAt : generatedModifiedAt;
            const articleCssVersion = assetVersions.articleSharedCssVersion || assetVersions.cssVersion;
            const schema = {
              '@context': 'https://schema.org',
              '@type': 'CollectionPage',
              name: content.title,
              description: content.description,
              url: canonical,
              inLanguage: locale.lang
            };
            const mainHtml = `<main class="main-card intl-article-hub">
              <header class="hero">
                <span class="hero-badge">${escapeHtml(content.eyebrow)}</span>
                <h1>${escapeHtml(content.title)}</h1>
                <p class="hero-meta">${escapeHtml(locale.lastUpdatedLabel)} ${modifiedAt}</p>
              </header>
              <article class="content">
                <div class="intl-hub-intro">${escapeHtml(content.intro)}</div>
                ${categorySections}
              </article>
              <aside class="official-source-note">
                <h2>${escapeHtml(locale.officialSourceTitle)}</h2>
                <p>${escapeHtml(locale.officialSourceBody)}</p>
                <a href="https://support.google.com/googleplay/answer/9077312" target="_blank" rel="noopener noreferrer">${escapeHtml(locale.officialSourceLink)}</a>
              </aside>
              <footer class="article-footer">
                <p><a href="/${localeKey}/">${escapeHtml(locale.back)}</a></p>
                <p class="site-footer-trademark">${escapeHtml(locale.trademarkNotice)}</p>
              </footer>
            </main>`;
            const chrome = renderArticleChrome(localeKey, content.title, '\n', { isHub: true });
            const sidebar = renderSidebar(localeKey, '\n');

            return `<!DOCTYPE html>
          <html lang="${locale.lang}">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${escapeHtml(content.title)} | ${escapeHtml(locale.siteName)}</title>
              <meta name="description" content="${escapeHtml(content.description)}">
              <meta name="robots" content="index, follow, max-image-preview:large">
              <meta name="last-modified" content="${modifiedAt}">
              <link rel="canonical" href="${canonical}">
              <link rel="alternate" hreflang="en" href="https://playpoint-sim.com/en/articles/">
              <link rel="alternate" hreflang="ko" href="https://playpoint-sim.com/ko/articles/">
              <link rel="alternate" hreflang="zh-TW" href="https://playpoint-sim.com/tw/articles/">
              <link rel="alternate" hreflang="x-default" href="https://playpoint-sim.com/en/articles/">
              <link rel="icon" href="/favicon.svg" type="image/svg+xml">
              <link rel="stylesheet" href="/articles/article-shared.css?v=${articleCssVersion}">
              <link rel="stylesheet" href="/en/articles/intl-article.css?v=${assetVersions.cssVersion}">
              <meta property="og:type" content="website">
              <meta property="og:site_name" content="${escapeHtml(locale.siteName)}">
              <meta property="og:title" content="${escapeHtml(content.title)}">
              <meta property="og:description" content="${escapeHtml(content.description)}">
              <meta property="og:url" content="${canonical}">
              <meta property="og:image" content="https://playpoint-sim.com/ogp.png">
              <meta name="twitter:card" content="summary_large_image">
              <script type="application/ld+json">
          ${jsonLd(schema)}
              </script>
          </head>
          <body>
          ${chrome}
          <div class="layout-container intl-layout-container">
          ${mainHtml}
          ${sidebar}
          </div>
          <script src="/js/intent-tracking.js?v=${assetVersions.intentTrackingVersion}"></script>
          <script src="/js/third-party.js?v=${assetVersions.thirdPartyVersion}"></script>
          </body>
          </html>
          `;
          }
          '''
          pattern = re.compile(r'function renderArticleHub\(localeKey, assetVersions\) \{[\s\S]*?\n\}\n\nfunction ensureDir', re.M)
          if not pattern.search(seo):
              raise SystemExit('renderArticleHub function not found')
          seo = pattern.sub(new_hub + '\nfunction ensureDir', seo, count=1)
          seo_path.write_text(seo)

          heading_replacements = {
              'en/articles/google-play-games-vs-play-points.html': (
                  'Answer: Play Games tracks your gaming identity; Play Points is a purchase and promotion rewards program',
                  'Answer: Play Games XP and Play Points are separate systems'
              ),
              'en/articles/google-play-points-apps-books-purchases.html': (
                  'Answer: eligible Google Play purchases can earn points; a random download does not guarantee them',
                  'Answer: eligible Google Play purchases can earn Play Points'
              ),
              'en/articles/google-play-points-earn-free.html': (
                  'Answer: start with benefits shown on your account, then separate no-purchase offers from purchase promotions',
                  'Answer: check account benefits before adding a purchase'
              )
          }
          for file, (old, new) in heading_replacements.items():
              p = Path(file)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'long heading not found in {file}')
              p.write_text(text.replace(old, new, 1))

          test = r'''const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');

          const ROOT = path.resolve(__dirname, '..');
          const read = relative => fs.readFileSync(path.join(ROOT, relative), 'utf8');

          test('international article hubs use the shared article shell and grouped cards', () => {
            for (const locale of ['en', 'ko', 'tw']) {
              const html = read(`${locale}/articles/index.html`);
              assert.match(html, /intl-article-site-header/);
              assert.match(html, /layout-container intl-layout-container/);
              assert.match(html, /main-card intl-article-hub/);
              assert.match(html, /intl-hub-grid/);
              assert.match(html, /sidebar-column intl-article-sidebar/);
            }
          });

          test('legacy gift-card stylesheet cannot override international article layout', () => {
            for (const locale of ['en', 'ko', 'tw']) {
              const html = read(`${locale}/articles/2026-06-20-discount-gift-cards.html`);
              assert.doesNotMatch(html, /article-gift-card\.css/);
              assert.match(html, /\/en\/articles\/intl-article\.css/);
              assert.match(html, /layout-container intl-layout-container/);
            }
          });

          test('international font stacks include local Korean and Traditional Chinese fallbacks', () => {
            const cssSource = read('scripts/intl-article-layout.cjs');
            assert.match(cssSource, /Apple SD Gothic Neo/);
            assert.match(cssSource, /Malgun Gothic/);
            assert.match(cssSource, /PingFang TC/);
            assert.match(cssSource, /Microsoft JhengHei/);
          });

          test('audited English answer headings stay compact', () => {
            const expectations = new Map([
              ['en/articles/google-play-games-vs-play-points.html', 'Answer: Play Games XP and Play Points are separate systems'],
              ['en/articles/google-play-points-apps-books-purchases.html', 'Answer: eligible Google Play purchases can earn Play Points'],
              ['en/articles/google-play-points-earn-free.html', 'Answer: check account benefits before adding a purchase']
            ]);
            for (const [file, heading] of expectations) {
              const html = read(file);
              assert.match(html, new RegExp(`<h2>${heading.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')}</h2>`));
            }
          });
          '''
          Path('tests/intl-article-ux-audit.test.cjs').write_text(test)
          PY

      - name: Validate sources
        run: |
          node --check scripts/intl-article-layout.cjs
          node --check scripts/intl-seo-pages.cjs
          node --check tests/intl-article-ux-audit.test.cjs
          node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs

      - name: Regenerate and prove fixed point
        run: |
          node scripts/prepare-pr.cjs
          node --test tests/intl-article-layout.test.cjs tests/intl-article-ux-audit.test.cjs
          git add -A
          if git diff --cached --quiet; then
            echo "Expected generated changes were not produced" >&2
            exit 1
          fi
          node scripts/prepare-pr.cjs
          git diff --exit-code

      - name: Commit implementation and remove one-shot workflow
        run: |
          rm .github/workflows/apply-intl-article-ux-audit.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish international article UX after visual audit"
          git push origin HEAD:fix/intl-article-ux-audit
