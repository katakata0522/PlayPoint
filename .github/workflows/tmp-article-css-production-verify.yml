name: Temporary article CSS production verify

on:
  push:
    branches: [fix/article-css-smoke-load-state-20260903]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify article CSS locally
        shell: bash
        run: node .github/scripts/article-css-smoke.cjs

      - name: Verify article CSS against production
        shell: bash
        env:
          SMOKE_BASE_URL: https://playpoint-sim.com/
        run: node .github/scripts/article-css-smoke.cjs
