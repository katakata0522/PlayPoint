name: Article Role Next Action Helper

on:
  push:
    branches:
      - fix/article-role-next-action-20260910

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/article-role-next-action-20260910
          fetch-depth: 0

      - name: Apply role-aware source patch and synchronize outputs
        run: node scripts/article-role-next-action-prepare-helper.cjs

      - name: Commit synchronized output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: Role別Next Actionの生成物を同期"
          git push origin HEAD:fix/article-role-next-action-20260910
