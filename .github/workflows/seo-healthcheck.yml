name: SEO Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

concurrency:
  group: seo-healthcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned CI Node
        id: ci_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Record CI environment
        id: record_ci_environment
        run: node .github/scripts/ci-evidence.cjs

      - name: Check technical SEO basics and latest hub schedule
        id: check_technical_seo_basics_and_latest_hub_schedule
        env:
          LATEST_HUB_ENFORCE_NEXT_CHECK: '1'
        run: node .github/scripts/seo-health-check.cjs

      # Independent monitors must still run after another monitor fails.
      # Do not run without a valid checkout/runtime or after cancellation.
      # Failures remain failures: no continue-on-error or relaxed checks.
      - name: Check all submitted sitemaps
        id: check_all_submitted_sitemaps
        if: ${{ !cancelled() && steps.checkout_code.outcome == 'success' && steps.ci_node.outcome == 'success' && steps.record_ci_environment.outcome == 'success' }}
        run: node .github/scripts/sitemap-health-check.cjs

      - name: Check production security headers
        id: check_production_security_headers
        if: ${{ !cancelled() && steps.checkout_code.outcome == 'success' && steps.ci_node.outcome == 'success' && steps.record_ci_environment.outcome == 'success' }}
        run: node .github/scripts/security-health-check.cjs

      - name: Check production internal links
        id: check_production_internal_links
        if: ${{ !cancelled() && steps.checkout_code.outcome == 'success' && steps.ci_node.outcome == 'success' && steps.record_ci_environment.outcome == 'success' }}
        run: node .github/scripts/live-internal-link-check.cjs

      - name: Record CI job outcome
        id: record_ci_job_outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: node .github/scripts/ci-evidence.cjs finalize

      - name: Preserve CI environment and phase evidence
        id: preserve_ci_environment_and_phase_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playpoint-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
