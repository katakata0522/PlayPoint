name: PR83 final copy fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818

permissions:
  contents: write

concurrency:
  group: pr83-final-copy-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply final copy cleanup
        run: node scripts/pr83-final-copy-cleanup.cjs

      - name: Rebuild canonical outputs
        run: node scripts/build-html.js

      - name: Verify syntax and all tests
        run: |
          node .github/scripts/verify-js-syntax.cjs
          node --test tests/*.test.cjs

      - name: Remove one-time helpers
        run: rm -f scripts/pr83-final-copy-cleanup.cjs .github/workflows/pr83-final-copy-fix.yml pr83-final-copy-trigger.txt

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize PR83 campaign copy"
          git push origin HEAD:fix/full-integrity-audit-20260818
