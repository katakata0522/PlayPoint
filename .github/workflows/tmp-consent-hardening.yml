name: Temporary Consent Hardening

on:
  push:
    branches:
      - fix/adsense-pwa-revenue-best-practice

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Harden consent-first ad loading
        shell: bash
        run: |
          CONSENT_REV="$(node -e "const {createFileRevision}=require('./scripts/asset-sync.cjs');process.stdout.write(createFileRevision(process.cwd(),'js/consent.js'));")"
          CONSENT_REV="$CONSENT_REV" python3 - <<'PY'
          import os
          from pathlib import Path

          consent_rev = os.environ['CONSENT_REV']

          third_path = Path('js/third-party.js')
          third = third_path.read_text(encoding='utf-8')
          old_third = """    void ensureConsentManager()
                  .catch((error) => console.error('Consent manager load failed:', error))
                  .finally(() => {
                      void loadAdsense();
                  });
          """
          new_third = """    void ensureConsentManager()
                  .then(() => {
                      void loadAdsense();
                  })
                  .catch((error) => console.error('Consent manager load failed:', error));
          """
          if old_third in third:
              third = third.replace(old_third, new_third, 1)
          elif new_third not in third:
              raise SystemExit('third-party consent chain target not found')
          third_path.write_text(third, encoding='utf-8')

          components_path = Path('blog/components.js')
          components = components_path.read_text(encoding='utf-8')
          components = components.replace(
              "script.src = rootPath + 'js/consent.js?v=20260727a';",
              f"script.src = rootPath + 'js/consent.js?v={consent_rev}';",
              1
          )
          old_components = """function setupBlogAdsense() {
              if (!isBlogPage && !isArticlePageTop) return;
              void ensureConsentManager()
                  .catch((error) => console.error('Consent manager load failed:', error))
                  .finally(() => {
                      loadBlogAdsense();
                  });
          }
          """
          new_components = """    function setupBlogAdsense() {
                  if (!isBlogPage && !isArticlePageTop) return;
                  void ensureConsentManager()
                      .then(() => {
                          loadBlogAdsense();
                      })
                      .catch((error) => console.error('Consent manager load failed:', error));
              }
          """
          if old_components in components:
              components = components.replace(old_components, new_components, 1)
          elif new_components not in components:
              raise SystemExit('components consent chain target not found')
          components_path.write_text(components, encoding='utf-8')

          audit_path = Path('tests/playpoint-audit-fixes.test.cjs')
          audit = audit_path.read_text(encoding='utf-8')
          audit = audit.replace(
              r"  assert.match(source, /\.finally\(\(\) => \{\s*void loadAdsense\(\);\s*\}\)/s);",
              r"  assert.match(source, /\.then\(\(\) => \{\s*void loadAdsense\(\);\s*\}\)\s*\.catch/s);",
              1
          )
          audit_path.write_text(audit, encoding='utf-8')

          regression_path = Path('tests/playpoint-regression.test.cjs')
          regression = regression_path.read_text(encoding='utf-8')
          regression = regression.replace("assert.ok(components.includes('.finally(() => {'));", "assert.ok(components.includes('.then(() => {'));", 2)
          regression = regression.replace("assert.ok(script.includes('.finally(() => {'));", "assert.ok(script.includes('.then(() => {'));", 2)
          regression_path.write_text(regression, encoding='utf-8')

          nine_path = Path('tests/playpoint-nine-fixes.test.cjs')
          nine = nine_path.read_text(encoding='utf-8')
          nine = nine.replace("assert.ok(main.includes('.finally(() => {'));", "assert.ok(main.includes('.then(() => {'));", 1)
          version_assert = "  assert.ok(blog.includes(`js/consent.js?v=${createFileRevision(root, 'js/consent.js')}`));\n"
          anchor = "  assert.ok(blog.includes('if (!isBlogPage && !isArticlePageTop) return;'));\n"
          if version_assert not in nine:
              if anchor not in nine:
                  raise SystemExit('consent version assertion anchor not found')
              nine = nine.replace(anchor, anchor + version_assert, 1)
          nine_path.write_text(nine, encoding='utf-8')
          PY

      - name: Sync generated assets
        shell: bash
        run: |
          MODIFIED_DATE="$(node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<meta name=\"last-modified\" content=\"(\d{4}-\d{2}-\d{2})\">/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          ASSET_VERSION="$(node -e "const fs=require('fs');const s=fs.readFileSync('sw.js','utf8');const m=s.match(/playpoint-calc-v([0-9_]+)-[a-f0-9]+/);if(!m)process.exit(1);process.stdout.write(m[1]);")"
          PLAYPOINT_MODIFIED_DATE="$MODIFIED_DATE" PLAYPOINT_ASSET_VERSION="$ASSET_VERSION" node scripts/build-html.js

      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-consent-hardening.yml

      - name: Run focused checks
        run: |
          node .github/scripts/verify-js-syntax.cjs
          node --test tests/playpoint-audit-fixes.test.cjs tests/playpoint-regression.test.cjs
          node tests/playpoint-nine-fixes.test.cjs

      - name: Commit hardened consent flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "同意初期化成功後だけ広告を早期読み込み"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run full preflight
        run: node .github/scripts/preflight.cjs
