name: Temporary amount copy sync

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-amount-copy-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Update source copy and content date through canonical preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('amount/10000/index.html')
          html = page.read_text(encoding='utf-8')
          replacements = {
              'ステータスや倍率ごとに逆算できます。': 'ステータスや特別獲得率ごとに逆算できます。',
              'キャンペーン倍率との違いも確認できます。': '特別獲得率による違いも確認できます。',
              '逆算・1万円・通常倍率': '逆算・1万円・通常獲得率',
          }
          for old, new in replacements.items():
              if html.count(old) != 1:
                  raise SystemExit(f'expected one occurrence: {old!r}, got {html.count(old)}')
              html = html.replace(old, new)
          page.write_text(html, encoding='utf-8')

          dates = Path('scripts/content-dates.cjs')
          source = dates.read_text(encoding='utf-8')
          old_date = "'amount/10000/index.html': '2026-08-12'"
          new_date = "'amount/10000/index.html': '2026-08-25'"
          if source.count(old_date) != 1:
              raise SystemExit('amount content-date source changed unexpectedly')
          dates.write_text(source.replace(old_date, new_date), encoding='utf-8')
          PY

          node scripts/prepare-pr.cjs

      - name: Verify narrow canonical diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          required = {'amount/10000/index.html', 'scripts/content-dates.cjs'}
          allowed = required | {'sitemap.xml', 'sitemap.html'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not required.issubset(changed):
              raise SystemExit(f'required canonical files missing: {sorted(required - changed)}')
          if not changed.issubset(allowed):
              raise SystemExit(f'unexpected canonical diff: {sorted(changed - allowed)}')

          html = open('amount/10000/index.html', encoding='utf-8').read()
          for old in ['ステータスや倍率ごとに', 'キャンペーン倍率との違い', '逆算・1万円・通常倍率']:
              if old in html:
                  raise SystemExit(f'old amount wording remains: {old}')
          if '2026-08-25' not in html:
              raise SystemExit('amount page content date was not synchronized')
          PY
          git diff --check

      - name: Commit synchronized source and outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add amount/10000/index.html scripts/content-dates.cjs sitemap.xml sitemap.html
          git commit -m 'fix: 1万円逆算ページの獲得率表現を統一'
          git push origin HEAD:${{ github.head_ref }}
