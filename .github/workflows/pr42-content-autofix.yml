name: PR 42 content autofix

on:
  push:
    branches:
      - agent/play-points-content-evolution

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/play-points-content-evolution
          fetch-depth: 0

      - name: Repair article metadata and static discovery
        run: |
          node <<'NODE'
          'use strict';

          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const read = file => fs.readFileSync(path.join(root, file), 'utf8');
          const write = (file, content) => fs.writeFileSync(path.join(root, file), content, 'utf8');
          const update = (file, transform) => {
            const before = read(file);
            const after = transform(before);
            if (after !== before) write(file, after);
          };
          const cleanText = value => value
            .replace(/<[^>]+>/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#39;|&apos;/g, "'")
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/\s+/g, ' ')
            .trim();
          const escapeHtml = value => value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

          // Visible FAQs should retain matching static FAQPage JSON-LD after article rewrites.
          for (const fileName of fs.readdirSync(path.join(root, 'articles')).filter(file => file.endsWith('.html'))) {
            const relative = `articles/${fileName}`;
            update(relative, html => {
              if (!/<h2[^>]*>\s*よくある質問\s*<\/h2>/.test(html)) return html;
              if (/"@type"\s*:\s*"FAQPage"/.test(html)) return html;

              const items = [];
              const pattern = /<div class="faq-item">\s*<h3>\s*Q\.\s*([\s\S]*?)<\/h3>\s*<p>\s*A\.\s*([\s\S]*?)<\/p>\s*<\/div>/g;
              for (const match of html.matchAll(pattern)) {
                items.push({
                  '@type': 'Question',
                  name: cleanText(match[1]),
                  acceptedAnswer: {
                    '@type': 'Answer',
                    text: cleanText(match[2])
                  }
                });
              }
              if (!items.length) throw new Error(`${relative}: visible FAQ could not be parsed`);

              const schema = {
                '@context': 'https://schema.org',
                '@type': 'FAQPage',
                mainEntity: items
              };
              const block = `<script type="application/ld+json">\n${JSON.stringify(schema, null, 2)}\n</script>\n`;
              const scriptMarker = '<script src="../blog/article.js';
              if (!html.includes(scriptMarker)) throw new Error(`${relative}: article script marker is missing`);
              return html.replace(scriptMarker, `${block}${scriptMarker}`);
            });
          }

          // Restore reciprocal hreflang clusters removed by the Japanese article rewrites.
          const alternateGroups = new Map();
          for (const locale of ['en', 'ko', 'tw']) {
            const dir = path.join(root, locale, 'articles');
            for (const fileName of fs.readdirSync(dir).filter(file => file.endsWith('.html'))) {
              const html = fs.readFileSync(path.join(dir, fileName), 'utf8');
              const links = [...html.matchAll(/<link rel="alternate" hreflang="[^"]+" href="https:\/\/playpoint-sim\.com\/[^"]+"\s*\/?\s*>/g)].map(match => match[0]);
              if (!links.length) continue;
              const japanese = links.find(link => /hreflang="ja"/.test(link));
              if (!japanese) continue;
              const href = japanese.match(/href="https:\/\/playpoint-sim\.com\/([^"]+)"/);
              if (!href || !href[1].startsWith('articles/')) continue;
              if (!alternateGroups.has(href[1])) alternateGroups.set(href[1], links);
            }
          }

          for (const [relative, links] of alternateGroups) {
            if (!fs.existsSync(path.join(root, relative))) continue;
            update(relative, html => {
              if (/rel="alternate" hreflang=/.test(html)) return html;
              const block = links.map(link => `  ${link}`).join('\n');
              const canonical = /(<link rel="canonical" href="[^"]+"\s*\/?>\r?\n)/;
              if (!canonical.test(html)) throw new Error(`${relative}: canonical link is missing`);
              return html.replace(canonical, `$1${block}\n`);
            });
          }

          // Keep the bronze exclusion explicit rather than relying on an inferred "Silver+" condition.
          update('articles/2025-12-25-weekly-reward.html', html => {
            if (html.includes('ブロンズは通常リワードの対象外です')) return html;
            const marker = '<h2>通常のウィークリーリワード</h2>';
            return html.replace(marker, `${marker}\n      <p><strong>ブロンズは通常リワードの対象外です。</strong> 日本向け公式案内では、通常リワードはシルバー以上が対象です。</p>`);
          });

          // Preserve fact-regression intent while accepting equivalent, clearer wording.
          update('tests/article-fact-regression.test.cjs', source => source
            .replace(
              'assert.match(html, /対象は国や時期、アカウントによって変わる/);',
              'assert.match(html, /対象コンテンツは国によって異なります|対象は国や時期、アカウントによって変わる/);'
            )
            .replace(
              'assert.match(html, /Androidから購入したGoogle One/);',
              'assert.match(html, /Androidから(?:購入したGoogle One|のGoogle One定期購入|Google Oneを定期購入)/);'
            ));

          // The latest hub audit requires the enrolment source in addition to earning/status sources.
          update('latest/index.html', html => {
            if (html.includes('answer/9077312')) return html;
            const heading = '<h2 id="official-sources-title">今回確認した公式参照先</h2>';
            const start = html.indexOf(heading);
            if (start < 0) throw new Error('latest/index.html: official sources heading is missing');
            const close = html.indexOf('</ul>', start);
            if (close < 0) throw new Error('latest/index.html: official sources list is missing');
            const item = '      <li><a href="https://support.google.com/googleplay/answer/9077312?co=GENIE.CountryCode%3DJP&amp;hl=ja" target="_blank" rel="noopener noreferrer">Google Play Points に登録する（日本向けGoogle公式）</a></li>\n';
            return `${html.slice(0, close)}${item}${html.slice(close)}`;
          });

          // Keep a JS-independent link for every registry article, including newly added pages.
          update('blog/index.html', html => {
            const articles = JSON.parse(read('blog/articles.json'));
            const missing = articles.filter(article => !html.includes(`href="${article.file}"`));
            if (!missing.length) return html;
            const links = missing.map(article => `                    <li><a href="${article.file}">${escapeHtml(article.title)}</a></li>`).join('\n');
            const block = `\n            <section class="static-article-fallback" aria-label="新着記事の静的リンク">\n                <h2>新着記事</h2>\n                <ul>\n${links}\n                </ul>\n            </section>`;
            const marker = '<div id="article-grid" class="grid-container">';
            if (!html.includes(marker)) throw new Error('blog/index.html: article grid marker is missing');
            return html.replace(marker, `${marker}${block}`);
          });

          // The latest hub was genuinely reverified on 2026-07-31; keep the regression test aligned.
          update('tests/seo-hygiene.test.cjs', source => source.replace(
            '<loc>${origin}/latest/</loc>\\\\r?\\\\n\\\\s*<lastmod>2026-07-26</lastmod>',
            '<loc>${origin}/latest/</loc>\\\\r?\\\\n\\\\s*<lastmod>2026-07-31</lastmod>'
          ));
          NODE

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles blog/index.html latest/index.html tests
          git commit -m "fix: 記事改稿後の品質メタデータと静的導線を同期"
          git push origin HEAD:agent/play-points-content-evolution
