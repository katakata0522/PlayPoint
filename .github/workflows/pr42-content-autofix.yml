name: PR 42 content autofix

on:
  push:
    branches:
      - agent/play-points-content-evolution

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/play-points-content-evolution
          fetch-depth: 0

      - name: Repair sources and regenerate outputs
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');

          function update(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${file}: expected replacement was not applied`);
            fs.writeFileSync(file, after, 'utf8');
          }

          update('tests/article-fact-regression.test.cjs', source => source.replace(
            /(test\('サブスク記事は現行の公式確認項目だけを例示する',[\s\S]*?assert\.match\(html, )\/Androidから購入したGoogle One\/(\);)/,
            '$1/Androidから(?:購入したGoogle One|のGoogle One定期購入|Google Oneを定期購入)/$2'
          ));

          update('articles/2026-07-31-super-weekly-reward.html', html => html.replace(
            'Google Play Pointsのスーパーウィークリーリワードについて、通常の週次特典との違い、ゴールド以上の対象条件、金曜0時の更新、賞品在庫と受け取り時の注意点をGoogle公式情報から整理します。',
            '通常のウィークリーリワードとの違い、ゴールド以上の対象条件、金曜0時の更新、賞品在庫と受け取り時の注意点をGoogle公式情報から整理します。'
          ));

          update('scripts/article-editorial-structure.cjs', source => source.replace(
            /\n  'articles\/2026-07-24-earn-play-points-free\.html': \{[\s\S]*?\n  \},\n  'articles\/2026-07-25-play-credit-not-working\.html': \{/,
            "\n  'articles/2026-07-25-play-credit-not-working.html': {"
          ));
          NODE

          node scripts/build-html.js

      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles atom.xml blog feed.xml sitemap.xml scripts tests
          git commit -m "fix: 記事生成元と公開成果物を同期"

      - name: Verify complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Push verified commit
        run: git push origin HEAD:agent/play-points-content-evolution
