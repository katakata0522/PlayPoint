name: Constrained mobile performance

# Constrained-mobile audit: 6x CPU slowdown + Lighthouse mobile network profile.
# PRs use the repository .htaccess on isolated Apache HTTPS and verify gzip before measuring.
# First-party gzip transfer has a 350KiB safety cap; measured baselines are advisory regression signals.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Audit target
        required: true
        default: local
        type: choice
        options:
          - local
          - production
  pull_request:
    branches:
      - main
    # PRでは実際に計測する代表画面と、その共有ランタイム/スタイルだけを対象にする。
    # 記事本文だけの編集や別記事専用CSSではLighthouseを起動しない。
    # 生成処理の整合性は常時実行のPR Gateが担当する。
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'blog/index.html'
      - 'blog/articles.json'
      - 'blog/*.css'
      - 'blog/*.js'
      - 'articles/2026-03-10-play-points-reflection-timing.html'
      - 'articles/article-modern.css'
      - 'articles/article-shared.css'
      - 'articles/intl-article.css'
      - 'articles/intl-shell-v1.css'
      - 'articles/styles/2026-03-10-play-points-reflection-timing.css'
      - 'en/articles/google-play-points-join-eligibility.html'
      - 'ko/articles/google-play-points-join-eligibility.html'
      - 'tw/articles/google-play-points-join-eligibility.html'
      - '.htaccess'
      - '.github/workflows/mobile-performance.yml'
      - '.github/scripts/minify.cjs'
      - '.github/scripts/performance-apache-server.cjs'
      - '.github/scripts/mobile-performance-budget.cjs'
      - '.github/scripts/lighthouse-diagnostics.cjs'
      - '.github/scripts/lighthouse-suite.cjs'
      - '.github/scripts/setup-browser-runtime.sh'
      - '.github/scripts/ci-evidence.cjs'
      - '.github/ci-runtime/**'
  schedule:
    # 毎週月曜 05:30 JST
    - cron: '30 20 * * 0'

permissions:
  contents: read

concurrency:
  group: low-end-android-performance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned CI Node
        id: ci_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false

      - name: Record CI environment
        id: record_ci_environment
        run: node .github/scripts/ci-evidence.cjs

      - name: Resolve audit target
        id: resolve_audit_target
        shell: bash
        run: |
          set -euo pipefail
          target=local
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            target=production
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.target }}" == "production" ]]; then
            target=production
          fi

          if [[ "$target" == "production" ]]; then
            echo 'AUDIT_BASE_URL=https://playpoint-sim.com' >> "$GITHUB_ENV"
          else
            echo 'AUDIT_BASE_URL=https://127.0.0.1:4173' >> "$GITHUB_ENV"
          fi
          echo "AUDIT_TARGET=$target" >> "$GITHUB_ENV"

      # PRでも本番デプロイと同じ公開アセット準備を通した成果物を測る。
      - name: Prepare production-like local assets
        id: prepare_production_like_local_assets
        if: env.AUDIT_TARGET == 'local'
        run: node .github/scripts/minify.cjs

      - name: Start production-like Apache with gzip
        id: start_local_static_server
        if: env.AUDIT_TARGET == 'local'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/performance-apache-server.cjs > /tmp/playpoint-performance-server.log 2>&1 &
          echo $! > /tmp/playpoint-performance-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent --show-error --insecure --compressed https://127.0.0.1:4173/ > /dev/null; then
              headers="$(curl --silent --show-error --insecure --compressed -D - -o /dev/null https://127.0.0.1:4173/style.css | tr -d '\r')"
              if grep -qi '^Content-Encoding: gzip$' <<< "$headers"; then
                echo 'Local performance server is using Apache mod_deflate gzip.'
                exit 0
              fi
            fi
            sleep 0.5
          done
          cat /tmp/playpoint-performance-server.log
          exit 1

      - name: Install performance browser runtime
        id: ci_browser
        run: bash .github/scripts/setup-browser-runtime.sh --performance

      - name: Audit calculator, hubs and representative articles
        id: ci_audit
        run: node .github/scripts/lighthouse-suite.cjs

      - name: Save Lighthouse diagnostics
        id: save_lighthouse_diagnostics
        if: ${{ always() && (steps.ci_audit.outcome == 'success' || steps.ci_audit.outcome == 'failure') }}
        run: node .github/scripts/lighthouse-diagnostics.cjs --manifest performance-artifacts/audit-manifest.json --output-dir performance-artifacts

      - name: Enforce strengthened mobile performance budgets
        id: enforce_strengthened_mobile_performance_budgets
        if: ${{ always() && (steps.ci_audit.outcome == 'success' || steps.ci_audit.outcome == 'failure') }}
        run: node .github/scripts/mobile-performance-budget.cjs --manifest performance-artifacts/audit-manifest.json

      - name: Upload Lighthouse reports and CLS evidence
        id: upload_lighthouse_reports_and_cls_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: low-end-android-performance-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI job outcome
        id: record_ci_job_outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: node .github/scripts/ci-evidence.cjs finalize

      - name: Preserve CI environment and phase evidence
        id: preserve_ci_environment_and_phase_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playpoint-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
