name: Temporary PR329 refinement v2

on:
  push:
    branches:
      - feat/calculator-flow-memory-20260916
    paths:
      - .github/workflows/tmp-pr329-refine-v2.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/calculator-flow-memory-20260916
          fetch-depth: 0
      - name: Refine, generate, validate and push
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/refine-pr329-v2.py
          python3 /tmp/refine-pr329-v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '計算履歴の保存責務と週次タブを整理'
          rm .github/workflows/tmp-pr329-refine.yml .github/workflows/tmp-pr329-refine-v2.yml
          git add -A
          git commit -m '一時作業ワークフローを削除'
          git push origin HEAD:feat/calculator-flow-memory-20260916
