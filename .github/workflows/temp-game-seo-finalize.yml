name: Temporary finalize game SEO output

on:
  push:
    branches:
      - feat/game-seo-depth-20260913

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate canonical output
        run: node scripts/prepare-pr.cjs

      - name: Run game SEO regression
        run: node --test tests/game-seo-depth.test.cjs

      - name: Commit generated output and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/temp-game-seo-finalize.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: finalize game SEO verified output"
          git push origin HEAD:feat/game-seo-depth-20260913
