name: Verify clean main split in browser

on:
  push:
    branches:
      - refactor/main-responsibility-split-20260806

permissions:
  contents: read

concurrency:
  group: verify-clean-main-split-browser
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: contains(github.event.head_commit.message, '[verify-clean-main-split]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean split branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/main-responsibility-split-clean-20260806
          persist-credentials: false

      - name: Verify expected revision
        run: test "$(git rev-parse HEAD)" = "a8686118fa8cd51c67f7f7a2deee731052e5ddca"

      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify four locale calculators in Chromium
        run: node .github/scripts/browser-smoke.cjs
