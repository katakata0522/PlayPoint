name: Compare main preflight baseline

on:
  push:
    branches:
      - fix/intl-article-ux-audit
    paths:
      - .github/workflows/baseline-main-preflight.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Run same repository preflight
        run: node .github/scripts/preflight.cjs --prepare-deploy
