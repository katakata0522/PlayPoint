name: Temporary P0 analytics canonical diff

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - '.github/workflows/p0-analytics-core-diff-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/article-journey-performance-p0-20260911
          persist-credentials: false

      - name: Show canonical analytics-core diff
        run: |
          set -euo pipefail
          node scripts/prepare-pr.cjs
          echo '=== analytics-core canonical diff ==='
          git --no-pager diff -- js/analytics-core.js
          echo '=== changed files ==='
          git status --short
