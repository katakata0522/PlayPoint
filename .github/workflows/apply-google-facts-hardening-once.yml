name: Apply Google facts hardening once

on:
  push:
    branches:
      - fix/adsense-ga4-policy-audit-20260818

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize one-time hardening script
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/apply-20260818-google-facts-hardening.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const beforeCount = "  if (index !== values.length) throw new Error(`${field}: expected ${values.length}, got ${index}`);";
          const afterCount = "  if (index !== values.length && !field.startsWith('reward')) throw new Error(`${field}: expected ${values.length}, got ${index}`);";
          if (!source.includes(beforeCount)) throw new Error('migration helper target not found');
          source = source.replace(beforeCount, afterCount);
          const beforeTemplate = "assert.ok(!runtime.includes('実質 約${min.toLocaleString()}円'));";
          const afterTemplate = "assert.ok(!runtime.includes('実質 約\\${min.toLocaleString()}円'));";
          if (!source.includes(beforeTemplate)) throw new Error('template escape target not found');
          source = source.replace(beforeTemplate, afterTemplate);
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Apply Google facts hardening
        run: node scripts/apply-20260818-google-facts-hardening.cjs

      - name: Add Taiwan redemption copy to generator
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/generate-game-simulators.cjs';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes("rewardCompareTitle: '請在 Play Points「使用」頁面確認兌換選項'")) {
            const marker = "    tableThCp: '5倍加碼 (5倍)',\n    faqHeading: '常見問題（FAQ）',";
            const fields = [
              "    tableThCp: '5倍加碼 (5倍)',",
              "    rewardCompareTitle: '請在 Play Points「使用」頁面確認兌換選項',",
              "    rewardTagCoupon: '折價券',",
              "    rewardCouponName: '遊戲專屬折價券',",
              "    rewardCouponRate: '所需點數與折扣額依顯示優惠為準',",
              "    rewardCouponDesc: 'Play Points 可能會顯示特定遊戲折價券。所需點數、折扣額、最低消費與期限，請以你帳戶「使用」頁面顯示的條件為準。',",
              "    rewardTagDirect: '直接兌換',",
              "    rewardDirectName: '遊戲內道具與內容',",
              "    rewardDirectRate: '內容與所需點數依顯示優惠為準',",
              "    rewardDirectDesc: '部分遊戲可能提供點數兌換遊戲內道具。是否提供與所需點數可能因地區、時間與帳戶而異，請查看 Play Points「使用」頁面。',",
              "    rewardTagCredit: 'Play 餘額',",
              "    rewardCreditName: 'Google Play 餘額',",
              "    rewardCreditRate: '所需點數與額度請以 Play Points 畫面為準',",
              "    rewardCreditDesc: '可兌換 Google Play 餘額時，請以 Play Points「使用」頁面顯示的所需點數與額度為準。使用點數取得的 Play 餘額會在一年後到期。',",
              "    faqHeading: '常見問題（FAQ）',"
            ].join('\n');
            if (!source.includes(marker)) throw new Error('Taiwan reward insertion target not found');
            source = source.replace(marker, fields);
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Regenerate game and canonical outputs
        run: |
          node scripts/generate-game-simulators.cjs
          node scripts/build-html.js

      - name: Add locale completeness regression
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/monetization-search-quality.test.cjs';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes("test('ゲーム計算機4言語に未定義テンプレート値を残さない'")) {
            source += [
              '',
              "test('ゲーム計算機4言語に未定義テンプレート値を残さない', () => {",
              "  for (const file of ['games/fgo/index.html', 'en/games/fgo/index.html', 'ko/games/fgo/index.html', 'tw/games/fgo/index.html']) {",
              "    const html = read(file);",
              "    assert.ok(!html.includes('>undefined<'), file);",
              "    assert.ok(!html.includes('undefined</'), file);",
              "  }",
              "});",
              ''
            ].join('\n');
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Run focused regression tests
        run: |
          node --check games/game-sim.js
          node --check scripts/generate-game-simulators.cjs
          node --test tests/monetization-search-quality.test.cjs tests/analytics-core.test.cjs tests/playpoint-product-guards.test.cjs

      - name: Commit canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Google公式値と検索品質の整合を強化"
          git push

# one-time audit workflow; remove after successful application.
