name: Intl shell finalizer temp

on:
  push:
    branches:
      - feat/intl-navigation-sidebar-v1-20260911

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/intl-navigation-sidebar-v1-20260911
          fetch-depth: 0

      - name: Apply audited fixes
        run: python3 .github/scripts/finalize-intl-shell-temp.py

      - name: Build canonical generated outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused regression suite
        run: node --test tests/intl-content-expansion.test.cjs tests/intl-article-layout.test.cjs tests/intl-related-guides.test.cjs tests/intl-popular-guides.test.cjs tests/intl-navigation-sidebar-v1.test.cjs

      - name: Verify generated tree is stable
        shell: bash
        run: |
          git diff --binary > /tmp/generated-before.diff
          node scripts/prepare-pr.cjs
          git diff --binary > /tmp/generated-after.diff
          if ! cmp -s /tmp/generated-before.diff /tmp/generated-after.diff; then
            echo "Canonical generation changed the working diff on the second pass."
            diff -u /tmp/generated-before.diff /tmp/generated-after.diff || true
            exit 1
          fi

      - name: Commit finalized source and generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: finalize international navigation shell"
          git push origin HEAD:feat/intl-navigation-sidebar-v1-20260911
