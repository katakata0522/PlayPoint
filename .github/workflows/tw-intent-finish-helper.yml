name: TW Intent Finish Helper

on:
  pull_request:
    paths:
      - ".github/workflows/tw-intent-finish-helper.yml"
      - "scripts/build-html.js"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - name: levels記事を制度参照へ集中
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tw/articles/google-play-points-levels.html')
          text = path.read_text()

          old_desc = '比較台灣銅級、銀級、黃金級、白金級、鑽石級門檻，每 NT$30 積點率、每週獎勵資格與基本消費估算。'
          new_desc = '比較台灣銅級、銀級、黃金級、白金級、鑽石級門檻、每 NT$30 積點率與每週獎勵資格，並說明年度等級進度與可用點數餘額的差別。'
          if text.count(old_desc) != 3:
              raise SystemExit(f'expected 3 old descriptions, found {text.count(old_desc)}')
          text = text.replace(old_desc, new_desc)

          old_toc = '<li><a href="#section-2">從 0 點開始的基本消費估算</a></li>'
          new_toc = '<li><a href="#section-2">等級門檻應怎麼理解</a></li>'
          if text.count(old_toc) != 1:
              raise SystemExit(f'expected 1 old section-2 toc, found {text.count(old_toc)}')
          text = text.replace(old_toc, new_toc)

          old_section = '''<section class="section"><h2 id="section-2">從 0 點開始的基本消費估算</h2><p>只使用銅級一般積點率時，銀級約需 NT$7,500、黃金級約 NT$30,000、白金級約 NT$120,000、鑽石級約 NT$450,000 的未稅適用消費。</p>
          <p>Google 會依商品分別計算並四捨五入到最接近的整數點，因此實際結果可能和單純用總額相乘不同。</p></section>'''
          new_section = '''<section class="section"><h2 id="section-2">等級門檻應怎麼理解</h2><p>這些數字代表年度累積點數，不是固定消費金額。實際達到某個等級需要多少消費，會受到目前等級的一般積點率、每筆購買的四捨五入，以及帳號中實際符合資格的活動影響。</p>
          <p>若要估算白金級或鑽石級實際還要花多少，請先確認目前還差的點數，再使用<a href="./google-play-points-platinum-diamond-cost.html">白金級・鑽石級所需金額比較</a>。本頁只保留理解等級制度所需的門檻與積點率。</p></section>'''
          if text.count(old_section) != 1:
              raise SystemExit(f'expected 1 old section-2 body, found {text.count(old_section)}')
          text = text.replace(old_section, new_section)
          path.write_text(text)
          PY
      - name: 正規生成と記事intent正規化
        run: node scripts/prepare-pr.cjs
      - name: 未同期差分をlevels記事だけに限定
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/changed-files.txt
          printf '%s\n' 'tw/articles/google-play-points-levels.html' > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
      - name: 生成物をhead branchへ同期
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw/articles/google-play-points-levels.html
          git commit -m 'seo: 台湾ランク費用intentの境界を完成'
          git push origin "HEAD:${{ github.head_ref }}"
