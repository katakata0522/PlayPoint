name: PR47 one-time test migration

on:
  push:
    branches:
      - fix/intl-regional-accuracy-20260803

permissions:
  contents: write

concurrency:
  group: pr47-one-time-test-migration
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/intl-regional-accuracy-20260803

      - name: Replace brittle official-help assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/playpoint-regression.test.cjs')
          content = path.read_text(encoding='utf-8')
          old = "      assert.ok(html.includes('https://support.google.com/googleplay/answer/9077312'), `${file} に公式ヘルプ導線がありません`);"
          new = """      assert.match(
                html,
                /https:\\/\\/support\\.google\\.com\\/googleplay\\/answer\\/\\d+/,
                `${file} に有効なGoogle Play公式ヘルプ導線がありません`
              );"""
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy assertion, found {count}')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit focused migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/playpoint-regression.test.cjs
          git diff --cached --check
          git commit -m 'test: validate article-specific Google Play help links'
          git push origin HEAD:fix/intl-regional-accuracy-20260803
