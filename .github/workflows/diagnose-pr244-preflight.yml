name: Diagnose PR244 preflight

on:
  push:
    branches:
      - growth/search-intent-articles-20260908

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/search-intent-articles-20260908
          persist-credentials: true

      - name: Capture preflight output
        run: |
          set +e
          node .github/scripts/preflight.cjs > /tmp/pr244-preflight.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo "--- preflight output ---"
            tail -n 300 /tmp/pr244-preflight.log
          } > .github/pr244-preflight-diagnostic.txt
          exit 0

      - name: Commit diagnostic and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-pr244-preflight.yml
          git add .github/pr244-preflight-diagnostic.txt
          git commit -m "chore: PR #244 preflight診断結果を記録"
          git push origin HEAD:growth/search-intent-articles-20260908
