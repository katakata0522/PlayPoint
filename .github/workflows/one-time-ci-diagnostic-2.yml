name: One-time final CI diagnostic

on:
  push:
    branches:
      - content/global-quests-rewards-audit-20260801

permissions:
  contents: write

concurrency:
  group: one-time-final-ci-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/global-quests-rewards-audit-20260801

      - name: Capture complete preflight output
        run: |
          set +e
          PLAYPOINT_MODIFIED_DATE=2026-07-31 PLAYPOINT_ASSET_VERSION=20260731_2149 node .github/scripts/preflight.cjs > ci-diagnostic-final.log 2>&1
          status=$?
          printf '\nPRECHECK_EXIT_STATUS=%s\n' "$status" >> ci-diagnostic-final.log
          exit 0

      - name: Commit diagnostic output and remove workflow
        run: |
          rm .github/workflows/one-time-ci-diagnostic-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostic-final.log .github/workflows/one-time-ci-diagnostic-2.yml
          git commit -m "Capture final preflight diagnostic output"
          git push origin HEAD:content/global-quests-rewards-audit-20260801
