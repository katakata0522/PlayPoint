name: Temporary repair diagnostics
on:
  push:
    branches: ['repair/playpoint-health-20260928']
    paths: ['.github/workflows/repair-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Snapshot tracked public repository source
        run: git archive --format=zip HEAD -o source-snapshot.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repair-source-${{ github.run_id }}
          path: source-snapshot.zip
          retention-days: 3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false
      - run: node .github/scripts/ci-evidence.cjs
      - run: bash .github/scripts/setup-browser-runtime.sh --performance
      - name: Observe production layout without changing advertisements or consent
        run: |
          mkdir -p repair-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath: process.env.CHROME_PATH, headless:true, args:['--no-sandbox']});
            try {
              const paths = ['/', '/blog/', '/articles/2026-03-10-play-points-reflection-timing.html'];
              for (let i=0; i<paths.length; i++) {
                const context = await browser.newContext({viewport:{width:412,height:823},isMobile:true,deviceScaleFactor:1,locale:'ja-JP'});
                const page = await context.newPage();
                await page.addInitScript(() => {
                  window.__repairShifts=[];
                  new PerformanceObserver(list => {for(const e of list.getEntries()) if(!e.hadRecentInput) window.__repairShifts.push({at:e.startTime,value:e.value,sources:(e.sources||[]).map(s=>({html:s.node?.outerHTML?.slice(0,350),before:s.previousRect,after:s.currentRect}))});}).observe({type:'layout-shift',buffered:true});
                });
                const cdp=await context.newCDPSession(page);
                await cdp.send('Emulation.setCPUThrottlingRate',{rate:6});
                await page.goto('https://playpoint-sim.com'+paths[i],{waitUntil:'domcontentloaded',timeout:45000});
                const samples=[];
                for(const delay of [1000,4000,10000]) {
                  await page.waitForTimeout(delay);
                  samples.push(await page.evaluate(() => ({shifts:window.__repairShifts,ads:[...document.querySelectorAll('ins.adsbygoogle,.google-auto-placed,.ad-container,.adsense-container,[class*="ad-slot"]')].map(e=>({html:e.outerHTML.slice(0,900),rect:e.getBoundingClientRect().toJSON()})),main:[...document.querySelectorAll('main.calculator-wrapper > *, article.content > *, #article-grid')].map(e=>({tag:e.tagName,id:e.id,class:e.className,style:e.getAttribute('style'),rect:e.getBoundingClientRect().toJSON()}))})));
                }
                fs.writeFileSync('repair-evidence/page-'+i+'.json',JSON.stringify({path:paths[i],samples},null,2));
                await page.screenshot({path:'repair-evidence/page-'+i+'.png',fullPage:false});
                await context.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Measure unchanged public production with existing Lighthouse settings
        env:
          AUDIT_BASE_URL: https://playpoint-sim.com
          AUDIT_TARGET: production
        run: |
          curl --fail --silent --show-error https://playpoint-sim.com/status/deploy-revision.txt > repair-evidence/revision-before.txt
          node .github/scripts/lighthouse-suite.cjs
          node .github/scripts/lighthouse-diagnostics.cjs --manifest performance-artifacts/audit-manifest.json --output-dir performance-artifacts
          curl --fail --silent --show-error https://playpoint-sim.com/status/deploy-revision.txt > repair-evidence/revision-after.txt
      - name: Preserve actual budget verdict
        if: ${{ !cancelled() }}
        run: node .github/scripts/mobile-performance-budget.cjs --manifest performance-artifacts/audit-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: repair-production-${{ github.run_id }}
          path: |
            repair-evidence/
            performance-artifacts/
          retention-days: 7
