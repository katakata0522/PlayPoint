name: Temporary P0 canonical regeneration

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - '.github/workflows/p0-canonical-regenerate-temp.yml'

permissions:
  contents: write

concurrency:
  group: p0-canonical-regeneration
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/article-journey-performance-p0-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Verify focused P0 contracts
        run: |
          node --check js/analytics-core.js
          node --test tests/analytics-core.test.cjs tests/article-navigation-observability.test.cjs

      - name: Commit canonical output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Canonical output already clean.'
            exit 0
          fi
          git commit -m 'build: synchronize P0 canonical outputs'
          git push origin HEAD:feat/article-journey-performance-p0-20260911
