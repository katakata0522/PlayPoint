name: PR230 CodeQL follow-up

on:
  push:
    branches:
      - refactor/analytics-resilience-routing

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/analytics-resilience-routing

      - name: Apply URL parsing fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, from, to) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(from)) throw new Error(`${file}: source block not found`);
            fs.writeFileSync(file, source.replace(from, to), 'utf8');
          }

          replaceOnce(
            'embed.html',
            `        const ref = document.referrer;\n        let targetRegion = preferredRegion;\n\n        if (ref) {\n            if (ref.includes('/ko/')) {\n                targetRegion = 'KR';\n            } else if (ref.includes('/tw/')) {\n                targetRegion = 'TW';\n            } else if (ref.includes('/hk/')) {\n                targetRegion = 'HK';\n            } else if (ref.includes('/in/')) {\n                targetRegion = 'IN';\n            } else if (ref.includes('/en/')) {\n                targetRegion = 'US';\n            } else if (ref.includes('playpoint-sim.com')) {\n                targetRegion = 'JP';\n            }\n        }`,
            `        const ref = document.referrer;\n        let targetRegion = preferredRegion;\n\n        if (ref) {\n            try {\n                const refUrl = new URL(ref, window.location.href);\n                if (refUrl.origin === window.location.origin) {\n                    const refPath = refUrl.pathname;\n                    if (refPath.startsWith('/ko/')) {\n                        targetRegion = 'KR';\n                    } else if (refPath.startsWith('/tw/')) {\n                        targetRegion = 'TW';\n                    } else if (refPath.startsWith('/hk/')) {\n                        targetRegion = 'HK';\n                    } else if (refPath.startsWith('/in/')) {\n                        targetRegion = 'IN';\n                    } else if (refPath.startsWith('/en/')) {\n                        targetRegion = 'US';\n                    } else {\n                        targetRegion = 'JP';\n                    }\n                }\n            } catch (error) {\n                console.warn('参照元URLを判定できませんでした。', error);\n            }\n        }`
          );

          replaceOnce(
            'tests/third-party-resilience.test.cjs',
            `        appendChild(script) {\n          const src = String(script.src);\n          if (src.includes('js/analytics-core.js')) {`,
            `        appendChild(script) {\n          const src = String(script.src);\n          const parsedSrc = new URL(src, 'https://playpoint-sim.com/');\n          if (parsedSrc.origin === 'https://playpoint-sim.com' && parsedSrc.pathname.endsWith('/js/analytics-core.js')) {`
          );

          replaceOnce(
            'tests/third-party-resilience.test.cjs',
            `          if (src.includes('js/consent.js')) {`,
            `          if (parsedSrc.origin === 'https://playpoint-sim.com' && parsedSrc.pathname.endsWith('/js/consent.js')) {`
          );

          replaceOnce(
            'tests/third-party-resilience.test.cjs',
            `          if (src.includes('googletagmanager.com/gtag/js')) {`,
            `          if (parsedSrc.hostname === 'www.googletagmanager.com' && parsedSrc.pathname === '/gtag/js') {`
          );

          replaceOnce(
            'tests/third-party-resilience.test.cjs',
            `          if (src.includes('pagead2.googlesyndication.com')) {`,
            `          if (parsedSrc.hostname === 'pagead2.googlesyndication.com') {`
          );
          NODE

      - name: Run focused tests
        run: node --test tests/third-party-resilience.test.cjs tests/runtime-module-guards.test.cjs tests/analytics-core.test.cjs tests/intl-locale-chrome.test.cjs

      - name: Verify canonical generated tree
        run: |
          node scripts/prepare-pr.cjs
          git diff --check

      - name: Remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/pr230-codeql-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: parse analytics routing URLs structurally"
          git push origin HEAD:refactor/analytics-resilience-routing

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs
