name: One-time full integrity audit fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818
    paths:
      - tests/trigger.txt
      - .github/workflows/full-integrity-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: one-time-full-integrity-audit-fix
  cancel-in-progress: true

jobs:
  final-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/full-integrity-audit-20260818
          fetch-depth: 0

      - name: Configure workflow git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync visible Q&A update date
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('info.html')
          s = p.read_text()
          s = s.replace(
              '<li><strong>2026/07/26 (v2.4.0)</strong>:',
              '<li><strong>2026/08/18</strong>: キャンペーンの特別獲得率をGoogle Play公式の考え方に合わせ、通常獲得率へ倍率を掛けない説明へ統一。Consent・計測・多言語表示も監査修正。</li>\n        <li><strong>2026/07/26 (v2.4.0)</strong>:'
          )
          s = s.replace('最終更新日: 2026年7月26日 (v2.4.0)', '最終更新日: 2026年8月18日')
          p.write_text(s)
          PY
          git add info.html
          git commit -m "docs: sync Q&A visible update date" || true
          git push origin HEAD:fix/full-integrity-audit-20260818

      - name: Run complete preflight
        run: |
          set +e
          node .github/scripts/preflight.cjs > .github/audit-preflight.txt 2>&1
          status=$?
          cat .github/audit-preflight.txt
          printf 'preflight status=%s %s\n' "$status" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/audit-stage.txt
          git add .github/audit-preflight.txt .github/audit-stage.txt
          git commit -m "chore: record final full preflight result" || true
          git push origin HEAD:fix/full-integrity-audit-20260818
          exit $status
