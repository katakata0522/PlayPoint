name: One-time full integrity audit fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818
    paths:
      - tests/trigger.txt

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/full-integrity-audit-20260818
          fetch-depth: 0

      - name: Configure workflow git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair one-time fixer helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-full-integrity-audit-20260818.cjs')
          s = p.read_text()
          start = s.index('function replaceRegionTemplate(')
          end_marker = '\n}\n\n// 1) Google Play公式仕様'
          end = s.index(end_marker, start) + 2
          replacement = r'''function replaceRegionTemplate(content, region, key, value) {
            const start = content.indexOf(`    '${region}': {`);
            if (start < 0) throw new Error(`config region not found: ${region}`);
            const nextRegions = ['JP', 'US', 'KR', 'TW'].map(r => content.indexOf(`    '${r}': {`, start + 1)).filter(i => i > start);
            const end = nextRegions.length ? Math.min(...nextRegions) : content.indexOf('\n};', start);
            const segment = content.slice(start, end);
            const keyToken = `'${key}':`;
            const keyIndex = segment.indexOf(keyToken);
            if (keyIndex < 0) throw new Error(`config template not found: ${region}.${key}`);
            const valueStart = segment.indexOf('`', keyIndex + keyToken.length);
            const valueEnd = valueStart >= 0 ? segment.indexOf('`', valueStart + 1) : -1;
            if (valueStart < 0 || valueEnd < 0) throw new Error(`config template bounds not found: ${region}.${key}`);
            const nextSegment = segment.slice(0, valueStart + 1) + value + segment.slice(valueEnd);
            return content.slice(0, start) + nextSegment + content.slice(end);
          }'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          node --check scripts/apply-full-integrity-audit-20260818.cjs

      - name: Apply audited fixes with diagnostics
        run: |
          set +e
          node scripts/apply-full-integrity-audit-20260818.cjs > .github/audit-fixer-diagnostics.txt 2>&1
          status=$?
          git add .github/audit-fixer-diagnostics.txt
          git commit -m "chore: record integrity fixer diagnostics" || true
          git push origin HEAD:fix/full-integrity-audit-20260818
          cat .github/audit-fixer-diagnostics.txt
          exit $status

      - name: Rebuild generated assets
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-18'
          PLAYPOINT_ASSET_VERSION: '2026_08_18'
        run: node scripts/build-html.js

      - name: Run targeted integrity regression
        run: node --test tests/full-integrity-audit.test.cjs tests/main-calculator-ui.test.cjs tests/analytics-core.test.cjs tests/monetization-search-quality.test.cjs

      - name: Run complete preflight
        run: node .github/scripts/preflight.cjs

      - name: Commit verified changes
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align calculator, consent, SEO and CI integrity"
          git push origin HEAD:fix/full-integrity-audit-20260818
