name: One-time full integrity audit fix

on:
  push:
    branches:
      - fix/full-integrity-audit-20260818
    paths:
      - tests/trigger.txt
      - scripts/audit-final-followup-20260818.cjs
      - scripts/audit-consent-followup-20260818.cjs
      - scripts/audit-content-date-followup-20260818.cjs
      - .github/workflows/full-integrity-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: one-time-full-integrity-audit-fix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/full-integrity-audit-20260818
          fetch-depth: 0

      - name: Configure workflow git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply consolidated final audit follow-up
        run: |
          set +e
          {
            node scripts/audit-final-followup-20260818.cjs
            node scripts/audit-consent-followup-20260818.cjs
            node scripts/audit-content-date-followup-20260818.cjs
          } > .github/audit-followup.txt 2>&1
          status=$?
          cat .github/audit-followup.txt
          printf 'followup status=%s %s\n' "$status" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/audit-stage.txt
          git add -A
          git commit -m "fix: apply final cross-locale consent and date repairs" || true
          git push origin HEAD:fix/full-integrity-audit-20260818
          exit $status

      - name: Rebuild all generated assets
        env:
          PLAYPOINT_MODIFIED_DATE: '2026-08-18'
          PLAYPOINT_ASSET_VERSION: '2026_08_18'
        run: |
          set +e
          node scripts/build-html.js > .github/audit-build-diagnostics.txt 2>&1
          status=$?
          cat .github/audit-build-diagnostics.txt
          printf 'build status=%s %s\n' "$status" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/audit-stage.txt
          git add -A
          git commit -m "fix: rebuild final audited assets" || true
          git push origin HEAD:fix/full-integrity-audit-20260818
          exit $status

      - name: Run complete preflight
        run: |
          set +e
          node .github/scripts/preflight.cjs > .github/audit-preflight.txt 2>&1
          status=$?
          cat .github/audit-preflight.txt
          printf 'preflight status=%s %s\n' "$status" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/audit-stage.txt
          git add .github/audit-preflight.txt .github/audit-stage.txt
          git commit -m "chore: record final full preflight result" || true
          git push origin HEAD:fix/full-integrity-audit-20260818
          exit $status
