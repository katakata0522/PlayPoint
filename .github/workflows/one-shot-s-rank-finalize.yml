name: One-shot S-rank finalizer

on:
  push:
    branches:
      - feat/s-rank-intl-discovery-ux
    paths:
      - scripts/run-s-rank-finalize.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/s-rank-intl-discovery-ux
          fetch-depth: 0

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused S-rank tests
        run: node --test tests/intl-guide-discovery.test.cjs tests/region-selector-semantics.test.cjs tests/intl-article-layout.test.cjs

      - name: Commit canonical result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No canonical changes required."
          else
            git commit -m "chore: refresh S-rank generated assets"
            git push origin HEAD:feat/s-rank-intl-discovery-ux
          fi
