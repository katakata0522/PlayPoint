name: Chapter 2 isolated source evidence

on:
  push:
    branches: [fix/intl-author-navigation-20260917]
    paths: [.github/workflows/intl-navigation-work.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'katakata0522/PlayPoint' && github.ref == 'refs/heads/fix/intl-author-navigation-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export committed source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chapter2-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/chapter2-source/source.tar.gz"
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/chapter2-source/revision.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chapter2-source-${{ github.run_id }}
          path: ${{ runner.temp }}/chapter2-source/
          retention-days: 1
          if-no-files-found: error
