name: Chapter 2 verified author navigation preparation

on:
  push:
    branches: [fix/intl-author-navigation-20260917]
    paths: [.github/workflows/intl-navigation-work.yml]

permissions:
  contents: read

concurrency:
  group: chapter2-author-preparation
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'katakata0522/PlayPoint' && github.ref == 'refs/heads/fix/intl-author-navigation-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout isolated branch revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Set up repository-pinned Node
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .github/ci-runtime/node-version
          package-manager-cache: false
      - name: Apply exact locally verified source patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess
          raw = pathlib.Path('.github/chapter2-author-payload.xz').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '3f8938f59a835afa498c551ec0dfec5a48ba2179f1177bd40d106ad8dfd21a60', 'Payload integrity mismatch'
          payload = json.loads(lzma.decompress(raw))
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'chapter2-author.patch'
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', str(patch)], check=True)
          PY
      - name: Regenerate canonical public output
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-pr.cjs 2>&1 | tee "$RUNNER_TEMP/chapter2-generation.log"
      - name: Verify exact diff fingerprint and regression tests
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          git add --all -- .
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          payload = json.loads(lzma.decompress(pathlib.Path('.github/chapter2-author-payload.xz').read_bytes()))
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert len(paths) == payload['expectedCount'], ('Unexpected changed-file count', len(paths))
          records = ''.join(f'{p}={hashlib.sha256(subprocess.check_output(["git", "show", ":" + p])).hexdigest()}\n' for p in sorted(paths))
          actual = hashlib.sha256(records.encode()).hexdigest()
          assert actual == payload['expectedDigest'], ('Generated diff differs from verified workspace', actual)
          print(f'Exact verified diff: {len(paths)} files, SHA256 {actual}')
          PY
          node --test tests/intl-author-navigation.test.cjs tests/ui-runtime-behavior.test.cjs tests/intl-locale-chrome.test.cjs tests/site-shell-footer.test.cjs tests/playpoint-product-guards.test.cjs 2>&1 | tee "$RUNNER_TEMP/chapter2-tests.log"
          node --check .github/scripts/browser-smoke.cjs
      - name: Commit verified output to this branch only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '著者導線207件を同言語へ修正し生成元・実行時・回帰検証を統一'
          test "$(git ls-remote origin refs/heads/fix/intl-author-navigation-20260917 | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          git push origin HEAD:refs/heads/fix/intl-author-navigation-20260917
          git rev-parse HEAD
      - name: Preserve generation and verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chapter2-author-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/chapter2-generation.log
            ${{ runner.temp }}/chapter2-tests.log
          retention-days: 1
          if-no-files-found: warn
