name: Temporary P0 article observability finalizer

on:
  push:
    branches:
      - feat/article-journey-performance-p0-20260911
    paths:
      - 'tools/apply-p0-article-observability.cjs'
      - '.github/workflows/p0-article-observability-temp.yml'

permissions:
  contents: write

concurrency:
  group: p0-article-observability-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/article-journey-performance-p0-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Apply P0 observability patch
        run: node tools/apply-p0-article-observability.cjs

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused regression checks
        run: |
          node --check js/analytics-core.js
          node --test tests/analytics-core.test.cjs tests/article-navigation-observability.test.cjs

      - name: Remove temporary finalizer files
        run: rm -f tools/apply-p0-article-observability.cjs .github/workflows/p0-article-observability-temp.yml

      - name: Commit canonical P0 implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add P0 article journey analytics and performance baselines'
          git push origin HEAD:feat/article-journey-performance-p0-20260911
