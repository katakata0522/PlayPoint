name: One-shot article quality repair

on:
  push:
    branches:
      - fix/article-quality-audit-20260914

permissions:
  contents: write

concurrency:
  group: one-shot-article-quality-repair
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[article-quality-ready]') && !contains(github.event.head_commit.message, '[preflight-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Normalize one-shot test strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-article-quality-repair.cjs')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "assert.equal(stripTags(html).split(firstDecision).length - 1, 1, `${localeKey}/${guide.slug}: primary decision duplicated`);",
              "assert.equal(stripTags(html).split(firstDecision).length - 1, 1, String(localeKey) + '/' + guide.slug + ': primary decision duplicated');"
          )
          source = source.replace(
              "assert.ok(profiles >= 60, `expected broad author coverage, got ${profiles}`);",
              "assert.ok(profiles >= 60, 'expected broad author coverage, got ' + profiles);"
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply source-level article quality fixes
        run: node scripts/tmp-article-quality-repair.cjs

      - name: Make the new duplication test HTML-escape independent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/article-quality-polish.test.cjs')
          source = path.read_text(encoding='utf-8')
          old = "      const firstDecision = guide.content[localeKey].decisions[0];\n      assert.equal(stripTags(html).split(firstDecision).length - 1, 1, String(localeKey) + '/' + guide.slug + ': primary decision duplicated');"
          new = "      const decisionSection = html.match(/<section class=\"section\" id=\"decision-guide\">([\\s\\S]*?)<\\/section>/)?.[1] || '';\n      assert.equal((decisionSection.match(/<li>/g) || []).length, guide.content[localeKey].decisions.length - 1, String(localeKey) + '/' + guide.slug + ': decision list still repeats the lead decision');"
          if old not in source:
              raise SystemExit('generated duplication assertion target not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate canonical outputs
        run: node scripts/prepare-pr.cjs

      - name: Run focused regression tests
        run: node --test tests/article-quality-polish.test.cjs tests/intl-game-guide-expansion.test.cjs tests/intl-localization-quality.test.cjs tests/intl-localization-semantics.test.cjs

      - name: Build clean candidate commit locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-article-quality-repair.yml
          rm scripts/tmp-article-quality-repair.cjs
          rm -f scripts/tmp-article-quality-trigger.txt
          rm -f tmp-preflight.log
          git add -A
          if git diff --cached --quiet; then
            echo "No candidate changes to commit"
            exit 1
          fi
          git commit -m "fix: 記事の多言語・日付・構造品質を再整備 [article-quality-ready]"

      - name: Run complete preflight against candidate HEAD
        shell: bash
        run: |
          set +e
          node .github/scripts/preflight.cjs > "$RUNNER_TEMP/article-quality-preflight.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/article-quality-preflight.log"

          if [ "$status" -eq 0 ] && [ -n "$(git status --porcelain)" ]; then
            echo "Preflight left an unexpected dirty worktree:" | tee -a "$RUNNER_TEMP/article-quality-preflight.log"
            git status --short | tee -a "$RUNNER_TEMP/article-quality-preflight.log"
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            cp "$RUNNER_TEMP/article-quality-preflight.log" "$RUNNER_TEMP/article-quality-preflight.saved.log"
            git reset --hard "$GITHUB_SHA"
            git clean -fd
            cp "$RUNNER_TEMP/article-quality-preflight.saved.log" tmp-preflight.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f tmp-preflight.log
            git commit -m "chore: capture candidate preflight diagnostic [preflight-diagnostic]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            exit "$status"
          fi

      - name: Publish verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"${GITHUB_REF_NAME}"
