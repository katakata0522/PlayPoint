name: Apply production smoke retry

on:
  push:
    branches:
      - fix/production-smoke-network-retry

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/production-smoke-network-retry
          fetch-depth: 0

      - name: Apply retry handling
        run: node scripts/apply-production-smoke-retry.cjs

      - name: Validate smoke script and regression tests
        run: |
          node --check .github/scripts/browser-smoke.cjs
          node --test tests/blog-runtime-regressions.test.cjs

      - name: Commit verified monitoring fix
        env:
          TARGET_BRANCH: fix/production-smoke-network-retry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- scripts/apply-production-smoke-retry.cjs .github/workflows/apply-production-smoke-retry.yml
          git add -- .github/scripts/browser-smoke.cjs tests/blog-runtime-regressions.test.cjs
          git diff --cached --check
          git commit -m "fix: retry production smoke revision checks over IPv4"
          git push origin "HEAD:${TARGET_BRANCH}"
