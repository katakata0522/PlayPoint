name: Game SEO Wave 3 Prepare

on:
  push:
    branches:
      - feat/game-seo-wave3-20260913
    paths:
      - '.github/workflows/game-seo-wave3-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/game-seo-wave3-20260913
          fetch-depth: 0

      - name: Generate canonical output twice and run game SEO regressions
        run: |
          set -euo pipefail
          node scripts/prepare-pr.cjs
          node --test tests/game-seo-wave3.test.cjs tests/game-seo-expanded.test.cjs tests/game-seo-depth.test.cjs
          node scripts/prepare-pr.cjs
          node --test tests/game-seo-wave3.test.cjs tests/game-seo-expanded.test.cjs tests/game-seo-depth.test.cjs

      - name: Commit canonical output and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/game-seo-wave3-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No canonical output changes to commit.'
            exit 0
          fi
          git commit -m 'build: finalize verified game SEO wave 3'
          git push origin HEAD:feat/game-seo-wave3-20260913
